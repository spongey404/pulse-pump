<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Pump — Home Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #edeae3; min-height: 100vh; font-family: 'Archivo', system-ui; }
  .canvas { padding: 60px 40px 120px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 52px; letter-spacing: -1.5px; line-height: 1; max-width: 1900px; margin: 0 auto 12px; }
  .h1-sub { font-family: 'Archivo'; font-size: 15px; color: #777; max-width: 700px; margin: 0 auto 56px; line-height: 1.5; }
  .section-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #c8553d; max-width: 1900px; margin: 56px auto 10px; font-weight: 700; }
  .section-desc { font-family: 'Archivo'; font-size: 13px; color: #888; max-width: 700px; margin: 0 auto 28px; line-height: 1.5; }
  .grid { display: flex; gap: 40px; max-width: 1900px; margin: 0 auto; align-items: flex-start; flex-wrap: wrap; }
  .pcard { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
  .card-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }
  .card-label .num { color: #c8553d; font-weight: 700; }
  .card-label .vibe { color: #1a1a1a; font-weight: 600; margin-left: 6px; }
  .frame { width: 390px; height: 844px; border-radius: 48px; padding: 4px; background: linear-gradient(135deg, #cbcac4, #b9b8b2); box-shadow: 0 40px 80px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.4); flex-shrink: 0; }
  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; position: relative; }
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .tk { display: inline-flex; gap: 28px; animation: ticker 45s linear infinite; white-space: nowrap; padding-left: 28px; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

// ── Tokens ────────────────────────────────────────────────────
const TL = {
  bg:'#fbf8f2', surf:'#f4f0e6', surf2:'#ece7d8', surf3:'#e2dccd',
  ink:'#1f1c19', ink2:'#3a342d',
  muted:'rgba(31,28,25,0.5)', faint:'rgba(31,28,25,0.13)',
  hair:'rgba(31,28,25,0.08)', hair2:'rgba(31,28,25,0.13)',
  accent:'#c8553d', accentSoft:'rgba(200,85,61,0.08)',
  up:'#1f8f5a', down:'#c0341a', pr:'#c9892e',
  tickerBg:'#1a1816', tickerFg:'#ece5d6',
};
const TD = {
  bg:'#1a1816', surf:'#252220', surf2:'#2e2a26', surf3:'#363028',
  ink:'#ece5d6', ink2:'#c8bfb0',
  muted:'rgba(236,229,214,0.5)', faint:'rgba(236,229,214,0.13)',
  hair:'rgba(236,229,214,0.08)', hair2:'rgba(236,229,214,0.13)',
  accent:'#dc7d4a', accentSoft:'rgba(220,125,74,0.10)',
  up:'#3fb777', down:'#e05a45', pr:'#d4a03c',
  tickerBg:'#0e0c0a', tickerFg:'#ece5d6',
};

// ── Session data ──────────────────────────────────────────────
const USER = {
  name: 'Jay',
  streak: 13,
  weekVol: [80, 94, 0, 112, 86, 0, 108], // Mon-Sun sets
  weekLabels: ['M','T','W','T','F','S','S'],
  weekDayDone: [true, true, false, true, true, false, false], // today = Sat = index 5
  todayIdx: 5,
  prediction: {
    name: 'PUSH DAY',
    program: 'PPL',
    lastDone: '3 days ago',
    estDuration: '~55 MIN',
    exercises: ['Bench Press','Overhead Press','Incline DB','Cable Fly','Tricep PD'],
    confidence: 0.94,
    reason: 'You do Push every Sat · 13-week pattern',
  },
  draftWorkout: null, // set to an object to show resume state
  weekImproved: 14,
  weekPRs: 3,
  weekStreak: 13,
  friends: [
    { name: 'Marcus', workout: 'Pull Day', ago: '2h' },
    { name: 'Priya',  workout: 'Legs',     ago: '5h' },
  ],
};

// Draft workout variant data
const USER_DRAFT = {
  ...USER,
  draftWorkout: { name: 'PUSH DAY', elapsed: '24:18', sets: 9, totalSets: 28 },
};

// ── Primitives ────────────────────────────────────────────────
const StatusBar = ({dark=false}) => (
  <div style={{height:50,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:6,flexShrink:0}}>
    <div style={{width:126,height:37,background:dark?'rgba(255,255,255,0.1)':'#000',borderRadius:24}}/>
  </div>
);

function TabBar({C, active='Home'}) {
  const dark=C===TD;
  const muted=dark?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.35)';
  const bg=dark?'rgba(26,24,22,0.94)':'rgba(251,248,242,0.94)';
  const bord=dark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';
  const tabs=[{k:'Programs'},{k:'Social'},{k:'Home',center:true,active:active==='Home'},{k:'Body'},{k:'More'}];
  const ICON=(k,col)=>{const s={width:22,height:22,fill:'none',stroke:col,strokeWidth:1.6,strokeLinecap:'round',strokeLinejoin:'round'};
    if(k==='Programs')return<svg {...s} viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>;
    if(k==='Social')  return<svg {...s} viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><circle cx="17" cy="11" r="2.5"/><path d="M3 19c.5-3 3-5 6-5s5.5 2 6 5"/></svg>;
    if(k==='Body')    return<svg {...s} viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M8 11l4-3 4 3M12 8v6M9 14l-2 6M15 14l2 6"/></svg>;
    if(k==='More')    return<svg {...s} viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>;
    return null;
  };
  return(
    <div style={{position:'absolute',bottom:0,left:0,right:0,background:bg,backdropFilter:'blur(16px)',borderTop:`0.5px solid ${bord}`,display:'flex',alignItems:'center',padding:'8px 0 28px',zIndex:50}}>
      {tabs.map((t,i)=>{
        const isActive=t.k===active;
        const col=isActive?C.ink:muted;
        return(
          <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
            {t.center
              ?<div style={{width:46,height:46,borderRadius:15,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',marginTop:-12,boxShadow:`0 8px 16px ${C.accent}44`}}>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3.5 12L12 4M12 4L20.5 12M6 13.5v7M18 13.5v7M6 20.5h12M10.5 20.5v-4.5h3v4.5" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </div>
              :ICON(t.k,col)}
            <span style={{fontFamily:'"Archivo",sans-serif',fontSize:10,fontWeight:isActive?600:500,color:t.center?C.accent:col}}>{t.k}</span>
          </div>
        );
      })}
    </div>
  );
}

// ── Ticker strip ──────────────────────────────────────────────
function TickerStrip({C}) {
  const items = [
    ['CHEST','▲ +12.5%',true],['BACK','▲ +11.1%',true],
    ['QUADS','TGT',null],['GLUTES','TGT',null],
    ['SHLDR','▼ -14.3%',false],['HAMS','▼ -33.3%',false],
    ['BICEP','▲ +20.0%',true],['TRI','TGT',null],
    ['CORE','▼ -40.0%',false],['TRAP','▼ -25.0%',false],
  ];
  return (
    <div style={{background:C.tickerBg,height:26,overflow:'hidden',display:'flex',alignItems:'center'}}>
      <div className="tk">
        {[...items,...items].map(([k,v,u],i)=>(
          <span key={i} style={{display:'inline-flex',alignItems:'center',gap:6}}>
            <span style={{color:'rgba(236,229,214,0.55)',letterSpacing:1}}>{k}</span>
            <span style={{color:u===true?'#7fcf9f':u===false?'#ff8b75':'rgba(236,229,214,0.6)',fontWeight:700}}>{v}</span>
            <span style={{color:'rgba(236,229,214,0.18)',marginLeft:4}}>·</span>
          </span>
        ))}
      </div>
    </div>
  );
}

// ── Week volume sparkbar ──────────────────────────────────────
function WeekBars({C, data, labels, done, today, compact=false}) {
  const max = Math.max(...data, 1);
  const h = compact ? 40 : 60;
  return (
    <div style={{display:'flex',gap:compact?4:6,alignItems:'flex-end',height:h+20}}>
      {data.map((v,i)=>{
        const isToday = i===today;
        const pct = v/max;
        const barH = Math.max(v>0?pct*h:3, 3);
        const col = isToday ? C.accent : done[i] ? C.up : v>0 ? C.ink : C.faint;
        const opacity = isToday ? 1 : done[i] ? 0.7 : v>0 ? 0.35 : 0.15;
        return (
          <div key={i} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3,flex:1}}>
            <div style={{width:'100%',height:barH,background:col,opacity,borderRadius:compact?2:3,transition:'height 0.3s ease'}}/>
            <span style={{fontFamily:'"Space Mono",monospace',fontSize:compact?7:8,color:isToday?C.accent:C.muted,fontWeight:isToday?700:400,letterSpacing:0.5}}>{labels[i]}</span>
          </div>
        );
      })}
    </div>
  );
}

// ── Smart prediction confidence indicator ─────────────────────
function ConfidenceDots({conf, C}) {
  const filled = Math.round(conf * 5);
  return (
    <div style={{display:'flex',gap:3,alignItems:'center'}}>
      {[0,1,2,3,4].map(i=>(
        <div key={i} style={{width:5,height:5,borderRadius:1,background:i<filled?C.accent:C.faint}}/>
      ))}
      <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,marginLeft:4,letterSpacing:0.5}}>{Math.round(conf*100)}% CONF</span>
    </div>
  );
}

// ── Friends chip ──────────────────────────────────────────────
function FriendsChip({C, friends}) {
  if (!friends.length) return null;
  return (
    <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',background:C.surf,borderRadius:8,border:`1px solid ${C.hair2}`}}>
      <div style={{display:'flex',gap:-4}}>
        {friends.slice(0,3).map((f,i)=>(
          <div key={i} style={{width:22,height:22,borderRadius:'50%',background:C.surf2,border:`2px solid ${C.bg}`,marginLeft:i>0?-8:0,display:'flex',alignItems:'center',justifyContent:'center',zIndex:friends.length-i}}>
            <span style={{fontFamily:'"Archivo",sans-serif',fontSize:9,color:C.muted}}>{f.name[0]}</span>
          </div>
        ))}
      </div>
      <div style={{flex:1,minWidth:0}}>
        <span style={{fontFamily:'"Archivo",sans-serif',fontSize:11,color:C.ink,fontWeight:500}}>{friends[0].name}{friends.length>1?` +${friends.length-1} others`:''} trained today</span>
      </div>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={C.faint} strokeWidth="2" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
  );
}

// ── Docked CTA ────────────────────────────────────────────────
function DockedCTA({C, user}) {
  const hasDraft = !!user.draftWorkout;
  const [confirmNew, setConfirmNew] = React.useState(false);

  if (hasDraft) {
    const d = user.draftWorkout;
    const pct = d.sets / d.totalSets;
    return (
      <div style={{position:'absolute',bottom:96,left:0,right:0,padding:'10px 16px 0',background:C.bg,borderTop:`1px solid ${C.hair2}`,zIndex:60}}>
        {/* Are you sure confirmation */}
        {confirmNew && (
          <div style={{marginBottom:8,padding:'10px 14px',background:C.surf,borderRadius:10,border:`1px solid ${C.hair2}`}}>
            <div style={{fontFamily:'"Archivo",sans-serif',fontSize:13,fontWeight:600,color:C.ink,marginBottom:3}}>Discard current workout?</div>
            <div style={{fontFamily:'"Archivo",sans-serif',fontSize:12,color:C.muted,marginBottom:10}}>Your progress on {d.name} will be lost.</div>
            <div style={{display:'flex',gap:8}}>
              <div onClick={()=>setConfirmNew(false)} style={{flex:1,height:34,borderRadius:8,background:C.surf2,border:`1px solid ${C.hair2}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
                <span style={{fontFamily:'"Archivo",sans-serif',fontSize:16,letterSpacing:1,color:C.muted}}>CANCEL</span>
              </div>
              <div style={{flex:1,height:34,borderRadius:8,background:'#c0341a',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
                <span style={{fontFamily:'"Archivo",sans-serif',fontSize:14,letterSpacing:0.8,color:'#fff'}}>DISCARD + START NEW</span>
              </div>
            </div>
          </div>
        )}
        {/* START NEW WORKOUT — uppercase link, not a button */}
        {!confirmNew && (
          <div style={{display:'flex',justifyContent:'center',marginBottom:7}}>
            <span onClick={()=>setConfirmNew(true)} style={{fontFamily:'"Space Mono",monospace',fontSize:10,color:C.muted,letterSpacing:1,cursor:'pointer',borderBottom:`1px solid ${C.faint}`,paddingBottom:1}}>
              START NEW WORKOUT
            </span>
          </div>
        )}
        {/* Full-width continue — whole bar is tappable, no separate resume button */}
        <div style={{position:'relative',height:54,borderRadius:12,overflow:'hidden',background:C.surf,border:`1px solid ${C.accent}55`,cursor:'pointer'}}>
          <div style={{position:'absolute',left:0,top:0,bottom:0,width:`${pct*100}%`,background:C.accent,opacity:0.18,borderRadius:12}}/>
          <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',padding:'0 18px',gap:14}}>
            <div style={{flex:1}}>
              <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:20,letterSpacing:1.5,color:C.accent}}>CONTINUE {d.name}</div>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,marginTop:1}}>{d.elapsed} · {d.sets}/{d.totalSets} SETS DONE</div>
            </div>
            <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:22,color:C.accent,flexShrink:0}}>›</span>
          </div>
        </div>
      </div>
    );
  }

  // Normal start workout — full width, no divider
  return (
    <div style={{position:'absolute',bottom:96,left:0,right:0,padding:'10px 16px 0',background:C.bg,zIndex:60}}>
      <div style={{position:'relative',height:54,borderRadius:12,background:C.accent,boxShadow:`0 8px 24px ${C.accent}44`,cursor:'pointer'}}>
        <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',padding:'0 20px',gap:10}}>
          <div style={{flex:1}}>
            <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:'rgba(255,255,255,0.6)',letterSpacing:1.5,marginBottom:2}}>TODAY · {user.prediction.program}</div>
            <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:22,letterSpacing:1.5,color:'#fff'}}>{user.prediction.name}</div>
          </div>
          <div style={{textAlign:'right',flexShrink:0}}>
            <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:'rgba(255,255,255,0.6)',letterSpacing:0.8,marginBottom:2}}>{user.prediction.estDuration}</div>
            <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:20,letterSpacing:1,color:'#fff'}}>START WORKOUT ›</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// VARIANT A — DENSE (Bloomberg Terminal)
// Max information density. Ticker, tabular KPIs, mini bars,
// everything visible above the fold before scrolling.
// ══════════════════════════════════════════════════════════════
function HomeDense({C, user}) {
  const dark=C===TD;
  return (
    <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',color:C.ink,fontFamily:'"Archivo",sans-serif'}}>
      <StatusBar dark={dark}/>
      <TickerStrip C={C}/>

      {/* Masthead row */}
      <div style={{padding:'8px 16px 6px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:`1px solid ${C.hair}`}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:16,height:16,background:C.accent,borderRadius:3}}/>
          <span style={{fontFamily:'"Space Mono",monospace',fontSize:10,letterSpacing:2,fontWeight:700,color:C.ink}}>PULSE/PUMP</span>
        </div>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <div style={{width:28,height:28,borderRadius:8,background:C.surf,border:`1px solid ${C.hair2}`,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <span style={{fontFamily:'"Archivo",sans-serif',fontSize:13,color:C.muted}}>J</span>
          </div>
        </div>
      </div>

      {/* Prediction block — tabular */}
      <div style={{padding:'10px 16px',borderBottom:`1px solid ${C.hair}`,background:C.surf}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
          <div>
            <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:1.5,marginBottom:4}}>PREDICTED TODAY · {user.prediction.program}</div>
            <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:36,color:C.ink,letterSpacing:0.5,lineHeight:0.9}}>{user.prediction.name}</div>
            <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,marginTop:4}}>
              <span style={{marginRight:10}}>{user.prediction.lastDone.toUpperCase()}</span>
              <span>{user.prediction.estDuration}</span>
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <ConfidenceDots conf={user.prediction.confidence} C={C}/>
            <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,marginTop:6,maxWidth:120,textAlign:'right',lineHeight:1.4}}>{user.prediction.reason}</div>
          </div>
        </div>
        {/* Upcoming exercise list */}
        <div style={{display:'flex',gap:5,marginTop:8,flexWrap:'wrap'}}>
          {user.prediction.exercises.map((e,i)=>(
            <span key={i} style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,background:C.surf2,padding:'2px 7px',borderRadius:4,letterSpacing:0.5}}>{e.toUpperCase()}</span>
          ))}
          <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.faint,padding:'2px 4px'}}>NOT TODAY? ›</span>
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',paddingBottom:180}}>
        {/* 4-up KPI row */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',borderBottom:`1px solid ${C.hair}`}}>
          {[
            {l:'STREAK',  v:`${user.weekStreak}D`, d:'▲ +1',     up:true},
            {l:'IMPROVED',v:`${user.weekImproved}`, d:'this wk',  up:null},
            {l:'PRs',     v:user.weekPRs,           d:'this wk',  up:null},
            {l:'SETS',    v:user.weekVol.reduce((a,b)=>a+b,0),d:'this wk', up:null},
          ].map((s,i)=>(
            <div key={i} style={{padding:'9px 10px',borderRight:i<3?`1px solid ${C.hair}`:'none',textAlign:'center'}}>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:7,color:C.muted,letterSpacing:1.2,marginBottom:3}}>{s.l}</div>
              <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:22,color:s.up===true?C.up:C.ink,lineHeight:0.9}}>{s.v}</div>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:s.up===true?C.up:C.muted,marginTop:2,fontWeight:700}}>{s.d}</div>
            </div>
          ))}
        </div>

        {/* Weekly volume bars */}
        <div style={{padding:'10px 16px 8px',borderBottom:`1px solid ${C.hair}`}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:6}}>
            <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:1.5}}>WEEKLY VOLUME · SETS</span>
            <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted}}>WK 14 · {user.weekVol.reduce((a,b)=>a+b,0)} TOTAL</span>
          </div>
          <WeekBars C={C} data={user.weekVol} labels={user.weekLabels} done={user.weekDayDone} today={user.todayIdx} compact/>
        </div>

        {/* Friends */}
        <div style={{padding:'10px 16px',borderBottom:`1px solid ${C.hair}`}}>
          <FriendsChip C={C} friends={user.friends}/>
        </div>

        {/* Recent workouts — compact table */}
        <div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 56px 56px 56px',padding:'5px 16px',fontFamily:'"Space Mono",monospace',fontSize:7,letterSpacing:1.2,color:C.muted,background:C.surf2,borderBottom:`1px solid ${C.hair}`}}>
            <span>RECENT</span><span style={{textAlign:'center'}}>SETS</span><span style={{textAlign:'center'}}>IMPR</span><span style={{textAlign:'right'}}>VOL▲</span>
          </div>
          {[
            {name:'Pull Day',  date:'Thu',  sets:26, improved:'5/6', vol:'+11%'},
            {name:'Push Day',  date:'Mon',  sets:24, improved:'4/6', vol:'+8%'},
            {name:'Legs',      date:'Last Sat', sets:28, improved:'3/5', vol:'+3%'},
          ].map((w,i)=>(
            <div key={i} style={{display:'grid',gridTemplateColumns:'1fr 56px 56px 56px',alignItems:'center',padding:'8px 16px',borderBottom:`1px solid ${C.hair}`}}>
              <div>
                <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:600,fontSize:14,color:C.ink,letterSpacing:0.3}}>{w.name}</div>
                <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,marginTop:1}}>{w.date}</div>
              </div>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:11,color:C.muted,textAlign:'center',fontWeight:700}}>{w.sets}</div>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:11,color:C.up,textAlign:'center',fontWeight:700}}>{w.improved}</div>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:11,color:C.up,textAlign:'right',fontWeight:700}}>▲{w.vol}</div>
            </div>
          ))}
        </div>
      </div>

      <DockedCTA C={C} user={user}/>
      <TabBar C={C} active="Home"/>
    </div>
  );
}


// ── Layout ────────────────────────────────────────────────────
function PhoneCard({num,vibe,children}) {
  return(
    <div className="pcard">
      <div><div className="card-label"><span className="num">{num}</span><span className="vibe">{vibe}</span></div></div>
      <div className="frame"><div className="screen">{children}</div></div>
    </div>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#c8553d",
  "variant": "dense"
}/*EDITMODE-END*/;

function TweaksPanel({ tweaks, setTweak, visible }) {
  if (!visible) return null;
  return (
    <div style={{position:'fixed',bottom:24,right:24,zIndex:9999,background:'#fff',borderRadius:14,padding:'16px 18px',boxShadow:'0 8px 32px rgba(0,0,0,0.18)',border:'1px solid rgba(0,0,0,0.1)',minWidth:220,fontFamily:'Inter,system-ui'}}>
      <div style={{fontSize:12,fontWeight:700,letterSpacing:1,color:'#888',marginBottom:12,textTransform:'uppercase'}}>Tweaks</div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <span style={{fontSize:13,color:'#333'}}>Accent color</span>
        <input type="color" value={tweaks.accentColor} onChange={e=>setTweak('accentColor',e.target.value)} style={{width:32,height:24,border:'none',borderRadius:4,cursor:'pointer'}}/>
      </div>
      <div>
        <span style={{fontSize:13,color:'#333',display:'block',marginBottom:8}}>Show variant</span>
        {['all','dense','calm','balanced'].map(v=>(
          <div key={v} onClick={()=>setTweak('variant',v)} style={{display:'flex',alignItems:'center',gap:8,padding:'4px 0',cursor:'pointer'}}>
            <div style={{width:14,height:14,borderRadius:3,border:`2px solid ${tweaks.variant===v?'#c8553d':'#ddd'}`,background:tweaks.variant===v?'#c8553d':'transparent'}}/>
            <span style={{fontSize:12,color:'#555',textTransform:'capitalize'}}>{v}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [tweaks, setTweaksState] = React.useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = React.useState(false);
  const setTweak = (k,v) => { setTweaksState(p => { const n={...p,[k]:v}; window.parent.postMessage({type:'__edit_mode_set_keys',edits:n},'*'); return n; }); };
  React.useEffect(()=>{ const h=(e)=>{ if(e.data?.type==='__activate_edit_mode') setTweaksVisible(true); if(e.data?.type==='__deactivate_edit_mode') setTweaksVisible(false); }; window.addEventListener('message',h); window.parent.postMessage({type:'__edit_mode_available'},'*'); return()=>window.removeEventListener('message',h); },[]);
  const CL = tweaks.accentColor !== '#c8553d' ? {...TL,accent:tweaks.accentColor,accentSoft:tweaks.accentColor+'18'} : TL;
  const CD = tweaks.accentColor !== '#c8553d' ? {...TD,accent:tweaks.accentColor,accentSoft:tweaks.accentColor+'18'} : TD;
  return (
    <>
    <TweaksPanel tweaks={tweaks} setTweak={setTweak} visible={tweaksVisible}/>
    <div className="canvas">
      <h1>Home Screen</h1>
      <p className="h1-sub">Dense Bloomberg variant. Smart workout prediction docked at bottom — one tap to start. Ticker strip shows weekly muscle deltas. Light + dark + draft state.</p>
      <div className="grid">
        <PhoneCard num="A1" vibe="Light"><HomeDense C={CL} user={USER}/></PhoneCard>
        <PhoneCard num="A2" vibe="Dark"><HomeDense C={CD} user={USER}/></PhoneCard>
        <PhoneCard num="A3" vibe="Draft in progress"><HomeDense C={CL} user={USER_DRAFT}/></PhoneCard>
      </div>
    </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
