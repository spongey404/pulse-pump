<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Pump — Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #edeae3; min-height: 100vh; font-family: 'Archivo', system-ui; }
  .canvas { padding: 60px 40px 120px; }
  h1 { font-family: 'DM Sans', sans-serif; font-weight: 400; font-size: 52px; letter-spacing: -1.5px; line-height: 1; max-width: 1900px; margin: 0 auto 12px; }
  .h1-sub { font-family: 'Archivo'; font-size: 15px; color: #777; max-width: 700px; margin: 0 auto 56px; line-height: 1.5; }
  .section-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #c8553d; max-width: 1900px; margin: 56px auto 10px; font-weight: 700; }
  .section-desc { font-family: 'Archivo'; font-size: 13px; color: #888; max-width: 700px; margin: 0 auto 28px; line-height: 1.5; }
  .grid { display: flex; gap: 32px; max-width: 1900px; margin: 0 auto; align-items: flex-start; flex-wrap: wrap; }
  .pcard { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
  .card-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }
  .card-label .num { color: #c8553d; font-weight: 700; }
  .card-label .vibe { color: #1a1a1a; font-weight: 600; margin-left: 6px; }
  .frame { width: 390px; height: 844px; border-radius: 48px; padding: 4px; background: linear-gradient(135deg, #cbcac4, #b9b8b2); box-shadow: 0 40px 80px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.4); flex-shrink: 0; }
  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; position: relative; background: #fbf8f2; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideIn { from { transform:translateX(30px); opacity:0; } to { transform:translateX(0); opacity:1; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">


// ── Tokens ────────────────────────────────────────────────────
const C = {
  bg:'#fbf8f2', surf:'#f4f0e6', surf2:'#ece7d8',
  ink:'#1f1c19', ink2:'#3a342d',
  muted:'rgba(31,28,25,0.5)', faint:'rgba(31,28,25,0.13)',
  hair:'rgba(31,28,25,0.08)', hair2:'rgba(31,28,25,0.13)',
  accent:'#c8553d', accentSoft:'rgba(200,85,61,0.08)',
  up:'#1f8f5a',
};

// ── Shared primitives ─────────────────────────────────────────
const StatusBar = () => (
  <div style={{height:50,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:6,flexShrink:0}}>
    <div style={{width:126,height:37,background:'#000',borderRadius:24}}/>
  </div>
);

// Progress bar — step N of total
function ProgressBar({step, total}) {
  return (
    <div style={{padding:'0 20px',marginBottom:8}}>
      <div style={{height:2,background:C.hair,borderRadius:999,overflow:'hidden'}}>
        <div style={{height:'100%',width:`${(step/total)*100}%`,background:C.accent,borderRadius:999,transition:'width 0.35s ease'}}/>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',marginTop:5}}>
        <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:1}}>STEP {step} OF {total}</span>
        <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:1}}>{Math.round((step/total)*100)}%</span>
      </div>
    </div>
  );
}

// Back button
function BackBtn({onBack}) {
  if (!onBack) return <div style={{width:36,height:36}}/>;
  return (
    <div onClick={onBack} style={{width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',borderRadius:8,background:C.surf}}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
  );
}

// Primary CTA
function PrimaryCTA({label='CONTINUE', onTap, disabled=false, sub=null}) {
  return (
    <div style={{padding:'0 20px 16px'}}>
      {sub && <div style={{fontFamily:'"Archivo",sans-serif',fontSize:11,color:C.muted,textAlign:'center',marginBottom:10,lineHeight:1.4}}>{sub}</div>}
      <div onClick={!disabled?onTap:undefined} style={{height:52,borderRadius:12,background:disabled?C.surf:C.accent,display:'flex',alignItems:'center',justifyContent:'center',cursor:disabled?'default':'pointer',boxShadow:disabled?'none':`0 8px 20px ${C.accent}33`,transition:'all 0.2s'}}>
        <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:22,letterSpacing:2,color:disabled?C.muted:'#fff'}}>{label}</span>
      </div>
    </div>
  );
}

// Question heading
function QHead({label, title, sub}) {
  return (
    <div style={{padding:'6px 20px 20px',animation:'fadeUp 0.3s ease-out'}}>
      {label && <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:1.5,marginBottom:8}}>{label}</div>}
      <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:300,fontSize:30,color:C.ink,letterSpacing:-0.5,lineHeight:1.1}}>{title}</div>
      {sub && <div style={{fontFamily:'"Archivo",sans-serif',fontSize:13,color:C.muted,marginTop:8,lineHeight:1.5}}>{sub}</div>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// SCREEN 1: Auth
// ══════════════════════════════════════════════════════════════
function AuthScreen({onNext}) {
  return (
    <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',color:C.ink}}>
      <StatusBar/>
      <div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'center',padding:'0 24px 40px',animation:'fadeUp 0.4s ease-out'}}>
        {/* Logo */}
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:48}}>
          <div style={{width:44,height:44,borderRadius:12,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3.5 12L12 4M12 4L20.5 12M6 13.5v7M18 13.5v7M6 20.5h12M10.5 20.5v-4.5h3v4.5" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </div>
          <div>
            <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:26,color:C.ink,letterSpacing:1,lineHeight:1}}>PULSE/PUMP</div>
            <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:1.5}}>TRAIN SMARTER</div>
          </div>
        </div>

        <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:300,fontSize:36,color:C.ink,letterSpacing:-1,lineHeight:1.05,marginBottom:8}}>Your training,<br/>quantified.</div>
        <div style={{fontFamily:'"Archivo",sans-serif',fontSize:14,color:C.muted,marginBottom:44,lineHeight:1.5}}>Log workouts, track progress, and let the app predict what you should do next.</div>

        {/* Auth buttons */}
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {/* Apple */}
          <div onClick={onNext} style={{height:52,borderRadius:12,background:C.ink,display:'flex',alignItems:'center',justifyContent:'center',gap:10,cursor:'pointer'}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill={C.bg}><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.42c1.32.07 2.23.7 3 .75 1.15-.23 2.25-.92 3.47-.84 1.49.11 2.61.74 3.33 1.87-3.02 1.81-2.29 5.7.62 6.82-.48 1.27-1.12 2.54-2.42 4.26zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            <span style={{fontFamily:'"Archivo",sans-serif',fontSize:15,fontWeight:600,color:C.bg}}>Continue with Apple</span>
          </div>
          {/* Google */}
          <div onClick={onNext} style={{height:52,borderRadius:12,background:C.surf,border:`1px solid ${C.hair2}`,display:'flex',alignItems:'center',justifyContent:'center',gap:10,cursor:'pointer'}}>
            <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            <span style={{fontFamily:'"Archivo",sans-serif',fontSize:15,fontWeight:500,color:C.ink}}>Continue with Google</span>
          </div>
          {/* Email */}
          <div onClick={onNext} style={{height:52,borderRadius:12,background:'transparent',border:`1px solid ${C.hair2}`,display:'flex',alignItems:'center',justifyContent:'center',gap:10,cursor:'pointer'}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2" strokeLinecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span style={{fontFamily:'"Archivo",sans-serif',fontSize:15,fontWeight:500,color:C.muted}}>Use email instead</span>
          </div>
        </div>

        <div style={{marginTop:20,fontFamily:'"Archivo",sans-serif',fontSize:11,color:C.faint,textAlign:'center',lineHeight:1.5}}>
          By continuing you agree to our Terms of Service and Privacy Policy.
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// SCREEN 1.5: Email Sign-in / Sign-up
// ══════════════════════════════════════════════════════════════
function EmailAuthScreen({onNext, onBack, initialMode='signin'}) {
  const [mode, setMode] = React.useState(initialMode); // 'signin' | 'signup'
  const [email, setEmail] = React.useState('');
  const [pw, setPw] = React.useState('');
  const [pwVisible, setPwVisible] = React.useState(false);
  const [pwFocus, setPwFocus] = React.useState(false);
  const [emailFocus, setEmailFocus] = React.useState(false);

  const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const pwValid = pw.length >= 8;
  const canSubmit = emailValid && pwValid;

  // password strength meter (signup only)
  const pwScore = (() => {
    let s = 0;
    if (pw.length >= 8) s++;
    if (pw.length >= 12) s++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) s++;
    if (/\d/.test(pw)) s++;
    if (/[^A-Za-z0-9]/.test(pw)) s++;
    return Math.min(s, 4);
  })();
  const strengthLabel = ['','WEAK','FAIR','GOOD','STRONG'][pwScore];
  const strengthColor = ['#999','#c0341a','#c89b3d','#7a8f3a','#1f8f5a'][pwScore];

  return (
    <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',color:C.ink}}>
      <StatusBar/>
      <div style={{padding:'4px 20px 0',display:'flex',alignItems:'center',gap:10}}>
        <BackBtn onBack={onBack}/>
        <div style={{flex:1,display:'flex',justifyContent:'flex-end'}}>
          <div style={{fontFamily:'"Space Mono",monospace',fontSize:10,fontWeight:700,letterSpacing:1.2,color:C.muted}}>EMAIL · STEP 01</div>
        </div>
      </div>

      <div style={{flex:1,display:'flex',flexDirection:'column',padding:'16px 0 0',animation:'fadeUp 0.3s ease-out'}}>
        {/* Header */}
        <div style={{padding:'6px 20px 20px'}}>
          <div style={{fontFamily:'"Space Mono",monospace',fontSize:10,fontWeight:700,letterSpacing:1.5,color:C.accent,marginBottom:10}}>
            {mode==='signin' ? '01 / WELCOME BACK' : '01 / CREATE ACCOUNT'}
          </div>
          <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:300,fontSize:34,color:C.ink,letterSpacing:-0.8,lineHeight:1.05,whiteSpace:'pre-line'}}>
            {mode==='signin' ? 'Sign in to\nyour account.' : 'Create your\naccount.'}
          </div>
          <div style={{fontFamily:'"Archivo",sans-serif',fontSize:13,color:C.muted,marginTop:8,lineHeight:1.5}}>
            {mode==='signin' ? 'Pick up right where you left off.' : 'Takes 30 seconds. No spam, ever.'}
          </div>
        </div>

        {/* Mode toggle — segmented, Bloomberg-style */}
        <div style={{padding:'0 20px',marginBottom:20}}>
          <div style={{display:'flex',background:C.surf2,borderRadius:10,padding:3,gap:2}}>
            {[['signin','SIGN IN'],['signup','SIGN UP']].map(([k,lbl])=>(
              <div key={k} onClick={()=>setMode(k)} style={{flex:1,height:36,borderRadius:8,background:mode===k?C.bg:'transparent',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',transition:'background 0.15s',boxShadow:mode===k?'0 1px 3px rgba(0,0,0,0.06)':'none'}}>
                <span style={{fontFamily:'"Space Mono",monospace',fontSize:11,fontWeight:700,color:mode===k?C.accent:C.muted,letterSpacing:1.2}}>{lbl}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Form */}
        <div style={{padding:'0 20px',flex:1,display:'flex',flexDirection:'column',gap:14}}>
          {/* Email field */}
          <div>
            <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,fontWeight:700,letterSpacing:1.2,color:C.muted,marginBottom:6}}>EMAIL</div>
            <div style={{position:'relative'}}>
              <input
                value={email}
                onChange={e=>setEmail(e.target.value)}
                onFocus={()=>setEmailFocus(true)}
                onBlur={()=>setEmailFocus(false)}
                placeholder="you@example.com"
                type="email"
                autoCapitalize="none"
                autoComplete="email"
                style={{width:'100%',height:50,background:C.surf,border:`1px solid ${emailFocus?C.accent:(email&&!emailValid?'#c0341a':C.hair2)}`,borderRadius:11,padding:'0 14px',fontFamily:'"Archivo",sans-serif',fontWeight:500,fontSize:16,color:C.ink,outline:'none',transition:'border 0.15s'}}
              />
              {email && emailValid && (
                <div style={{position:'absolute',right:14,top:'50%',transform:'translateY(-50%)',width:18,height:18,borderRadius:9,background:C.up,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.5l2.5 2.5 4.5-5" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </div>
              )}
            </div>
            {email && !emailValid && (
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,fontWeight:700,letterSpacing:1,color:'#c0341a',marginTop:6}}>NOT A VALID EMAIL</div>
            )}
          </div>

          {/* Password field */}
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:6}}>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,fontWeight:700,letterSpacing:1.2,color:C.muted}}>PASSWORD</div>
              {mode==='signin' && (
                <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,fontWeight:700,letterSpacing:1,color:C.accent,cursor:'pointer'}}>FORGOT?</div>
              )}
            </div>
            <div style={{position:'relative'}}>
              <input
                value={pw}
                onChange={e=>setPw(e.target.value)}
                onFocus={()=>setPwFocus(true)}
                onBlur={()=>setPwFocus(false)}
                placeholder={mode==='signup'?'At least 8 characters':'Your password'}
                type={pwVisible?'text':'password'}
                autoComplete={mode==='signin'?'current-password':'new-password'}
                style={{width:'100%',height:50,background:C.surf,border:`1px solid ${pwFocus?C.accent:C.hair2}`,borderRadius:11,padding:'0 44px 0 14px',fontFamily:'"Archivo",sans-serif',fontWeight:500,fontSize:16,letterSpacing:pw&&!pwVisible?2:0,color:C.ink,outline:'none',transition:'border 0.15s'}}
              />
              <div onClick={()=>setPwVisible(v=>!v)} style={{position:'absolute',right:6,top:'50%',transform:'translateY(-50%)',width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
                {pwVisible ? (
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                ) : (
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                )}
              </div>
            </div>

            {/* Strength meter (signup only, when typing) */}
            {mode==='signup' && pw.length>0 && (
              <div style={{marginTop:8}}>
                <div style={{display:'flex',gap:4,marginBottom:5}}>
                  {[0,1,2,3].map(i=>(
                    <div key={i} style={{flex:1,height:3,borderRadius:2,background:i<pwScore?strengthColor:C.hair2,transition:'background 0.2s'}}/>
                  ))}
                </div>
                <div style={{display:'flex',justifyContent:'space-between'}}>
                  <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,fontWeight:700,letterSpacing:1,color:strengthColor}}>{strengthLabel}</span>
                  <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,fontWeight:700,letterSpacing:1,color:C.muted}}>MIN 8 CHARS</span>
                </div>
              </div>
            )}
          </div>

          {/* Spacer + bottom microcopy */}
          <div style={{flex:1}}/>

          {mode==='signup' && (
            <div style={{fontFamily:'"Archivo",sans-serif',fontSize:11,color:C.faint,lineHeight:1.5,paddingBottom:6}}>
              By creating an account you agree to our <span style={{color:C.muted,textDecoration:'underline'}}>Terms</span> and <span style={{color:C.muted,textDecoration:'underline'}}>Privacy Policy</span>.
            </div>
          )}
        </div>
      </div>

      <PrimaryCTA
        label={mode==='signin'?'SIGN IN':'CREATE ACCOUNT'}
        onTap={()=>canSubmit&&onNext({email})}
        disabled={!canSubmit}
      />
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// SCREEN 2: Name
// ══════════════════════════════════════════════════════════════
function NameScreen({onNext, onBack, step, total}) {
  const [name, setName] = React.useState('');
  return (
    <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',color:C.ink}}>
      <StatusBar/>
      <div style={{padding:'4px 20px 0',display:'flex',alignItems:'center',gap:10}}>
        <BackBtn onBack={onBack}/>
        <div style={{flex:1}}><ProgressBar step={step} total={total}/></div>
      </div>
      <div style={{flex:1,display:'flex',flexDirection:'column',padding:'16px 0 0'}}>
        <QHead label="01 / NAME" title={"What should\nwe call you?"} sub="This is how you'll appear to friends and on your profile."/>
        <div style={{padding:'0 20px',flex:1}}>
          <input
            value={name} onChange={e=>setName(e.target.value)}
            placeholder="Your name"
            autoFocus
            style={{width:'100%',height:54,background:C.surf,border:`1px solid ${name?C.accent:C.hair2}`,borderRadius:12,padding:'0 16px',fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:24,letterSpacing:0.5,color:C.ink,outline:'none',transition:'border 0.15s'}}
          />
          <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:0.8,marginTop:8}}>FIRST NAME IS FINE · CAN CHANGE LATER</div>
        </div>
      </div>
      <PrimaryCTA label="CONTINUE" onTap={()=>name.trim()&&onNext({name})} disabled={!name.trim()}/>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// SCREEN 3: Weight
// ══════════════════════════════════════════════════════════════
function WeightScreen({onNext, onBack, step, total, data}) {

// COMPLETE FLOW — interactive
// ══════════════════════════════════════════════════════════════
const SCREENS = ['auth','name','weight','height','age','gender','experience','split','tutorial','done'];
const TOTAL_STEPS = 8; // excludes auth and done

function OnboardingFlow({startAt='auth'}) {
  const [screen, setScreen] = React.useState(startAt);
  const [data, setData] = React.useState({});
  const [history, setHistory] = React.useState([]);

  const go = (next, newData={}) => {
    setHistory(h=>[...h, screen]);
    setData(d=>({...d,...newData}));
    setScreen(next);
  };
  const back = () => {
    const prev = history[history.length-1];
    if (prev) { setHistory(h=>h.slice(0,-1)); setScreen(prev); }
  };

  const stepOf = (s) => Math.max(1, SCREENS.indexOf(s) - 1);

  if (screen==='done') {
    return (
      <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 24px',gap:16,color:C.ink}}>
        <div style={{width:60,height:60,borderRadius:18,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3.5 12L12 4M12 4L20.5 12M6 13.5v7M18 13.5v7M6 20.5h12M10.5 20.5v-4.5h3v4.5"/></svg>
        </div>
        <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:36,color:C.ink,letterSpacing:0.5,textAlign:'center'}}>LET'S GO</div>
        <div style={{fontFamily:'"Archivo",sans-serif',fontSize:13,color:C.muted,textAlign:'center',lineHeight:1.5}}>
          Navigating to your home screen…
        </div>
        <div style={{marginTop:8,fontFamily:'"Space Mono",monospace',fontSize:9,color:C.faint,letterSpacing:0.8}}>
          {Object.entries(data).map(([k,v])=>`${k}: ${v}`).join(' · ')}
        </div>
      </div>
    );
  }

  const step = stepOf(screen);

  if (screen==='auth')       return <AuthScreen onNext={()=>go('name')}/>;
  if (screen==='name')       return <NameScreen onNext={d=>go('weight',d)} onBack={back} step={1} total={TOTAL_STEPS}/>;
  if (screen==='weight')     return <WeightScreen onNext={d=>go('height',d)} onBack={back} step={2} total={TOTAL_STEPS} data={data}/>;
  if (screen==='height')     return <HeightScreen onNext={d=>go('age',d)} onBack={back} step={3} total={TOTAL_STEPS}/>;
  if (screen==='age')        return <AgeScreen onNext={d=>go('gender',d)} onBack={back} step={4} total={TOTAL_STEPS}/>;
  if (screen==='gender')     return <GenderScreen onNext={d=>go('experience',d)} onBack={back} step={5} total={TOTAL_STEPS}/>;
  if (screen==='experience') return <ExperienceScreen onNext={d=>go('split',d)} onBack={back} step={6} total={TOTAL_STEPS}/>;
  if (screen==='split')      return <SplitScreen onNext={d=>go('tutorial',d)} onBack={back} step={7} total={TOTAL_STEPS}/>;
  if (screen==='tutorial')   return <TutorialScreen onNext={d=>go('done',d)} onBack={back} step={8} total={TOTAL_STEPS} data={data}/>;
  return null;
}
