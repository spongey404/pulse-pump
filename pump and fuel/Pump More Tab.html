<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Pump — More Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #edeae3; min-height: 100vh; font-family: 'Archivo', system-ui; }
  .canvas { padding: 60px 40px 120px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 52px; letter-spacing: -1.5px; line-height: 1; max-width: 1900px; margin: 0 auto 12px; }
  .h1-sub { font-family: 'Archivo'; font-size: 15px; color: #777; max-width: 700px; margin: 0 auto 56px; line-height: 1.5; }
  .section-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #c8553d; max-width: 1900px; margin: 56px auto 10px; font-weight: 700; }
  .section-desc { font-family: 'Archivo'; font-size: 13px; color: #888; max-width: 700px; margin: 0 auto 28px; line-height: 1.5; }
  .grid { display: flex; gap: 40px; max-width: 1900px; margin: 0 auto; align-items: flex-start; flex-wrap: wrap; }
  .pcard { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
  .card-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }
  .card-label .num { color: #c8553d; font-weight: 700; }
  .card-label .vibe { color: #1a1a1a; font-weight: 600; margin-left: 6px; }
  .frame { width: 390px; height: 844px; border-radius: 48px; padding: 4px; background: linear-gradient(135deg, #cbcac4, #b9b8b2); box-shadow: 0 40px 80px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.4); flex-shrink: 0; }
  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; position: relative; }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

// ── Tokens ────────────────────────────────────────────────────
const TL = {
  bg:'#fbf8f2', surf:'#f4f0e6', surf2:'#ece7d8', surf3:'#e2dccd',
  ink:'#1f1c19', ink2:'#3a342d',
  muted:'rgba(31,28,25,0.5)', faint:'rgba(31,28,25,0.13)',
  hair:'rgba(31,28,25,0.08)', hair2:'rgba(31,28,25,0.13)',
  accent:'#c8553d', accentSoft:'rgba(200,85,61,0.08)',
  up:'#1f8f5a', down:'#c0341a', pr:'#c9892e',
};
const TD = {
  bg:'#1a1816', surf:'#252220', surf2:'#2e2a26', surf3:'#363028',
  ink:'#ece5d6', ink2:'#c8bfb0',
  muted:'rgba(236,229,214,0.5)', faint:'rgba(236,229,214,0.13)',
  hair:'rgba(236,229,214,0.08)', hair2:'rgba(236,229,214,0.13)',
  accent:'#dc7d4a', accentSoft:'rgba(220,125,74,0.10)',
  up:'#3fb777', down:'#e05a45', pr:'#d4a03c',
};

// ── Primitives ─────────────────────────────────────────────────
const StatusBar = ({dark=false}) => (
  <div style={{height:50,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:6,flexShrink:0}}>
    <div style={{width:126,height:37,background:dark?'rgba(255,255,255,0.1)':'#000',borderRadius:24}}/>
  </div>
);

function TabBar({C}) {
  const dark=C===TD;
  const muted=dark?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.35)';
  const bg=dark?'rgba(26,24,22,0.94)':'rgba(251,248,242,0.94)';
  const bord=dark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';
  const tabs=[{k:'Programs'},{k:'Social'},{k:'Home',center:true},{k:'Body'},{k:'More',active:true}];
  const ICON=(k,col)=>{const s={width:22,height:22,fill:'none',stroke:col,strokeWidth:1.6,strokeLinecap:'round',strokeLinejoin:'round'};
    if(k==='Programs')return<svg {...s} viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>;
    if(k==='Social')  return<svg {...s} viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><path d="M3 19c.5-3 3-5 6-5s5.5 2 6 5"/></svg>;
    if(k==='Body')    return<svg {...s} viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M8 11l4-3 4 3M12 8v6M9 14l-2 6M15 14l2 6"/></svg>;
    if(k==='More')    return<svg {...s} viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>;
    return null;
  };
  return(
    <div style={{position:'absolute',bottom:0,left:0,right:0,background:bg,backdropFilter:'blur(16px)',borderTop:`0.5px solid ${bord}`,display:'flex',alignItems:'center',padding:'8px 0 28px',zIndex:50}}>
      {tabs.map((t,i)=>{
        const isActive=t.active;
        const col=isActive?C.ink:muted;
        return(
          <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
            {t.center
              ?<div style={{width:46,height:46,borderRadius:15,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',marginTop:-12,boxShadow:`0 8px 16px ${C.accent}44`}}>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3.5 12L12 4M12 4L20.5 12M6 13.5v7M18 13.5v7M6 20.5h12M10.5 20.5v-4.5h3v4.5" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </div>
              :ICON(t.k,col)}
            <span style={{fontFamily:'"Archivo",sans-serif',fontSize:10,fontWeight:isActive?600:500,color:t.center?C.accent:col}}>{t.k}</span>
          </div>
        );
      })}
    </div>
  );
}

// ── Nav row component ─────────────────────────────────────────
function NavRow({C, icon, label, sub, badge, chevron=true, accent=false, destructive=false, onTap}) {
  const color = destructive ? C.down : accent ? C.accent : C.ink;
  return (
    <div onClick={onTap} style={{display:'flex',alignItems:'center',gap:12,padding:'13px 16px',borderBottom:`1px solid ${C.hair}`,cursor:'pointer',background:'transparent'}}>
      <div style={{width:32,height:32,borderRadius:8,background:destructive?`${C.down}15`:accent?C.accentSoft:C.surf2,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">{icon}</svg>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontFamily:'"Archivo",sans-serif',fontSize:14,fontWeight:500,color}}>{label}</div>
        {sub && <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,marginTop:2,letterSpacing:0.5}}>{sub}</div>}
      </div>
      {badge && (
        <div style={{height:20,padding:'0 8px',borderRadius:4,background:C.accent,display:'flex',alignItems:'center'}}>
          <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,fontWeight:700,color:'#fff',letterSpacing:0.5}}>{badge}</span>
        </div>
      )}
      {chevron && <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={C.faint} strokeWidth="2" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>}
    </div>
  );
}

// ── Toggle row ────────────────────────────────────────────────
function ToggleRow({C, icon, label, sub, value, onChange}) {
  return (
    <div style={{display:'flex',alignItems:'center',gap:12,padding:'13px 16px',borderBottom:`1px solid ${C.hair}`}}>
      <div style={{width:32,height:32,borderRadius:8,background:C.surf2,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">{icon}</svg>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontFamily:'"Archivo",sans-serif',fontSize:14,fontWeight:500,color:C.ink}}>{label}</div>
        {sub && <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,marginTop:2,letterSpacing:0.5}}>{sub}</div>}
      </div>
      <div onClick={()=>onChange&&onChange(!value)} style={{width:44,height:26,borderRadius:999,background:value?C.accent:C.surf3,cursor:'pointer',position:'relative',transition:'background 0.2s',flexShrink:0}}>
        <div style={{position:'absolute',top:3,left:value?20:3,width:20,height:20,borderRadius:'50%',background:'#fff',transition:'left 0.2s',boxShadow:'0 1px 4px rgba(0,0,0,0.2)'}}/>
      </div>
    </div>
  );
}

// ── Section header ────────────────────────────────────────────
function SectionHeader({C, title}) {
  return (
    <div style={{padding:'14px 16px 6px',fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:1.5,textTransform:'uppercase'}}>
      {title}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// SCREEN: More Hub
// ══════════════════════════════════════════════════════════════
function MoreHub({C, onNav}) {
  const dark=C===TD;
  const user = { name:'Jay', handle:'@jaypump', workouts:148, streak:13, plan:'FREE' };

  return (
    <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',color:C.ink}}>
      <StatusBar dark={dark}/>
      <div style={{padding:'2px 16px 12px',borderBottom:`1px solid ${C.hair}`}}>
        <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:28,letterSpacing:0.5,color:C.ink}}>MORE</div>
      </div>

      <div style={{flex:1,overflowY:'auto',paddingBottom:96}}>
        {/* Profile card — tap to open profile */}
        <div onClick={()=>onNav('profile')} style={{margin:'12px 16px',padding:'14px',background:C.surf,borderRadius:12,border:`1px solid ${C.hair2}`,display:'flex',alignItems:'center',gap:12,cursor:'pointer'}}>
          <div style={{width:52,height:52,borderRadius:14,background:C.surf2,border:`1px solid ${C.hair2}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:22,color:C.muted}}>{user.name[0]}</span>
          </div>
          <div style={{flex:1}}>
            <div style={{fontFamily:'"Archivo",sans-serif',fontSize:16,fontWeight:700,color:C.ink}}>{user.name}</div>
            <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:0.8,marginTop:2}}>{user.handle}</div>
            <div style={{display:'flex',gap:10,marginTop:4}}>
              {[['WORKOUTS',user.workouts],['STREAK',`${user.streak}D`]].map(([l,v],i)=>(
                <div key={i}>
                  <span style={{fontFamily:'"Archivo",sans-serif',fontSize:14,color:C.ink}}>{v}</span>
                  <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,marginLeft:3,letterSpacing:0.5}}>{l}</span>
                </div>
              ))}
            </div>
          </div>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={C.faint} strokeWidth="2" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>

        {/* Pulse+ banner — strong CTA */}
        <div onClick={()=>onNav('pulse+')} style={{margin:'0 16px 12px',padding:'14px 16px',background:C.accent,borderRadius:12,boxShadow:`0 8px 24px ${C.accent}55`,display:'flex',alignItems:'center',gap:12,cursor:'pointer'}}>
          <div style={{width:36,height:36,borderRadius:8,background:'rgba(255,255,255,0.18)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </div>
          <div style={{flex:1}}>
            <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:18,color:'#fff',letterSpacing:1.2}}>UNLOCK PULSE+</div>
            <div style={{fontFamily:'"Space Mono",monospace',fontSize:10,color:'rgba(255,255,255,0.85)',marginTop:2,letterSpacing:0.5}}>SMART SUGGESTIONS · CLOUD SYNC · ANALYTICS</div>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>

        {/* Nav sections */}
        <SectionHeader C={C} title="TRAINING"/>
        <NavRow C={C} onTap={()=>onNav('history')} label="History"
          icon={<><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></>}
          sub="148 WORKOUTS · CALENDAR + LIST VIEW"/>
        <NavRow C={C} onTap={()=>onNav('equipment')} label="Equipment Profiles"
          icon={<><path d="M6.5 6.5h11M6.5 17.5h11M2 12h20M4 6.5v11M20 6.5v11"/></>}
          sub="HOME GYM · COMMERCIAL GYM"/>
        <NavRow C={C} onTap={()=>onNav('history')} label="Weekly Recap"
          icon={<><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></>}
          sub="AVAILABLE EVERY MONDAY"/>

        <SectionHeader C={C} title="ACCOUNT"/>
        <NavRow C={C} onTap={()=>onNav('profile')} label="Profile"
          icon={<><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></>}/>
        <NavRow C={C} onTap={()=>onNav('settings')} label="Settings"
          icon={<><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></>}/>
        <NavRow C={C} onTap={()=>onNav('pulse+')} label="Pulse+ Subscription"
          icon={<><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></>}
          sub={user.plan==='FREE'?'FREE PLAN · UPGRADE':'PULSE+ ACTIVE'} accent/>

        <SectionHeader C={C} title="HELP"/>
        <NavRow C={C} label="Tutorial" icon={<><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3M12 17h.01"/></>} sub="REPLAY ONBOARDING WALKTHROUGH"/>
        <NavRow C={C} label="Data Import" icon={<><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>} sub="IMPORT FROM STRONG · HEVY"/>
        <NavRow C={C} label="Privacy & Legal" icon={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>}/>
        <NavRow C={C} label="Sign Out" icon={<><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></>} destructive/>
      </div>
      <TabBar C={C}/>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// SCREEN: History
// ══════════════════════════════════════════════════════════════
function HistoryScreen({C, onBack}) {
  const dark=C===TD;
  const [view, setView] = React.useState('list');

  const workouts = [
    {name:'Pull Day',   date:'Thu 1 May',  sets:26, duration:'51:20', improved:'5/6', prs:1, vol:'+11%'},
    {name:'Push Day',   date:'Mon 28 Apr', sets:24, duration:'58:42', improved:'4/6', prs:2, vol:'+8%'},
    {name:'Legs',       date:'Sat 26 Apr', sets:28, duration:'64:10', improved:'3/5', prs:0, vol:'+3%'},
    {name:'Pull Day',   date:'Thu 24 Apr', sets:25, duration:'52:05', improved:'4/6', prs:1, vol:'+5%'},
    {name:'Push Day',   date:'Mon 21 Apr', sets:22, duration:'55:30', improved:'3/6', prs:0, vol:'-2%'},
    {name:'Legs',       date:'Sat 19 Apr', sets:30, duration:'66:45', improved:'4/5', prs:1, vol:'+7%'},
  ];

  // Calendar data — simplified
  const calDays = Array.from({length:35},(_,i)=>{
    const day = i - 4; // offset so week starts Mon
    const hasWorkout = [1,3,5,8,10,12,15,17,19,22,24,26,29,31].includes(day);
    const isToday = day === 30;
    return { day: day>0&&day<=31?day:null, hasWorkout, isToday };
  });

  return (
    <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',color:C.ink}}>
      <StatusBar dark={dark}/>
      <div style={{padding:'2px 16px 10px',display:'flex',alignItems:'center',gap:10,borderBottom:`1px solid ${C.hair}`}}>
        <div onClick={onBack} style={{cursor:'pointer',fontSize:20,color:C.muted}}>‹</div>
        <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:22,color:C.ink,letterSpacing:0.5,flex:1}}>HISTORY</div>
        {/* Toggle */}
        <div style={{display:'flex',background:C.surf2,borderRadius:8,padding:3,gap:2}}>
          {['list','calendar'].map(v=>(
            <div key={v} onClick={()=>setView(v)} style={{height:26,padding:'0 10px',borderRadius:6,background:view===v?C.bg:'transparent',display:'flex',alignItems:'center',cursor:'pointer',transition:'background 0.15s'}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={view===v?C.accent:C.muted} strokeWidth="2" strokeLinecap="round">
                {v==='list' ? <><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></>
                  : <><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></>}
              </svg>
            </div>
          ))}
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',paddingBottom:20}}>
        {view==='calendar' ? (
          <div style={{padding:'12px 16px'}}>
            {/* Month header */}
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
              <span style={{fontSize:16,color:C.muted}}>‹</span>
              <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:20,color:C.ink,letterSpacing:0.5}}>MAY 2026</span>
              <span style={{fontSize:16,color:C.faint}}>›</span>
            </div>
            {/* Day labels */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:6}}>
              {['M','T','W','T','F','S','S'].map((d,i)=>(
                <div key={i} style={{textAlign:'center',fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:0.8,padding:'4px 0'}}>{d}</div>
              ))}
            </div>
            {/* Calendar grid */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4}}>
              {calDays.map((d,i)=>(
                <div key={i} style={{aspectRatio:'1',borderRadius:8,background:d.isToday?C.accent:d.hasWorkout&&d.day?C.accentSoft:'transparent',border:d.isToday?`none`:d.hasWorkout&&d.day?`1px solid ${C.accent}44`:d.day?`1px solid ${C.hair}`:'none',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',cursor:d.day&&d.hasWorkout?'pointer':'default'}}>
                  {d.day && <span style={{fontFamily:'"Space Mono",monospace',fontSize:11,color:d.isToday?'#fff':d.hasWorkout?C.accent:C.muted,fontWeight:d.isToday||d.hasWorkout?700:400}}>{d.day}</span>}
                  {d.hasWorkout&&d.day&&!d.isToday&&<div style={{width:4,height:4,borderRadius:'50%',background:C.accent,marginTop:1}}/>}
                </div>
              ))}
            </div>
            {/* Selected workout preview */}
            <div style={{marginTop:14,padding:'12px',background:C.surf,borderRadius:10,border:`1px solid ${C.hair2}`}}>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:1.3,marginBottom:6}}>THU 1 MAY</div>
              <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:20,color:C.ink,letterSpacing:0.5}}>PULL DAY</div>
              <div style={{display:'flex',gap:12,marginTop:4,fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted}}>
                <span>26 SETS</span><span>·</span><span>51:20</span><span>·</span><span style={{color:C.up}}>▲ 5/6 IMPR</span>
              </div>
            </div>
          </div>
        ) : (
          <>
            {/* Stats header */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',borderBottom:`1px solid ${C.hair}`}}>

        <div onClick={onBack} style={{cursor:'pointer',fontSize:20,color:C.muted}}>‹</div>
        <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:22,color:C.ink,letterSpacing:0.5,flex:1}}>PULSE+</div>
      </div>

      <div style={{flex:1,overflowY:'auto',paddingBottom:20}}>
        {/* Hero */}
        <div style={{padding:'20px 16px 16px',borderBottom:`1px solid ${C.hair}`,textAlign:'center'}}>
          <div style={{width:52,height:52,borderRadius:14,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </div>
          <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:36,color:C.ink,letterSpacing:0.5,lineHeight:1}}>UNLOCK PULSE+</div>
          <div style={{fontFamily:'"Archivo",sans-serif',fontSize:13,color:C.muted,marginTop:6,lineHeight:1.5}}>The full Pulse ecosystem. Smarter training, deeper analytics, seamless sync.</div>
          {/* Free trial badge */}
          <div style={{display:'inline-flex',alignItems:'center',gap:6,marginTop:10,padding:'6px 14px',borderRadius:999,background:C.accentSoft,border:`1px solid ${C.accent}44`}}>
            <span style={{fontFamily:'"Space Mono",monospace',fontSize:10,fontWeight:700,color:C.accent,letterSpacing:0.8}}>14-DAY FREE TRIAL</span>
          </div>
        </div>

        {/* Billing toggle */}
        <div style={{padding:'12px 16px',borderBottom:`1px solid ${C.hair}`}}>
          <div style={{display:'flex',background:C.surf2,borderRadius:8,padding:3,gap:2}}>
            {['monthly','yearly'].map(b=>(
              <div key={b} onClick={()=>setBilling(b)} style={{flex:1,height:32,borderRadius:6,background:billing===b?C.bg:'transparent',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',transition:'background 0.15s'}}>
                <span style={{fontFamily:'"Space Mono",monospace',fontSize:10,fontWeight:700,color:billing===b?C.accent:C.muted,letterSpacing:0.8}}>
                  {b.toUpperCase()}{b==='yearly'?' · SAVE 25%':''}
                </span>
              </div>
            ))}
          </div>
        </div>

        {/* Tier selector */}
        <div style={{padding:'12px 16px',borderBottom:`1px solid ${C.hair}`}}>
          <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:1.3,marginBottom:8}}>UNLOCK</div>
          <div style={{display:'flex',gap:6}}>
            {[{id:'pump',label:'PUMP ONLY'},{id:'two',label:'2 APPS'},{id:'all',label:'ALL 3 APPS'}].map(t=>(
              <div key={t.id} onClick={()=>setTier(t.id)} style={{flex:1,borderRadius:10,padding:'10px 8px',background:tier===t.id?C.accentSoft:C.surf,border:`1px solid ${tier===t.id?C.accent:C.hair2}`,cursor:'pointer',textAlign:'center'}}>
                <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,fontWeight:700,color:tier===t.id?C.accent:C.muted,letterSpacing:0.5}}>{t.label}</div>
                <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:22,color:tier===t.id?C.accent:C.ink,marginTop:2,lineHeight:1}}>
                  {billing==='yearly'?pricing[t.id].yearly:pricing[t.id].monthly}
                </div>
                <div style={{fontFamily:'"Space Mono",monospace',fontSize:7,color:C.muted,marginTop:1}}>
                  {billing==='yearly'?'/YEAR':'/MONTH'}
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Features list */}
        <div style={{padding:'12px 16px 8px',fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:1.3}}>WHAT YOU GET</div>
        {features.map((f,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 16px',borderBottom:i<features.length-1?`1px solid ${C.hair}`:'none'}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.up} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            <span style={{fontFamily:'"Archivo",sans-serif',fontSize:12,color:C.ink}}>{f}</span>
          </div>
        ))}

        {/* CTA */}
        <div style={{padding:'16px'}}>
          <div style={{height:52,borderRadius:12,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',boxShadow:`0 8px 24px ${C.accent}44`}}>
            <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:22,letterSpacing:2,color:'#fff'}}>START FREE TRIAL</span>
          </div>
          <div style={{textAlign:'center',marginTop:8,fontFamily:'"Archivo",sans-serif',fontSize:11,color:C.muted,lineHeight:1.4}}>
            14 days free. Cancel anytime. No payment required to start.
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// COMPOSED — full navigation flow
// ══════════════════════════════════════════════════════════════
function MoreFlow({C}) {
  const [screen, setScreen] = React.useState('hub');
  const nav = (s) => setScreen(s);
  const back = () => setScreen('hub');

  const style = {width:'100%',height:'100%',animation:'slideIn 0.2s ease-out'};

  if (screen==='history')   return <div style={style}><HistoryScreen C={C} onBack={back}/></div>;
  if (screen==='profile')   return <div style={style}><ProfileScreen C={C} onBack={back}/></div>;
  if (screen==='settings')  return <div style={style}><SettingsScreen C={C} onBack={back}/></div>;
  if (screen==='equipment') return <div style={style}><EquipmentScreen C={C} onBack={back}/></div>;
  if (screen==='pulse+')    return <div style={style}><PulsePlusScreen C={C} onBack={back}/></div>;

  return <MoreHub C={C} onNav={nav}/>;
}

// ── Layout ────────────────────────────────────────────────────
function PhoneCard({num,vibe,children}) {
  return(
    <div className="pcard">
      <div><div className="card-label"><span className="num">{num}</span><span className="vibe">{vibe}</span></div></div>
      <div className="frame"><div className="screen">{children}</div></div>
    </div>
  );
}

function App() {
  return (
    <div className="canvas">
      <h1>More Tab</h1>
      <p className="h1-sub">Fully interactive. Tap any row in the hub to navigate. Fully wired: History (calendar/list toggle), Profile, Settings (all toggles live), Equipment Profiles with plate visualizer, Pulse+ paywall with billing/tier selectors.</p>

      <div className="section-label">FULLY INTERACTIVE FLOWS</div>
      <p className="section-desc">Tap any nav row to enter that screen. Back arrow returns to hub.</p>
      <div className="grid">
        <PhoneCard num="A1" vibe="Light — More Hub"><MoreFlow C={TL}/></PhoneCard>
        <PhoneCard num="A2" vibe="Dark — More Hub"><MoreFlow C={TD}/></PhoneCard>
      </div>

      <div className="section-label">INDIVIDUAL SCREENS</div>
      <div className="grid">
        <PhoneCard num="B1" vibe="History — List"><HistoryScreen C={TL} onBack={()=>{}}/></PhoneCard>
        <PhoneCard num="B2" vibe="History — Calendar"><div style={{width:'100%',height:'100%'}}>{React.createElement(()=>{const [v,setV]=React.useState('calendar');return <HistoryScreen C={TL} onBack={()=>{}}/>;})}</div></PhoneCard>
        <PhoneCard num="B3" vibe="Profile"><ProfileScreen C={TL} onBack={()=>{}}/></PhoneCard>
        <PhoneCard num="B4" vibe="Profile (dark)"><ProfileScreen C={TD} onBack={()=>{}}/></PhoneCard>
      </div>

      <div className="grid" style={{marginTop:40}}>
        <PhoneCard num="C1" vibe="Settings (light)"><SettingsScreen C={TL} onBack={()=>{}}/></PhoneCard>
        <PhoneCard num="C2" vibe="Settings (dark)"><SettingsScreen C={TD} onBack={()=>{}}/></PhoneCard>
        <PhoneCard num="C3" vibe="Equipment Profiles"><EquipmentScreen C={TL} onBack={()=>{}}/></PhoneCard>
        <PhoneCard num="C4" vibe="Pulse+ Paywall"><PulsePlusScreen C={TL} onBack={()=>{}}/></PhoneCard>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
