<div id="root"></div>
<script type="text/babel" data-presets="react">
// ── Shared tokens & primitives ─────────────────────────────────
const L = {
  bg: '#fbf8f2',
  surf: '#f4f0e6',
  surf2: '#ece7d8',

    dropset: { bg: 'rgba(200,85,61,0.13)', fg: '#a8442f', label: 'DROP' },
    restpause: { bg: 'rgba(31,28,25,0.08)', fg: '#3a342d', label: 'RP' },
    amrap: { bg: 'rgba(44,109,163,0.10)', fg: '#2c6da3', label: 'AMRAP' },
    failure: { bg: 'rgba(229,27,27,0.10)', fg: '#c0341a', label: 'FAIL' },
    unilateral: { bg: 'rgba(44,109,163,0.12)', fg: '#2c6da3', label: 'L/R' }
  }
};

const StatusBar = ({ color = L.ink }) =>
<div style={{ position: 'absolute', top: 18, left: 0, right: 0, height: 20, padding: '0 28px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', zIndex: 50, color, fontFamily: '-apple-system', fontWeight: 600, fontSize: 14 }}>
    <span>9:41</span>
    <div style={{ width: 120, height: 32, borderRadius: 18, background: '#000', position: 'absolute', left: '50%', top: 8, transform: 'translateX(-50%)' }} />
    <div style={{ display: 'flex', gap: 5, fontSize: 12 }}><span>●●●●</span><span>📶</span><span>▭</span></div>
  </div>;


// ── Persistent ticker (slow scroll) ────────────────────────────
function Ticker() {
  const items = [
  ['BENCH', '+5LB', true], ['LAST SET', '225×5', null], ['TGT', '3/4 SETS', null],
  ['PR WATCH', '▲ +1', true], ['VOL·SESS', '1840', null],
  ['HR', '142BPM', null], ['RPE', '7.5', null], ['INCLINE', '-5LB', false]];

  return (
    <div style={{ background: L.tickerBg, color: L.tickerFg, height: 24, overflow: 'hidden', display: 'flex', alignItems: 'center' }}>
      <div className="ticker-track" style={{ fontFamily: '"DM Mono", monospace', fontSize: 10, fontWeight: 500, letterSpacing: 0.5 }}>
        {[...items, ...items].map(([k, v, u], i) =>
        <span key={i} style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
            <span style={{ opacity: 0.85 }}>{k}</span>
            <span style={{ color: u === true ? '#7fcf9f' : u === false ? '#ff8b75' : 'rgba(236,229,214,0.55)', fontWeight: 700 }}>{u === true ? '▲' : u === false ? '▼' : ''} {v}</span>
            <span style={{ color: 'rgba(236,229,214,0.2)' }}>·</span>
          </span>
        )}
      </div>
    </div>);

}

// ── Masthead with persistent rest pill ─────────────────────────
function Masthead({ restSecs = 102, restTotal = 150, onRestTap }) {
  const m = Math.floor(restSecs / 60),s = String(restSecs % 60).padStart(2, '0');
  const pct = restSecs / restTotal;
  const running = restSecs > 0;
  return (
    <div style={{ position: 'absolute', top: 54, left: 0, right: 0, height: 42, padding: '0 14px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: `1px solid ${L.hair}`, background: L.bg }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <span style={{ fontSize: 18, color: L.muted, fontWeight: 300 }}>‹</span>
        <div>
          <div style={{ fontFamily: '"DM Mono", monospace', fontSize: 9, color: L.muted, letterSpacing: 1.2 }}>SESSION</div>
          <div style={{ fontFamily: '"Bebas Neue"', fontSize: 18, lineHeight: 1, letterSpacing: 0.8 }}>PUSH · 24:18</div>
        </div>
      </div>

      {/* Rest timer pill — tappable, persistent */}
      <div onClick={onRestTap} style={{
        display: 'flex', alignItems: 'center', gap: 8,
        background: running ? L.ink : L.surf,
        color: running ? L.tickerFg : L.muted,
        borderRadius: 99, padding: '5px 6px 5px 12px', cursor: 'pointer',
        border: running ? 'none' : `1px solid ${L.hair2}`
      }}>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', lineHeight: 1 }}>
          <span style={{ fontFamily: '"DM Mono", monospace', fontSize: 8, opacity: 0.7, letterSpacing: 1 }}>REST</span>
          <span style={{ fontFamily: '"Bebas Neue"', fontSize: 18, letterSpacing: 1, marginTop: 1 }}>
            {running ? `${m}:${s}` : '—:—'}
          </span>
        </div>
        {/* mini ring */}
        <div style={{ width: 24, height: 24, position: 'relative' }}>
          <svg width="24" height="24" viewBox="0 0 24 24" style={{ transform: 'rotate(-90deg)' }}>
            <circle cx="12" cy="12" r="9" fill="none" stroke={running ? 'rgba(236,229,214,0.18)' : L.hair2} strokeWidth="2" />
            {running && <circle cx="12" cy="12" r="9" fill="none" stroke={L.accent} strokeWidth="2.5"
            strokeDasharray={2 * Math.PI * 9} strokeDashoffset={2 * Math.PI * 9 * (1 - pct)} strokeLinecap="round" />}
          </svg>
          {!running && <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, color: L.muted }}>›</div>}
        </div>
      </div>
    </div>);

}

// ── Set type chip (left of every row) ──────────────────────────
function SetTypeChip({ type = 'standard', onTap }) {
  const cfg = L.st[type] || L.st.standard;
  if (type === 'standard') {
    return (
      <div onClick={onTap} style={{
        width: 24, height: 18, borderRadius: 4, border: `1px dashed ${L.faint}`,
        display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
        fontSize: 9, color: L.faint
      }}>+</div>);

  }
  return (
    <div onClick={onTap} style={{
      height: 18, padding: '0 5px', borderRadius: 4,
      background: cfg.bg, color: cfg.fg,
      fontFamily: '"DM Mono", monospace', fontSize: 8, fontWeight: 700, letterSpacing: 0.6,
      display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
      whiteSpace: 'nowrap'
    }}>{cfg.label}</div>);

}

// ── Plate calculator popover ───────────────────────────────────
// Computes plate stack per side for a given target weight & bar
function computePlates(targetKg, barKg) {
  const plates = [25, 20, 15, 10, 5, 2.5, 1.25];
  const perSide = (targetKg - barKg) / 2;
  if (perSide <= 0) return { perSide: 0, stack: [] };
  let remaining = perSide;
  const stack = [];
  for (const p of plates) {
    while (remaining >= p - 0.001) {
      stack.push(p);
      remaining = +(remaining - p).toFixed(3);
    }
  }
  return { perSide, stack, remainder: remaining };
}

const PLATE_COLORS = {
  25: { bg: '#e51b1b', fg: '#fff' },
  20: { bg: '#1f4ea3', fg: '#fff' },
  15: { bg: '#c98a17', fg: '#fff' },
  10: { bg: '#1f8f5a', fg: '#fff' },
  5: { bg: '#1f1c19', fg: '#f4f0e6' },
  2.5: { bg: '#a3a39a', fg: '#1f1c19' },
  1.25: { bg: '#d6d2c4', fg: '#1f1c19' }
};

function PlateBar({ barKg = 20, targetKg = 100, compact = false }) {
  const { perSide, stack, remainder } = computePlates(targetKg, barKg);
  const sleeveLen = 80;
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: compact ? 50 : 64 }}>
      {/* left plates (mirrored) */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-end', width: sleeveLen, gap: 1 }}>
        {[...stack].reverse().map((p, i) => {
          const c = PLATE_COLORS[p];
          const h = compact ? 28 + Math.min(p, 25) * 0.7 : 32 + Math.min(p, 25) * 0.9;
          const w = p >= 20 ? 9 : p >= 10 ? 7 : p >= 5 ? 6 : 5;
          return <div key={i} style={{ width: w, height: h, background: c.bg, border: `1px solid rgba(0,0,0,0.25)`, borderRadius: 1.5 }} />;
        })}
      </div>
      {/* bar */}
      <div style={{ position: 'relative', width: 60, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
        <div style={{ height: 4, width: '100%', background: '#8a857c', borderTop: '1px solid #5a554d', borderBottom: '1px solid #5a554d' }} />
        {/* collar dots */}
      </div>
      {/* right plates */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-start', width: sleeveLen, gap: 1 }}>
        {stack.map((p, i) => {
          const c = PLATE_COLORS[p];
          const h = compact ? 28 + Math.min(p, 25) * 0.7 : 32 + Math.min(p, 25) * 0.9;
          const w = p >= 20 ? 9 : p >= 10 ? 7 : p >= 5 ? 6 : 5;
          return <div key={i} style={{ width: w, height: h, background: c.bg, border: `1px solid rgba(0,0,0,0.25)`, borderRadius: 1.5 }} />;
        })}
      </div>
    </div>);

}

const BAR_TYPES = [
{ id: 'barbell', name: 'BARBELL', kg: 20 },
{ id: 'olympic', name: 'OLY 15', kg: 15 },
{ id: 'ez', name: 'EZ', kg: 7.5 },
{ id: 'trap', name: 'TRAP', kg: 25 },
{ id: 'safety', name: 'SAFETY', kg: 32 }];


function PlateCalcPopover({ targetKg = 100, barKg = 20, onBarChange, onClose }) {
  const { stack, remainder } = computePlates(targetKg, barKg);
  return (
    <div style={{ background: L.surf, border: `1px solid ${L.hair2}`, borderRadius: 12, padding: '10px 12px', boxShadow: '0 16px 40px rgba(0,0,0,0.18)', width: '100%' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
        <div>
          <div style={{ fontFamily: '"DM Mono", monospace', fontSize: 9, letterSpacing: 1.2, color: L.muted }}>PLATE CALCULATOR</div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 6, marginTop: 1 }}>
            <span style={{ fontFamily: '"Bebas Neue"', fontSize: 30, lineHeight: 0.9, letterSpacing: 0.8 }}>{targetKg}</span>
            <span style={{ fontFamily: '"DM Mono", monospace', fontSize: 10, color: L.muted }}>KG · BAR {barKg}</span>
          </div>
        </div>
        <div onClick={onClose} style={{ fontFamily: '"DM Mono", monospace', fontSize: 10, color: L.muted, cursor: 'pointer', padding: '2px 6px' }}>CLOSE</div>
      </div>

      <PlateBar barKg={barKg} targetKg={targetKg} />

      {/* per-side breakdown */}
      <div style={{ display: 'flex', justifyContent: 'center', gap: 6, flexWrap: 'wrap', marginTop: 6 }}>
        {stack.length === 0 ?
        <span style={{ fontFamily: '"DM Mono", monospace', fontSize: 10, color: L.muted }}>BAR ONLY</span> :
        stack.map((p, i) => {
          const c = PLATE_COLORS[p];
          return (
            <div key={i} style={{ background: c.bg, color: c.fg, fontFamily: '"DM Mono", monospace', fontSize: 9, fontWeight: 700, padding: '2px 6px', borderRadius: 3 }}>
              {p}
            </div>);

        })}
        {remainder > 0.01 &&
        <span style={{ fontFamily: '"DM Mono", monospace', fontSize: 9, color: L.down }}>
            +{remainder.toFixed(2)}KG OFF
          </span>
        }
      </div>

      {/* bar selector */}
      <div style={{ display: 'flex', gap: 4, marginTop: 10, paddingTop: 8, borderTop: `1px solid ${L.hair}` }}>
        {BAR_TYPES.map((b) =>
        <div key={b.id} onClick={() => onBarChange && onBarChange(b.kg)} style={{
          flex: 1, textAlign: 'center', padding: '5px 2px', borderRadius: 6, cursor: 'pointer',
          background: b.kg === barKg ? L.ink : 'transparent',
          color: b.kg === barKg ? L.tickerFg : L.muted,
          fontFamily: '"DM Mono", monospace', fontSize: 9, fontWeight: 700, letterSpacing: 0.5,
          border: b.kg === barKg ? 'none' : `1px solid ${L.hair2}`
        }}>
            <div>{b.name}</div>
            <div style={{ fontSize: 8, opacity: 0.7, marginTop: 1 }}>{b.kg}KG</div>
          </div>
        )}
      </div>
    </div>);

}

// ── Set Type bottom sheet ──────────────────────────────────────
function SetTypeSheet({ current = 'standard', onPick, onClose }) {
  const types = [
  { id: 'standard', name: 'Standard', desc: 'Normal working set' },
  { id: 'warmup', name: 'Warmup', desc: 'Excluded from volume' },
  { id: 'superset', name: 'Superset', desc: 'Paired with next exercise, no rest' },

// ── Rest Timer Modal ───────────────────────────────────────────
function RestTimerModal({ secs = 102, total = 150, onClose }) {
  const m = Math.floor(secs / 60),s = String(secs % 60).padStart(2, '0');
  const pct = secs / total;
  const r = 64,circ = 2 * Math.PI * r;
  return (
    <div style={{ position: 'absolute', inset: 0, zIndex: 90, background: 'rgba(31,28,25,0.55)', backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end' }}>
      <div onClick={onClose} style={{ flex: 1 }} />
      <div style={{ background: L.bg, borderRadius: '20px 20px 0 0', padding: '14px 16px 30px', borderTop: `1px solid ${L.hair2}` }}>
        <div style={{ width: 36, height: 4, background: L.faint, borderRadius: 2, margin: '0 auto 14px' }} />

        {/* ring + countdown */}
        <div style={{ position: 'relative', width: 172, height: 172, margin: '4px auto 14px' }}>
          <svg width="172" height="172" viewBox="0 0 172 172">
            <circle cx="86" cy="86" r={r} fill="none" stroke={L.hair2} strokeWidth="6" />
            <circle cx="86" cy="86" r={r} fill="none" stroke={L.accent} strokeWidth="6"
            strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)}
            strokeLinecap="round" transform="rotate(-90 86 86)" />
          </svg>
          <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
            <div style={{ fontFamily: '"Bebas Neue"', fontSize: 56, color: L.ink, letterSpacing: 2, lineHeight: 1 }}>{m}:{s}</div>
            <div style={{ fontFamily: '"DM Mono", monospace', fontSize: 9, color: L.muted, letterSpacing: 1.5, marginTop: 4 }}>REST · TGT 2:30</div>
          </div>
        </div>

        {/* add time buttons */}
        <div style={{ display: 'flex', gap: 6, justifyContent: 'center', marginBottom: 10 }}>
          {['−15s', '+15s', '+30s', '+1m'].map((label, i) =>
          <div key={i} style={{
            height: 34, borderRadius: 8, padding: '0 14px',
            background: L.surf, border: `1px solid ${L.hair2}`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontFamily: '"DM Mono", monospace', fontSize: 11, fontWeight: 700, color: L.ink, letterSpacing: 0.5
          }}>{label}</div>
          )}
        </div>

        {/* default rest */}
        <div style={{ background: L.surf, borderRadius: 10, padding: '8px 12px', border: `1px solid ${L.hair}`, display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
          <div>
            <div style={{ fontFamily: '"DM Mono", monospace', fontSize: 8, letterSpacing: 1.2, color: L.muted }}>DEFAULT · BENCH</div>
            <div style={{ fontFamily: '"Bebas Neue"', fontSize: 20, lineHeight: 1, marginTop: 2 }}>2:30 PER SET</div>
          </div>
          <span style={{ fontFamily: '"DM Mono", monospace', fontSize: 10, color: L.accent, fontWeight: 700 }}>EDIT</span>
        </div>

        {/* skip */}
        <div onClick={onClose} style={{
          height: 46, borderRadius: 12, background: L.accent, color: '#fff',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontFamily: '"Bebas Neue"', fontSize: 20, letterSpacing: 2,
          boxShadow: '0 8px 16px rgba(200,85,61,0.25)', cursor: 'pointer'
        }}>SKIP REST</div>
      </div>
    </div>);

}


// ── VARIANT A — Card stack (each exercise in own surface card) ──

function ExerciseCardA({ ex, exIdx, onSetTypeTap, onPlateTap, openPlateFor, onClosePlate, plateBar, onPlateBarChange, expandedNotes, onToggleNotes }) {
  const [collapsed, setCollapsed] = React.useState(false);
  const isBarbell = ex.equipment === 'BARBELL' || ex.equipment === 'EZ';

  return (
    <div style={{
      background: L.surf, borderRadius:14, border:`1px solid ${L.hair}`, marginBottom:10, overflow:'hidden',
    }}>
      {/* Header */}
      <div style={{ padding:'10px 12px 8px', display:'flex', alignItems:'center', gap:8, borderBottom: collapsed ? 'none' : `1px solid ${L.hair}` }}>
        <div style={{ display:'flex', flexDirection:'column', gap:2, opacity:0.4 }}>
          <div style={{ width:12, height:1.5, background:L.ink }}/>
          <div style={{ width:12, height:1.5, background:L.ink }}/>
          <div style={{ width:12, height:1.5, background:L.ink }}/>
        </div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ display:'flex', alignItems:'baseline', gap:8 }}>
            <span style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color:L.muted, letterSpacing:1 }}>{String(exIdx+1).padStart(2,'0')}</span>
            <span style={{ fontFamily:'"Bebas Neue"', fontSize:20, letterSpacing:0.5, lineHeight:1, color:L.ink }}>{ex.name}</span>
          </div>
          <div style={{ display:'flex', gap:10, marginTop:3, fontFamily:'"DM Mono", monospace', fontSize:9, color:L.muted, letterSpacing:0.4 }}>
            <span>{ex.equipment}</span>
            <span>·</span>
            <span>PR <span style={{ color:L.ink, fontWeight:700 }}>{ex.pr}</span></span>
            <span>·</span>
            <span>1RM <span style={{ color:L.ink, fontWeight:700 }}>{ex.oneRm}</span></span>
            {ex.delta && <>
              <span>·</span>
              <span style={{ color: ex.deltaUp ? L.up : L.down, fontWeight:700 }}>{ex.deltaUp ? '▲' : '▼'} {ex.delta}</span>
            </>}
          </div>
        </div>
        <div style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color:L.muted, fontWeight:700 }}>
          {ex.setsDone}/{ex.sets.length}
        </div>
        <div onClick={() => onToggleNotes && onToggleNotes(exIdx)} style={{ width:24, height:24, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:L.muted, fontSize:14 }}>···</div>
        <div onClick={() => setCollapsed(!collapsed)} style={{ width:20, height:20, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:L.muted, fontSize:11, transform: collapsed ? 'rotate(-90deg)' : 'rotate(0deg)', transition:'transform 0.15s' }}>▾</div>
      </div>

      {/* Last note (read-only, from ⋯ menu) */}
      {expandedNotes && !collapsed && (
        <div style={{ padding:'8px 12px', background:L.surf2, borderBottom:`1px solid ${L.hair}`, display:'flex', gap:8 }}>
          <span style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color:L.muted, letterSpacing:1 }}>LAST</span>
          <span style={{ fontFamily:'Inter', fontSize:11, color:L.ink2, fontStyle:'italic', flex:1 }}>"{ex.lastNote}"</span>
        </div>
      )}

      {!collapsed && (
        <>
          {/* Column headers */}
          <div style={{ display:'grid', gridTemplateColumns: ex.hasRIR ? '36px 22px 1fr 1fr 38px 30px' : '36px 22px 1fr 1fr 30px', padding:'5px 12px', background:L.surf2, fontFamily:'"DM Mono", monospace', fontSize:8, letterSpacing:1.2, color:L.muted, borderBottom:`1px solid ${L.hair}` }}>
            <span>TYPE</span>
            <span>#</span>
            <span style={{ textAlign:'center' }}>KG</span>
            <span style={{ textAlign:'center' }}>REPS</span>
            {ex.hasRIR && <span style={{ textAlign:'center' }}>RIR</span>}
            <span style={{ textAlign:'right' }}>✓</span>
          </div>

          {/* Set rows */}
          {ex.sets.map((s, i) => (
            <SetRowA
              key={i}
              set={s}
              setIdx={i}
              hasRIR={ex.hasRIR}
              onSetTypeTap={() => onSetTypeTap(exIdx, i)}
              onPlateTap={() => onPlateTap(exIdx, i)}
              onClosePlate={onClosePlate}
              showPlate={openPlateFor && openPlateFor.ex === exIdx && openPlateFor.set === i}
              plateBar={plateBar}
              onPlateBarChange={onPlateBarChange}
              isBarbell={isBarbell}
            />
          ))}

          {/* Inline plate visualizer (for barbell exercises, persistent under last completed set) */}
          {isBarbell && ex.lastWeight && (
            <div style={{ padding:'6px 12px', borderTop:`1px solid ${L.hair}`, background:L.surf2 }}>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:4 }}>
                <span style={{ fontFamily:'"DM Mono", monospace', fontSize:8, color:L.muted, letterSpacing:1 }}>PLATE PREVIEW · {ex.lastWeight}KG</span>
                <span style={{ fontFamily:'"DM Mono", monospace', fontSize:8, color:L.muted, letterSpacing:1 }}>BAR {plateBar}KG</span>
              </div>
              <PlateBar barKg={plateBar} targetKg={ex.lastWeight} compact/>
            </div>
          )}

          {/* Add Set */}
          <div style={{ padding:'8px 12px', display:'flex', gap:6 }}>
            <div style={{ flex:1, height:30, borderRadius:6, border:`1px dashed ${L.faint}`, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'"DM Mono", monospace', fontSize:10, color:L.muted, letterSpacing:0.8 }}>+ ADD SET</div>
            {ex.hasRIR && (
              <div style={{ height:30, padding:'0 10px', borderRadius:6, background:L.surf2, border:`1px solid ${L.hair}`, display:'flex', alignItems:'center', fontFamily:'"DM Mono", monospace', fontSize:9, color:L.muted, letterSpacing:0.5 }}>
                RIR ON
              </div>
            )}
          </div>
        </>
      )}
    </div>
  );
}

function SetRowA({ set: s, setIdx, hasRIR, onSetTypeTap, onPlateTap, showPlate, onClosePlate, plateBar, onPlateBarChange, isBarbell }) {
  const cols = hasRIR ? '36px 22px 1fr 1fr 38px 30px' : '36px 22px 1fr 1fr 30px';
  return (
    <>
      <div style={{
        display:'grid', gridTemplateColumns: cols,
        alignItems:'center', padding:'7px 12px',
        borderBottom:`1px solid ${L.hair}`,
        background: s.active ? L.accentSoft : 'transparent',
        borderLeft: s.active ? `2px solid ${L.accent}` : '2px solid transparent',
        opacity: s.type === 'warmup' ? 0.65 : 1,
      }}>
        <SetTypeChip type={s.type || 'standard'} onTap={onSetTypeTap}/>
        <span style={{ fontFamily:'"DM Mono", monospace', fontSize:10, fontWeight:700, color: s.active ? L.accent : L.muted }}>{String(setIdx+1).padStart(2,'0')}</span>

        {/* KG cell */}
        <div style={{ textAlign:'center', position:'relative' }}>
          {s.kg ? (
            <span style={{ fontFamily:'"Bebas Neue"', fontSize:20, color:L.ink, letterSpacing:0.5 }}>
              {s.kg}
              {s.pr && <span style={{ display:'inline-block', width:5, height:5, borderRadius:'50%', background:L.warn, marginLeft:4, verticalAlign:'middle' }}/>}
            </span>
          ) : (
            <span style={{ fontFamily:'"Bebas Neue"', fontSize:20, color:L.faint, letterSpacing:0.5 }}>{s.prevKg}</span>
          )}
        </div>

        <div style={{ textAlign:'center' }}>
          {s.reps ? (
            <span style={{ fontFamily:'"Bebas Neue"', fontSize:20, color:L.ink, letterSpacing:0.5 }}>{s.reps}</span>
          ) : (
            <span style={{ fontFamily:'"Bebas Neue"', fontSize:20, color:L.faint, letterSpacing:0.5 }}>{s.prevReps}</span>
          )}
        </div>

        {hasRIR && (
          <div style={{ textAlign:'center' }}>
            {s.rir != null ? (
              <span style={{ fontFamily:'"DM Mono", monospace', fontSize:11, fontWeight:700, color:L.ink2 }}>{s.rir}</span>
            ) : (
              <span style={{ fontFamily:'"DM Mono", monospace', fontSize:11, color:L.faint }}>{s.prevRir ?? '—'}</span>
            )}
          </div>
        )}

        <div style={{ textAlign:'right' }}>
          {s.done
            ? <span style={{ color:L.up, fontSize:13, fontWeight:700 }}>✓</span>
            : (s.active
                ? <span style={{ width:12, height:12, display:'inline-block', border:`2px solid ${L.accent}`, borderRadius:'50%' }}/>
                : <span style={{ width:12, height:12, display:'inline-block', border:`1.5px solid ${L.faint}`, borderRadius:'50%' }}/>)}
        </div>
      </div>

      {/* Plate calc popover under this row */}
      {/* Plate calc — collapsed by default, tap to expand */}
      {isBarbell && showPlate !== undefined && (
        <div style={{ borderBottom:`1px solid ${L.hair}` }}>
          <div onClick={showPlate ? onClosePlate : onPlateTap} style={{
            display:'flex', alignItems:'center', justifyContent:'space-between',
            padding:'5px 12px', background:L.surf2, cursor:'pointer',
          }}>
            <span style={{ fontFamily:'"DM Mono", monospace', fontSize:9, letterSpacing:1.2, color:L.muted }}>
              PLATES · {s.kg || s.prevKg}KG
            </span>
            <span style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color:L.muted }}>{showPlate ? '▴ CLOSE' : '▾ SHOW'}</span>
          </div>
          {showPlate && (
            <div style={{ padding:'8px 12px', background:L.surf2 }}>
              <PlateCalcPopover targetKg={s.kg ? parseFloat(s.kg) : parseFloat(s.prevKg)} barKg={plateBar} onBarChange={onPlateBarChange} onClose={onClosePlate}/>
            </div>
          )}
        </div>
      )}
      {/* Unilateral sub-rows */}
      {s.type === 'unilateral' && (
        <>
          {['L','R'].map(side => (
            <div key={side} style={{
              display:'grid', gridTemplateColumns: hasRIR ? '36px 22px 1fr 1fr 38px 30px' : '36px 22px 1fr 1fr 30px',
              alignItems:'center', padding:'5px 12px 5px 28px',
              background: side === 'L' ? 'rgba(44,109,163,0.04)' : 'rgba(44,109,163,0.07)',
              borderBottom:`1px solid ${L.hair}`,
            }}>
              <div style={{ fontFamily:'"DM Mono", monospace', fontSize:9, fontWeight:700, color:'#2c6da3', textAlign:'center' }}>{side}</div>
              <div/>
              <div style={{ height:26, borderRadius:5, background:L.surf, border:`1px solid ${L.hair}`, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'"Bebas Neue"', fontSize:16, color:L.faint, textAlign:'center' }}>{side === 'L' ? (s.lKg || s.prevKg) : (s.rKg || s.prevKg)}</div>
              <div style={{ height:26, borderRadius:5, background:L.surf, border:`1px solid ${L.hair}`, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'"Bebas Neue"', fontSize:16, color:L.faint, textAlign:'center' }}>{side === 'L' ? (s.lReps || s.prevReps) : (s.rReps || s.prevReps)}</div>
              {hasRIR && <div/>}
              <div/>
            </div>
          ))}
        </>
      )}
    </>
  );
}

// ── Stage A: full screen with all exercises open ───────────────
function StageA({ stage = 'main' }) {
  // stage: 'main' | 'rest' | 'settype' | 'plate'
  const [openPlate, setOpenPlate] = React.useState(stage === 'plate' ? { ex: 0, set: 2 } : null);
  const [plateBar, setPlateBar] = React.useState(20);
  const [setSheet, setSetSheet] = React.useState(stage === 'settype' ? { ex:0, set:3 } : null);
  const [restModal, setRestModal] = React.useState(stage === 'rest');
  const [expandedNotes, setExpandedNotes] = React.useState(0);

  const exercises = [
    {
      name:'BENCH PRESS', equipment:'BARBELL', pr:'105×4', oneRm:'~118', delta:'+5KG', deltaUp:true,
      hasRIR:true, setsDone:3, lastWeight:100, lastNote:'Pause at bottom. Felt strong.',
      sets: [
        { type:'warmup',    kg:'60',  reps:'8',  rir:5,    done:true,  prevKg:'60',  prevReps:'8',  prevRir:5 },
        { type:'standard',  kg:'95',  reps:'6',  rir:3,    done:true,  prevKg:'90',  prevReps:'6',  prevRir:3 },
        { type:'standard',  kg:'100', reps:'6',  rir:2,    done:true,  pr:true, prevKg:'95',  prevReps:'6',  prevRir:3 },
        { type:'standard',  kg:null,  reps:null, rir:null, active:true, prevKg:'95', prevReps:'6', prevRir:3 },
        { type:'dropset',   kg:null,  reps:null, rir:null, prevKg:'80', prevReps:'8', prevRir:1 },
      ],
    },
    {
      name:'OVERHEAD PRESS', equipment:'BARBELL', pr:'70×5', oneRm:'~80',
      hasRIR:false, setsDone:0, lastWeight:65, lastNote:'Strict form, no leg drive.',
      sets: [
        { type:'standard', kg:null, reps:null, prevKg:'65', prevReps:'8' },
        { type:'standard', kg:null, reps:null, prevKg:'65', prevReps:'8' },
        { type:'standard', kg:null, reps:null, prevKg:'65', prevReps:'7' },
      ],
    },
    {
      name:'INCLINE DB PRESS', equipment:'DUMBBELL', pr:'34×10', oneRm:'~38',
      hasRIR:true, setsDone:0, lastNote:'Bench at 30°. Right shoulder felt tight.',
      sets: [
        { type:'standard', kg:null, reps:null, rir:null, prevKg:'32', prevReps:'10', prevRir:2 },
        { type:'standard', kg:null, reps:null, rir:null, prevKg:'32', prevReps:'10', prevRir:2 },
        { type:'failure',  kg:null, reps:null, rir:null, prevKg:'30', prevReps:'9',  prevRir:0 },
      ],
    },
    {
      name:'CABLE FLY', equipment:'CABLE', pr:'18×12', oneRm:'—',
      hasRIR:false, setsDone:0,
      sets: [
        { type:'standard',   kg:null, reps:null, prevKg:'15', prevReps:'12' },
        { type:'unilateral', kg:null, reps:null, prevKg:'13', prevReps:'12', prevLKg:'13', prevLReps:'12', prevRKg:'13', prevRReps:'11' },
        { type:'amrap',      kg:null, reps:null, prevKg:'12', prevReps:'15' },
      ],
    },
  ];

  const totalSets = exercises.reduce((a,e) => a + e.sets.length, 0);
  const doneSets  = exercises.reduce((a,e) => a + e.setsDone, 0);

  return (
    <div style={{ width:'100%', height:'100%', background:L.bg, color:L.ink, fontFamily:'Inter, system-ui', position:'relative', overflow:'hidden' }}>
      <StatusBar/>
      <Masthead onRestTap={() => setRestModal(true)}/>

      {/* Ticker */}
      <div style={{ position:'absolute', top:96, left:0, right:0 }}><Ticker/></div>

      {/* Scroll body */}
      <div style={{ position:'absolute', top:120, left:0, right:0, bottom:108, overflowY:'auto', padding:'10px 10px 12px' }}>
        {exercises.map((ex, i) => (
          <ExerciseCardA
            key={i}
            ex={ex}
            exIdx={i}
            onSetTypeTap={(ei, si) => setSetSheet({ ex:ei, set:si })}
            onPlateTap={(ei, si) => setOpenPlate({ ex:ei, set:si })}
            openPlateFor={openPlate}
            onClosePlate={() => setOpenPlate(null)}
            plateBar={plateBar}
            onPlateBarChange={setPlateBar}
            expandedNotes={expandedNotes === i}
            onToggleNotes={(idx) => setExpandedNotes(expandedNotes === idx ? -1 : idx)}
          />
        ))}

        {/* Add exercise FAB-style row */}
        <div style={{ height:42, borderRadius:10, border:`1px dashed ${L.faint}`, display:'flex', alignItems:'center', justifyContent:'center', gap:6, fontFamily:'"DM Mono", monospace', fontSize:11, color:L.muted, letterSpacing:1, marginTop:4 }}>
          <span style={{ fontSize:14 }}>+</span> ADD EXERCISE
        </div>
      </div>

      {/* Bottom: Finish bar with progress fill */}
      <div style={{ position:'absolute', bottom:0, left:0, right:0, padding:'10px 12px 28px', background:L.bg, borderTop:`1px solid ${L.hair}` }}>
        <div style={{ position:'relative', height:46, borderRadius:11, overflow:'hidden', background:L.surf, border:`1px solid ${L.hair2}` }}>
          <div style={{ position:'absolute', left:0, top:0, bottom:0, width:`${(doneSets/totalSets)*100}%`, background:L.accent, borderRadius:'10px 0 0 10px' }}/>
          <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 16px' }}>
            <span style={{ fontFamily:'"Bebas Neue"', fontSize:20, letterSpacing:1.5, color: doneSets/totalSets > 0.4 ? '#fff' : L.ink }}>FINISH WORKOUT</span>
            <span style={{ fontFamily:'"DM Mono", monospace', fontSize:10, fontWeight:700, color: doneSets/totalSets > 0.6 ? 'rgba(255,255,255,0.85)' : L.muted, letterSpacing:1 }}>{totalSets - doneSets} SETS LEFT</span>
          </div>
        </div>
      </div>

      {setSheet && <SetTypeSheet current={exercises[setSheet.ex].sets[setSheet.set].type || 'standard'} onPick={() => setSetSheet(false)} onClose={() => setSetSheet(false)}/>}
      {restModal && <RestTimerModal secs={102} total={150} onClose={() => setRestModal(false)}/>}
    </div>
  );
}


// ── VARIANT B — Logbook (flat, sheet-like, no rounded cards per exercise) ──

function ExerciseBlockB({ ex, exIdx, onSetTypeTap, onPlateTap, openPlateFor, onClosePlate, plateBar, onPlateBarChange }) {
  const [collapsed, setCollapsed] = React.useState(false);
  const isBarbell = ex.equipment === 'BARBELL' || ex.equipment === 'EZ';

  return (
    <div style={{ borderTop:`1px solid ${L.hair2}`, paddingBottom:6 }}>
      {/* Tight header bar */}
      <div onClick={() => setCollapsed(!collapsed)} style={{
        padding:'8px 14px 6px', display:'flex', alignItems:'baseline', gap:8,
        background: L.bg, cursor:'pointer',
      }}>
        <span style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color:L.muted, letterSpacing:1, width:18 }}>{String(exIdx+1).padStart(2,'0')}</span>
        <span style={{ fontFamily:'"Bebas Neue"', fontSize:18, letterSpacing:0.6, lineHeight:1, color:L.ink, flex:1 }}>{ex.name}</span>
        <span style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color:L.muted, letterSpacing:0.6 }}>{ex.equipment}</span>
        <span style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color:L.muted, letterSpacing:0.6 }}>·</span>
        <span style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color:L.ink, letterSpacing:0.6, fontWeight:700 }}>{ex.setsDone}/{ex.sets.length}</span>
        {ex.delta && <span style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color: ex.deltaUp ? L.up : L.down, letterSpacing:0.6, fontWeight:700 }}>{ex.deltaUp ? '▲' : '▼'} {ex.delta}</span>}
        <span style={{ color:L.muted, fontSize:10, transform: collapsed ? 'rotate(-90deg)' : 'rotate(0deg)', display:'inline-block' }}>▾</span>
      </div>

      {/* Tight metadata strip */}
      {!collapsed && (
        <div style={{ padding:'0 14px 6px 32px', display:'flex', gap:12, fontFamily:'"DM Mono", monospace', fontSize:9, color:L.muted, letterSpacing:0.4 }}>
          <span>PR <span style={{ color:L.ink, fontWeight:700 }}>{ex.pr}</span></span>
          <span>1RM <span style={{ color:L.ink, fontWeight:700 }}>{ex.oneRm}</span></span>
          {ex.lastNote && <span style={{ flex:1, fontStyle:'italic', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', color:L.muted }}>"{ex.lastNote}"</span>}
        </div>
      )}

      {!collapsed && (
        <>
          {/* Column headers — only shown once per block */}
          <div style={{ display:'grid', gridTemplateColumns: ex.hasRIR ? '36px 22px 1fr 1fr 38px 28px' : '36px 22px 1fr 1fr 28px', padding:'4px 14px', fontFamily:'"DM Mono", monospace', fontSize:8, letterSpacing:1.2, color:L.muted, borderBottom:`1px solid ${L.hair}` }}>
            <span>TYPE</span>
            <span>#</span>
            <span style={{ textAlign:'center' }}>KG</span>
            <span style={{ textAlign:'center' }}>REPS</span>
            {ex.hasRIR && <span style={{ textAlign:'center' }}>RIR</span>}
            <span style={{ textAlign:'right' }}>✓</span>
          </div>

          {ex.sets.map((s, i) => (
            <SetRowB
              key={i}
              set={s}
              setIdx={i}
              hasRIR={ex.hasRIR}
              onSetTypeTap={() => onSetTypeTap(exIdx, i)}
              onPlateTap={() => onPlateTap(exIdx, i)}
              showPlate={openPlateFor && openPlateFor.ex === exIdx && openPlateFor.set === i}
              onClosePlate={onClosePlate}
              plateBar={plateBar}
              onPlateBarChange={onPlateBarChange}
              isBarbell={isBarbell}
            />
          ))}

          {/* Inline plate strip */}
          {isBarbell && ex.lastWeight && (
            <div style={{ padding:'4px 14px 6px', display:'flex', alignItems:'center', gap:10, borderTop:`1px solid ${L.hair}`, background:'transparent' }}>
              <span style={{ fontFamily:'"DM Mono", monospace', fontSize:8, color:L.muted, letterSpacing:1, width:120 }}>{ex.lastWeight}KG · BAR {plateBar}</span>
              <div style={{ flex:1 }}>
                <PlateBar barKg={plateBar} targetKg={ex.lastWeight} compact/>
              </div>
            </div>
          )}

          {/* Add Set */}
          <div style={{ padding:'4px 14px 8px', display:'flex' }}>
            <span style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color:L.muted, letterSpacing:1, paddingLeft:58 }}>+ ADD SET</span>
          </div>
        </>
      )}
    </div>
  );
}

function SetRowB({ set: s, setIdx, hasRIR, onSetTypeTap, onPlateTap, showPlate, onClosePlate, plateBar, onPlateBarChange, isBarbell }) {
  const cols = hasRIR ? '36px 22px 1fr 1fr 38px 28px' : '36px 22px 1fr 1fr 28px';
  return (
    <>
      <div style={{
        display:'grid', gridTemplateColumns: cols,
        alignItems:'center', padding:'5px 14px',
        background: s.active ? L.accentSoft : 'transparent',
        borderBottom:`1px solid ${L.hair}`,
        opacity: s.type === 'warmup' ? 0.65 : 1,
      }}>
        <SetTypeChip type={s.type || 'standard'} onTap={onSetTypeTap}/>
        <span style={{ fontFamily:'"DM Mono", monospace', fontSize:10, fontWeight:700, color: s.active ? L.accent : L.muted }}>{String(setIdx+1).padStart(2,'0')}</span>

        <div onClick={isBarbell ? onPlateTap : undefined} style={{ textAlign:'center', cursor: isBarbell ? 'pointer' : 'default' }}>
          {s.kg ? (
            <span style={{ fontFamily:'"Bebas Neue"', fontSize:19, color:L.ink, letterSpacing:0.5 }}>
              {s.kg}
              {s.pr && <span style={{ display:'inline-block', width:5, height:5, borderRadius:'50%', background:L.warn, marginLeft:4, verticalAlign:'middle' }}/>}
            </span>
          ) : (
            <span style={{ fontFamily:'"Bebas Neue"', fontSize:19, color:L.faint, letterSpacing:0.5 }}>{s.prevKg}</span>
          )}
        </div>

        <div style={{ textAlign:'center' }}>
          {s.reps ? (
            <span style={{ fontFamily:'"Bebas Neue"', fontSize:19, color:L.ink, letterSpacing:0.5 }}>{s.reps}</span>
          ) : (
            <span style={{ fontFamily:'"Bebas Neue"', fontSize:19, color:L.faint, letterSpacing:0.5 }}>{s.prevReps}</span>
          )}
        </div>

        {hasRIR && (
          <div style={{ textAlign:'center' }}>
            {s.rir != null ? (
              <span style={{ fontFamily:'"DM Mono", monospace', fontSize:11, fontWeight:700, color:L.ink2 }}>{s.rir}</span>
            ) : (
              <span style={{ fontFamily:'"DM Mono", monospace', fontSize:11, color:L.faint }}>{s.prevRir ?? '—'}</span>
            )}
          </div>
        )}

        <div style={{ textAlign:'right' }}>
          {s.done
            ? <span style={{ color:L.up, fontSize:13, fontWeight:700 }}>✓</span>
            : (s.active
                ? <span style={{ width:11, height:11, display:'inline-block', border:`2px solid ${L.accent}`, borderRadius:'50%' }}/>
                : <span style={{ width:11, height:11, display:'inline-block', border:`1.5px solid ${L.faint}`, borderRadius:'50%' }}/>)}
        </div>
      </div>

      {showPlate && (
        <div style={{ padding:'8px 14px', background:L.surf, borderBottom:`1px solid ${L.hair}` }}>
          <PlateCalcPopover targetKg={s.kg ? parseFloat(s.kg) : parseFloat(s.prevKg)} barKg={plateBar} onBarChange={onPlateBarChange} onClose={onClosePlate}/>
        </div>
      )}
      {/* Unilateral sub-rows */}
      {s.type === 'unilateral' && (
        <>
          {['L','R'].map(side => (
            <div key={side} style={{
              display:'grid', gridTemplateColumns: hasRIR ? '36px 22px 1fr 1fr 38px 28px' : '36px 22px 1fr 1fr 28px',
              alignItems:'center', padding:'4px 14px 4px 28px',
              background: side === 'L' ? 'rgba(44,109,163,0.04)' : 'rgba(44,109,163,0.08)',
              borderBottom:`1px solid ${L.hair}`,
            }}>
              <div style={{ fontFamily:'"DM Mono", monospace', fontSize:9, fontWeight:700, color:'#2c6da3', textAlign:'center' }}>{side}</div>
              <div/>
              <div style={{ height:24, borderRadius:4, background:L.surf, border:`1px solid ${L.hair}`, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'"Bebas Neue"', fontSize:15, color:L.faint }}>{side === 'L' ? (s.lKg || s.prevKg) : (s.rKg || s.prevKg)}</div>
              <div style={{ height:24, borderRadius:4, background:L.surf, border:`1px solid ${L.hair}`, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'"Bebas Neue"', fontSize:15, color:L.faint }}>{side === 'L' ? (s.lReps || s.prevReps) : (s.rReps || s.prevReps)}</div>
              {hasRIR && <div/>}
              <div/>
            </div>
          ))}
        </>
      )}
    </>
  );
}

function StageB({ stage = 'main' }) {
  const [openPlate, setOpenPlate] = React.useState(stage === 'plate' ? { ex: 0, set: 2 } : null);
  const [plateBar, setPlateBar] = React.useState(20);
  const [setSheet, setSetSheet] = React.useState(stage === 'settype' ? { ex:0, set:3 } : null);
  const [restModal, setRestModal] = React.useState(stage === 'rest');

  const exercises = [
    {
      name:'BENCH PRESS', equipment:'BARBELL', pr:'105×4', oneRm:'~118', delta:'+5KG', deltaUp:true,
      hasRIR:true, setsDone:3, lastWeight:100, lastNote:'Pause at bottom. Felt strong.',
      sets: [
        { type:'warmup', kg:'60',  reps:'8', rir:5, done:true,  prevKg:'60',  prevReps:'8',  prevRir:5 },
        { type:'standard', kg:'95',  reps:'6', rir:3, done:true, prevKg:'90',  prevReps:'6',  prevRir:3 },
        { type:'standard', kg:'100', reps:'6', rir:2, done:true, pr:true, prevKg:'95',  prevReps:'6',  prevRir:3 },
        { type:'standard', kg:null,  reps:null, rir:null, active:true, prevKg:'95', prevReps:'6', prevRir:3 },
        { type:'dropset',  kg:null,  reps:null, rir:null, prevKg:'80', prevReps:'8', prevRir:1 },
      ],
    },
    {
      name:'OVERHEAD PRESS', equipment:'BARBELL', pr:'70×5', oneRm:'~80',
      hasRIR:false, setsDone:0, lastWeight:65, lastNote:'Strict form, no leg drive.',
      sets: [
        { type:'standard', kg:null, reps:null, prevKg:'65', prevReps:'8' },
        { type:'standard', kg:null, reps:null, prevKg:'65', prevReps:'8' },
        { type:'standard', kg:null, reps:null, prevKg:'65', prevReps:'7' },
      ],
    },
    {
      name:'INCLINE DB PRESS', equipment:'DUMBBELL', pr:'34×10', oneRm:'~38',
      hasRIR:true, setsDone:0, lastNote:'Bench at 30°. Right shoulder felt tight.',
      sets: [
        { type:'standard', kg:null, reps:null, rir:null, prevKg:'32', prevReps:'10', prevRir:2 },
        { type:'standard', kg:null, reps:null, rir:null, prevKg:'32', prevReps:'10', prevRir:2 },
        { type:'failure',  kg:null, reps:null, rir:null, prevKg:'30', prevReps:'9',  prevRir:0 },
      ],
    },
    {
      name:'CABLE FLY', equipment:'CABLE', pr:'18×12', oneRm:'—',
      hasRIR:false, setsDone:0,
      sets: [
        { type:'standard',   kg:null, reps:null, prevKg:'15', prevReps:'12' },
        { type:'unilateral', kg:null, reps:null, prevKg:'13', prevReps:'12', prevLKg:'13', prevLReps:'12', prevRKg:'13', prevRReps:'11' },
        { type:'amrap',      kg:null, reps:null, prevKg:'12', prevReps:'15' },
      ],
    },
  ];

  const totalSets = exercises.reduce((a,e) => a + e.sets.length, 0);
  const doneSets  = exercises.reduce((a,e) => a + e.setsDone, 0);

  return (
    <div style={{ width:'100%', height:'100%', background:L.bg, color:L.ink, fontFamily:'Inter, system-ui', position:'relative', overflow:'hidden' }}>
      <StatusBar/>
      <Masthead onRestTap={() => setRestModal(true)}/>
      <div style={{ position:'absolute', top:96, left:0, right:0 }}><Ticker/></div>

      <div style={{ position:'absolute', top:120, left:0, right:0, bottom:108, overflowY:'auto' }}>
        {exercises.map((ex, i) => (
          <ExerciseBlockB
            key={i}
            ex={ex}
            exIdx={i}
            onSetTypeTap={(ei, si) => setSetSheet({ ex:ei, set:si })}
            onPlateTap={(ei, si) => setOpenPlate({ ex:ei, set:si })}
            openPlateFor={openPlate}
            onClosePlate={() => setOpenPlate(null)}
            plateBar={plateBar}
            onPlateBarChange={setPlateBar}
          />
        ))}

        <div style={{ borderTop:`1px solid ${L.hair2}`, padding:'10px 14px' }}>
          <div style={{ height:36, borderRadius:8, border:`1px dashed ${L.faint}`, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'"DM Mono", monospace', fontSize:10, color:L.muted, letterSpacing:1 }}>
            <span style={{ fontSize:14, marginRight:6 }}>+</span> ADD EXERCISE
          </div>
        </div>
      </div>

      {/* Bottom finish bar */}
      <div style={{ position:'absolute', bottom:0, left:0, right:0, padding:'10px 12px 28px', background:L.bg, borderTop:`1px solid ${L.hair2}` }}>
        <div style={{ position:'relative', height:46, borderRadius:11, overflow:'hidden', background:L.surf, border:`1px solid ${L.hair2}` }}>
          <div style={{ position:'absolute', left:0, top:0, bottom:0, width:`${(doneSets/totalSets)*100}%`, background:L.accent }}/>
          <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 16px' }}>
            <span style={{ fontFamily:'"Bebas Neue"', fontSize:20, letterSpacing:1.5, color: doneSets/totalSets > 0.4 ? '#fff' : L.ink }}>FINISH WORKOUT</span>
            <span style={{ fontFamily:'"DM Mono", monospace', fontSize:10, fontWeight:700, color: doneSets/totalSets > 0.6 ? 'rgba(255,255,255,0.85)' : L.muted, letterSpacing:1 }}>{totalSets - doneSets} SETS LEFT</span>
          </div>
        </div>
      </div>

      {setSheet && <SetTypeSheet current={exercises[setSheet.ex].sets[setSheet.set].type || 'standard'} onPick={() => setSetSheet(false)} onClose={() => setSetSheet(false)}/>}
      {restModal && <RestTimerModal secs={102} total={150} onClose={() => setRestModal(false)}/>}
    </div>
  );
}



function Card({ num, vibe, desc, children }) {
  return (
    <div className="card">
      <div>
        <div className="card-label"><span className="num">{num}</span><span className="vibe">{vibe}</span></div>
        <div className="card-desc">{desc}</div>
      </div>
      <div className="frame"><div className="screen">{children}</div></div>
    </div>
  );
}

function App() {
  return (
    <div className="canvas">
      <h1>Logging v2 · All exercises open</h1>
      <p className="h1-sub">Single scrollable page — every exercise visible by default. Set-type chip on every row (tap → sheet with 8 types incl. Unilateral). RIR column per exercise. Persistent rest pill in masthead. Plate calc collapses/expands per barbell set. Two layouts, four states each.</p>

      <div className="section-label">A · CARD STACK</div>
      <p className="section-desc">Each exercise in its own surface card. More hierarchy, easier to scan exercise by exercise.</p>
      <div className="grid">
        <Card num="A1" vibe="Main" desc="All open. Bench mid-set, note expanded under header, PR dot on set 3, unilateral sub-rows on Cable Fly set 2."><StageA stage="main"/></Card>
        <Card num="A2" vibe="Rest Modal" desc="Tap rest pill → centered ring countdown, ±15/30/60s, default rest editor, skip CTA."><StageA stage="rest"/></Card>
        <Card num="A3" vibe="Set Type Sheet" desc="Tap any set chip → 8 types: Std, Warmup, Superset, Dropset, Rest-Pause, AMRAP, Failure, Unilateral."><StageA stage="settype"/></Card>
        <Card num="A4" vibe="Plate Calc" desc="Tap PLATES row under a barbell set → expands with color-coded stack visualizer, bar selector."><StageA stage="plate"/></Card>
      </div>

      <div className="section-label">B · LOGBOOK</div>
      <p className="section-desc">Flat hairline-divided rows — no card chrome. Reads like a single continuous sheet.</p>
      <div className="grid">
        <Card num="B1" vibe="Main" desc="Same content, flatter expression."><StageB stage="main"/></Card>
        <Card num="B2" vibe="Rest Modal" desc="Same overlay."><StageB stage="rest"/></Card>
        <Card num="B3" vibe="Set Type Sheet" desc="Same overlay."><StageB stage="settype"/></Card>
        <Card num="B4" vibe="Plate Calc" desc="Collapsible plate row under barbell set."><StageB stage="plate"/></Card>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body></html>
