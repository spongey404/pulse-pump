document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-card\" onclick=\"showScreen('4')\">\n            <div class=\"card-num\">05<\u002Fdiv>\n            <div class=\"card-title\">MUSCLE MAP (BODY TAB)<\u002Fdiv>\n            <div class=\"card-desc\">Thermal heatmap silhouette. Clickable day scrubber, ticker strip, volume bars.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"screen-card\" onclick=\"showScreen('5')\">\n            <div class=\"card-num\">06<\u002Fdiv>\n            <div class=\"card-title\">SOCIAL FEED<\u002Fdiv>\n            <div class=\"card-desc\">Swipeable posts, music chip, hold-to-react, comments modal, friend profiles.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"screen-card\" onclick=\"showScreen('6')\">\n            <div class=\"card-num\">07<\u002Fdiv>\n            <div class=\"card-title\">PROGRAMS + EXERCISE LIBRARY<\u002Fdiv>\n            <div class=\"card-desc\">Program list, preset picker, template detail, exercise variant picker.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"screen-card\" onclick=\"showScreen('7')\">\n            <div class=\"card-num\">08<\u002Fdiv>\n            <div class=\"card-title\">MORE TAB<\u002Fdiv>\n            <div class=\"card-desc\">Hub, history (calendar+list), profile, settings, equipment, Pulse+ paywall.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <iframe id=\"screen-0\" class=\"screen-frame\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;en&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;UTF-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;title&gt;Pulse Pump — Onboarding&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&amp;family=Space+Mono:wght@400;7 700; }\n  .card-label .vibe { color: #1a1a1a; font-weight: 600; margin-left: 6px; }\n  .frame { width: 390px; height: 844px; border-radius: 48px; padding: 4px; background: linear-gradient(135deg, #cbcac4, #b9b8b2); box-shadow: 0 40px 80px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.4); flex-shrink: 0; }\n  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; position: relative; background: #fbf8f2; }\n  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }\n  @keyframes slideIn { from { transform:translateX(30px); opacity:0; } to { transform:translateX(0); opacity:1; } }\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div id=&quot;root&quot;&gt;&lt;/div&gt;\n&lt;script type=&quot;text/babel&quot; data-presets=&quot;react&quot;&gt;\n\n\n// ── Tokens ────────────────────────────────────────────────────\nconst C = {\n  bg:'#fbf8f2', surf:'#f4f0e6', surf2:'#ece7d8',\n  ink:'#1f1c19', ink2:'#3a342d',\n  muted:'rgba(31,28,25,0.5)', faint:'rgba(31,28,25,0.13)',\n  hair:'rgba(31,28,25,0.08)', hair2:'rgba(31,28,25,0.13)',\n  accent:'#c8553d', accentSoft:'rgba(200,85,61,0.08)',\n  up:'#1f8f5a',\n};\n\n// ── Shared primitives ─────────────────────────────────────────\nconst StatusBar = () =&gt; (\n  &lt;div style={{height:50,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:6,flexShrink:0}}&gt;\n    &lt;div style={{width:126,height:37,background:'#000',borderRadius:24}}/&gt;\n  &lt;/div&gt;\n);\n\n// Progress bar — step N of total\nfunction ProgressBar({step, total}) {\n  return (\n    &lt;div style={{padding:'0 20px',marginBottom:8}}&gt;\n      &lt;div style={{height:2,background:C.hair,borderRadius:999,overflow:'hidden'}}&gt;\n        &lt;div style={{height:'100%',width:`${(step/total)*100}%`,background:C.accent,borderRadius:999,transition:'width 0.35s ease'}}/&gt;\n      &lt;/div&gt;\n      &lt;div style={{display:'flex',justifyContent:'space-between',marginTop:5}}&gt;\n        &lt;span style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:8,color:C.muted,letterSpacing:1}}&gt;STEP {step} OF {total}&lt;/span&gt;\n        &lt;span style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:8,color:C.muted,letterSpacing:1}}&gt;{Math.round((step/total)*100)}%&lt;/span&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\n// Back button\nfunction BackBtn({onBack}) {\n  if (!onBack) return &lt;div style={{width:36,height:36}}/&gt;;\n  return (\n    &lt;div onClick={onBack} style={{width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',borderRadius:8,background:C.surf}}&gt;\n      &lt;svg width=&quot;16&quot; height=&quot;16&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke={C.muted} strokeWidth=&quot;2&quot; strokeLinecap=&quot;round&quot;&gt;&lt;polyline points=&quot;15 18 9 12 15 6&quot;/&gt;&lt;/svg&gt;\n    &lt;/div&gt;\n  );\n}\n\n// Primary CTA\nfunction PrimaryCTA({label='CONTINUE', onTap, disabled=false, sub=null}) {\n  return (\n    &lt;div style={{padding:'0 20px 16px'}}&gt;\n      {sub &amp;&amp; &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:11,color:C.muted,textAlign:'center',marginBottom:10,lineHeight:1.4}}&gt;{sub}&lt;/div&gt;}\n      &lt;div onClick={!disabled?onTap:undefined} style={{height:52,borderRadius:12,background:disabled?C.surf:C.accent,display:'flex',alignItems:'center',justifyContent:'center',cursor:disabled?'default':'pointer',boxShadow:disabled?'none':`0 8px 20px ${C.accent}33`,transition:'all 0.2s'}}&gt;\n        &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:22,letterSpacing:2,color:disabled?C.muted:'#fff'}}&gt;{label}&lt;/span&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\n// Question heading\nfunction QHead({label, title, sub}) {\n  return (\n    &lt;div style={{padding:'6px 20px 20px',animation:'fadeUp 0.3s ease-out'}}&gt;\n      {label &amp;&amp; &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:9,color:C.muted,letterSpacing:1.5,marginBottom:8}}&gt;{label}&lt;/div&gt;}\n      &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:300,fontSize:30,color:C.ink,letterSpacing:-0.5,lineHeight:1.1}}&gt;{title}&lt;/div&gt;\n      {sub &amp;&amp; &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:13,color:C.muted,marginTop:8,lineHeight:1.5}}&gt;{sub}&lt;/div&gt;}\n    &lt;/div&gt;\n  );\n}\n\n// ══════════════════════════════════════════════════════════════\n// SCREEN 1: Auth\n// ══════════════════════════════════════════════════════════════\nfunction AuthScreen({onNext}) {\n  return (\n    &lt;div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',color:C.ink}}&gt;\n      &lt;StatusBar/&gt;\n      &lt;div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'center',padding:'0 24px 40px',animation:'fadeUp 0.4s ease-out'}}&gt;\n        {/* Logo */}\n        &lt;div style={{display:'flex',alignItems:'center',gap:10,marginBottom:48}}&gt;\n          &lt;div style={{width:44,height:44,borderRadius:12,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center'}}&gt;\n            &lt;svg width=&quot;22&quot; height=&quot;22&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M3.5 12L12 4M12 4L20.5 12M6 13.5v7M18 13.5v7M6 20.5h12M10.5 20.5v-4.5h3v4.5&quot; stroke=&quot;#fff&quot; strokeWidth=&quot;2&quot; strokeLinecap=&quot;round&quot; strokeLinejoin=&quot;round&quot;/&gt;&lt;/svg&gt;\n          &lt;/div&gt;\n          &lt;div&gt;\n            &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:26,color:C.ink,letterSpacing:1,lineHeight:1}}&gt;PULSE/PUMP&lt;/div&gt;\n            &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:9,color:C.muted,letterSpacing:1.5}}&gt;TRAIN SMARTER&lt;/div&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n 18v2.84C3.99 20.53 7.7 23 12 23z&quot; fill=&quot;#34A853&quot;/&gt;&lt;path d=&quot;M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z&quot; fill=&quot;#FBBC05&quot;/&gt;&lt;path d=&quot;M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z&quot; fill=&quot;#EA4335&quot;/&gt;&lt;/svg&gt;\n            &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:15,fontWeight:500,color:C.ink}}&gt;Continue with Google&lt;/span&gt;\n          &lt;/div&gt;\n          {/* Email */}\n          &lt;div onClick={onNext} style={{height:52,borderRadius:12,background:'transparent',border:`1px solid ${C.hair2}`,display:'flex',alignItems:'center',justifyContent:'center',gap:10,cursor:'pointer'}}&gt;\n            &lt;svg width=&quot;16&quot; height=&quot;16&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke={C.muted} strokeWidth=&quot;2&quot; strokeLinecap=&quot;round&quot;&gt;&lt;path d=&quot;M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z&quot;/&gt;&lt;polyline points=&quot;22,6 12,13 2,6&quot;/&gt;&lt;/svg&gt;\n            &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:15,fontWeight:500,color:C.muted}}&gt;Use email instead&lt;/span&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n\n        &lt;div style={{marginTop:20,fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:11,color:C.faint,textAlign:'center',lineHeight:1.5}}&gt;\n          By continuing you agree to our Terms of Service and Privacy Policy.\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ══════════════════════════════════════════════════════════════\n// SCREEN 2: Name\n// ══════════════════════════════════════════════════════════════\nfunction NameScreen({onNext, onBack, step, total}) {\n  const [name, setName] = React.useState('');\n  return (\n    &lt;div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',color:C.ink}}&gt;\n      &lt;StatusBar/&gt;\n      &lt;div style={{padding:'4px 20px 0',display:'flex',alignItems:'center',gap:10}}&gt;\n        &lt;BackBtn onBack={onBack}/&gt;\n        &lt;div style={{flex:1}}&gt;&lt;ProgressBar step={step} total={total}/&gt;&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div style={{flex:1,display:'flex',flexDirection:'column',padding:'16px 0 0'}}&gt;\n        &lt;QHead label=&quot;01 / NAME&quot; title={&quot;What should\\nwe call you?&quot;} sub=&quot;This is how you'll appear to friends and on your profile.&quot;/&gt;\n        &lt;div style={{padding:'0 20px',flex:1}}&gt;\n          &lt;input\n            value={name} onChange={e=&gt;setName(e.target.value)}\n            placeholder=&quot;Your name&quot;\n            autoFocus\n            style={{width:'100%',height:54,background:C.surf,border:`1px solid ${name?C.accent:C.hair2}`,borderRadius:12,padding:'0 16px',fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:24,letterSpacing:0.5,color:C.ink,outline:'none',transition:'border 0.15s'}}\n          /&gt;\n          &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:9,color:C.muted,letterSpacing:0.8,marginTop:8}}&gt;FIRST NAME IS FINE · CAN CHANGE LATER&lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n      &lt;PrimaryCTA label=&quot;CONTINUE&quot; onTap={()=&gt;name.trim()&amp;&amp;onNext({name})} disabled={!name.trim()}/&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ══════════════════════════════════════════════════════════════\n// SCREEN 3: Weight\n// ══════════════════════════════════════════════════════════════\nfunction WeightScreen({onNext, onBack, step, total, data}) {\n  const [unit, setUnit] = React.useState('kg');\n  const [val, setVal] = React.useState('');\n  return (\n    &lt;div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',color:C.ink}}&gt;\n      &lt;StatusBar/&gt;\n      &lt;div style={{padding:'4px 20px 0',display:'flex',alignItems:'center',gap:10}}&gt;\n        &lt;BackBtn onBack={onBack}/&gt;\n        &lt;div style={{flex:1}}&gt;&lt;ProgressBar step={step} total={total}/&gt;&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div style={{flex:1,display:'flex',flexDirection:'column',padding:'16px 0 0'}}&gt;\n        &lt;QHead label=&quot;02 / BODY&quot; title={`How much do\\nyou weigh, ${data.name||''}?`} sub=&quot;Used to estimate calorie burn. Can be updated anytime.&quot;/&gt;\n        &lt;div style={{padding:'0 20px',flex:1}}&gt;\n          {/* Unit toggle */}\n          &lt;div style={{display:'flex',background:C.surf2,borderRadius:8,padding:3,gap:2,width:140,marginBottom:16}}&gt;\n            {['kg','lbs'].map(u=&gt;(\n              &lt;div key={u} onClick={()=&gt;setUnit(u)} style={{flex:1,height:30,borderRadius:6,background:unit===u?C.bg:'transparent',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',transition:'background 0.15s'}}&gt;\n                &lt;span style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:10,fontWeight:700,color:unit===u?C.accent:C.muted,letterSpacing:0.8}}&gt;{u.toUpperCase()}&lt;/span&gt;\n              &lt;/div&gt;\n            ))}\n          &lt;/div&gt;\n          {/* Large number input */}\n          &lt;div style={{display:'flex',alignItems:'baseline',gap:6}}&gt;\n            &lt;input\n              value={val} onChange={e=&gt;setVal(e.target.value.replace(/[^0-9.]/g,''))}\n              placeholder=&quot;—&quot;\n              type=&quot;number&quot;\n              style={{width:160,background:'transparent',border:'none',outline:'none',fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:72,letterSpacing:-1,color:val?C.ink:C.faint,lineHeight:1}}\n            /&gt;\n            &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:28,color:C.muted,letterSpacing:0.5}}&gt;{unit.toUpperCase()}&lt;/span&gt;\n          &lt;/div&gt;\n          &lt;div style={{height:1,background:C.hair,marginTop:4,marginBottom:12}}/&gt;\n          &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:9,color:C.muted,letterSpacing:0.8}}&gt;TYPICAL RANGE: 50–150KG&lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n      &lt;PrimaryCTA label=&quot;CONTINUE&quot; onTap={()=&gt;val&amp;&amp;onNext({weight:val,weightUnit:unit})} disabled={!val}/&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ══════════════════════════════════════════════════════════════\n// SCREEN 4: Height\n// ══════════════════════════════════════════════════════════════\nfunction HeightScreen({onNext, onBack, step, total}) {\n  const [unit, setUnit] = React.useState('cm');\n  const [val, setVal] = React.useState('');\n  const [ft, setFt] = React.useState('');\n  const [inches, setInches] = React.useState('');\n  return (\n    &lt;div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',color:C.ink}}&gt;\n      &lt;StatusBar/&gt;\n      &lt;div style={{padding:'4px 20px 0',display:'flex',alignItems:'center',gap:10}}&gt;\n        &lt;BackBtn onBack={onBack}/&gt;\n        &lt;div style={{flex:1}}&gt;&lt;ProgressBar step={step} total={total}/&gt;&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div style={{flex:1,display:'flex',flexDirection:'column',padding:'16px 0 0'}}&gt;\n        &lt;QHead label=&quot;03 / BODY&quot; title=&quot;How tall are you?&quot; sub=&quot;Used with weight to estimate your baseline metabolism.&quot;/&gt;\n        &lt;div style={{padding:'0 20px',flex:1}}&gt;\n          &lt;div style={{display:'flex',background:C.surf2,borderRadius:8,padding:3,gap:2,width:140,marginBottom:16}}&gt;\n            {['cm','ft/in'].map(u=&gt;(\n              &lt;div key={u} onClick={()=&gt;setUnit(u)} style={{flex:1,height:30,borderRadius:6,background:unit===u?C.bg:'transparent',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}&gt;\n                &lt;span style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:10,fontWeight:700,color:unit===u?C.accent:C.muted,letterSpacing:0.8}}&gt;{u.toUpperCase()}&lt;/span&gt;\n              &lt;/div&gt;\n            ))}\n          &lt;/div&gt;\n          {unit==='cm' ? (\n            &lt;div&gt;\n              &lt;div style={{display:'flex',alignItems:'baseline',gap:6}}&gt;\n                &lt;input value={val} onChange={e=&gt;setVal(e.target.value.replace(/[^0-9]/g,''))} placeholder=&quot;—&quot; type=&quot;number&quot;\n                  style={{width:160,background:'transparent',border:'none',outline:'none',fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:72,letterSpacing:-1,color:val?C.ink:C.faint,lineHeight:1}}/&gt;\n                &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:28,color:C.muted}}&gt;CM&lt;/span&gt;\n              &lt;/div&gt;\n              &lt;div style={{height:1,background:C.hair,marginTop:4}}/&gt;\n            &lt;/div&gt;\n          ) : (\n            &lt;div style={{display:'flex',alignItems:'baseline',gap:16}}&gt;\n              &lt;div&gt;\n                &lt;div style={{display:'flex',alignItems:'baseline',gap:4}}&gt;\n                  &lt;input value={ft} onChange={e=&gt;setFt(e.target.value.replace(/[^0-9]/g,''))} placeholder=&quot;—&quot; type=&quot;number&quot;\n                    style={{width:80,background:'transparent',border:'none',outline:'none',fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:64,letterSpacing:-1,color:ft?C.ink:C.faint,lineHeight:1}}/&gt;\n                  &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:28,color:C.muted}}&gt;FT&lt;/span&gt;\n                &lt;/div&gt;\n                &lt;div style={{height:1,background:C.hair}}/&gt;\n              &lt;/div&gt;\n              &lt;div&gt;\n                &lt;div style={{display:'flex',alignItems:'baseline',gap:4}}&gt;\n                  &lt;input value={inches} onChange={e=&gt;setInches(e.target.value.replace(/[^0-9]/g,''))} placeholder=&quot;—&quot; type=&quot;number&quot;\n                    style={{width:80,background:'transparent',border:'none',outline:'none',fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:64,letterSpacing:-1,color:inches?C.ink:C.faint,lineHeight:1}}/&gt;\n                  &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:28,color:C.muted}}&gt;IN&lt;/span&gt;\n                &lt;/div&gt;\n                &lt;div style={{height:1,background:C.hair}}/&gt;\n              &lt;/div&gt;\n            &lt;/div&gt;\n          )}\n        &lt;/div&gt;\n      &lt;/div&gt;\n      &lt;PrimaryCTA label=&quot;CONTINUE&quot; onTap={()=&gt;onNext({height:val||ft,heightUnit:unit})} disabled={unit==='cm'?!val:!ft}/&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ══════════════════════════════════════════════════════════════\n// SCREEN 5: Age + under-16 handling\n// ══════════════════════════════════════════════════════════════\nfunction AgeScreen({onNext, onBack, step, total}) {\n  const [age, setAge] = React.useState('');\n  return (\n    &lt;div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',color:C.ink}}&gt;\n      &lt;StatusBar/&gt;\n      &lt;div style={{padding:'4px 20px 0',display:'flex',alignItems:'center',gap:10}}&gt;\n        &lt;BackBtn onBack={onBack}/&gt;\n        &lt;div style={{flex:1}}&gt;&lt;ProgressBar step={step} total={total}/&gt;&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div style={{flex:1,display:'flex',flexDirection:'column',padding:'16px 0 0'}}&gt;\n        &lt;QHead label=&quot;04 / BODY&quot; title=&quot;How old are you?&quot; sub=&quot;Used to calibrate calorie estimates. Not shown publicly.&quot;/&gt;\n        &lt;div style={{padding:'0 20px',flex:1}}&gt;\n          &lt;div style={{display:'flex',alignItems:'baseline',gap:6}}&gt;\n            &lt;input value={age} onChange={e=&gt;setAge(e.target.value.replace(/[^0-9]/g,''))} placeholder=&quot;—&quot; type=&quot;number&quot;\n              style={{width:160,background:'transparent',border:'none',outline:'none',fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:72,letterSpacing:-1,color:age?C.ink:C.faint,lineHeight:1}}/&gt;\n            &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:28,color:C.muted}}&gt;YRS&lt;/span&gt;\n          &lt;/div&gt;\n          &lt;div style={{height:1,background:C.hair,marginTop:4}}/&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n      &lt;PrimaryCTA label=&quot;CONTINUE&quot; onTap={()=&gt;age&amp;&amp;onNext({age:parseInt(age)})} disabled={!age}/&gt;\n    &lt;/div&gt;\n  );\n}\n\n\n// ══════════════════════════════════════════════════════════════\n// SCREEN 6: Gender\n// ══════════════════════════════════════════════════════════════\nfunction GenderScreen({onNext, onBack, step, total}) {\n  const [sel, setSel] = React.useState(null);\n  const opts = [\n    {id:'male',   label:'Male'},\n    {id:'female', label:'Female'},\n    {id:'other',  label:'Non-binary / Other'},\n    {id:'skip',   label:'Prefer not to say'},\n  ];\n  return (\n    &lt;div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',color:C.ink}}&gt;\n      &lt;StatusBar/&gt;\n      &lt;div style={{padding:'4px 20px 0',display:'flex',alignItems:'center',gap:10}}&gt;\n        &lt;BackBtn onBack={onBack}/&gt;\n        &lt;div style={{flex:1}}&gt;&lt;ProgressBar step={step} total={total}/&gt;&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div style={{flex:1,display:'flex',flexDirection:'column',padding:'16px 0 0'}}&gt;\n        &lt;QHead label=&quot;05 / BODY&quot; title=&quot;Which best describes you?&quot; sub=&quot;Used only for calorie burn calculations.&quot;/&gt;\n        &lt;div style={{padding:'0 20px',flex:1,display:'flex',flexDirection:'column',gap:8}}&gt;\n          {opts.map(o=&gt;(\n            &lt;div key={o.id} onClick={()=&gt;setSel(o.id)} style={{height:52,borderRadius:12,background:sel===o.id?C.accentSoft:C.surf,border:`1px solid ${sel===o.id?C.accent:C.hair2}`,display:'flex',alignItems:'center',padding:'0 16px',cursor:'pointer',transition:'all 0.15s'}}&gt;\n              &lt;div style={{width:18,height:18,borderRadius:'50%',border:`2px solid ${sel===o.id?C.accent:C.faint}`,background:sel===o.id?C.accent:'transparent',marginRight:12,flexShrink:0,transition:'all 0.15s',display:'flex',alignItems:'center',justifyContent:'center'}}&gt;\n                {sel===o.id&amp;&amp;&lt;div style={{width:6,height:6,borderRadius:'50%',background:'#fff'}}/&gt;}\n              &lt;/div&gt;\n              &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:15,fontWeight:sel===o.id?600:400,color:sel===o.id?C.accent:C.ink}}&gt;{o.label}&lt;/span&gt;\n            &lt;/div&gt;\n          ))}\n        &lt;/div&gt;\n      &lt;/div&gt;\n      &lt;PrimaryCTA label=&quot;CONTINUE&quot; onTap={()=&gt;sel&amp;&amp;onNext({gender:sel})} disabled={!sel}/&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ══════════════════════════════════════════════════════════════\n// SCREEN 7: Experience level\n// ══════════════════════════════════════════════════════════════\nfunction ExperienceScreen({onNext, onBack, step, total}) {\n  const [sel, setSel] = React.useState(null);\n  const opts = [\n    {\n      id:'beginner',\n      label:'New to lifting',\n      sub:'Less than 1 year of consistent training',\n      detail:'We\\'ll guide you through the basics and build your first program.',\n    },\n    {\n      id:'intermediate',\n      label:'Some experience',\n      sub:'1–3 years of consistent training',\n      detail:'You know the lifts. We\\'ll help you track and progress.',\n    },\n    {\n      id:'experienced',\n      label:'Advanced lifter',\n      sub:'3+ years, training with intention',\n      detail:'Minimal setup. Full control. We\\'ll get out of your way.',\n    },\n  ];\n  return (\n    &lt;div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',color:C.ink}}&gt;\n      &lt;StatusBar/&gt;\n      &lt;div style={{padding:'4px 20px 0',display:'flex',alignItems:'center',gap:10}}&gt;\n        &lt;BackBtn onBack={onBack}/&gt;\n        &lt;div style={{flex:1}}&gt;&lt;ProgressBar step={step} total={total}/&gt;&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div style={{flex:1,display:'flex',flexDirection:'column',padding:'16px 0 0'}}&gt;\n        &lt;QHead label=&quot;06 / EXPERIENCE&quot; title=&quot;How long have you been lifting?&quot; sub=&quot;This shapes how we set up your first program.&quot;/&gt;\n        &lt;div style={{padding:'0 20px',flex:1,display:'flex',flexDirection:'column',gap:10}}&gt;\n          {opts.map(o=&gt;(\n            &lt;div key={o.id} onClick={()=&gt;setSel(o.id)} style={{borderRadius:12,background:sel===o.id?C.accentSoft:C.surf,border:`1px solid ${sel===o.id?C.accent:C.hair2}`,padding:'14px 16px',cursor:'pointer',transition:'all 0.15s'}}&gt;\n              &lt;div style={{display:'flex',alignItems:'center',gap:10}}&gt;\n                &lt;div style={{width:18,height:18,borderRadius:'50%',border:`2px solid ${sel===o.id?C.accent:C.faint}`,background:sel===o.id?C.accent:'transparent',flexShrink:0,transition:'all 0.15s',display:'flex',alignItems:'center',justifyContent:'center'}}&gt;\n                  {sel===o.id&amp;&amp;&lt;div style={{width:6,height:6,borderRadius:'50%',background:'#fff'}}/&gt;}\n                &lt;/div&gt;\n                &lt;div&gt;\n                  &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:15,fontWeight:sel===o.id?600:500,color:sel===o.id?C.accent:C.ink}}&gt;{o.label}&lt;/div&gt;\n                  &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:9,color:C.muted,letterSpacing:0.5,marginTop:2}}&gt;{o.sub}&lt;/div&gt;\n                &lt;/div&gt;\n              &lt;/div&gt;\n              {sel===o.id&amp;&amp;&lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:12,color:C.muted,marginTop:10,paddingLeft:28,lineHeight:1.4}}&gt;{o.detail}&lt;/div&gt;}\n            &lt;/div&gt;\n          ))}\n        &lt;/div&gt;\n      &lt;/div&gt;\n      &lt;PrimaryCTA label=&quot;CONTINUE&quot; onTap={()=&gt;sel&amp;&amp;onNext({experience:sel})} disabled={!sel}/&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ══════════════════════════════════════════════════════════════\n// SCREEN 8: Split selection\n// ══════════════════════════════════════════════════════════════\nfunction SplitScreen({onNext, onBack, step, total}) {\n  const [sel, setSel] = React.useState(null);\n  const splits = [\n    {id:'ppl',    label:'Push / Pull / Legs', sub:'6 DAYS/WK · HIGH FREQUENCY · POPULAR'},\n    {id:'ul',     label:'Upper / Lower',       sub:'4 DAYS/WK · BALANCED · GREAT FOR MOST'},\n    {id:'full',   label:'Full Body',           sub:'3 DAYS/WK · EFFICIENT · GOOD FOR BEGINNERS'},\n    {id:'bro',    label:'Bro Split',           sub:'5 DAYS/WK · ONE MUSCLE/DAY · CLASSIC'},\n    {id:'custom', label:'Custom',              sub:'DEFINE YOUR OWN DAYS AND FOCUS'},\n    {id:'none',   label:'No fixed split',      sub:'TRAIN WHENEVER · LOG FREELY'},\n  ];\n  return (\n    &lt;div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',color:C.ink}}&gt;\n      &lt;StatusBar/&gt;\n      &lt;div style={{padding:'4px 20px 0',display:'flex',alignItems:'center',gap:10}}&gt;\n        &lt;BackBtn onBack={onBack}/&gt;\n        &lt;div style={{flex:1}}&gt;&lt;ProgressBar step={step} total={total}/&gt;&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div style={{flex:1,display:'flex',flexDirection:'column',padding:'16px 0 0',overflow:'hidden'}}&gt;\n        &lt;QHead label=&quot;07 / PROGRAM&quot; title=&quot;How do you structure your training?&quot; sub=&quot;This sets up your first program template. Change it anytime.&quot;/&gt;\n        &lt;div style={{padding:'0 20px',flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:8,paddingBottom:8}}&gt;\n          {splits.map(s=&gt;(\n            &lt;div key={s.id} onClick={()=&gt;setSel(s.id)} style={{height:56,borderRadius:12,background:sel===s.id?C.accentSoft:C.surf,border:`1px solid ${sel===s.id?C.accent:C.hair2}`,display:'flex',alignItems:'center',padding:'0 16px',cursor:'pointer',transition:'all 0.15s',gap:12}}&gt;\n              &lt;div style={{width:18,height:18,borderRadius:'50%',border:`2px solid ${sel===s.id?C.accent:C.faint}`,background:sel===s.id?C.accent:'transparent',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}&gt;\n                {sel===s.id&amp;&amp;&lt;div style={{width:6,height:6,borderRadius:'50%',background:'#fff'}}/&gt;}\n              &lt;/div&gt;\n              &lt;div style={{flex:1,minWidth:0}}&gt;\n                &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:14,fontWeight:sel===s.id?600:500,color:sel===s.id?C.accent:C.ink}}&gt;{s.label}&lt;/div&gt;\n                &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:8,color:C.muted,letterSpacing:0.5,marginTop:1}}&gt;{s.sub}&lt;/div&gt;\n              &lt;/div&gt;\n            &lt;/div&gt;\n          ))}\n        &lt;/div&gt;\n      &lt;/div&gt;\n      &lt;PrimaryCTA label=&quot;CONTINUE&quot; onTap={()=&gt;sel&amp;&amp;onNext({split:sel})} disabled={!sel}/&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ══════════════════════════════════════════════════════════════\n// SCREEN 9: Tutorial prompt\n// ══════════════════════════════════════════════════════════════\nfunction TutorialScreen({onNext, onBack, step, total, data}) {\n  const isExperienced = data.experience === 'experienced';\n  return (\n    &lt;div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',color:C.ink}}&gt;\n      &lt;StatusBar/&gt;\n      &lt;div style={{padding:'4px 20px 0',display:'flex',alignItems:'center',gap:10}}&gt;\n        &lt;BackBtn onBack={onBack}/&gt;\n        &lt;div style={{flex:1}}&gt;&lt;ProgressBar step={step} total={total}/&gt;&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'center',padding:'0 24px',gap:24}}&gt;\n        {/* Done checkmark */}\n        &lt;div style={{width:56,height:56,borderRadius:16,background:C.accentSoft,border:`1px solid ${C.accent}44`,display:'flex',alignItems:'center',justifyContent:'center'}}&gt;\n          &lt;svg width=&quot;24&quot; height=&quot;24&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke={C.accent} strokeWidth=&quot;2.5&quot; strokeLinecap=&quot;round&quot; strokeLinejoin=&quot;round&quot;&gt;&lt;polyline points=&quot;20 6 9 17 4 12&quot;/&gt;&lt;/svg&gt;\n        &lt;/div&gt;\n        &lt;div&gt;\n          &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:9,color:C.muted,letterSpacing:1.5,marginBottom:8}}&gt;08 / ALMOST DONE&lt;/div&gt;\n          &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:300,fontSize:32,color:C.ink,letterSpacing:-0.5,lineHeight:1.1,marginBottom:10}}&gt;\n            {isExperienced ? &quot;You're all set.&quot; : `Welcome, ${data.name||'there'}.`}\n          &lt;/div&gt;\n          &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:13,color:C.muted,lineHeight:1.6}}&gt;\n            {isExperienced\n              ? &quot;We've set up a basic template based on your split. You know the drill — start logging and the app learns your patterns.&quot;\n              : &quot;Your program is ready. Want a quick tour of the key features before you start?&quot;}\n          &lt;/div&gt;\n        &lt;/div&gt;\n\n        {isExperienced ? (\n          // Experienced: just one CTA\n          &lt;div onClick={()=&gt;onNext({tutorial:false})} style={{height:52,borderRadius:12,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',boxShadow:`0 8px 20px ${C.accent}33`}}&gt;\n            &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:22,letterSpacing:2,color:'#fff'}}&gt;START TRAINING&lt;/span&gt;\n          &lt;/div&gt;\n        ) : (\n          // Beginner: yes/no tutorial\n          &lt;div style={{display:'flex',flexDirection:'column',gap:10}}&gt;\n            &lt;div onClick={()=&gt;onNext({tutorial:true})} style={{height:52,borderRadius:12,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',boxShadow:`0 8px 20px ${C.accent}33`}}&gt;\n              &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:22,letterSpacing:2,color:'#fff'}}&gt;YES, SHOW ME AROUND&lt;/span&gt;\n            &lt;/div&gt;\n            &lt;div onClick={()=&gt;onNext({tutorial:false})} style={{height:52,borderRadius:12,background:C.surf,border:`1px solid ${C.hair2}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}&gt;\n              &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:20,letterSpacing:1.5,color:C.muted}}&gt;SKIP, I'LL EXPLORE MYSELF&lt;/span&gt;\n            &lt;/div&gt;\n          &lt;/div&gt;\n        )}\n        &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:9,color:C.faint,letterSpacing:0.8,textAlign:'center'}}&gt;TUTORIAL ALWAYS AVAILABLE IN MORE → HELP&lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ══════════════════════════════════════════════════════════════\n// COMPLETE FLOW — interactive\n// ══════════════════════════════════════════════════════════════\nconst SCREENS = ['auth','name','weight','height','age','gender','experience','split','tutorial','done'];\nconst TOTAL_STEPS = 8; // excludes auth and done\n\nfunction OnboardingFlow({startAt='auth'}) {\n  const [screen, setScreen] = React.useState(startAt);\n  const [data, setData] = React.useState({});\n  const [history, setHistory] = React.useState([]);\n\n  const go = (next, newData={}) =&gt; {\n    setHistory(h=&gt;[...h, screen]);\n    setData(d=&gt;({...d,...newData}));\n    setScreen(next);\n  };\n  const back = () =&gt; {\n    const prev = history[history.length-1];\n    if (prev) { setHistory(h=&gt;h.slice(0,-1)); setScreen(prev); }\n  };\n\n  const stepOf = (s) =&gt; Math.max(1, SCREENS.indexOf(s) - 1);\n\n  if (screen==='done') {\n    return (\n      &lt;div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 24px',gap:16,color:C.ink}}&gt;\n        &lt;div style={{width:60,height:60,borderRadius:18,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center'}}&gt;\n          &lt;svg width=&quot;28&quot; height=&quot;28&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;#fff&quot; strokeWidth=&quot;2.5&quot; strokeLinecap=&quot;round&quot; strokeLinejoin=&quot;round&quot;&gt;&lt;path d=&quot;M3.5 12L12 4M12 4L20.5 12M6 13.5v7M18 13.5v7M6 20.5h12M10.5 20.5v-4.5h3v4.5&quot;/&gt;&lt;/svg&gt;\n        &lt;/div&gt;\n        &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:36,color:C.ink,letterSpacing:0.5,textAlign:'center'}}&gt;LET'S GO&lt;/div&gt;\n        &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:13,color:C.muted,textAlign:'center',lineHeight:1.5}}&gt;\n          Navigating to your home screen…\n        &lt;/div&gt;\n        &lt;div style={{marginTop:8,fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:9,color:C.faint,letterSpacing:0.8}}&gt;\n          {Object.entries(data).map(([k,v])=&gt;`${k}: ${v}`).join(' · ')}\n        &lt;/div&gt;\n      &lt;/div&gt;\n    );\n  }\n\n  const step = stepOf(screen);\n\n  if (screen==='auth')       return &lt;AuthScreen onNext={()=&gt;go('name')}/&gt;;\n  if (screen==='name')       return &lt;NameScreen onNext={d=&gt;go('weight',d)} onBack={back} step={1} total={TOTAL_STEPS}/&gt;;\n  if (screen==='weight')     return &lt;WeightScreen onNext={d=&gt;go('height',d)} onBack={back} step={2} total={TOTAL_STEPS} data={data}/&gt;;\n  if (screen==='height')     return &lt;HeightScreen onNext={d=&gt;go('age',d)} onBack={back} step={3} total={TOTAL_STEPS}/&gt;;\n  if (screen==='age')        return &lt;AgeScreen onNext={d=&gt;go('gender',d)} onBack={back} step={4} total={TOTAL_STEPS}/&gt;;\n  if (screen==='gender')     return &lt;GenderScreen onNext={d=&gt;go('experience',d)} onBack={back} step={5} total={TOTAL_STEPS}/&gt;;\n  if (screen==='experience') return &lt;ExperienceScreen onNext={d=&gt;go('split',d)} onBack={back} step={6} total={TOTAL_STEPS}/&gt;;\n  if (screen==='split')      return &lt;SplitScreen onNext={d=&gt;go('tutorial',d)} onBack={back} step={7} total={TOTAL_STEPS}/&gt;;\n  if (screen==='tutorial')   return &lt;TutorialScreen onNext={d=&gt;go('done',d)} onBack={back} step={8} total={TOTAL_STEPS} data={data}/&gt;;\n  return null;\n}\n\n// ── Layout ────────────────────────────────────────────────────\nfunction PhoneCard({num, vibe, children}) {\n  return (\n    &lt;div className=&quot;pcard&quot;&gt;\n      &lt;div&gt;&lt;div className=&quot;card-label&quot;&gt;&lt;span className=&quot;num&quot;&gt;{num}&lt;/span&gt;&lt;span className=&quot;vibe&quot;&gt;{vibe}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\n      &lt;div className=&quot;frame&quot;&gt;&lt;div className=&quot;screen&quot;&gt;{children}&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nfunction App() {\n  return (\n    &lt;div className=&quot;canvas&quot;&gt;\n      &lt;h1&gt;Onboarding&lt;/h1&gt;\n      &lt;p className=&quot;h1-sub&quot;&gt;Fully interactive flow — tap through from auth to the app. All inputs work. Back navigation preserved. Under-16 acknowledgment screen. Experienced user fast-track on the tutorial step.&lt;/p&gt;\n\n      &lt;div className=&quot;section-label&quot;&gt;FULL FLOW — INTERACTIVE&lt;/div&gt;\n      &lt;p className=&quot;section-desc&quot;&gt;Tap through the entire onboarding: Auth → Name → Weigh oneCard num=&quot;C4&quot; vibe=&quot;08 · Split&quot;&gt;&lt;SplitScreen onNext={()=&gt;{}} onBack={()=&gt;{}} step={7} total={8}/&gt;&lt;/PhoneCard&gt;\n      &lt;/div&gt;\n\n      &lt;div className=&quot;grid&quot; style={{marginTop:40}}&gt;\n        &lt;PhoneCard num=&quot;D1&quot; vibe=&quot;09 · Tutorial (beginner)&quot;&gt;&lt;TutorialScreen onNext={()=&gt;{}} onBack={()=&gt;{}} step={8} total={8} data={{name:'Jay',experience:'beginner'}}/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;D2&quot; vibe=&quot;09 · Tutorial (experienced)&quot;&gt;&lt;TutorialScreen onNext={()=&gt;{}} onBack={()=&gt;{}} step={8} total={8} data={{name:'Jay',experience:'experienced'}}/&gt;&lt;/PhoneCard&gt;\n\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(&lt;App /&gt;);\n\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\" title=\"ONBOARDING\"><\u002Fiframe>\n    <iframe id=\"screen-1\" class=\"screen-frame\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;en&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;UTF-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;title&gt;Pulse Pump — Home Screen&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&amp;family=Space+Mono:wght@400;700&amp;family=DM+Mono:wght@400;500&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;script src=&quot;https://unpkg.com/react@18.3.1/umd/react.development.js&quot; integrity=&quot;sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;\n&lt;script src=&quot;https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js&quot; integrity=&quot;sha384-u { transform: translateX(0); } to { transform: translateX(-50%); } }\n  .tk { display: inline-flex; gap: 28px; animation: ticker 45s linear infinite; white-space: nowrap; padding-left: 28px; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.5px; }\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div id=&quot;root&quot;&gt;&lt;/div&gt;\n&lt;script type=&quot;text/babel&quot; data-presets=&quot;react&quot;&gt;\n\n// ── Tokens ────────────────────────────────────────────────────\nconst TL = {\n  bg:'#fbf8f2', surf:'#f4f0e6', surf2:'#ece7d8', surf3:'#e2dccd',\n  ink:'#1f1c19', ink2:'#3a342d',\n  muted:'rgba(31,28,25,0.5)', faint:'rgba(31,28,25,0.13)',\n  hair:'rgba(31,28,25,0.08)', hair2:'rgba(31,28,25,0.13)',\n  accent:'#c8553d', accentSoft:'rgba(200,85,61,0.08)',\n  up:'#1f8f5a', down:'#c0341a', pr:'#c9892e',\n  tickerBg:'#1a1816', tickerFg:'#ece5d6',\n};\nconst TD = {\n  bg:'#1a1816', surf:'#252220', surf2:'#2e2a26', surf3:'#363028',\n  ink:'#ece5d6', ink2:'#c8bfb0',\n  muted:'rgba(236,229,214,0.5)', faint:'rgba(236,229,214,0.13)',\n  hair:'rgba(236,229,214,0.08)', hair2:'rgba(236,229,214,0.13)',\n  accent:'#dc7d4a', accentSoft:'rgba(220,125,74,0.10)',\n  up:'#3fb777', down:'#e05a45', pr:'#d4a03c',\n  tickerBg:'#0e0c0a', tickerFg:'#ece5d6',\n};\n\n// ── Session data ──────────────────────────────────────────────\nconst USER = {\n  name: 'Jay',\n  streak: 13,\n  weekVol: [80, 94, 0, 112, 86, 0, 108], // Mon-Sun sets\n  weekLabels: ['M','T','W','T','F','S','S'],\n  weekDayDone: [true, true, false, true, true, false, false], // today = Sat = index 5\n  todayIdx: 5,\n  prediction: {\n    name: 'PUSH DAY',\n    program: 'PPL',\n    lastDone: '3 days ago',\n    estDuration: '~55 MIN',\n    exercises: ['Bench Press','Overhead Press','Incline DB','Cable Fly','Tricep PD'],\n    confidence: 0.94,\n    reason: 'You do Push every Sat · 13-week pattern',\n  },\n  draftWorkout: null, // set to an object to show resume state\n  weekImproved: 14,\n  weekPRs: 3,\n  weekStreak: 13,\n  friends: [\n    { name: 'Marcus', workout: 'Pull Day', ago: '2h' },\n    { name: 'Priya',  workout: 'Legs',     ago: '5h' },\n  ],\n};\n\n// Draft workout variant data\nconst USER_DRAFT = {\n  ...USER,\n  draftWorkout: { name: 'PUSH DAY', elapsed: '24:18', sets: 9, totalSets: 28 },\n};\n\n// ── Primitives ────────────────────────────────────────────────\nconst StatusBar = ({dark=false}) =&gt; (\n  &lt;div style={{height:50,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:6,flexShrink:0}}&gt;\n    &lt;div style={{width:126,height:37,background:dark?'rgba(255,255,255,0.1)':'#000',borderRadius:24}}/&gt;\n  &lt;/div&gt;\n);\n\nfunction TabBar({C, active='Home'}) {\n  const dark=C===TD;\n  const muted=dark?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.35)';\n  const bg=dark?'rgba(26,24,22,0.94)':'rgba(251,248,242,0.94)';\n  const bord=dark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';\n  const tabs=[{k:'Programs'},{k:'Social'},{k:'Home',center:true,active:active==='Home'},{k:'Body'},{k:'More'}];\n  const ICON=(k,col)=&gt;{const s={width:22,height:22,fill:'none',stroke:col,strokeWidth:1.6,strokeLinecap:'round',strokeLinejoin:'round'};\n    if(k==='Programs')return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;5&quot; width=&quot;16&quot; height=&quot;14&quot; rx=&quot;2&quot;/&gt;&lt;path d=&quot;M8 9h8M8 13h8M8 17h5&quot;/&gt;&lt;/svg&gt;;\n    if(k==='Social')  return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;9&quot; cy=&quot;9&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;17&quot; cy=&quot;11&quot; r=&quot;2.5&quot;/&gt;&lt;path d=&quot;M3 19c.5-3 3-5 6-5s5.5 2 6 5&quot;/&gt;&lt;/svg&gt;;\n    if(k==='Body')    return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;5&quot; r=&quot;2.2&quot;/&gt;&lt;path d=&quot;M8 11l4-3 4 3M12 8v6M9 14l-2 6M15 14l2 6&quot;/&gt;&lt;/svg&gt;;\n    if(k==='More')    return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;6&quot; cy=&quot;12&quot; r=&quot;1.4&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;1.4&quot;/&gt;&lt;circle cx=&quot;18&quot; cy=&quot;12&quot; r=&quot;1.4&quot;/&gt;&lt;/svg&gt;;\n    return null;\n  };\n  return(\n    &lt;div style={{position:'absolute',bottom:0,left:0,right:0,background:bg,backdropFilter:'blur(16px)',borderTop:`0.5px solid ${bord}`,display:'flex',alignItems:'center',padding:'8px 0 28px',zIndex:50}}&gt;\n      {tabs.map((t,i)=&gt;{\n        const isActive=t.k===active;\n        const col=isActive?C.ink:muted;\n        return(\n          &lt;div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}&gt;\n            {t.center\n              ?&lt;div style={{width:46,height:46,borderRadius:15,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',marginTop:-12,boxShadow:`0 8px 16px ${C.accent}44`}}&gt;\n                &lt;svg width=&quot;22&quot; height=&quot;22&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M3.5 12L12 4M12 4L20.5 12M6 13.5v7M18 13.5v7M6 20.5h12M10.5 20.5v-4.5h3v4.5&quot; stroke=&quot;#fff&quot; strokeWidth=&quot;1.8&quot; strokeLinecap=&quot;round&quot; strokeLinejoin=&quot;round&quot;/&gt;&lt;/svg&gt;\n              &lt;/div&gt;\n              :ICON(t.k,col)}\n            &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:10,fontWeight:isActive?600:500,color:t.center?C.accent:col}}&gt;{t.k}&lt;/span&gt;\n          &lt;/div&gt;\n        );\n      })}\n    &lt;/div&gt;\n  );\n}\n\n// ── Ticker strip ──────────────────────────────────────────────\nfunction TickerStrip({C}) {\n  const items = [\n    ['CHEST','▲ +12.5%',true],['BACK','▲ +11.1%',true],\n    ['QUADS','TGT',null],['GLUTES','TGT',null],\n    ['SHLDR','▼ -14.3%',false],['HAMS','▼ -33.3%',false],\n    ['BICEP','▲ +20.0%',true],['TRI','TGT',null],\n    ['CORE','▼ -40.0%',false],['TRAP','▼ -25.0%',false],\n  ];\n  return (\n    &lt;div style={{background:C.tickerBg,height:26,overflow:'hidden',display:'flex',alignItems:'center'}}&gt;\n      &lt;div className=&quot;tk&quot;&gt;\n        {[...items,...items].map(([k,v,u],i)=&gt;(\n          &lt;span key={i} style={{display:'inline-flex',alignItems:'center',gap:6}}&gt;\n            &lt;span style={{color:'rgba(236,229,214,0.55)',letterSpacing:1}}&gt;{k}&lt;/span&gt;\n            &lt;span style={{color:u===true?'#7fcf9f':u===false?'#ff8b75':'rgba(236,229,214,0.6)',fontWeight:700}}&gt;{v}&lt;/span&gt;\n            &lt;span style={{color:'rgba(236,229,214,0.18)',marginLeft:4}}&gt;·&lt;/span&gt;\n          &lt;/span&gt;\n        ))}\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ── Week volume sparkbar ──────────────────────────────────────\nfunction WeekBars({C, data, labels, done, today, compact=false}) {\n  const max = Math.max(...data, 1);\n  const h = compact ? 40 : 60;\n  return (\n    &lt;div style={{display:'flex',gap:compact?4:6,alignItems:'flex-end',height:h+20}}&gt;\n      {data.map((v,i)=&gt;{\n        const isToday = i===today;\n        const pct = v/max;\n        const barH = Math.max(v&gt;0?pct*h:3, 3);\n        const col = isToday ? C.accent : done[i] ? C.up : v&gt;0 ? C.ink : C.faint;\n        const opacity = isToday ? 1 : done[i] ? 0.7 : v&gt;0 ? 0.35 : 0.15;\n        return (\n          &lt;div key={i} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3,flex:1}}&gt;\n            &lt;div style={{width:'100%',height:barH,background:col,opacity,borderRadius:compact?2:3,transition:'height 0.3s ease'}}/&gt;\n            &lt;span style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:compact?7:8,color:isToday?C.accent:C.muted,fontWeight:isToday?700:400,letterSpacing:0.5}}&gt;{labels[i]}&lt;/span&gt;\n          &lt;/div&gt;\n        );\n      })}\n    &lt;/div&gt;\n  );\n}\n\n// ── Smart prediction confidence indicator ─────────────────────\nfunction ConfidenceDots({conf, C}) {\n  const filled = Math.round(conf * 5);\n  return (\n    &lt;div style={{display:'flex',gap:3,alignItems:'center'}}&gt;\n      {[0,1,2,3,4].map(i=&gt;(\n        &lt;div key={i} style={{width:5,height:5,borderRadius:1,background:i&lt;filled?C.accent:C.faint}}/&gt;\n      ))}\n      &lt;span style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:8,color:C.muted,marginLeft:4,letterSpacing:0.5}}&gt;{Math.round(conf*100)}% CONF&lt;/span&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ── Friends chip ──────────────────────────────────────────────\nfunction FriendsChip({C, friends}) {\n  if (!friends.length) return null;\n  return (\n    &lt;div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',background:C.surf,borderRadius:8,border:`1px solid ${C.hair2}`}}&gt;\n      &lt;div style={{display:'flex',gap:-4}}&gt;\n        {friends.slice(0,3).map((f,i)=&gt;(\n          &lt;div key={i} style={{width:22,height:22,borderRadius:'50%',background:C.surf2,border:`2px solid ${C.bg}`,marginLeft:i&gt;0?-8:0,display:'flex',alignItems:'center',justifyContent:'center',zIndex:friends.length-i}}&gt;\n            &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:9,color:C.muted}}&gt;{f.name[0]}&lt;/span&gt;\n          &lt;/div&gt;\n        ))}\n      &lt;/div&gt;\n      &lt;div style={{flex:1,minWidth:0}}&gt;\n        &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:11,color:C.ink,fontWeight:500}}&gt;{friends[0].name}{friends.length&gt;1?` +${friends.length-1} others`:''} trained today&lt;/span&gt;\n      &lt;/div&gt;\n      &lt;svg width=&quot;12&quot; height=&quot;12&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke={C.faint} strokeWidth=&quot;2&quot; strokeLinecap=&quot;round&quot;&gt;&lt;polyline points=&quot;9 18 15 12 9 6&quot;/&gt;&lt;/svg&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ── Docked CTA ────────────────────────────────────────────────\nfunction DockedCTA({C, user}) {\n  const hasDraft = !!user.draftWo ue)} style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:10,color:C.muted,letterSpacing:1,cursor:'pointer',borderBottom:`1px solid ${C.faint}`,paddingBottom:1}}&gt;\n              START NEW WORKOUT\n            &lt;/span&gt;\n          &lt;/div&gt;\n        )}\n        {/* Full-width continue — whole bar is tappable, no separate resume button */}\n        &lt;div style={{position:'relative',height:54,borderRadius:12,overflow:'hidden',background:C.surf,border:`1px solid ${C.accent}55`,cursor:'pointer'}}&gt;\n          &lt;div style={{position:'absolute',left:0,top:0,bottom:0,width:`${pct*100}%`,background:C.accent,opacity:0.18,borderRadius:12}}/&gt;\n          &lt;div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',padding:'0 18px',gap:14}}&gt;\n            &lt;div style={{flex:1}}&gt;\n              &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,fontSize:20,letterSpacing:1.5,color:C.accent}}&gt;CONTINUE {d.name}&lt;/div&gt;\n              &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:9,color:C.muted,marginTop:1}}&gt;{d.elapsed} · {d.sets}/{d.totalSets} SETS DONE&lt;/div&gt;\n            &lt;/div&gt;\n            &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,fontSize:22,color:C.accent,flexShrink:0}}&gt;›&lt;/span&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    );\n  }\n\n  // Normal start workout — full width, no divider\n  return (\n    &lt;div style={{position:'absolute',bottom:96,left:0,right:0,padding:'10px 16px 0',background:C.bg,zIndex:60}}&gt;\n      &lt;div style={{position:'relative',height:54,borderRadius:12,background:C.accent,boxShadow:`0 8px 24px ${C.accent}44`,cursor:'pointer'}}&gt;\n        &lt;div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',padding:'0 20px',gap:10}}&gt;\n          &lt;div style={{flex:1}}&gt;\n            &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace', amily:'&quot;Archivo&quot;,sans-serif',fontWeight:600,fontSize:14,color:C.ink,letterSpacing:0.3}}&gt;{w.name}&lt;/div&gt;\n                &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:8,color:C.muted,marginTop:1}}&gt;{w.date}&lt;/div&gt;\n              &lt;/div&gt;\n              &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:11,color:C.muted,textAlign:'center',fontWeight:700}}&gt;{w.sets}&lt;/div&gt;\n              &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:11,color:C.up,textAlign:'center',fontWeight:700}}&gt;{w.improved}&lt;/div&gt;\n              &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:11,color:C.up,textAlign:'right',fontWeight:700}}&gt;▲{w.vol}&lt;/div&gt;\n            &lt;/div&gt;\n          ))}\n        &lt;/div&gt;\n      &lt;/div&gt;\n\n      &lt;DockedCTA C={C} user={user}/&gt;\n      &lt;TabBar C={C} active=&quot;Home&quot;/&gt;\n    &lt;/div&gt;\n  );\n}\n\n\n// ── Layout ────────────────────────────────────────────────────\nfunction PhoneCard({num,vibe,children}) {\n  return(\n    &lt;div className=&quot;pcard&quot;&gt;\n      &lt;div&gt;&lt;div className=&quot;card-label&quot;&gt;&lt;span className=&quot;num&quot;&gt;{num}&lt;/span&gt;&lt;span className=&quot;vibe&quot;&gt;{vibe}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\n      &lt;div className=&quot;frame&quot;&gt;&lt;div className=&quot;screen&quot;&gt;{children}&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nconst TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\n  &quot;accentColor&quot;: &quot;#c8553d&quot;,\n  &quot;variant&quot;: &quot;dense&quot;\n}/*EDITMODE-END*/;\n\nfunction TweaksPanel({ tweaks, setTweak, visible }) {\n  if (!visible) return null;\n  return (\n    &lt;div style={{position:'fixed',bottom:24,right:24,zIndex:9999,background:'#fff',borderRadius:14,padding:'16px 18px',boxShadow:'0 8px 32px rgba(0,0,0,0.18)',border:'1px solid rgba(0,0,0,0.1)',minWidth:220,fontFamily:'Inter,system-ui'}}&gt;\n      &lt;div style={{fontSize:12,fontWeight:700,letterSpacing:1,color:'#888',marginBottom:12,textTransform:'uppercase'}}&gt;Tweaks&lt;/div&gt;\n      &lt;div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}&gt;\n        &lt;span style={{fontSize:13,color:'#333'}}&gt;Accent color&lt;/span&gt;\n        &lt;input type=&quot;color&quot; value={tweaks.accentColor} onChange={e=&gt;setTweak('accentColor',e.target.value)} style={{width:32,height:24,border:'none',borderRadius:4,cursor:'pointer'}}/&gt;\n      &lt;/div&gt;\n      &lt;div&gt;\n        &lt;span style={{fontSize:13,color:'#333',display:'block',marginBottom:8}}&gt;Show variant&lt;/span&gt;\n        {['all','dense','calm','balanced'].map(v=&gt;(\n          &lt;div key={v} onClick={()=&gt;setTweak('variant',v)} style={{display:'flex',alignItems:'center',gap:8,padding:'4px 0',cursor:'pointer'}}&gt;\n            &lt;div style={{width:14,height:14,borderRadius:3,border:`2px solid ${tweaks.variant===v?'#c8553d':'#ddd'}`,background:tweaks.variant===v?'#c8553d':'transparent'}}/&gt;\n            &lt;span style={{fontSize:12,color:'#555',textTransform:'capitalize'}}&gt;{v}&lt;/span&gt;\n          &lt;/div&gt;\n        ))}\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nfunction App() {\n  const [tweaks, setTweaksState] = React.useState(TWEAK_DEFAULTS);\n  const [tweaksVisible, setTweaksVisible] = React.useState(false);\n  const setTweak = (k,v) =&gt; { setTweaksState(p =&gt; { const n={...p,[k]:v}; window.parent.postMessage({type:'__edit_mode_set_keys',edits:n},'*'); return n; }); };\n  React.useEffect(()=&gt;{ const h=(e)=&gt;{ if(e.data?.type==='__activate_edit_mode') setTweaksVisible(true); if(e.data?.type==='__deactivate_edit_mode') setTweaksVisible(false); }; window.addEventListener('message',h); window.parent.postMessage({type:'__edit_mode_available'},'*'); return()=&gt;window.removeEventListener('message',h); },[]);\n  const CL = tweaks.accentColor !== '#c8553d' ? {...TL,accent:tweaks.accentColor,accentSoft:tweaks.accentColor+'18'} : TL;\n  const CD = tweaks.accentColor !== '#c8553d' ? {...TD,accent:tweaks.accentColor,accentSoft:tweaks.accentColor+'18'} : TD;\n  return (\n    &lt;&gt;\n    &lt;TweaksPanel tweaks={tweaks} setTweak={setTweak} visible={tweaksVisible}/&gt;\n    &lt;div className=&quot;canvas&quot;&gt;\n      &lt;h1&gt;Home Screen&lt;/h1&gt;\n      &lt;p className=&quot;h1-sub&quot;&gt;Dense Bloomberg variant. Smart workout prediction docked at bottom — one tap to start. Ticker strip shows weekly muscle deltas. Light + dark + draft state.&lt;/p&gt;\n      &lt;div className=&quot;grid&quot;&gt;\n        &lt;PhoneCard num=&quot;A1&quot; vibe=&quot;Light&quot;&gt;&lt;HomeDense C={CL} user={USER}/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;A2&quot; vibe=&quot;Dark&quot;&gt;&lt;HomeDense C={CD} user={USER}/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;A3&quot; vibe=&quot;Draft in progress&quot;&gt;&lt;HomeDense C={CL} user={USER_DRAFT}/&gt;&lt;/PhoneCard&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;/&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(&lt;App /&gt;);\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\" title=\"HOME SCREEN\"><\u002Fiframe>\n    <iframe id=\"screen-2\" class=\"screen-frame\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;en&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;UTF-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;title&gt;Pulse Pump — Workout Logging v2&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&amp;family=Space+Mono:wght@400;700&amp;family=DM+Mono:wght@400;500&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;script src=&quot;https://unpkg.com/react@18.3.1/umd/react.development.js&quot; integrity=&quot;sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;\n&lt;script src=&quot;https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js&quot; integrity=&quot;sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;\n&lt;script src=&quot;https://unpkg.com/@babel/standalone@7.29.0/babel.min.js&quot; integrity=&quot;sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;\n&lt;style&gt;\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body { background: #f3f1ec; min-height: 100vh; font-family: 'Archivo', system-ui; color: #1a1a1a; }\n  .canvas { padding: 60px 40px 120px; }\n  h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 56px; letter-spacing: -1.5px; line-height: 1; max-width: 1600px; margin: 0 auto 14px; }\n  .h1-sub { font-family: 'Archivo'; font-size: 16px; color: #666; max-width: 800px; margin: 0 auto 60px; line-height: 1.5; }\n  .section-label { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #c8553d; max-width: 1600px; margin: 60px auto 10px; font-weight: 700; }\n  .section-desc { font-family: 'Archivo'; font-size: 14px; color: #666; max-width: 800px; margin: 0 auto 32px; line-height: 1.5; }\n  .grid { display: grid; grid-template-columns: repeat(4, 360px); gap: 36px; max-width: 1600px; margin: 0 auto; }\n  .card { display: flex; flex-direction: column; gap: 12px; }\n  .card-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #777; }\n  .card-label .num { color: #c8553d; font-weight: 700; }\n  .card-label .vibe { color: #1a1a1a; font-weight: 600; margin-left: 6px; }\n  .card-desc { font-family: 'Archivo'; font-size: 11px; color: #777; line-height: 1.5; }\n  .frame { width: 360px; height: 760px; border-radius: 44px; padding: 4px; background: linear-gradient(135deg, #cbcac4, #b9b8b2); box-shadow: 0 30px 60px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.4); flex-shrink: 0; }\n  .screen { width: 100%; height: 100%; border-radius: 40px; overflow: hidden; position: relative; background: #fbf8f2; }\n\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div id=&quot;root&quot;&gt;&lt;/div&gt;\n&lt;script type=&quot;text/babel&quot; data-presets=&quot;react&quot;&gt;\n\nconst L = {\n  bg: '#fbf8f2',\n  surf: '#f4f0e6',\n  surf2: '#ece7d8',\n  surf3: '#e2dccd',\n  ink: '#1f1c19',\n  ink2: '#3a342d',\n  muted: 'rgba(31,28,25,0.5)',\n  faint: 'rgba(31,28,25,0.18)',\n  hair: 'rgba(31,28,25,0.08)',\n  hair2: 'rgba(31,28,25,0.14)',\n  accent: '#c8553d',\n  accentSoft: 'rgba(200,85,61,0.07)',\n  up: '#1f8f5a',\n  down: '#e51b1b',\n  warn: '#c98a17',\n  blue: '#2c6da3',\n  purple: '#7d4a8c',\n  tickerBg: '#1a1816',\n  tickerFg: '#ece5d6',\n  st: {\n    standard:  { bg: 'transparent',              fg: 'rgba(31,28,25,0.55)', label: 'STD' },\n    warmup:    { bg: 'rgba(180,140,60,0.12)',     fg: '#a17418',             label: 'WU' },\n    superset:  { bg: 'rgba(125,74,140,0.13)',     fg: '#7d4a8c',             label: 'SS' },\n    dropset:   { bg: 'rgba(200,85,61,0.13)',      fg: '#a8442f',             label: 'DROP' },\n    restpause: { bg: 'rgba(31,28,25,0.08)',        fg: '#3a342d',             label: 'RP' },\n    amrap:     { bg: 'rgba(44,109,163,0.10)',     fg: '#2c6da3',             label: 'AMRAP' },\n    failure:   { bg: 'rgba(229,27,27,0.10)',      fg: '#c0341a',             label: 'FAIL' },\n    unilateral:{ bg: 'rgba(44,109,163,0.12)',     fg: '#2c6da3',             label: 'L/R' },\n  }\n};\n\nconst StatusBar = ({ color = L.ink }) =&gt; (\n  &lt;div style={{ position:'absolute', top:18, left:0, right:0, height:20, padding:'0 28px', display:'flex', justifyContent:'space-between', alignItems:'center', zIndex:50, color, fontFamily:'-apple-system', fontWeight:600, fontSize:14 }}&gt;\n    &lt;span&gt;9:41&lt;/span&gt;\n    &lt;div style={{ width:120, height:32, borderRadius:18, background:'#000', position:'absolute', left:'50%', top:8, transform:'translateX(-50%)' }}/&gt;\n    &lt;div style={{ display:'flex', gap:5, fontSize:12 }}&gt;&lt;span&gt;●●●●&lt;/span&gt;&lt;span&gt;▭&lt;/span&gt;&lt;/div&gt;\n  &lt;/div&gt;\n);\n\n\n\nfunction Masthead({ restSecs=102, restTotal=150, onRestTap }) {\n  const m = Math.floor(restSecs/60), s = String(restSecs%60).padStart(2,'0');\n  const pct = restSecs/restTotal;\n  const running = restSecs &gt; 0;\n  return (\n    &lt;div style={{ position:'absolute', top:54, left:0, right:0, height:42, padding:'0 14px', display:'flex', alignItems:'center', justifyContent:'space-between', borderBottom:`1px solid ${L.hair}`, background:L.bg }}&gt;\n      &lt;div style={{ display:'flex', alignItems:'center', gap:8 }}&gt;\n        &lt;span style={{ fontSize:18, color:L.muted, fontWeight:300 }}&gt;‹&lt;/span&gt;\n        &lt;div&gt;\n          &lt;div style={{ fontFamily:'&quot;Space Mono&quot;,monospace', fontSize:9, color:L.muted, letterSpacing:1.2 }}&gt;SESSION&lt;/div&gt;\n          &lt;div style={{ fontFamily:'&quot;Archivo&quot;,sans-serif', fontSize:18, lineHeight:1, letterSpacing:0.8 }}&gt;PUSH · 24:18&lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div onClick={onRestTap} style={{ display:'flex', alignItems:'center', gap:8, background:running?L.ink:L.surf, color:running?L.tickerFg:L.muted, borderRadius:99, padding:'5px 6px 5px 12px', cursor:'pointer', border:running?'none':`1px solid ${L.hair2}` }}&gt;\n        &lt;div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', lineHeight:1 }}&gt;\n          &lt;span style={{ fontFamily:'&quot;Space Mono&quot;,monospace', fontSize:8, opacity:0.7, letterSpacing:1 }}&gt;REST&lt;/span&gt;\n          &lt;span style={{ fontFamily:'&quot;Archivo&quot;,sans-serif', fontSize:18, letterSpacing:1, marginTop:1 }}&gt;{running?`${m}:${s}`:'—:—'}&lt;/span&gt;\n        &lt;/div&gt;\n        &lt;div style={{ width:24, height:24, position:'relative' }}&gt;\n          &lt;svg width=&quot;24&quot; height=&quot;24&quot; viewBox=&quot;0 0 24 24&quot; style={{ transform:'rotate(-90deg)' }}&gt;\n            &lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot; fill=&quot;none&quot; stroke={running?'rgba(236,229,214,0.18)':L.hair2} strokeWidth=&quot;2&quot;/&gt;\n            {running &amp;&amp; &lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot; fill=&quot;none&quot; stroke={L.accent} strokeWidth=&quot;2.5&quot; strokeDasharray={2*Math.PI*9} strokeDashoffset={2*Math.PI*9*(1-pct)} strokeLinecap=&quot;round&quot;/&gt;}\n          &lt;/svg&gt;\n          {!running &amp;&amp; &lt;div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, color:L.muted }}&gt;›&lt;/div&gt;}\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nfunction SetTypeChip({ type='standard', onTap }) {\n  const cfg = L.st[type] || L.st.standard;\n  if (type === 'standard') {\n    return (\n      &lt;div onClick={onTap} style={{ width:24, height:18, borderRadius:4, border:`1px dashed ${L.faint}`, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', fontSize:9, color:L.faint }}&gt;+&lt;/div&gt;\n    );\n  }\n  return (\n    &lt;div onClick={onTap} style={{ height:18, padding:'0 5px', borderRadius:4, background:cfg.bg, color:cfg.fg, fontFamily:'&quot;Space Mono&quot;,monospace', fontSize:8, fontWeight:700, letterSpacing:0.6, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', whiteSpace:'nowrap' }}&gt;{cfg.label}&lt;/div&gt;\n  );\n}\n\nfunction computePlates(targetKg, barKg) {\n  const plates = [25,20,15,10,5,2.5,1.25];\n  const perSide = (targetKg - barKg) / 2;\n  if (perSide &lt;= 0) return { perSide:0, stack:[] };\n  let remaining = perSide;\n  const stack = [];\n  for (const p of plates) {\n    while (remaining &gt;= p - 0.001) { stack.push(p); remaining = +(remaining-p).toFixed(3); }\n  }\n  return { perSide, stack, remainder:remaining };\n}\n\nconst PLATE_COLORS = {\n  25:   { bg:'#e51b1b', fg:'#fff' },\n  20:   { bg:'#1f4ea3', fg:'#fff' },\n  15:   { bg:'#c98a17', fg:'#fff' },\n  10:   { bg:'#1f8f5a', fg:'#fff' },\n  5:    { bg:'#1f1c19', fg:'#f4f0e6' },\n  2.5:  { bg:'#a3a39a', fg:'#1f1c19' },\n  1.25: { bg:'#d6d2c4', fg:'#1f1c19' },\n};\n\nfunction PlateBar({ barKg=20, targetKg=100, compact=false }) {\n  const { stack } = computePlates(targetKg, barKg);\n  const sleeveLen = 80;\n  return (\n    &lt;div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:compact?50:64 }}&gt;\n      &lt;div style={{ display:'flex', alignItems:'center', justifyContent:'flex-end', width:sleeveLen, gap:1 }}&gt;\n        {[...stack].reverse().map((p,i) =&gt; {\n          const c = PLATE_COLORS[p];\n          const h = compact ? 28+Math.min(p,25)*0.7 : 32+Math.min(p,25)*0.9;\n          const w = p&gt;=20?9:p&gt;=10?7:p&gt;=5?6:5;\n          return &lt;div key={i} style={{ width:w, height:h, background:c.bg, border:'1px solid rgba(0,0,0,0.25)', borderRadius:1.5 }}/&gt;;\n        })}\n      &lt;/div&gt;\n      &lt;div style={{ position:'relative', width:60, display:'flex', flexDirection:'column', alignItems:'center' }}&gt;\n        &lt;div style={{ height:4, width:'100%', background:'#8a857c', borderTop:'1px solid #5a554d', borderBottom:'1px solid #5a554d' }}/&gt;\n      &lt;/div&gt;\n      &lt;div style={{ display:'flex', alignItems:'center', justifyContent:'flex-start', width:sleeveLen, gap:1 }}&gt;\n        {stack.map((p,i) =&gt; {\n          const c = PLATE_COLORS[p];\n          const h = compact ? 28+Math.min(p,25)*0.7 : 32+Math.min(p,25)*0.9;\n          const w = p&gt;=20?9:p&gt;=10?7:p&gt;=5?6:5;\n          return &lt;div key={i} style={{ width:w, height:h, background:c.bg, border:'1px solid rgba(0,0,0,0.25)', borderRadius:1.5 }}/&gt;;\n        })}\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nconst BAR_TYPES = [\n  { id:'barbell', name:'BARBELL', kg:20 },\n  { id:'olympic', name:'OLY 15',  kg:15 },\n  { id:'ez',      name:'EZ',      kg:7.5 },\n  { id:'trap',    name:'TRAP',    kg:25 },\n  { id:'safety',  name:'SAFETY',  kg:32 },\n];\n\nfunction PlateCalcPopover({ targetKg=100, barKg=20, onBarChange, onClose }) {\n  const { stack, remainder } = computePlates(targetKg, barKg);\n  return (\n    &lt;div style={{ background:L.surf, border:`1px solid ${L.hair2}`, borderRadius:12, padding:'10px 12px', boxShadow:'0 16px 40px rgba(0,0,0,0.18)', width:'100%' }}&gt;\n      &lt;div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:6 }}&gt;\n        &lt;div&gt;\n          &lt;div style={{ fontFamily:'&quot;Space Mono&quot;,monospace', fontSize:9, letterSpacing:1.2, color:L.muted }}&gt;PLATE CALCULATOR&lt;/div&gt;\n          &lt;div style={{ display:'flex', alignItems:'baseline', gap:6, marginTop:1 }}&gt;\n            &lt;span style={{ fontFamily:'&quot;Archivo&quot;,sans-serif', fontSize:30, lineHeight:0.9, letterSpacing:0.8 }}&gt;{targetKg}&lt;/span&gt;\n            &lt;span style={{ fontFamily:'&quot;Space Mono&quot;,monospace', fontSize:10, color:L.muted }}&gt;KG · BAR {barKg}&lt;/span&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n        &lt;div onClick={onClose} style={{ fontFamily:'&quot;Space Mono&quot;,monospace', fontSize:10, color:L.muted, cursor:'pointer', padding:'2px 6px' }}&gt;CLOSE&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;PlateBar barKg={barKg} targetKg={targetKg}/&gt;\n      &lt;div style={{ display:'flex', justifyContent:'center', gap:6, flexWrap:'wrap', marginTop:6 }}&gt;\n        {stack.length === 0\n          ? &lt;span style={{ fontFamily:'&quot;Space Mono&quot;,monospace', fontSize:10, color:L.muted }}&gt;BAR
