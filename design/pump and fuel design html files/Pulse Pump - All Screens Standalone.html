}:null);\n  const [plateBar, setPlateBar]   = React.useState(20);\n  const [setSheet, setSetSheet]   = React.useState(stage==='settype'?{ex:0,set:3}:null);\n  const [restModal, setRestModal] = React.useState(stage==='rest');\n\n  const exercises = EXERCISES_DATA;\n  const totalSets = exercises.reduce((a,e)=&gt;a+e.sets.length,0);\n  const doneSets  = exercises.reduce((a,e)=&gt;a+e.setsDone,0);\n\n  return (\n    &lt;div style={{ width:'100%', height:'100%', background:L.bg, color:L.ink, fontFamily:'&quot;Archivo&quot;,sans-serif', position:'relative', overflow:'hidden' }}&gt;\n      &lt;StatusBar/&gt;\n      &lt;Masthead onRestTap={() =&gt; setRestModal(true)}/&gt;\n      &lt;div style={{ position:'absolute', top:96, left:0, right:0 }}&gt;&lt;Ticker/&gt;&lt;/div&gt;\n      &lt;div style={{ position:'absolute', top:120, left:0, right:0, bottom:108, overflowY:'auto' }}&gt;\n        {exercises.map((ex,i) =&gt; (\n          &lt;ExerciseBlockB key={i} ex={ex} exIdx={i}\n            onSetTypeTap={(ei,si) =&gt; setSetSheet({ex:ei,set:si})}\n            onPlateTap={(ei,si) =&gt; setOpenPlate({ex:ei,set:si})}\n            openPlateFor={openPlate}\n            onClosePlate={() =&gt; setOpenPlate(null)}\n            plateBar={plateBar}\n            onPlateBarChange={setPlateBar}\n          /&gt;\n        ))}\n        &lt;div style={{ borderTop:`1px solid ${L.hair2}`, padding:'10px 14px' }}&gt;\n          &lt;div style={{ height:36, borderRadius:8, border:`1px dashed ${L.faint}`, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'&quot;Space Mono&quot;,monospace', fontSize:10, color:L.muted, letterSpacing:1 }}&gt;\n            &lt;span style={{ fontSize:14, marginRight:6 }}&gt;+&lt;/span&gt; ADD EXERCISE\n          &lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div style={{ position:'absolute', bottom:0, left:0, right:0, padding:'10px 12px 28px', background:L.bg, borderTop:`1px solid ${L.hair2}` }}&gt;\n        &lt;div style={{ position:'relative', height:46, borderRadius:11, overflow:'hidden', background:L.surf, border:`1px solid ${L.hair2}` }}&gt;\n          &lt;div style={{ position:'absolute', left:0, top:0, bottom:0, width:`${(doneSets/totalSets)*100}%`, background:L.accent }}/&gt;\n          &lt;div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 16px' }}&gt;\n            &lt;span style={{ fontFamily:'&quot;Archivo&quot;,sans-serif', fontSize:20, letterSpacing:1.5, color:doneSets/totalSets&gt;0.4?'#fff':L.ink }}&gt;FINISH WORKOUT&lt;/span&gt;\n            &lt;span style={{ fontFamily:'&quot;Space Mono&quot;,monospace', fontSize:10, fontWeight:700, color:doneSets/totalSets&gt;0.6?'rgba(255,255,255,0.85)':L.muted, letterSpacing:1 }}&gt;{totalSets-doneSets} SETS LEFT&lt;/span&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n      {setSheet &amp;&amp; &lt;SetTypeSheet current={exercises[setSheet.ex].sets[setSheet.set].type||'standard'} onPick={() =&gt; setSetSheet(null)} onClose={() =&gt; setSetSheet(null)}/&gt;}\n      {restModal &amp;&amp; &lt;RestTimerModal secs={102} total={150} onClose={() =&gt; setRestModal(false)}/&gt;}\n    &lt;/div&gt;\n  );\n}\n\nfunction Card({ num, vibe, desc, children }) {\n  return (\n    &lt;div className=&quot;card&quot;&gt;\n      &lt;div&gt;\n        &lt;div className=&quot;card-label&quot;&gt;&lt;span className=&quot;num&quot;&gt;{num}&lt;/span&gt;&lt;span className=&quot;vibe&quot;&gt;{vibe}&lt;/span&gt;&lt;/div&gt;\n        &lt;div className=&quot;card-desc&quot;&gt;{desc}&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div className=&quot;frame&quot;&gt;&lt;div className=&quot;screen&quot;&gt;{children}&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nfunction App() {\n  return (\n    &lt;div className=&quot;canvas&quot;&gt;\n      &lt;h1&gt;Workout Logger · Card Stack&lt;/h1&gt;\n      &lt;p className=&quot;h1-sub&quot;&gt;Card stack layout. Set-type chip on every row. RIR column. Persistent rest pill in masthead. Plate calc on active set only. Four states.&lt;/p&gt;\n\n      &lt;div className=&quot;section-label&quot;&gt;CARD STACK&lt;/div&gt;\n      &lt;p className=&quot;section-desc&quot;&gt;Each exercise in its own surface card. Plate calculator only accessible on the current active set.&lt;/p&gt;\n      &lt;div className=&quot;grid&quot;&gt;\n        &lt;Card num=&quot;A1&quot; vibe=&quot;Main&quot; desc=&quot;All open. Bench mid-set, note expanded under header, PR dot on set 3, unilateral sub-rows on Cable Fly set 2.&quot;&gt;&lt;StageA stage=&quot;main&quot;/&gt;&lt;/Card&gt;\n        &lt;Card num=&quot;A2&quot; vibe=&quot;Rest Modal&quot; desc=&quot;Tap rest pill → centered ring countdown, ±15/30/60s, default rest editor, skip CTA.&quot;&gt;&lt;StageA stage=&quot;rest&quot;/&gt;&lt;/Card&gt;\n        &lt;Card num=&quot;A3&quot; vibe=&quot;Set Type Sheet&quot; desc=&quot;Tap any set chip → 8 types: Std, Warmup, Superset, Dropset, Rest-Pause, AMRAP, Failure, Unilateral.&quot;&gt;&lt;StageA stage=&quot;settype&quot;/&gt;&lt;/Card&gt;\n        &lt;Card num=&quot;A4&quot; vibe=&quot;Plate Calc&quot; desc=&quot;Tap PLATES row under a barbell set → expands with color-coded stack visualizer, bar selector.&quot;&gt;&lt;StageA stage=&quot;plate&quot;/&gt;&lt;/Card&gt;\n      &lt;/div&gt;\n\n\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(&lt;App /&gt;);\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\" title=\"WORKOUT LOGGER\"><\u002Fiframe>\n    <iframe id=\"screen-3\" class=\"screen-frame\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;en&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;UTF-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;title&gt;Pulse Pump — Post-Workout Summary&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&amp;family=Space+Mono:wght@400;700&amp;family=DM+Mono:wght@400;500&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;script src=&quot;https://unpkg.com/react@18.3.1/umd/react.development.js&quot; integrity=&quot;sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;\n&lt;script src=&quot;https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js&quot; integrity=&quot;sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;\n&lt;script src=&quot;https://unpkg.com/@babel/standalone@7.29.0/babel.min.js&quot; integrity=&quot;sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;\n&lt;style&gt;\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body { background: #f0ece4; min-height: 100vh; font-family: 'Archivo', system-ui; color: #1a1a1a; }\n  .canvas { padding: 60px 40px 120px; }\n  h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 52px; letter-spacing: -1.5px; line-height: 1; max-width: 1400px; margin: 0 auto 12px; }\n  .h1-sub { font-family: 'Archivo'; font-size: 15px; color: #777; max-width: 700px; margin: 0 auto 56px; line-height: 1.5; }\n  .grid { display: flex; gap: 56px; max-width: 1400px; margin: 0 auto; align-items: flex-start; justify-content: center; }\n  .card { display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }\n  .card-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }\n  .card-label .num { color: #c8553d; font-weight: 700; }\n  .card-label .vibe { color: #1a1a1a; font-weight: 600; margin-left: 6px; }\n  .frame { width: 390px; height: 844px; border-radius: 48px; padding: 4px; background: linear-gradient(135deg, #cbcac4, #b9b8b2); box-shadow: 0 40px 80px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.4); flex-shrink: 0; }\n  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; position: relative; }\n  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }\n  .tk { display: inline-flex; gap: 32px; animation: ticker 38s linear infinite; white-space: nowrap; padding-left: 32px; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.6px; }\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div id=&quot;root&quot;&gt;&lt;/div&gt;\n&lt;script type=&quot;text/babel&quot; data-presets=&quot;react&quot;&gt;\n\n// ── Tokens ────────────────────────────────────────────────────\nconst T = {\n  light: {\n    bg:       '#fbf8f2',\n    surf:     '#f4f0e6',\n    surf2:    '#ece7d8',\n    ink:      '#1f1c19',\n    muted:    'rgba(31,28,25,0.5)',\n    faint:    'rgba(31,28,25,0.15)',\n    hair:     'rgba(31,28,25,0.08)',\n    hair2:    'rgba(31,28,25,0.14)',\n    inputBg:  '#f4f0e6',\n    accent:   '#c8553d',\n    down:     '#c0341a',\n    // share card — light cream, proper light mode\n    cardBg:   '#faf5ec',\n    cardBorder:'rgba(31,28,25,0.11)',\n    cardFg:   '#1f1c19',\n    cardMuted:'rgba(31,28,25,0.45)',\n    cardHair: 'rgba(31,28,25,0.09)',\n    cardUp:   '#1f8f5a',\n    cardPr:   '#c9892e',\n    // ticker always dark regardless of mode\n    tickerBg: '#1a1816',\n    tickerFg: '#ece5d6',\n  },\n  dark: {\n    bg:       '#1a1816',\n    surf:     '#252220',\n    surf2:    '#2e2a26',\n    ink:      '#ece5d6',\n    muted:    'rgba(236,229,214,0.5)',\n    faint:    'rgba(236,229,214,0.15)',\n    hair:     'rgba(236,229,214,0.08)',\n    hair2:    'rgba(236,229,214,0.14)',\n    inputBg:  '#252220',\n    accent:   '#dc7d4a',\n    down:     '#e05a45',\n    cardBg:   '#0e0c0a',\n    cardBorder:'rgba(255,255,255,0.06)',\n    cardFg:   '#ece5d6',\n    cardMuted:'rgba(236,229,214,0.45)',\n    cardHair: 'rgba(236,229,214,0.08)',\n    cardUp:   '#7fcf9f',\n    cardPr:   '#d4a03c',\n    tickerBg: '#0e0c0a',\n    tickerFg: '#ece5d6',\n  }\n};\n\n// ── Session data ──────────────────────────────────────────────\nconst SESSION = {\n  name:      'Push Day',\n  date:      'SAT 2 MAY 2026',\n  duration:  '58:42',\n  calories:  342,\n  sets:      28,\n  exercises: 6,\n  improved:  4,\n  prs:       2,\n  streak:    13,\n  volumeDelta: '+8.4%',\n  exercises_list: [\n    { name:'Bench Press',    sets:5, improved:true,  pr:true,  delta:'+5KG',   kg:'105×3' },\n    { name:'Overhead Press', sets:4, improved:true,  pr:false, delta:'+2KG',   kg:'72.5×4' },\n    { name:'Incline DB',     sets:3, improved:false, pr:false, delta:'—',      kg:'34×8' },\n    { name:'Cable Fly',      sets:4, improved:true,  pr:false, delta:'+5%',    kg:'18×12' },\n    { name:'Tricep PD',      sets:4, improved:true,  pr:false, delta:'+2.5KG', kg:'40×10' },\n    { name:'Lateral Raise',  sets:3, improved:false, pr:false, delta:'—',      kg:'12×12' },\n  ],\n  muscles: [\n    { id:'chest',     heat:0.95 },\n    { id:'shoulders', heat:0.78 },\n    { id:'triceps',   heat:0.80 },\n    { id:'core',      heat:0.18 },\n    { id:'back',      heat:0.06 },\n    { id:'quads',     heat:0.04 },\n  ]\n};\n\n// ── Sorting: PRs first → improved → unimproved ───────────────\nfunction sortedExercises(list) {\n  return [...list].sort((a, b) =&gt; {\n    const sa = a.pr ? 2 : a.improved ? 1 : 0;\n    const sb = b.pr ? 2 : b.improved ? 1 : 0;\n    return sb - sa;\n  });\n}\n\nconst MAX_IN_CARD = 6;\n\n// ── Thermal coloring ──────────────────────────────────────────\nfunction thermal(t) {\n  const stops = [[0,[240,236,226]],[0.2,[236,214,184]],[0.45,[226,170,124]],[0.7,[212,118,88]],[1.0,[192,72,60]]];\n  t = Math.max(0, Math.min(1, t));\n  for (let i=0;i&lt;stops.length-1;i++) {\n    const [a,ca]=stops[i],[b,cb]=stops[i+1];\n    if (t&lt;=b) { const k=(t-a)/(b-a); return `rgb(${Math.round(ca[0]+(cb[0]-ca[0])*k)},${Math.round(ca[1]+(cb[1]-ca[1])*k)},${Math.round(ca[2]+(cb[2]-ca[2])*k)})`; }\n  }\n  return 'rgb(192,72,60)';\n}\nfunction heatOf(id) { return thermal(SESSION.muscles.find(m=&gt;m.id===id)?.heat||0); }\n\n// ── Body silhouette ───────────────────────────────────────────\nfunction BodySilhouette({ size=76, showBack=false, C }) {\n  // strokes adapt to card theme\n  const stroke = C.cardHair;\n  const base   = 'rgba(128,110,90,0.07)';\n  const h = size * 480/200;\n  return (\n    &lt;svg viewBox=&quot;0 0 200 480&quot; width={size} height={h} style={{ display:'block' }}&gt;\n      &lt;g fill={base} stroke=&quot;none&quot;&gt;\n        &lt;ellipse cx=&quot;100&quot; cy=&quot;32&quot; rx=&quot;22&quot; ry=&quot;26&quot;/&gt;\n        &lt;rect x=&quot;90&quot; y=&quot;54&quot; width=&quot;20&quot; height=&quot;18&quot; rx=&quot;4&quot;/&gt;\n        &lt;path d=&quot;M60 76 Q54 130 56 200 Q58 260 68 310 L72 340 L128 340 L132 310 Q142 260 144 200 Q146 130 140 76Z&quot;/&gt;\n        &lt;path d=&quot;M60 76 Q46 86 40 108 Q34 140 36 180 Q38 220 48 240 L58 238 Q56 200 58 160 Q60 110 64 88Z&quot;/&gt;\n        &lt;path d=&quot;M140 76 Q154 86 160 108 Q166 140 164 180 Q162 220 152 240 L142 238 Q144 200 142 160 Q140 110 136 88Z&quot;/&gt;\n        &lt;path d=&quot;M48 240 Q40 268 36 300 L46 302 Q54 276 58 244Z&quot;/&gt;\n        &lt;path d=&quot;M152 240 Q160 268 164 300 L154 302 Q146 276 142 244Z&quot;/&gt;\n        &lt;path d=&quot;M72 340 Q66 390 64 440 L90 440 Q94 400 96 350Z&quot;/&gt;\n        &lt;path d=&quot;M128 340 Q134 390 136 440 L110 440 Q106 400 104 350Z&quot;/&gt;\n      &lt;/g&gt;\n      &lt;g stroke={stroke} strokeWidth=&quot;0.8&quot;&gt;\n        {!showBack ? (&lt;&gt;\n          &lt;path fill={heatOf('chest')}     d=&quot;M72 92 Q68 110 74 130 Q84 140 96 138 L96 94 Q84 88 72 92Z&quot;/&gt;\n          &lt;path fill={heatOf('chest')}     d=&quot;M128 92 Q132 110 126 130 Q116 140 104 138 L104 94 Q116 88 128 92Z&quot;/&gt;\n          &lt;path fill={heatOf('shoulders')} d=&quot;M56 80 Q46 90 42 108 Q50 114 62 112 Q66 96 64 84Z&quot;/&gt;\n          &lt;path fill={heatOf('shoulders')} d=&quot;M144 80 Q154 90 158 108 Q150 114 138 112 Q134 96 136 84Z&quot;/&gt;\n          &lt;path fill={heatOf('triceps')}   d=&quot;M42 112 Q38 140 44 168 Q52 168 60 160 Q62 136 60 114Z&quot;/&gt;\n          &lt;path fill={heatOf('triceps')}   d=&quot;M158 112 Q162 140 156 168 Q148 168 140 160 Q138 136 140 114Z&quot;/&gt;\n          &lt;g fill={heatOf('core')}&gt;\n            &lt;rect x=&quot;86&quot; y=&quot;144&quot; width=&quot;28&quot; height=&quot;14&quot; rx=&quot;3&quot;/&gt;\n            &lt;rect x=&quot;86&quot; y=&quot;162&quot; width=&quot;28&quot; height=&quot;14&quot; rx=&quot;3&quot;/&gt;\n            &lt;rect x=&quot;86&quot; y=&quot;180&quot; width=&quot;28&quot; height=&quot;14&quot; rx=&quot;3&quot;/&gt;\n          &lt;/g&gt;\n          &lt;path fill={heatOf('quads')} d=&quot;M70 340 Q64 380 66 420 L92 420 Q94 380 94 346Z&quot;/&gt;\n          &lt;path fill={heatOf('quads')} d=&quot;M130 340 Q136 380 134 420 L108 420 Q106 380 106 346Z&quot;/&gt;\n        &lt;/&gt;) : (&lt;&gt;\n          &lt;path fill={heatOf('back')}      d=&quot;M70 102 Q66 150 72 200 L100 210 L128 200 Q134 150 130 102 Q118 108 100 108 Q82 108 70 102Z&quot;/&gt;\n          &lt;path fill={heatOf('shoulders')} d=&quot;M56 80 Q46 90 42 108 Q50 114 62 112 Q66 96 64 84Z&quot;/&gt;\n          &lt;path fill={heatOf('shoulders')} d=&quot;M144 80 Q154 90 158 108 Q150 114 138 112 Q134 96 136 84Z&quot;/&gt;\n        &lt;/&gt;)}\n      &lt;/g&gt;\n    &lt;/svg&gt;\n  );\n}\n\n// ── Status bar ────────────────────────────────────────────────\nconst StatusBar = ({ dark=false }) =&gt; (\n  &lt;div style={{ height:50, display:'flex', alignItems:'flex-end', justifyContent:'center', paddingBottom:6, flexShrink:0 }}&gt;\n    &lt;div style={{ width:126, height:37, background: dark ? 'rgba(255,255,255,0.12)' n    &lt;div style={{ width:'100%', height:'100%', background:C.bg, display:'flex', flexDirection:'column', overflow:'hidden', fontFamily:'&quot;Archivo&quot;,sans-serif', color:C.ink }}&gt;\n      &lt;StatusBar dark={mode==='dark'}/&gt;\n\n      {/* Screen header */}\n      &lt;div style={{ padding:'2px 16px 10px', display:'flex', alignItems:'center', justifyContent:'space-between', borderBottom:`1px solid ${C.hair}` }}&gt;\n        &lt;div style={{ display:'flex', alignItems:'center', gap:8 }}&gt;\n          &lt;span style={{ fontSize:18, color:C.muted, fontWeight:300 }}&gt;‹&lt;/span&gt;\n          &lt;div&gt;\n            &lt;div style={{ fontFamily:'&quot;Space Mono&quot;,monospace', fontSize:9, color:C.muted, letterSpacing:1.2 }}&gt;WORKOUT COMPLETE&lt;/div&gt;\n            &lt;div style={{ fontFamily:'&quot;Archivo&quot;,sans-serif', fontSize:18, lineHeight:1, letterSpacing:0.8, color:C.ink }}&gt;PUSH DAY&lt;/div&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n        &lt;div style={{ fontFamily:'&quot;Space Mono&quot;,monospace', fontSize:10, color:C.muted, letterSpacing:0.8 }}&gt;SAT 2 MAY&lt;/div&gt;\n      &lt;/div&gt;\n\n      {/* Scrollable */}\n      &lt;div style={{ flex:1, overflowY:'auto' }}&gt;\n        &lt;ShareCard C={C}/&gt;\n        &lt;CaptionComposer C={C}/&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ── Wrapper ───────────────────────────────────────────────────\nfunction Card({ num, vibe, children }) {\n  return (\n    &lt;div className=&quot;card&quot;&gt;\n      &lt;div style={{ marginBottom:4 }}&gt;\n        &lt;div className=&quot;card-label&quot;&gt;&lt;span className=&quot;num&quot;&gt;{num}&lt;/span&gt;&lt;span className=&quot;vibe&quot;&gt;{vibe}&lt;/span&gt;&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div className=&quot;frame&quot;&gt;&lt;div className=&quot;screen&quot;&gt;{children}&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nfunction App() {\n  return (\n    &lt;div className=&quot;canvas&quot;&gt;\n      &lt;h1&gt;Post-Workout Summary&lt;/h1&gt;\n      &lt;p className=&quot;h1-sub&quot;&gt;Share card with Bloomberg ticker header. Best exercises sorted first. Instagram-style caption composer with friend tagging. Big POST pill + ··· menu for save/share.&lt;/p&gt;\n      &lt;div className=&quot;grid&quot;&gt;\n        &lt;Card num=&quot;A&quot; vibe=&quot;Light mode&quot;&gt;&lt;PostWorkoutScreen mode=&quot;light&quot;/&gt;&lt;/Card&gt;\n        &lt;Card num=&quot;B&quot; vibe=&quot;Dark mode&quot;&gt;&lt;PostWorkoutScreen mode=&quot;dark&quot;/&gt;&lt;/Card&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(&lt;App /&gt;);\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\" title=\"POST-WORKOUT SUMMARY\"><\u002Fiframe>\n    <iframe id=\"screen-4\" class=\"screen-frame\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;en&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;UTF-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;title&gt;Pulse Pump — Muscle Map · Ticker Studies&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&amp;family=Space+Mono:wght@400;700&amp;family=DM+Mono:wght@400;500&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;script src=&quot;https://unpkg.com/react@18.3.1/umd/react.development.js&quot; integrity=&quot;sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;\n&lt;script src=&quot;https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js&quot; integrity=&quot;sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;\n&lt;script src=&quot;https://unpkg.com/@babel/standalone@7.29.0/babel.min.js&quot; integrity=&quot;sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;\n&lt;style&gt;\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body { background: #f3f1ec; min-height: 100vh; font-family: 'Archivo', system-ui; color: #1a1a1a; }\n  .canvas { padding: 60px 40px 120px; }\n  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 60px; max-width: 1100px; margin: 0 auto; justify-items: center; }\n  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }\n  .card { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }\n  .label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #777; }\n  .label .num { color: #c8553d; font-weight: 700; }\n  .label .vibe { color: #1a1a1a; font-weight: 500; margin-left: 6px; }\n  .desc { font-family: 'Archivo'; font-size: 12px; color: #777; line-height: 1.5; max-width: 360px; }\n  .frame { width: 360px; height: 760px; border-radius: 44px; padding: 4px; background: linear-gradient(135deg, #cbcac4, #b9b8b2); box-shadow: 0 30px 60px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.4); flex-shrink: 0; }\n  .screen { width: 100%; height: 100%; border-radius: 40px; overflow: hidden; position: relative; }\n  h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 56px; letter-spacing: -1.5px; line-height: 1; max-width: 1100px; margin: 0 auto 14px; }\n  .h1-sub { font-family: 'Archivo'; font-size: 16px; color: #666; max-width: 800px; margin: 0 auto 60px; line-height: 1.5; }\n  @keyframes ticker {\n    from { transform: translateX(0); }\n    to { transform: translateX(-50%); }\n  }\n  .ticker-track { display: inline-flex; gap: 32px; animation: ticker 50s linear infinite; white-space: nowrap; }\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div id=&quot;root&quot;&gt;&lt;/div&gt;\n&lt;script type=&quot;text/babel&quot; data-presets=&quot;react&quot;&gt;\n\nconst WEEK = [\n  { d: 'M', date:13, kind:'Push',  total: 24, delta:+12.4, sets: { chest:8, shoulders:6, triceps:6, traps:2, core:2 } },\n  { d: 'T', date:14, kind:'Rest',  total: 0,  delta: 0,    sets: {} },\n  { d: 'W', date:15, kind:'Pull',  total: 26, delta:+8.1,  sets: { back:10, biceps:6, traps:4, forearms:0, core:2, hams:4 } },\n  { d: 'T', date:16, kind:'Rest',  total: 0,  delta: 0,    sets: {} },\n  { d: 'F', date:17, kind:'Legs',  total: 32, delta:+15.7, sets: { quads:10, glutes:8, hams:4, calves:4, core:2, shoulders:4 } },\n  { d: 'S', date:18, kind:'Cond.', total: 12, delta:-4.2,  sets: { core:6, shoulders:2, calves:2, glutes:2 } },\n  { d: 'S', date:19, kind:'—',     total: 0,  delta: 0,    sets: {} },\n];\n\nconst TARGETS = { chest:16, shoulders:14, triceps:10, back:18, traps:8, biceps:10, quads:16, glutes:14, hams:12, calves:8, core:10, forearms:6 };\n\nfunction weekTotals() {\n  const t = {};\n  for (const d of WEEK) for (const k in d.sets) t[k] = (t[k]||0) + d.sets[k];\n  return t;\n}\n\nfunction dayHeat(idx) {\n  const d = WEEK[idx];\n  const map = {};\n  const max = Math.max(...Object.values(d.sets), 1);\n  for (const k in d.sets) map[k] = Math.min(1, d.sets[k] / max);\n  return map;\n}\n\nfunction weekHeat() {\n  const tot = weekTotals();\n  const map = {};\n  for (const k in TARGETS) {\n    const sets = tot[k] || 0;\n    map[k] = Math.min(1, sets / TARGETS[k]);\n  }\n  return map;\n}\n\nfunction thermal(t) {\n  const stops = [\n    [0.00, [240, 236, 226]],\n    [0.20, [236, 214, 184]],\n    [0.45, [226, 170, 124]],\n    [0.70, [212, 118, 88]],\n    [1.00, [192, 72, 60]],\n  ];\n  t = Math.max(0, Math.min(1, t));\n  for (let i=0;i&lt;stops.length-1;i++) {\n    const [a,ca]=stops[i],[b,cb]=stops[i+1];\n    if (t&lt;=b) {\n      const k=(t-a)/(b-a);\n      return `rgb(${Math.round(ca[0]+(cb[0]-ca[0])*k)},${Math.round(ca[1]+(cb[1]-ca[1])*k)},${Math.round(ca[2]+(cb[2]-ca[2])*k)})`;\n    }\n  }\n  return `rgb(192,72,60)`;\n}\n\nfunction thermalDark(t) {\n  const stops = [\n    [0.00, [40, 38, 34]],\n    [0.20, [80, 60, 50]],\n    [0.45, [148, 96, 64]],\n    [0.70, [220, 130, 70]],\n    [1.00, [248, 100, 80]],\n  ];\n  t = Math.max(0, Math.min(1, t));\n  for (let i=0;i&lt;stops.length-1;i++) {\n    const [a,ca]=stops[i],[b,cb]=stops[i+1];\n    if (t&lt;=b) {\n      const k=(t-a)/(b-a);\n      return `rgb(${Math.round(ca[0]+(cb[0]-ca[0])*k)},${Math.round(ca[1]+(cb[1]-ca[1])*k)},${Math.round(ca[2]+(cb[2]-ca[2])*k)})`;\n    }\n  }\n  return `rgb(248,100,80)`;\n}\n\nfunction BodyMap({ heat, thermalFn, stroke, baseFill, strokeW = 1 }) {\n  const c = (id) =&gt; heat[id] !== undefined ? thermalFn(heat[id]) : baseFill;\n  return (\n    &lt;svg viewBox=&quot;0 0 200 320&quot; width=&quot;100%&quot; height=&quot;100%&quot; style={{ display: 'block' }}&gt;\n      &lt;circle cx=&quot;100&quot; cy=&quot;22&quot; r=&quot;14&quot; fill={baseFill} stroke={stroke} strokeWidth={strokeW}/&gt;\n      &lt;rect x=&quot;94&quot; y=&quot;34&quot; width=&quot;12&quot; height=&quot;10&quot; fill={baseFill} stroke={stroke} strokeWidth={strokeW}/&gt;\n      &lt;path d=&quot;M75 46 L100 42 L125 46 L120 56 L100 52 L80 56 Z&quot; fill={c('traps')} stroke={stroke} strokeWidth={strokeW}/&gt;\n      &lt;path d=&quot;M70 56 Q100 48 130 56 L132 96 Q100 102 68 96 Z&quot; fill={c('chest')} stroke={stroke} strokeWidth={strokeW}/&gt;\n      &lt;path d=&quot;M55 60 Q48 70 50 90 L66 92 Q70 76 70 56 Z&quot; fill={c('shoulders')} stroke={stroke} strokeWidth={strokeW}/&gt;\n      &lt;path d=&quot;M145 60 Q152 70 150 90 L134 92 Q130 76 130 56 Z&quot; fill={c('shoulders')} stroke={stroke} strokeWidth={strokeW}/&gt;\n      &lt;path d=&quot;M40 90 Q34 110 36 130 L52 130 Q54 110 50 90 Z&quot; fill={c('biceps')} stroke={stroke} strokeWidth={strokeW}/&gt;\n      &lt;path d=&quot;M160 90 Q166 110 164 130 L148 130 Q146 110 150 90 Z&quot; fill={c('bicep ─────────────────────\nconst StatusBar=({dark=false})=&gt;(\n  &lt;div style={{height:50,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:6,flexShrink:0}}&gt;\n    &lt;div style={{width:126,height:37,background:dark?'rgba(255,255,255,0.1)':'#000',borderRadius:24}}/&gt;\n  &lt;/div&gt;\n);\n\n// ── Tab bar ───────────────────────────────────────────────────\nfunction TabBar({C}) {\n  const dark=C===TD;\n  const muted=dark?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.35)';\n  const bg=dark?'rgba(26,24,22,0.94)':'rgba(251,248,242,0.94)';\n  const bord=dark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';\n  const tabs=[{k:'Programs'},{k:'Social',active:true},{k:'Home',center:true},{k:'Body'},{k:'More'}];\n  const ICON=(k,col)=&gt;{const s={width:22,height:22,fill:'none',stroke:col,strokeWidth:1.6,strokeLinecap:'round',strokeLinejoin:'round'};\n    if(k==='Programs')return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;5&quot; width=&quot;16&quot; height=&quot;14&quot; rx=&quot;2&quot;/&gt;&lt;path d=&quot;M8 9h8M8 13h8M8 17h5&quot;/&gt;&lt;/svg&gt;;\n    if(k==='Social')  return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;9&quot; cy=&quot;9&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;17&quot; cy=&quot;11&quot; r=&quot;2.5&quot;/&gt;&lt;path d=&quot;M3 19c.5-3 3-5 6-5s5.5 2 6 5M14 19c.4-2 1.7-3.5 4-3.5s3.6 1.5 4 3.5&quot;/&gt;&lt;/svg&gt;;\n    if(k==='Body')    return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;5&quot; r=&quot;2.2&quot;/&gt;&lt;path d=&quot;M8 11l4-3 4 3M12 8v6M9 14l-2 6M15 14l2 6&quot;/&gt;&lt;/svg&gt;;\n    if(k==='More')    return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;6&quot; cy=&quot;12&quot; r=&quot;1.4&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;1.4&quot;/&gt;&lt;circle cx=&quot;18&quot; cy=&quot;12&quot; r=&quot;1.4&quot;/&gt;&lt;/svg&gt;;\n    return null;\n  };\n  return(\n    &lt;div style={{position:'absolute',bottom:0,left:0,right:0,background:bg,backdropFilter:'blur(16px)',borderTop:`0.5px solid ${bord}`,display:'flex',alignItems:'center',padding:'8px 0 28px',zIndex:50}}&gt;\n      {tabs.map((t,i)=&gt;{\n        const col=t.active?C.ink:muted;\n        return(\n          &lt;div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}&gt;\n            {t.center\n              ?&lt;div style={{width:46,height:46,borderRadius:15,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',marginTop:-12,boxShadow:`0 8px 16px ${C.accent}44`}}&gt;\n                &lt;svg width=&quot;22&quot; height=&quot;22&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M3.5 12L12 4M12 4L20.5 12M6 13.5v7M18 13.5v7M6 20.5h12M10.5 20.5v-4.5h3v4.5&quot; stroke=&quot;#fff&quot; strokeWidth=&quot;1.8&quot; strokeLinecap=&quot;round&quot; strokeLinejoin=&quot;round&quot;/&gt;&lt;/svg&gt;\n              &lt;/div&gt;\n              :ICON(t.k,col)}\n            &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:10,fontWeight:t.active?600:500,color:t.center?C.accent:col}}&gt;{t.k}&lt;/span&gt;\n          &lt;/div&gt;\n        );\n      })}\n    &lt;/div&gt;\n  );\n}\n\n// ── Avatar ────────────────────────────────────────────────────\nfunction Avatar({name,size=36,C}) {\n  return(\n    &lt;div style={{width:size,height:size,borderRadius:'50%',background:C.surf2,border:`1px solid ${C.hair2}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}&gt;\n      &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:size*0.42,color:C.muted}}&gt;{name[0]}&lt;/span&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ── Music chip ────────────────────────────────────────────────\nfunction MusicChip({ song, artist, muted: isMuted, onToggle, C }) {\n  const dark = C===TD;\n  return (\n    &lt;div onClick={onToggle} style={{display:'flex',alignItems:'center',gap:8,  Hold-to-react picker ─────────────────────────────────────\nconst REACTS = ['❤️','💪','🔥','👊','🏆','😤'];\n\nfunction ReactPicker({ onPick, onClose, C }) {\n  return (\n    &lt;div style={{position:'absolute',bottom:56,left:10,zIndex:200,animation:'reactPop 0.2s ease-out'}}&gt;\n      &lt;div style={{display:'flex',alignItems:'center',gap:4,background:C.bg,border:`1px solid ${C.hair2}`,borderRadius:999,padding:'6px 10px',boxShadow:'0 8px 32px rgba(0,0,0,0.22)'}}&gt;\n        {REACTS.map((r,i)=&gt;(\n          &lt;div key={i} onClick={()=&gt;{onPick(r);onClose();}} style={{width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,cursor:'pointer',borderRadius:'50%',transition:'transform 0.1s'}}\n            onMouseEnter={e=&gt;e.currentTarget.style.transform='scale(1.3)'}\n            onMouseLeave={e=&gt;e.currentTarget.style.transform='scale(1)'}&gt;\n            {r}\n          &lt;/div&gt;\n        ))}\n      &lt;/div&gt;\n      {/* Tail */}\n      &lt;div style={{width:0,height:0,borderLeft:'6px solid transparent',borderRight:'6px solid transparent',borderTop:`6px solid ${C.bg}`,marginLeft:20,marginTop:-1}}/&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ── Reaction row ─────────────────────────────────────────────\nfunction ReactRow({ post, C, onComment, themed=false }) {\n  const [react, setReact]         = React.useState(null);\n  const [showPicker, setShowPicker] = React.useState(false);\n  const holdTimer = React.useRef(null);\n\n  const startHold = () =&gt; { holdTimer.current = setTimeout(()=&gt;setShowPicker(true), 400); };\n  const endHold   = () =&gt; { clearTimeout(holdTimer.current); };\n  const tapLike   = () =&gt; { if(showPicker) return; setReact(r =&gt; r ? null : '❤️'); };\n\n  const btn=(active,col)=&gt;({display:'flex',alignItems:'center',gap:6,padding:'7px 14px',borderRadius:8,border:`1px solid ${active?col:(themed?'rgba(255,255,255,0.2)':C.hair2)}`,background:active?col+'1a':(themed?'rgba(255,255,255,0.08)':'transparent'),cursor:'pointer',position:'relative'});\n\n  return (\n    &lt;div style={{display:'flex',alignItems:'center',gap:8,position:'relative'}}&gt;\n      {showPicker &amp;&amp; &lt;ReactPicker onPick={r=&gt;setReact(r)} onClose={()=&gt;setShowPicker(false)} C={C}/&gt;}\n      {/* Like / hold to react */}\n      &lt;div onMouseDown={startHold} onMouseUp={endHold} onMouseLeave={endHold}\n           onTouchStart={startHold} onTouchEnd={endHold}\n           onClick={tapLike}\n           style={btn(!!react, C.accent)}&gt;\n        {react\n          ? &lt;span style={{fontSize:16,lineHeight:1}}&gt;{react}&lt;/span&gt;\n          : &lt;svg width=&quot;14&quot; height=&quot;14&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke={C.muted} strokeWidth=&quot;2&quot; strokeLinecap=&quot;round&quot; strokeLinejoin=&quot;round&quot;&gt;&lt;path d=&quot;M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z&quot;/&gt;&lt;/svg&gt;}\n        &lt;span style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:12,color:react?C.accent:(themed?'rgba(255,255,255,0.7)':C.muted),fontWeight:700}}&gt;{post.likes+(react?1:0)}&lt;/span&gt;\n        &lt;span style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:8,color:themed?'rgba(255,255,255,0.3)':C.faint,letterSpacing:0.5}}&gt;HOLD&lt;/span&gt;\n      &lt;/div&gt;\n      {/* Comment — opens modal */}\n      &lt;div onClick={onComment} style={btn(false,C.muted)}&gt;\n        &lt;svg width=&quot;14&quot; height=&quot;14&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke={themed?'rgba(255,255,255,0.6)':C.muted} strokeWidth=&quot;2&quot; strokeLinecap=&quot;round&quot; strokeLinejoin=&quot;round&quot;&gt;&lt;path d=&quot;M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z&quot;/&gt;&lt;/svg&gt;\n        &lt;span style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:12,color:themed?'rgba(255,255,255,0.7)':C.muted,fontWeight:700}}&gt;{post.comments}&lt;/span&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ── Comments modal ────────────────────────────────────────────\nfunction CommentsModal({ post, C, onClose }) {\n  const dark = C===TD;\n  const comments = [\n    {user:'Marcus', text:'That bench! Been watching this number creep up for weeks.', time:'2h'},\n    {user:'Priya',  text:'Form check vid next time?', time:'3h'},\n    {user:'Alex',   text:'105 is insane. What program are you running?', time:'5h'},\n    {user:'Sam',    text:'Been on a similar trajectory. Keep going!', time:'6h'},\n    {user:'Dom',    text:'That OHP PR too 👏', time:'8h'},\n    {user:'Jay',    text:'Appreciate it everyone 🙏 Running a PPL 3x/week', time:'Yesterday'},\n  ];\n  return (\n    &lt;div style={{position:'absolute',inset:0,zIndex:300,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}&gt;\n      {/* Backdrop */}\n      &lt;div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.45)',backdropFilter:'blur(4px)'}}/&gt;\n      {/* Sheet */}\n      &lt;div style={{position:'relative',background:C.bg,borderRadius:'20px 20px 0 0',height:'72%',display:'flex',flexDirection:'column',border:`1px solid ${C.hair2}`,animation:'slideUp 0.28s ease-out'}}&gt;\n        {/* Handle */}\n        &lt;div style={{padding:'10px 0 6px',display:'flex',justifyContent:'center'}}&gt;\n          &lt;div style={{width:36,height:4,borderRadius:2,background:C.faint}}/&gt;\n        &lt;/div&gt;\n        {/* Header */}\n        &lt;div style={{padding:'0 16px 10px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:`1px solid ${C.hair}`}}&gt;\n          &lt;span style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:10,fontWeight:700,letterSpacing:1.2,color:C.muted}}&gt;COMMENTS&lt;/span&gt;\n          &lt;div onClick={onClose} style={{fontSize:18,color:C.muted,cursor:'pointer',lineHeight:1}}&gt;×&lt;/div&gt;\n        &lt;/div&gt;\n        {/* Scrollabl          {item.sub&amp;&amp;&lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:9,color:C.muted,marginTop:1,letterSpacing:0.5}}&gt;{item.sub}&lt;/div&gt;}\n              &lt;/div&gt;\n            &lt;/div&gt;\n          ))}\n        &lt;/div&gt;\n      )}\n\n      {/* Stolen toast */}\n      {stolen &amp;&amp; (\n        &lt;div style={{position:'absolute',top:14,left:'50%',transform:'translateX(-50%)',zIndex:300,background:C.accent,borderRadius:999,padding:'8px 18px',display:'flex',alignItems:'center',gap:8,boxShadow:'0 6px 20px rgba(0,0,0,0.22)',whiteSpace:'nowrap',animation:'reactPop 0.2s ease-out'}}&gt;\n          &lt;svg width=&quot;14&quot; height=&quot;14&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;#fff&quot; strokeWidth=&quot;2.5&quot; strokeLinecap=&quot;round&quot; strokeLinejoin=&quot;round&quot;&gt;&lt;path d=&quot;M4 19.5A2.5 2.5 0 016.5 17H20&quot;/&gt;&lt;path d=&quot;M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z&quot;/&gt;&lt;/svg&gt;\n          &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:16,letterSpacing:1,color:'#fff'}}&gt;SAVED TO PROGRAMS&lt;/span&gt;\n        &lt;/div&gt;\n      )}\n      {/* Swipeable carousel: Photo (if any) → Body Map → Workout summary */}\n      &lt;PostCarousel post={post} C={C} dark={dark} onTap={onTap}/&gt;\n\n      {/* Stats strip */}\n      &lt;div style={{display:'flex',borderTop:`1px solid ${C.hair}`,borderBottom:`1px solid ${C.hair}`}}&gt;\n        {[['SETS',post.sets],['KCAL',post.kcal],['DURATION',post.duration]].map(([l,v],i)=&gt;(\n          &lt;div key={i} style={{flex:1,padding:'8px 0',textAlign:'center',borderRight:i&lt;2?`1px solid ${C.hair}`:'none'}}&gt;\n            &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:8,color:C.muted,letterSpacing:1.1}}&gt;{l}&lt;/div&gt;\n            &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:18,color:C.ink,lineHeight:1}}&gt;{v}&lt;/div&gt;\n          &lt;/div&gt;\n        ))}\n      &lt;/div&gt;\n\n      {/* Music chip + caption */}\n      &lt;div style={{padding:'10px 14px',borderBottom:`1px solid ${C.hair}`,display:'flex',flexDirection:'column',gap:8}}&gt;\n        &lt;MusicChip song={post.song} artist={post.artist} muted={muted} onToggle={()=&gt;setMuted(m=&gt;!m)} C={C}/&gt;\n        {post.caption&amp;&amp;(\n          &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:13,color:C.ink,lineHeight:1.45}}&gt;\n            &lt;span style={{fontWeight:700}}&gt;{post.user} &lt;/span&gt;{post.caption}\n          &lt;/span&gt;\n        )}\n      &lt;/div&gt;\n\n      {/* Reactions */}\n      &lt;div style={{padding:'10px 14px 14px'}}&gt;\n        &lt;ReactRow post={post} C={C} onComment={onComment} themed={false}/&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ── Exercise detail — body map + swipeable sets ───────────────\nfunction ExerciseDetailSheet({ exercise, C, onClose }) {\n  const [tab, setTab] = React.useState('map');\n  const dark = C===TD;\n  // Build heat map focused on this exercise's primary muscle\n  const focusHeat = {};\n  if (exercise.primary) focusHeat[exercise.primary] = 1.0;\n\n  const typeColors={WU:'rgba(180,140,60,0.13)',STD:'transparent',DROP:'rgba(200,85,61,0.10)',AMRAP:'rgba(44,109,163,0.10)'};\n  const typeFg={WU:'#a17418',STD:C.muted,DROP:'#a8442f',AMRAP:'#2c6da3'};\n\n  return (\n    &lt;div style={{position:'absolute',inset:0,zIndex:250,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}&gt;\n      &lt;div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.5)',backdropFilter:'blur(4px)'}}/&gt;\n      &lt;div style={{position:'relative',background:C.bg,borderRadius:'20px 20px 0 0',height:'65%',display:'flex',flexDirection:'column',animation:'slideUp 0.25s ease-out'}}&gt;\n        &lt;div style={{padding:'10px 0 6px',display:'flex',justifyContent:'center'}}&gt;\n          &lt;div style={{width:36,height:4,borderRadius:2,background:C.faint}}/&gt;\n        &lt;/div&gt;\n        &lt;div style={{padding:'0 16px 10px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:`1px solid ${C.hair}`}}&gt;\n          &lt;div&gt;\n            &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:20,color:C.ink,letterSpacing:0.5}}&gt;{exercise.name}&lt;/div&gt;\n            {exercise.pr&amp;&amp;&lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:9,color:C.pr,fontWeight:700,marginTop:1}}&gt;★ NEW PR · {exercise.delta}&lt;/div&gt;}\n            {!exercise.pr&amp;&amp;exercise.delta!=='—'&amp;&amp;&lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:9,color:C.up,fontWeight:700,marginTop:1}}&gt;▲ {exercise.delta}&lt;/div&gt;}\n          &lt;/div&gt;\n          &lt;div onClick={onClose} style={{fontSize:20,color:C.muted,cursor:'pointer'}}&gt;×&lt;/div&gt;\n        &lt;/div&gt;\n        {/* Tabs: MAP / SETS */}\n        &lt;div style={{display:'flex',borderBottom:`1px solid ${C.hair}`,padding:'0 16px'}}&gt;\n          {['map','sets'].map(t=&gt;(\n            &lt;div key={t} onClick={()=&gt;setTab(t)} style={{padding:'8px 16px',fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:10,fontWeight:700,letterSpacing:1,textTransform:'uppercase',color:tab===t?C.ink:C.muted,borderBottom:tab===t?`2px solid ${C.accent}`:'2px solid transparent',marginBottom:-1,cursor:'pointer'}}&gt;\n              {t==='map'?'BODY MAP':'SETS'}\n            &lt;/div&gt;\n          ))}\n        &lt;/div&gt;\n        &lt;div style={{flex:1,overflowY:'auto'}}&gt;\n          {tab==='map' ? (\n            &lt;div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'24px 0 16px',background:dark?'#111':'#f0ece4',gap:10}}&gt;\n              &lt;Body3D heat={focusHeat} size={140} interactive={true} dark={dark}/&gt;\n              &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:8,color:C.faint,letterSpacing:1}}&gt;DRAG TO ROTATE&lt;/div&gt;\n              &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:10,color:C.muted,letterSpacing:1,textTransform:'uppercase',marginTop:4}}&gt;{exercise.primary} — primary&lt;/div&gt;\n            &lt;/div&gt;\n          ) : (\n            &lt;div&gt;\n              &lt;div style={{display:'grid',gridTemplateColumns:'40px 1fr 1fr 32px',padding:'5px 16px',fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:8,letterSpacing:1.1,color:C.muted,background:C.surf,borderBottom:`1px solid ${C.hair}`}}&gt;\n                &lt;span&gt;TYPE&lt;/span&gt;&lt;span style={{textAlign:'center'}}&gt;KG&lt;/span&gt;&lt;span style={{textAlign:'center'}}&gt;REPS&lt;/span&gt;&lt;span style={{textAlign:'right'}}&gt;✓&lt;/span&gt;\n              &lt;/div&gt;\n              {exercise.sets.map((s,si)=&gt;(\n                &lt;div key={si} style={{display:'grid',gridTemplateColumns:'40px 1fr 1fr 32px',alignItems:'center',padding:'10px 16px',borderBottom:`1px solid ${C.hair}`,background:typeColors[s.type]||'transparent'}}&gt;\n                  &lt;span style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:8,fontWeight:700,color:typeFg[s.type]||C.muted,background:typeColors[s.type]||C.surf2,padding:'2px 5px',borderRadius:3,width:'fit-content'}}&gt;{s.type}&lt;/span&gt;\n                  &lt;div style={{textAlign:'center',display:'flex',alignItems:'center',justifyContent:'center',gap:4}}&gt;\n                    &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:22,color:C.ink,letterSpacing:0.5}}&gt;{s.kg}&lt;/span&gt;\n                    {s.pr&amp;&amp;&lt;span style={{width:6,height:6,borderRadius:'50%',background:C.pr,display:'inline-block'}}/&gt;}\n                  &lt;/div&gt;\n                  &lt;div style={{textAlign:'center'}}&gt;&lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:22,color:C.ink,letterSpacing:0.5}}&gt;{s.reps}&lt;/span&gt;&lt;/div&gt;\n                  &lt;div style={{textAlign:'right'}}&gt;&lt;span style={{color:C.up,fontSize:14,fontWeight:700}}&gt;✓&lt;/span&gt;&lt;/div&gt;\n                &lt;/div&gt;\n              ))}\n            &lt;/div&gt;\n          )}\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ── Post detail screen ────────────────────────────────────────\nfunction PostDetailScreen({ C, post, onBack }) {\n  const [commentsOpen, setCommentsOpen] = React.useState(false);\n  const [selectedEx, setSelectedEx]     = React.useState(null);\n  const [muted, setMuted] = React.useState(true);\n  const dark = C===TD;\n  return (\n    &lt;div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',color:C.ink}}&gt;\n      &lt;StatusBar dark={dark}/&gt;\n      &lt;div style={{padding:'2px 16px 10px',display:'flex',alignItems:'center',gap:10,borderBottom:`1px solid ${C.hair}`}}&gt;\n        &lt;div onClick={onBack} style={{cursor:'pointer',fontSize:20,color:C.muted,lineHeight:1}}&gt;‹&lt;/div&gt;\n        &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:15,fontWeight:600,color:C.ink}}&gt;Workout&lt;/span&gt;\n      &lt;/div&gt;\n      &lt;div style={{flex:1,overflowY:'auto',paddingBottom:30}}&gt;\n        {/* Author */}\n        &lt;div style={{padding:'12px 16px',display:'flex',alignItems:'center',gap:10}}&gt;\n          &lt;Avatar name={post.user} C={C} size={42}/&gt;\n          &lt;div&gt;\n            &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:15,fontWeight:700,color:C.ink}}&gt;{post.user}&lt;/div&gt;\n            &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:9,color:C.muted}}&gt;{post.handle} · {post.time}&lt;/div&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n        {/* Large interactive silhouette */}\n        &lt;div style={{background:dark?'#111':'#f0ece4',borderTop:`1px solid ${C.hair}`,borderBottom:`1px solid ${C.hair}`,padding:'28px 0 18px',display:'flex',flexDirection:'column',alignItems:'center',gap:10,position:'relative'}}&gt;\n          &lt;div style={{position:'absolute',inset:0,background:dark?'radial-gradient(ellipse at 50% 55%, rgba(220,125,74,0.10) 0%, transparent 65%)':'radial-gradient(ellipse at 50% 55%, rgba(200,85,61,0.07) 0%, transparent 65%)'}}/&gt;\n          &lt;Body3D heat={post.heat} size={180} interactive={true} dark={dark}/&gt;\n          &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:8,color:C.faint,letterSpacing:1.2}}&gt;DRAG TO ROTATE&lt;/div&gt;\n          &lt;div style={{display:'flex',alignItems:'center',gap:8}}&gt;\n            &lt;span style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:8,color:C.muted}}&gt;COLD&lt;/span&gt;\n            &lt;div style={{width:72,height:4,borderRadius:2,background:'linear-gradient(90deg, rgb(240,236,226), rgb(212,118,88), rgb(192,72,60))'}}/&gt;\n            &lt;span style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:8,color:C.muted}}&gt;HOT&lt;/span&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n        {/* Session headline */}\n        &lt;div style={{padding:'14px 16px',borderBottom:`1px solid ${C.hair}`,display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}&gt;\n          &lt;div&gt;\n            &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:9,color:C.muted,letterSpacing:1.2,marginBottom:3}}&gt;{post.time.toUpperCase()}&lt;/div&gt;\n            &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:36,color:C.ink,letterSpacing:0.5,lineHeight:0.9}}&gt;{post.workout}&lt;/div&gt;\n          &lt;/div&gt;\n          &lt;div style={{textAlign:'right'}}&gt;\n            &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:8,color:C.muted,letterSpacing:1}}&gt;DURATION&lt;/div&gt;\n            &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:28,color:C.ink,letterSpacing:0.5}}&gt;{post.duration}&lt;/div&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n        {/* Key stats */}\n        &lt;div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',borderBottom:`1px solid ${C.hair}`}}&gt;\n          {[['IMPROVED',`${post.improved}/${post.total}`,C.up],['SETS',post.sets,C.ink],['KCAL',post.kcal,C.ink],['VOL',post.volumeDelta,C.up]].map(([l,v,col],i)=&gt;(\n            &lt;div key={i} style={{padding:'10px 0',textAlign:'center',borderRight:i&lt;3?`1px solid ${C.hair}`:'none'}}&gt;\n              &lt;div style={{fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:8,color:C.muted,letterSpacing:1.1,marginBottom:3}}&gt;{l}&lt;/div&gt;\n              &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,ontSize:22,color:col,lineHeight:0.9}}&gt;{v}&lt;/div&gt;\n            &lt;/div&gt;\n          ))}\n        &lt;/div&gt;\n        {/* Music + caption */}\n        &lt;div style={{padding:'10px 16px',borderBottom:`1px solid ${C.hair}`,display:'flex',flexDirection:'column',gap:8}}&gt;\n          &lt;MusicChip song={post.song} artist={post.artist} muted={muted} onToggle={()=&gt;setMuted(m=&gt;!m)} C={C}/&gt;\n          {post.caption&amp;&amp;&lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:14,color:C.ink,lineHeight:1.5}}&gt;&lt;span style={{fontWeight:700}}&gt;{post.user} &lt;/span&gt;{post.caption}&lt;/span&gt;}\n        &lt;/div&gt;\n        {/* Reactions */}\n        &lt;div style={{padding:'10px 16px',borderBottom:`1px solid ${C.hair}`,display:'flex',alignItems:'center',gap:8}}&gt;\n          &lt;ReactRow post={post} C={C} onComment={()=&gt;setCommentsOpen(true)}/&gt;\n        &lt;/div&gt;\n        {/* Exercise list — tap any to see body map + sets */}\n        &lt;div&gt;\n          &lt;div style={{padding:'12px 16px 6px',fontFamily:'&quot;Space Mono&quot;,monospace',fontSize:9,color:C.muted,letterSpacing:1.3}}&gt;EXERCISES — TAP TO INSPECT&lt;/div&gt;\n ize:14,color:C.faint}}&gt;›&lt;/span&gt;\n            &lt;/div&gt;\n          ))}\n        &lt;/div&gt;\n      &lt;/div&gt;\n      &lt;TabBar C={C}/&gt;\n    &lt;/div&gt;\n  );\n}\n\n// ── Layout ────────────────────────────────────────────────────\nfunction PhoneCard({num,vibe,children}) {\n  return(\n    &lt;div className=&quot;pcard&quot;&gt;\n      &lt;div&gt;&lt;div className=&quot;card-label&quot;&gt;&lt;span className=&quot;num&quot;&gt;{num}&lt;/span&gt;&lt;span className=&quot;vibe&quot;&gt;{vibe}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\n      &lt;div className=&quot;frame&quot;&gt;&lt;div className=&quot;screen&quot;&gt;{children}&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nfunction App() {\n  return (\n    &lt;div className=&quot;canvas&quot;&gt;\n      &lt;h1&gt;Social Feed&lt;/h1&gt;\n      &lt;p className=&quot;h1-sub&quot;&gt;Instagram-scale cards. Spinning vinyl music chip, tap unmute to play. Hold heart to react with custom emoji. Tap any exercise → body map + sets sheet. Comments slide up as a modal. No STRONG button.&lt;/p&gt;\n      &lt;div className=&quot;section-label&quot;&gt;FEED&lt;/div&gt;\n      &lt;p className=&quot;section-desc&quot;&gt;Tap any post to open full detail. Tap any exercise in detail to see body map + sets. Hold the heart to pick a reaction. Tap the music chip to unmute.&lt;/p&gt;\n      &lt;div className=&quot;grid&quot;&gt;\n        &lt;PhoneCard num=&quot;A1&quot; vibe=&quot;Light mode&quot;&gt;&lt;FeedScreen C={TL}/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;A2&quot; vibe=&quot;Dark mode&quot;&gt;&lt;FeedScreen C={TD}/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;A3&quot; vibe=&quot;Empty state&quot;&gt;&lt;EmptyFeedScreen C={TL}/&gt;&lt;/PhoneCard&gt;\n      &lt;/div&gt;\n      &lt;div className=&quot;section-label&quot;&gt;FRIEND PROFILE&lt;/div&gt;\n      &lt;div className=&quot;grid&quot;&gt;\n        &lt;PhoneCard num=&quot;B1&quot; vibe=&quot;Friend profile (light)&quot;&gt;&lt;FriendPr ; }\n  .canvas { padding: 60px 40px 120px; }\n  h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 52px; letter-spacing: -1.5px; line-height: 1; max-width: 1900px; margin: 0 auto 12px; }\n  .h1-sub { font-family: 'Archivo'; font-size: 15px; color: #777; max-width: 700px; margin: 0 auto 56px; line-height: 1.5; }\n  .section-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #c8553d; max-width: 1900px; margin: 56px auto 10px; font-weight: 700; }\n  .section-desc { font-family: 'Archivo'; font-size: 13px; color: #888; max-width: 700px; margin: 0 auto 28px; line-height: 1.5; }\n  .grid { display: flex; gap: 40px; max-width: 1900px; margin: 0 auto; align-items: flex-start; flex-wrap: wrap; }\n  .pcard { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }\n  .card-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }\n  .card-label .num { color: #c8553d; font-weight: 700; }\n  .card-label .vibe { color: #1a1a1a; font-weight: 600; margin-left: 6px; }\n  .frame { width: 390px; height: 844px; border-radius: 48px; padding: 4px; background: linear-gradient(135deg, #cbcac4, #b9b8b2); box-shadow: 0 40px 80px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.4); flex-shrink: 0; }\n  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; position: relative; }\n  @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }\n  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div id=&quot;root&quot;&gt;&lt;/div&gt;\n&lt;script type=&quot;text/babel&quot; data-presets=&quot;react&quot;&gt;\n\n// ── Tokens ────────────────────────────────────────────────────\nconst TL = {\n  bg:'#fbf8f2', surf:'#f4f0e6', surf2:'#ece7d8', surf3:'#e2dccd',\n  ink:'#1f1c19', ink2:'#3a342d',\n  muted:'rgba(31,28,25,0.5)', faint:'rgba(31,28,25,0.14)',\n  hair:'rgba(31,28,25,0.08)', hair2:'rgba(31,28,25,0.13)',\n  accent:'#c8553d', accentSoft:'rgba(200,85,61,0.08)',\n  up:'#1f8f5a', pr:'#c9892e',\n  st:{ WU:'rgba(180,140,60,0.13)', STD:'transparent', DROP:'rgba(200,85,61,0.10)', AMRAP:'rgba(44,109,163,0.10)' },\n  stFg:{ WU:'#a17418', STD:'rgba(31,28,25,0.5)', DROP:'#a8442f', AMRAP:'#2c6da3' },\n};\nconst TD = {\n  bg:'#1a1816', surf:'#252220', surf2:'#2e2a26', surf3:'#363028',\n  ink:'#ece5d6', ink2:'#c8bfb0',\n  muted:'rgba(236,229,214,0.5)', faint:'rgba(236,229,214,0.13)',\n  hair:'rgba(236,229,214,0.08)', hair2:'rgba(236,229,214,0.13)',\n  accent:'#dc7d4a', accentSoft:'rgba(220,125,74,0.10)',\n  up:'#3fb777', pr:'#d4a03c',\n  st:{ WU:'rgba(180,140,60,0.18)', STD:'transparent', DROP:'rgba(200,85,61,0.15)', AMRAP:'rgba(44,109,163,0.15)' },\n  stFg:{ WU:'#c9a040', STD:'rgba(236,229,214,0.5)', DROP:'#e06040', AMRAP:'#5590d0' },\n};\n\n// ── Exercise database with variant taxonomy ───────────────────\nconst EXERCISES = [\n  {\n    id:'rdl', name:'Romanian Deadlift', abbr:'RDL',\n    primary:'hamstrings', secondary:['glutes','back'],\n    movement:'hinge',\n    variants: {\n      equipment: [\n        { id:'barbell', label:'Barbell', grip: null },\n        { id:'dumbbell', label:'Dumbbell', grip: null },\n        { id:'cable',    label:'Cable', grip: null },\n        { id:'trap',     label:'Trap Bar', grip: null },\n      ]\n    }\n  },\n  {\n    id:'pullup', name:'Pull-up', abbr:'Pull-up',\n    primary:'back', secondary:['biceps','core'],\n    movement:'pull',\n    variants: {\n      grip: [\n        { id:'overhand', label:'Overhand (Pronated)' },\n        { id:'neutral',  label:'Neutral (Parallel)' },\n        { id:'underhand',label:'Underhand (Supinated)' },\n        { id:'wide',     label:'Wide Grip' },\n        { id:'close',    label:'Close Grip' },\n      ]\n    }\n  },\n  {\n    id:'bench', name:'Bench Press', abbr:'Bench',\n    primary:'chest', secondary:['shoulders','triceps'],\n    movement:'push',\n    variants: {\n      equipment: [\n        { id:'barbell',  label:'Barbell',       grip: ['flat','incline','decline'] },\n        { id:'dumbbell', label:'Dumbbell',       grip: ['flat','incline','decline'] },\n        { id:'machine',  label:'Machine',        grip: null },\n        { id:'cable',    label:'Cable Fly',      grip: null },\n      ]\n    }\n  },\n  {\n    id:'squat', name:'Squat', abbr:'Squat',\n    primary:'quads', secondary:['glutes','hamstrings'],\n    movement:'squat',\n    variants: {\n      equipment: [\n        { id:'barbell',  label:'Barbell',     grip: ['high-bar','low-bar','front'] },\n        { id:'goblet',   label:'Goblet',      grip: null },\n        { id:'hack',     label:'Hack Squat',  grip: null },\n        { id:'leg-press',label:'Leg Press',   grip: null },\n        { id:'belt',     label:'Belt Squat',  grip: null },\n      ]\n    }\n  },\n  {\n    id:'row', name:'Row', abbr:'Row',\n    primary:'back', secondary:['biceps','rear-delt'],\n    movement:'pull',\n    variants: {\n      equipment: [\n        { id:'barbell',  label:'Barbell',    grip: ['overhand','underhand','pendlay'] },\n        { id:'dumbbell', label:'Dumbbell',   grip: ['pronated','supinated','neutral'] },\n        { id:'cable',    label:'Cable',      grip: ['seated-low','standing','face-pull'] },\n        { id:'machine',  label:'Machine',    grip: null },\n        { id:'chest-supported', label:'Chest Supported', grip: null },\n      ]\n    }\n  },\n  {\n    id:'curl', name:'Curl', abbr:'Curl',\n    primary:'biceps', secondary:['forearms'],\n    movement:'pull',\n    variants: {\n      equipment: [\n        { id:'barbell',  label:'Barbell',   grip: ['straight-bar','ez-bar'] },\n        { id:'dumbbell', label:'Dumbbell',  grip: ['alternate','hammer','concentration','spider'] },\n        { id:'cable',    label:'Cable',     grip: ['straight-bar','rope','high-cable'] },\n        { id:'machine',  label:'Machine',   grip: null },\n      ]\n    }\n  },\n  {\n    id:'ohp', name:'Overhead Press', abbr:'OHP',\n    primary:'shoulders', secondary:['triceps','traps'],\n    movement:'push',\n    variants: {\n      equipment: [\n        { id:'barbell',  label:'Barbell',   grip: ['standing','seated'] },\n        { id:'dumbbell', label:'Dumbbell',  grip: ['standing','seated','arnold'] },\n        { id:'cable',    label:'Cable',     grip: null },\n        { id:'machine',  label:'Machine',   grip: null },\n        { id:'landmine', label:'Landmine',  grip: null },\n      ]\n    }\n  },\n  {\n    id:'deadlift', name:'Deadlift', abbr:'DL',\n    primary:'back', secondary:['hamstrings','glutes','traps'],\n    movement:'hinge',\n    variants: {\n      equipment: [\n        { id:'conventional', label:'Conventional',   grip: ['double-overhand','mixed','hook'] },\n        { id:'sumo',         label:'Sumo',            grip: ['double-overhand','mixed'] },\n        { id:'trap',         label:'Trap Bar',        grip: null },\n        { id:'deficit',      label:'Deficit',         grip: null },\n        { id:'single-leg',   label:'Single Leg',      grip: null },\n      ]\n    }\n  },\n  {\n    id:'lateral-raise', name:'Lateral Raise', abbr:'Lat Raise',\n    primary:'shoulders', secondary:[],\n    movement:'isolation',\n    variants: {\n      equipment: [\n        { id:'dumbbell', label:'Dumbbell',  grip: null },\n        { id:'cable',    label:'Cable',     grip: null },\n        { id:'machine',  label:'Machine',   grip: null },\n      ]\n    }\n  },\n  {\n    id:'dip', name:'Dip', abbr:'Dip',\n    primary:'triceps', secondary:['chest','shoulders'],\n    movement:'push',\n    variants: {\n      grip: [\n        { id:'chest',   label:'Chest Dip (Wide)' },\n        { id:'tricep',  label:'Tricep Dip (Narrow)' },\n        { id:'machine', label:'Machine Assisted' },\n        { id:'weighted',label:'Weighted' },\n      ]\n    }\n  },\n];\n\n// ── Programs data ─────────────────────────────────────────────\nconst PROGRAMS = [\n  {\n    id:1, name:'Push Pull Legs', tag:'PPL', days:6,\n    exercises:18, lastUsed:'2 days ago',\n    split:['Push','Pull','Legs','Push','Pull','Legs'],\n  },\n  {\n    id:2, name:'Upper Lower', tag:'U/L', days:4,\n    exercises:12, lastUsed:'1 week ago',\n    split:['Upper','Lower','Upper','Lower'],\n  },\n  {\n    id:3, name:'Full Body', tag:'FB', days:3,\n    exercises:9, lastUsed:'3 weeks ago',\n    split:['Full','Full','Full'],\n  },\n];\n\nconst TEMPLATE_EXERCISES = [\n  { exId:'bench',    variantEq:'barbell', variantGrip:'flat',     sets:4, reps:'6-8', rir:2, pr:'105kg', oneRm:'~118kg' },\n  { exId:'ohp',      variantEq:'barbell', variantGrip:'standing', sets:4, reps:'8-10', rir:2, pr:'72.5kg', oneRm:'~82kg' },\n  { exId:'dip',      variantEq:'chest',   variantGrip:null,       sets:3, reps:'10-12', rir:2, pr:null, oneRm:null },\n  { exId:'lateral-raise', variantEq:'cable', variantGrip:null,   sets:3, reps:'15-20', rir:1, pr:null, oneRm:null },\n  { exId:'curl',     variantEq:'cable',   variantGrip:'rope',     sets:3, reps:'12-15', rir:2, pr:null, oneRm:null },\n];\n\n// Helper: build readable variant label for an exercise row\nfunction variantLabel(exId, variantEq, variantGrip) {\n  const ex = EXERCISES.find(e=&gt;e.id===exId);\n  if (!ex) return '';\n  const parts = [];\n  if (variantEq) {\n    // find label\n    const allVariants = ex.variants.equipment || ex.variants.grip || [];\n    const found = allVariants.find(v=&gt;v.id===variantEq);\n    if (found) parts.push(found.label);\n  }\n  if (variantGrip) {\n    parts.push(variantGrip.replace(/-/g,' '));\n  }\n  return parts.join(' · ');\n}\n\n// ── Primitives ────────────────────────────────────────────────\nconst StatusBar = ({dark=false}) =&gt; (\n  &lt;div style={{height:50,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:6,flexShrink:0}}&gt;\n    &lt;div style={{width:126,height:37,background:dark?'rgba(255,255,255,0.1)':'#000',borderRadius:24}}/&gt;\n  &lt;/div&gt;\n);\n\nfunction TabBar({C, active='Programs'}) {\n  const dark=C===TD;\n  const muted=dark?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.35)';\n  const bg=dark?'rgba(26,24,22,0.94)':'rgba(251,248,242,0.94)';\n  const bord=dark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';\n  const tabs=[{k:'Programs',active:active==='Programs'},{k:'Social'},{k:'Home',center:true},{k:'Body'},{k:'More'}];\n  const ICON=(k,col)=&gt;{const s={width:22,height:22,fill:'none',stroke:col,strokeWidth:1.6,strokeLinecap:'round',strokeLinejoin:'round'};\n    if(k==='Programs')return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;5&quot; width=&quot;16&quot; height=&quot;14&quot; rx=&quot;2&quot;/&gt;&lt;path d=&quot;M8 9h8M8 13h8M8 17h5&quot;/&gt;&lt;/svg&gt;;\n    if(k==='Social')  return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;9&quot; cy=&quot;9&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;17&quot; cy=&quot;11&quot; r=&quot;2.5&quot;/&gt;&lt;path d=&quot;M3 19c.5-3 3-5 6-5s5.5 2 6 5&quot;/&gt;&lt;/svg&gt;;\n    if(k==='Body')    return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;5&quot; r=&quot;2.2&quot;/&gt;&lt;path d=&quot;M8 11l4-3 4 3M12 8v6M9 14l-2 6M15 14l2 6&quot;/&gt;&lt;/svg&gt;;\n    if(k==='More')    return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;6&quot; cy=&quot;12&quot; r=&quot;1.4&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;1.4&quot;/&gt;&lt;circle cx=&quot;18&quot; cy=&quot;12&quot; r=&quot;1.4&quot;/&gt;&lt;/svg&gt;;\n    return null;\n  };\n  return(\n    &lt;div style={{position:'absolute',bottom:0,left:0,right:0,background:bg,backdropFilter:'blur(16px)',borderTop:`0.5px solid ${bord}`,display:'flex',alignItems:'center',padding:'8px 0 28px',zIndex:50}}&gt;\n      {tabs.map((t,i)=&gt;{\n        const col=t.active?C.ink:muted;\n        return(\n          &lt;div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3 ),'').trim())) {\n        return { match: true, preselect: v };\n      }\n    }\n    return { match: nameMatch, preselect: null };\n  }\n\n  const filtered = EXERCISES\n    .map(ex =&gt; ({ ex, ...smartMatch(ex, query) }))\n    .filter(({match}) =&gt; match)\n    .filter(({ex}) =&gt; filter==='All' || ex.movement.toLowerCase()===filter.toLowerCase() ||\n      (filter==='Hinge' &amp;&amp; ex.movement==='hinge') ||\n      (filter==='Push' &amp;&amp; ex.movement==='push') ||\n      (filter==='Pull' &amp;&amp; ex.movement==='pull') ||\n      (filter==='Squat' &amp;&amp; ex.movement==='squat') ||\n      (filter==='Isolation' &amp;&amp; ex.movement==='isolation'));\n\n  return (\n    &lt;div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',color:C.ink}}&gt;\n      &lt;StatusBar dark={dark}/&gt;\n      &lt;div style={{padding:'2px 16px 10px',display:'flex',alignItems:'center',gap:10}}&gt;\n        &lt;div onClick={onBack} style={{cursor:'pointer',fontSize:20,color:C.muted,lineHeight:1}}&gt;‹&lt;/div&gt;\n        &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontWeight:900,fontSize:22,color:C.ink,letterSpacing:0.5,flex:1}}&gt;ADD EXERCISE&lt;/div&gt;\n      &lt;/div&gt;\n\n      {/* Search bar */}\n      &lt;div style={{padding:'0 16px 10px'}}&gt;\n        &lt;div style={{display:'flex',alignItems:'center',gap:8,height:40,background:C.surf,borderRadius:10,border:`1px solid ${C.hair2}`,padding:'0 12px'}}&gt;\n          &lt;svg width=&quot;14&quot; height=&quot;14&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke={C.muted} strokeWidth=&quot;2&quot; strokeLinecap=&quot;round&quot;&gt;&lt;circle cx=&quot;11&quot; cy=&quot;11&quot; r=&quot;8&quot;/&gt;&lt;path d=&quot;M21 21l-4.35-4.35&quot;/&gt;&lt;/svg&gt;\n          &lt;input value={query} onChange={e=&gt;setQuery(e.target.value)} placeholder='Search &quot;RDL&quot;, &quot;dumbbell curl&quot;, &quot;pull-up&quot;…'\n            style={{flex
