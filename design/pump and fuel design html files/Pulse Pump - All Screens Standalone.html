.useState(false);\n  const [selectedProgram, setSelectedProgram] = React.useState(null);\n\n  if (screen==='picker-inline') return &lt;ExercisePickerInline C={C} onBack={()=&gt;setScreen(selectedProgram?'detail':'new')} searchQuery=&quot;rdl&quot;/&gt;;\n  if (screen==='picker-sheet')  return &lt;ExercisePickerSheet C={C} onBack={()=&gt;setScreen(selectedProgram?'detail':'new')}/&gt;;\n  if (screen==='new') return (\n    &lt;NewProgramScreen C={C}\n      onBack={()=&gt;setScreen('list')}\n      onAddExercise={()=&gt;setScreen('picker-inline')}/&gt;\n  );\n  if (screen==='detail') return (\n    &lt;TemplateDetailScreen C={C} program={selectedProgram}\n      onBack={()=&gt;setScreen('list')}\n      onAddExercise={()=&gt;setScreen('picker-inline')}/&gt;\n  );\n\n  return (\n    &lt;div style={{position:'relative',width:'100%',height:'100%'}}&gt;\n      &lt;ProgramListScreen C={C}\n        onSelectProgram={(p)=&gt;{setSelectedProgram(p);setScreen('detail');}}\n        onNewProgram={()=&gt;{setSelectedProgram(null);setShowPresets(true);}}/&gt;\n      {showPresets &amp;&amp; (\n        &lt;PresetPickerSheet C={C}\n          onClose={()=&gt;setShowPresets(false)}\n          onSelect={(p)=&gt;{setShowPresets(false); if(p.id==='blank') setScreen('new'); else setScreen('detail');}}/&gt;\n      )}\n    &lt;/div&gt;\n  );\n}\n\n// ── Layout ────────────────────────────────────────────────────\nfunction PhoneCard({num,vibe,children}) {\n  return(\n    &lt;div className=&quot;pcard&quot;&gt;\n      &lt;div&gt;&lt;div className=&quot;card-label&quot;&gt;&lt;span className=&quot;num&quot;&gt;{num}&lt;/span&gt;&lt;span className=&quot;vibe&quot;&gt;{vibe}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\n      &lt;div className=&quot;frame&quot;&gt;&lt;div className=&quot;screen&quot;&gt;{children}&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nconst TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\n  &quot;accentColor&quot;: &quot;#c8553d&quot;,\n  &quot;showPR&quot;: true,\n  &quot;showRIR&quot;: true\n}/*EDITMODE-END*/;\n\n// Minimal tweaks panel (self-contained, no external dep)\nfunction TweaksFloating({ tweaks, setTweak, visible }) {\n  if (!visible) return null;\n  return (\n    &lt;div style={{position:'fixed',bottom:24,right:24,zIndex:9999,background:'#fff',borderRadius:14,padding:'16px 18px',boxShadow:'0 8px 32px rgba(0,0,0,0.18)',border:'1px solid rgba(0,0,0,0.1)',minWidth:220,fontFamily:'Inter,system-ui'}}&gt;\n      &lt;div style={{fontSize:12,fontWeight:700,letterSpacing:1,color:'#888',marginBottom:12,textTransform:'uppercase'}}&gt;Tweaks&lt;/div&gt;\n      &lt;div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}&gt;\n        &lt;span style={{fontSize:13,color:'#333'}}&gt;Accent color&lt;/span&gt;\n        &lt;input type=&quot;color&quot; value={tweaks.accentColor} onChange={e=&gt;setTweak('accentColor',e.target.value)} style={{width:32,height:24,border:'none',borderRadius:4,cursor:'pointer'}}/&gt;\n      &lt;/div&gt;\n      &lt;div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}&gt;\n        &lt;span style={{fontSize:13,color:'#333'}}&gt;Show PR badges&lt;/span&gt;\n        &lt;div onClick={()=&gt;setTweak('showPR',!tweaks.showPR)} style={{width:36,height:20,borderRadius:999,background:tweaks.showPR?'#c8553d':'#ddd',cursor:'pointer',position:'relative',transition:'background 0.2s'}}&gt;\n          &lt;div style={{position:'absolute',top:2,left:tweaks.showPR?16:2,width:16,height:16,borderRadius:'50%',background:'#fff',transition:'left 0.2s'}}/&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}&gt;\n        &lt;span style={{fontSize:13,color:'#333'}}&gt;Show RIR&lt;/span&gt;\n        &lt;div onClick={()=&gt;setTweak('showRIR',!tweaks.showRIR)} style={{width:36,height:20,borderRadius:999,background:tweaks.showRIR?'#c8553d':'#ddd',cursor:'pointer',position:'relative',transition:'background 0.2s'}}&gt;\n          &lt;div style={{position:'absolute',top:2,left:tweaks.showRIR?16:2,width:16,height:16,borderRadius:'50%',background:'#fff',transition:'left 0.2s'}}/&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nfunction App() {\n  const [tweaks, setTweaksState] = React.useState(TWEAK_DEFAULTS);\n  const [tweaksVisible, setTweaksVisible] = React.useState(false);\n\n  const setTweak = (k,v) =&gt; {\n    setTweaksState(p =&gt; {\n      const next = {...p,[k]:v};\n      window.parent.postMessage({type:'__edit_mode_set_keys', edits: next}, '*');\n      return next;\n    });\n  };\n\n  React.useEffect(() =&gt; {\n    const handler = (e) =&gt; {\n      if (e.data?.type === '__activate_edit_mode')   setTweaksVisible(true);\n      if (e.data?.type === '__deactivate_edit_mode')  setTweaksVisible(false);\n    };\n    window.addEventListener('message', handler);\n    window.parent.postMessage({type:'__edit_mode_available'}, '*');\n    return () =&gt; window.removeEventListener('message', handler);\n  }, []);\n\n  const C_LIGHT = tweaks.accentColor !== '#c8553d'\n    ? { ...TL, accent: tweaks.accentColor, accentSoft: tweaks.accentColor + '18' }\n    : TL;\n  const C_DARK = tweaks.accentColor !== '#c8553d'\n    ? { ...TD, accent: tweaks.accentColor, accentSoft: tweaks.accentColor + '18' }\n    : TD;\n\n  return (\n    &lt;&gt;\n    &lt;TweaksFloating tweaks={tweaks} setTweak={setTweak} visible={tweaksVisible}/&gt;\n    &lt;div className=&quot;canvas&quot;&gt;\n      &lt;h1&gt;Programs + Exercise Library&lt;/h1&gt;\n      &lt;p className=&quot;h1-sub&quot;&gt;Tap any program to enter template detail. Tap ADD EXERCISE to enter the exercise picker. The picker has two variant patterns: inline expansion and bottom sheet drill-down. Smart search pre-selects variants from query keywords.&lt;/p&gt;\n\n      &lt;div className=&quot;section-label&quot;&gt;PROGRAMS — FULLY INTERACTIVE&lt;/div&gt;\n      &lt;p className=&quot;section-desc&quot;&gt;Tap a program → template detail → ADD EXERCISE → exercise picker with variants. All navigation wired up.&lt;/p&gt;\n      &lt;div className=&quot;grid&quot;&gt;\n        &lt;PhoneCard num=&quot;A1&quot; vibe=&quot;Light — full flow&quot;&gt;&lt;ProgramFlowLight C={C_LIGHT}/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;A2&quot; vibe=&quot;Dark — full flow&quot;&gt;&lt;ProgramFlowLight C={C_DARK}/&gt;&lt;/PhoneCard&gt;\n      &lt;/div&gt;\n\n      &lt;div className=&quot;section-label&quot;&gt;NEW PROGRAM — BLANK CANVAS&lt;/div&gt;\n      &lt;p className=&quot;section-desc&quot;&gt;Creating a program from scratch. Name + days per week required. Exercise list starts empty with a clear empty state CTA.&lt;/p&gt;\n      &lt;div className=&quot;grid&quot;&gt;\n        &lt;PhoneCard num=&quot;A3&quot; vibe=&quot;New program — empty (light)&quot;&gt;&lt;NewProgramScreen C={C_LIGHT} onBack={()=&gt;{}} onAddExercise={()=&gt;{}}/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;A4&quot; vibe=&quot;New program — empty (dark)&quot;&gt;&lt;NewProgramScreen C={C_DARK} onBack={()=&gt;{}} onAddExercise={()=&gt;{}}/&gt;&lt;/PhoneCard&gt;\n      &lt;/div&gt;\n\n      &lt;div className=&quot;section-label&quot;&gt;EXERCISE PICKER — VARIANTS SIDE BY SIDE&lt;/div&gt;\n      &lt;p className=&quot;section-desc&quot;&gt;Left: inline expansion (tap exercise row to reveal variants below). Right: bottom sheet (tap opens drill-down modal with equipment → grip sub-selection).&lt;/p&gt;\n      &lt;div className=&quot;grid&quot;&gt;\n        &lt;PhoneCard num=&quot;B1&quot; vibe=&quot;Inline expansion (light)&quot;&gt;&lt;ExercisePickerInline C={C_LIGHT} onBack={()=&gt;{}} searchQuery=&quot;&quot;/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;B2&quot; vibe=&quot;Inline — smart search 'rdl'&quot;&gt;&lt;ExercisePickerInline C={C_LIGHT} onBack={()=&gt;{}} searchQuery=&quot;rdl&quot;/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;B3&quot; vibe=&quot;Bottom sheet (light)&quot;&gt;&lt;ExercisePickerSheet C={C_LIGHT} onBack={()=&gt;{}}/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;B4&quot; vibe=&quot;Bottom sheet (dark)&quot;&gt;&lt;ExercisePickerSheet C={C_DARK} onBack={()=&gt;{}}/&gt;&lt;/PhoneCard&gt;\n      &lt;/div&gt;\n\n      &lt;div className=&quot;section-label&quot;&gt;PRESET PICKER + TEMPLATE DETAIL&lt;/div&gt;\n      &lt;div className=&quot;grid&quot;&gt;\n        &lt;PhoneCard num=&quot;C1&quot; vibe=&quot;Preset picker open (light)&quot;&gt;\n          &lt;div style={{position:'relative',width:'100%',height:'100%'}}&gt;\n            &lt;ProgramListScreen C={C_LIGHT} onSelectProgram={()=&gt;{}} onNewProgram={()=&gt;{}}/&gt;\n            &lt;PresetPickerSheet C={C_LIGHT} onClose={()=&gt;{}} onSelect={()=&gt;{}}/&gt;\n          &lt;/div&gt;\n        &lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;C2&quot; vibe=&quot;Template detail (light)&quot;&gt;\n          &lt;TemplateDetailScreen C={C_LIGHT} program={PROGRAMS[0]} onBack={()=&gt;{}} onAddExercise={()=&gt;{}}/&gt;\n        &lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;C3&quot; vibe=&quot;Template detail (dark)&quot;&gt;\n          &lt;TemplateDetailScreen C={C_DARK} program={PROGRAMS[0]} onBack={()=&gt;{}} onAddExercise={()=&gt;{}}/&gt;\n        &lt;/PhoneCard&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;/&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(&lt;App /&gt;);\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\" title=\"PROGRAMS + EXERCISE LIBRARY\"><\u002Fiframe>\n    <iframe id=\"screen-7\" class=\"screen-frame\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;en&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;UTF-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;title&gt;Pulse Pump — More Tab&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&amp;family=Space+Mono:wght@400;700&amp;family=DM+Mono:wght@400;500&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;script src=&quot;https://unpkg.com/react@18.3.1/umd/react.development.js&quot; integrity=&quot;sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;\n&lt;script src=&quot;https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js&quot; integrity=&quot;sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;\n&lt;script src=&quot;https://unpkg.com/@babel/standalone@7.29.0/babel.min.js&quot; integrity=&quot;sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;\n&lt;style&gt;\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body { background: #edeae3; min-height: 100vh; font-family: 'Archivo', system-ui; }\n  .canvas { padding: 60px 40px 120px; }\n  h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 52px; letter-spacing: -1.5px; line-height: 1; max-width: 1900px; margin: 0 auto 12px; }\n  .h1-sub { font-family: 'Archivo'; font-size: 15px; color: #777; max-width: 700px; margin: 0 auto 56px; line-height: 1.5; }\n  .section-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #c8553d; max-width: 1900px; margin: 56px auto 10px; font-weight: 700; }\n  .section-desc { font-family: 'Archivo'; font-size: 13px; color: #888; max-width: 700px; margin: 0 auto 28px; line-height: 1.5; }\n  .grid { display: flex; gap: 40px; max-width: 1900px; margin: 0 auto; align-items: flex-start; flex-wrap: wrap; }\n  .pcard { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }\n  .card-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }\n  .card-label .num { color: #c8553d; font-weight: 700; }\n  .card-label .vibe { color: #1a1a1a; font-weight: 600; margin-left: 6px; }\n  .frame { width: 390px; height: 844px; border-radius: 48px; padding: 4px; background: linear-gradient(135deg, #cbcac4, #b9b8b2); box-shadow: 0 40px 80px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.4); flex-shrink: 0; }\n  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; position: relative; }\n  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }\n  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div id=&quot;root&quot;&gt;&lt;/div&gt;\n&lt;script type=&quot;text/babel&quot; data-presets=&quot;react&quot;&gt;\n\n// ── Tokens ────────────────────────────────────────────────────\nconst TL = {\n  bg:'#fbf8f2', surf:'#f4f0e6', surf2:'#ece7d8', surf3:'#e2dccd',\n  ink:'#1f1c19', ink2:'#3a342d',\n  muted:'rgba(31,28,25,0.5)', faint:'rgba(31,28,25,0.13)',\n  hair:'rgba(31,28,25,0.08)', hair2:'rgba(31,28,25,0.13)',\n  accent:'#c8553d', accentSoft:'rgba(200,85,61,0.08)',\n  up:'#1f8f5a', down:'#c0341a', pr:'#c9892e',\n};\nconst TD = {\n  bg:'#1a1816', surf:'#252220', surf2:'#2e2a26', surf3:'#363028',\n  ink:'#ece5d6', ink2:'#c8bfb0',\n  muted:'rgba(236,229,214,0.5)', faint:'rgba(236,229,214,0.13)',\n  hair:'rgba(236,229,214,0.08)', hair2:'rgba(236,229,214,0.13)',\n  accent:'#dc7d4a', accentSoft:'rgba(220,125,74,0.10)',\n  up:'#3fb777', down:'#e05a45', pr:'#d4a03c',\n};\n\n// ── Primitives ─────────────────────────────────────────────────\nconst StatusBar = ({dark=false}) =&gt; (\n  &lt;div style={{height:50,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:6,flexShrink:0}}&gt;\n    &lt;div style={{width:126,height:37,background:dark?'rgba(255,255,255,0.1)':'#000',borderRadius:24}}/&gt;\n  &lt;/div&gt;\n);\n\nfunction TabBar({C}) {\n  const dark=C===TD;\n  const muted=dark?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.35)';\n  const bg=dark?'rgba(26,24,22,0.94)':'rgba(251,248,242,0.94)';\n  const bord=dark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';\n  const tabs=[{k:'Programs'},{k:'Social'},{k:'Home',center:true},{k:'Body'},{k:'More',active:true}];\n  const ICON=(k,col)=&gt;{const s={width:22,height:22,fill:'none',stroke:col,strokeWidth:1.6,strokeLinecap:'round',strokeLinejoin:'round'};\n    if(k==='Programs')return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;5&quot; width=&quot;16&quot; height=&quot;14&quot; rx=&quot;2&quot;/&gt;&lt;path d=&quot;M8 9h8M8 13h8M8 17h5&quot;/&gt;&lt;/svg&gt;;\n    if(k==='Social')  return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;9&quot; cy=&quot;9&quot; r=&quot;3&quot;/&gt;&lt;path d=&quot;M3 19c.5-3 3-5 6-5s5.5 2 6 5&quot;/&gt;&lt;/svg&gt;;\n    if(k==='Body')    return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;5&quot; r=&quot;2.2&quot;/&gt;&lt;path d=&quot;M8 11l4-3 4 3M12 8v6M9 14l-2 6M15 14l2 6&quot;/&gt;&lt;/svg&gt;;\n    if(k==='More')    return&lt;svg {...s} viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;6&quot; cy=&quot;12&quot; r=&quot;1.4&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;1.4&quot;/&gt;&lt;circle cx=&quot;18&quot; cy=&quot;12&quot; r=&quot;1.4&quot;/&gt;&lt;/svg&gt;;\n    return null;\n  };\n  return(\n    &lt;div style={{position:'absolute',bottom:0,left:0,right:0,background:bg,backdropFilter:'blur(16px)',borderTop:`0.5px solid ${bord}`,display:'flex',alignItems:'center',padding:'8px 0 28px',zIndex:50}}&gt;\n      {tabs.map((t,i)=&gt;{\n        const isActive=t.active;\n        const col=isActive?C.ink:muted;\n        return(\n          &lt;div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}&gt;\n            {t.center\n              ?&lt;div style={{width:46,height:46,borderRadius:15,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',marginTop:-12,boxShadow:`0 8px 16px ${C.accent}44`}}&gt;\n                &lt;svg width=&quot;22&quot; height=&quot;22&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M3.5 12L12 4M12 4L20.5 12M6 13.5v7M18 13.5v7M6 20.5h12M10.5 20.5v-4.5h3v4.5&quot; stroke=&quot;#fff&quot; strokeWidth=&quot;1.8&quot; strokeLinecap=&quot;round&quot; strokeLinejoin=&quot;round&quot;/&gt;&lt;/svg&gt;\n              &lt;/div&gt;\n              :ICON(t.k,col)}\n            &lt;span style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:10,fontWeight:isActive?600:500,color:t.center?C.accent:col}}&gt;{t.k}&lt;/span&gt;\n          &lt;/div&gt;\n        );\n      })}\n    &lt;/div&gt;\n  );\n}\n\n// ── Nav row component ─────────────────────────────────────────\nfunction NavRow({C, icon, label, sub, badge, chevron=true, accent=false, destructive=false, onTap}) {\n  const color = destructive ? C.down : accent ? C.accent : C.ink;\n  return (\n    &lt;div onClick={onTap} style={{display:'flex',alignItems:'center',gap:12,padding:'13px 16px',borderBottom:`1px solid ${C.hair}`,cursor:'pointer',background:'transparent'}}&gt;\n      &lt;div style={{width:32,height:32,borderRadius:8,background:destructive?`${C.down}15`:accent?C.accentSoft:C.surf2,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}&gt;\n        &lt;svg width=&quot;16&quot; height=&quot;16&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke={color} strokeWidth=&quot;1.8&quot; strokeLinecap=&quot;round&quot; strokeLinejoin=&quot;round&quot;&gt;{icon}&lt;/svg&gt;\n      &lt;/div&gt;\n      &lt;div style={{flex:1,minWidth:0}}&gt;\n        &lt;div style={{fontFamily:'&quot;Archivo&quot;,sans-serif',fontSize:14,fontWeight:500,color}}&gt;{label}&lt;/div&gt;\n        {sub &amp;&amp; &lt;div style={{fontF — full navigation flow\n// ══════════════════════════════════════════════════════════════\nfunction MoreFlow({C}) {\n  const [screen, setScreen] = React.useState('hub');\n  const nav = (s) =&gt; setScreen(s);\n  const back = () =&gt; setScreen('hub');\n\n  const style = {width:'100%',height:'100%',animation:'slideIn 0.2s ease-out'};\n\n  if (screen==='history')   return &lt;div style={style}&gt;&lt;HistoryScreen C={C} onBack={back}/&gt;&lt;/div&gt;;\n  if (screen==='profile')   return &lt;div style={style}&gt;&lt;ProfileScreen C={C} onBack={back}/&gt;&lt;/div&gt;;\n  if (screen==='settings')  return &lt;div style={style}&gt;&lt;SettingsScreen C={C} onBack={back}/&gt;&lt;/div&gt;;\n  if (screen==='equipment') return &lt;div style={style}&gt;&lt;EquipmentScreen C={C} onBack={back}/&gt;&lt;/div&gt;;\n  if (screen==='pulse+')    return &lt;div style={style}&gt;&lt;PulsePlusScreen C={C} onBack={back}/&gt;&lt;/div&gt;;\n\n  return &lt;MoreHub C={C} onNav={nav}/&gt;;\n}\n\n// ── Layout ────────────────────────────────────────────────────\nfunction PhoneCard({num,vibe,children}) {\n  return(\n    &lt;div className=&quot;pcard&quot;&gt;\n      &lt;div&gt;&lt;div className=&quot;card-label&quot;&gt;&lt;span className=&quot;num&quot;&gt;{num}&lt;/span&gt;&lt;span className=&quot;vibe&quot;&gt;{vibe}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\n      &lt;div className=&quot;frame&quot;&gt;&lt;div className=&quot;screen&quot;&gt;{children}&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nfunction App() {\n  return (\n    &lt;div className=&quot;canvas&quot;&gt;\n      &lt;h1&gt;More Tab&lt;/h1&gt;\n      &lt;p className=&quot;h1-sub&quot;&gt;Fully interactive. Tap any row in the hub to navigate. Fully wired: History (calendar/list toggle), Profile, Settings (all toggles live), Equipment Profiles with plate visualizer, Pulse+ paywall with billing/tier selectors.&lt;/p&gt;\n\n      &lt;div className=&quot;section-label&quot;&gt;FULLY INTERACTIVE FLOWS&lt;/div&gt;\n      &lt;p className=&quot;section-desc&quot;&gt;Tap any nav row to enter that screen. Back arrow returns to hub.&lt;/p&gt;\n      &lt;div className=&quot;grid&quot;&gt;\n        &lt;PhoneCard num=&quot;A1&quot; vibe=&quot;Light — More Hub&quot;&gt;&lt;MoreFlow C={TL}/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;A2&quot; vibe=&quot;Dark — More Hub&quot;&gt;&lt;MoreFlow C={TD}/&gt;&lt;/PhoneCard&gt;\n      &lt;/div&gt;\n\n      &lt;div className=&quot;section-label&quot;&gt;INDIVIDUAL SCREENS&lt;/div&gt;\n      &lt;div className=&quot;grid&quot;&gt;\n        &lt;PhoneCard num=&quot;B1&quot; vibe=&quot;History — List&quot;&gt;&lt;HistoryScreen C={TL} onBack={()=&gt;{}}/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;B2&quot; vibe=&quot;History — Calendar&quot;&gt;&lt;div style={{width:'100%',height:'100%'}}&gt;{React.createElement(()=&gt;{const [v,setV]=React.useState('calendar');return &lt;HistoryScreen C={TL} onBack={()=&gt;{}}/&gt;;})}&lt;/div&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;B3&quot; vibe=&quot;Profile&quot;&gt;&lt;ProfileScreen C={TL} onBack={()=&gt;{}}/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;B4&quot; vibe=&quot;Profile (dark)&quot;&gt;&lt;ProfileScreen C={TD} onBack={()=&gt;{}}/&gt;&lt;/PhoneCard&gt;\n      &lt;/div&gt;\n\n      &lt;div className=&quot;grid&quot; style={{marginTop:40}}&gt;\n        &lt;PhoneCard num=&quot;C1&quot; vibe=&quot;Settings (light)&quot;&gt;&lt;SettingsScreen C={TL} onBack={()=&gt;{}}/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;C2&quot; vibe=&quot;Settings (dark)&quot;&gt;&lt;SettingsScreen C={TD} onBack={()=&gt;{}}/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;C3&quot; vibe=&quot;Equipment Profiles&quot;&gt;&lt;EquipmentScreen C={TL} onBack={()=&gt;{}}/&gt;&lt;/PhoneCard&gt;\n        &lt;PhoneCard num=&quot;C4&quot; vibe=&quot;Pulse+ Paywall&quot;&gt;&lt;PulsePlusScreen C={TL} onBack={()=&gt;{}}/&gt;&lt;/PhoneCard&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(&lt;App /&gt;);\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\" title=\"MORE TAB\"><\u002Fiframe>\n  <\u002Fdiv>\n<\u002Fdiv>\n<script>\nfunction showScreen(id) {\n  document.querySelectorAll('.screen-frame').forEach(function(el) {\n    el.classList.remove('active');\n    el.style.display = 'none';\n  });\n  document.querySelectorAll('.nav-item').forEach(function(el) {\n    el.classList.remove('active');\n  });\n  var target = document.getElementById('screen-' + id);\n  if (target) { target.classList.add('active'); target.style.display = 'block'; }\n  var navItems = document.querySelectorAll('.nav-item');\n  if (id === 'welcome') {\n    navItems[0].classList.add('active');\n  } else {\n    var idx = parseInt(id);\n    if (navItems[idx + 1]) navItems[idx + 1].classList.add('active');\n  }\n}\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
