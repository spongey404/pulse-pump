<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Fuel — Log Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #edeae3; min-height: 100vh; font-family: 'Archivo', sans-serif; }
  .canvas { padding: 60px 40px 120px; }
  h1 { font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 48px; letter-spacing: -1.5px; line-height: 1; max-width: 2000px; margin: 0 auto 12px; color: #1a1a1a; }
  .h1-sub { font-family: 'Archivo'; font-size: 15px; color: #777; max-width: 700px; margin: 0 auto 56px; line-height: 1.5; }
  .section-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #7A9B6E; max-width: 2000px; margin: 56px auto 10px; font-weight: 700; }
  .section-desc { font-family: 'Archivo'; font-size: 13px; color: #888; max-width: 700px; margin: 0 auto 28px; line-height: 1.5; }
  .grid { display: flex; gap: 40px; max-width: 2000px; margin: 0 auto; align-items: flex-start; flex-wrap: wrap; }
  .pcard { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
  .card-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }
  .card-label .num { color: #7A9B6E; font-weight: 700; }
  .card-label .vibe { color: #1a1a1a; font-weight: 600; margin-left: 6px; }
  .frame { width: 390px; height: 844px; border-radius: 48px; padding: 4px; background: linear-gradient(135deg, #cbcac4, #b9b8b2); box-shadow: 0 40px 80px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.4); flex-shrink: 0; }
  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; position: relative; }
  @keyframes slideLeft { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

// ── Fuel tokens ───────────────────────────────────────────────
const FL = { // light
  bg:'#fbf8f2', surf:'#f4f0e6', surf2:'#ece7d8',
  ink:'#1f1c19', ink2:'#3a342d',
  muted:'rgba(31,28,25,0.5)', faint:'rgba(31,28,25,0.13)',
  hair:'rgba(31,28,25,0.08)', hair2:'rgba(31,28,25,0.13)',
  accent:'#7A9B6E', accentSoft:'rgba(122,155,110,0.10)',
  accent2:'#B5C7A8', // muted sage for soft backgrounds
  down:'#c0341a', warn:'#C9892E',
  tickerBg:'#1a1816', tickerFg:'#ece5d6',
};
const FD = { // dark
  bg:'#1a1816', surf:'#252220', surf2:'#2e2a26',
  ink:'#ece5d6', ink2:'#c8bfb0',
  muted:'rgba(236,229,214,0.5)', faint:'rgba(236,229,214,0.13)',
  hair:'rgba(236,229,214,0.08)', hair2:'rgba(236,229,214,0.13)',
  accent:'#8FAF82', accentSoft:'rgba(143,175,130,0.12)',
  accent2:'#5a7a52',
  down:'#e05a45', warn:'#d4a03c',
  tickerBg:'#0e0c0a', tickerFg:'#ece5d6',
};

// ── Day data ──────────────────────────────────────────────────
const DAYS = [
  { d:'M', date:4,  label:'Mon' },
  { d:'T', date:5,  label:'Tue' },
  { d:'W', date:6,  label:'Wed' },
  { d:'T', date:7,  label:'Thu' },
  { d:'F', date:8,  label:'Fri' },
  { d:'S', date:9,  label:'Sat' },
  { d:'S', date:10, label:'Sun', today:true },
];

const TODAY_MEALS = [
  {
    id:1, name:'Breakfast', time:'8:14 AM', confirmed:true,
    items:[
      { name:'Greek Yoghurt', amount:'200g', kcal:120, p:17, c:9, f:0, confirmed:true },
      { name:'Banana',        amount:'1 medium', kcal:89, p:1, c:23, f:0, confirmed:true },
      { name:'Granola',       amount:'40g', kcal:190, p:4, c:28, f:7, confirmed:true },
    ],
  },
  {
    id:2, name:'Pre-workout', time:'12:30 PM', confirmed:true,
    items:[
      { name:'Rice Cakes',    amount:'3 cakes', kcal:105, p:2, c:24, f:0, confirmed:true },
      { name:'Peanut Butter', amount:'20g', kcal:120, p:5, c:3, f:10, confirmed:true },
    ],
  },
  {
    id:3, name:'Lunch', time:'2:05 PM', confirmed:true,
    items:[
      { name:'Chicken Breast', amount:'180g', kcal:270, p:54, c:0, f:5, confirmed:true },
      { name:'Brown Rice',     amount:'180g cooked', kcal:234, p:5, c:48, f:2, confirmed:true },
      { name:'Broccoli',       amount:'150g', kcal:51, p:4, c:10, f:0, confirmed:true },
      { name:'Olive Oil',      amount:'10ml', kcal:90, p:0, c:0, f:10, confirmed:true },
    ],
  },
  {
    id:4, name:'Post-workout', time:'6:00 PM', confirmed:false, planned:true,
    items:[
      { name:'Whey Protein',  amount:'35g', kcal:140, p:30, c:3, f:2, confirmed:false },
      { name:'Oat Milk',      amount:'250ml', kcal:120, p:3, c:18, f:4, confirmed:false },
    ],
  },
];

const TOTALS = { kcal:1529, p:125, c:166, f:40 };
const TARGET = { kcal:2200, p:165, c:220, f:73 };
const REMAINING = { kcal:TARGET.kcal-TOTALS.kcal, p:TARGET.p-TOTALS.p, c:TARGET.c-TOTALS.c, f:TARGET.f-TOTALS.f };
const WEEK_AVG = { kcal:2080, p:148, c:195, f:62 };

// ── Primitives ────────────────────────────────────────────────
const StatusBar = ({dark=false}) => (
  <div style={{height:50,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:6,flexShrink:0}}>
    <div style={{width:126,height:37,background:dark?'rgba(255,255,255,0.1)':'#000',borderRadius:24}}/>
  </div>
);

function TabBar({C}) {
  const dark=C===FD;
  const muted=dark?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.35)';
  const bg=dark?'rgba(26,24,22,0.94)':'rgba(251,248,242,0.94)';
  const bord=dark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';
  const tabs=[{k:'Trends'},{k:'Log',center:true,active:true},{k:'More'}];
  return(
    <div style={{position:'absolute',bottom:0,left:0,right:0,background:bg,backdropFilter:'blur(16px)',borderTop:`0.5px solid ${bord}`,display:'flex',alignItems:'center',padding:'8px 0 28px',zIndex:50}}>
      {tabs.map((t,i)=>{
        const col=t.active?C.ink:muted;
        return(
          <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
            {t.center
              ?<div style={{width:52,height:52,borderRadius:16,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',marginTop:-14,boxShadow:`0 8px 16px ${C.accent}55`}}>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </div>
              :<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
                {t.k==='Trends'?<><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></>:<><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></>}
              </svg>}
            <span style={{fontFamily:'"Archivo",sans-serif',fontSize:10,fontWeight:t.active?600:500,color:t.center?C.accent:col}}>{t.k}</span>
          </div>
        );
      })}
    </div>
  );
}

// ── Calorie ring ──────────────────────────────────────────────
function CalorieRing({C, size=80, kcal, target, weekAvg}) {
  const pct = Math.min(1, kcal/target);
  const r = size/2 - 7;
  const circ = 2*Math.PI*r;
  const remaining = target - kcal;
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,flexShrink:0}}>
      <div style={{position:'relative',width:size,height:size}}>
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={C.hair2} strokeWidth="7"/>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={C.accent} strokeWidth="7"
            strokeDasharray={circ} strokeDashoffset={circ*(1-pct)}
            strokeLinecap="round" transform={`rotate(-90 ${size/2} ${size/2})`}/>
        </svg>
        <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
          <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:size*0.2,color:C.ink,lineHeight:1}}>{remaining}</span>
          <span style={{fontFamily:'"Space Mono",monospace',fontSize:6,color:C.muted,letterSpacing:1,marginTop:1}}>LEFT</span>
        </div>
      </div>
      <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:0.8,textAlign:'center'}}>
        7D AVG {weekAvg}
      </div>
    </div>
  );
}

// ── Macro bar ─────────────────────────────────────────────────
function MacroRow({C, label, val, target, unit='g'}) {
  const pct = Math.min(1, val/target);
  const col = pct >= 1 ? C.warn : C.accent;
  return (
    <div style={{display:'flex',alignItems:'center',gap:8}}>
      <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,letterSpacing:1,color:C.muted,width:12}}>{label}</span>
      <div style={{flex:1,height:3,background:C.hair,borderRadius:2,overflow:'hidden'}}>
        <div style={{width:`${pct*100}%`,height:'100%',background:col,borderRadius:2}}/>
      </div>
      <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,fontWeight:700,color:C.ink,minWidth:32,textAlign:'right'}}>{val}{unit}</span>
      <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,minWidth:28,textAlign:'right'}}>{target}{unit}</span>
    </div>
  );
}

// ── Date strip ────────────────────────────────────────────────
function DateStrip({C, selectedDay, onSelectDay}) {
  const ink = C.ink;
  const muted = C.muted;
  const border = C.hair2;
  return (
    <div style={{display:'flex',gap:4,padding:'8px 14px',overflowX:'auto'}}>
      {DAYS.map((d,i) => {
        const sel = i === selectedDay;
        return (
          <button key={i} onClick={() => onSelectDay(i)} style={{
            flex:1, minWidth:40, height:52, borderRadius:10,
            background: sel ? C.accent : (d.today ? C.accentSoft : 'transparent'),
            border: `1px solid ${sel ? C.accent : (d.today ? C.accent+'55' : border)}`,
            display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
            cursor:'pointer', padding:0, gap:2,
          }}>
            <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,letterSpacing:0.8,color:sel?'rgba(255,255,255,0.7)':muted}}>{d.d}</span>
            <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:sel?800:600,fontSize:15,color:sel?'#fff':(d.today?C.accent:ink)}}>{d.date}</span>
          </button>
        );
      })}
    </div>
  );
}

// ── Docked search bar ─────────────────────────────────────────
function DockedSearch({C}) {
  return (
    <div style={{position:'absolute',bottom:0,left:0,right:0,background:C.bg,borderTop:`1px solid ${C.hair2}`,padding:'8px 14px 28px',zIndex:40}}>
      <div style={{height:48,borderRadius:12,background:C.surf,border:`1px solid ${C.hair2}`,display:'flex',alignItems:'center',padding:'0 14px',gap:10}}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:500,fontSize:14,color:C.muted,flex:1}}>Search foods…</span>
        <div style={{width:36,height:36,borderRadius:8,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round"><path d="M4 4h16"/><path d="M4 8l2-2h12l2 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M9 21v-6a2 2 0 014 0v6"/></svg>
        </div>
      </div>
    </div>
  );
}

// ── Food item row (3 variants) ────────────────────────────────
function FoodRowMinimal({C, item}) {
  const dim = !item.confirmed;
  return (
    <div style={{display:'flex',alignItems:'center',padding:'9px 14px',gap:10,opacity:dim?0.5:1,borderBottom:`1px solid ${C.hair}`}}>
      {!item.confirmed && <div style={{width:14,height:14,borderRadius:3,border:`1.5px dashed ${C.muted}`,flexShrink:0}}/>}
      <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:500,fontSize:13,color:C.ink,flex:1}}>{item.name}</span>
      <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:0.5}}>{item.amount}</span>
      <span style={{fontFamily:'"Space Mono",monospace',fontSize:11,fontWeight:700,color:C.ink,minWidth:42,textAlign:'right'}}>{item.kcal}</span>
    </div>
  );
}

function FoodRowMacros({C, item}) {
  const dim = !item.confirmed;
  return (
    <div style={{padding:'9px 14px',opacity:dim?0.5:1,borderBottom:`1px solid ${C.hair}`}}>
      <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:4}}>
        {!item.confirmed && <div style={{width:14,height:14,borderRadius:3,border:`1.5px dashed ${C.muted}`,flexShrink:0,marginBottom:-2}}/>}
        <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:600,fontSize:13,color:C.ink,flex:1}}>{item.name}</span>
        <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:0.5}}>{item.amount}</span>
        <span style={{fontFamily:'"Space Mono",monospace',fontSize:11,fontWeight:700,color:C.ink,minWidth:42,textAlign:'right'}}>{item.kcal}</span>
      </div>
      <div style={{display:'flex',gap:10,paddingLeft:item.confirmed?0:22}}>
        {[['P',item.p],[' C',item.c],['F',item.f]].map(([l,v],i)=>(
          <div key={i} style={{display:'flex',gap:3,alignItems:'baseline'}}>
            <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:0.8}}>{l}</span>
            <span style={{fontFamily:'"Space Mono",monospace',fontSize:10,fontWeight:700,color:C.accent}}>{v}g</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function FoodRowBloomberg({C, item}) {
  const dim = !item.confirmed;
  const pBar = item.p / 50; const cBar = item.c / 80; const fBar = item.f / 30;
  return (
    <div style={{padding:'8px 14px',opacity:dim?0.5:1,borderBottom:`1px solid ${C.hair}`}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        {!item.confirmed && <div style={{width:14,height:14,borderRadius:3,border:`1.5px dashed ${C.muted}`,flexShrink:0}}/>}
        <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:600,fontSize:13,color:C.ink,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</span>
        <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,whiteSpace:'nowrap'}}>{item.amount}</span>
        <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:14,color:C.ink,minWidth:36,textAlign:'right'}}>{item.kcal}</span>
      </div>
      <div style={{display:'flex',gap:4,marginTop:5,paddingLeft:item.confirmed?0:22}}>
        {[['P',pBar,'#5a9ec8'],['C',cBar,C.accent],['F',fBar,'#c9892e']].map(([l,pct,col],i)=>(
          <div key={i} style={{flex:1,display:'flex',flexDirection:'column',gap:2}}>
            <div style={{height:3,background:C.hair,borderRadius:2,overflow:'hidden'}}>
              <div style={{width:`${Math.min(1,pct)*100}%`,height:'100%',background:col,borderRadius:2}}/>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Meal block (3 styles) ────────────────────────────────────
function MealBlockCard({C, meal, FoodRow}) {
  const totalKcal = meal.items.reduce((a,b)=>a+b.kcal,0);
  return (
    <div style={{margin:'8px 14px 0',background:C.surf,borderRadius:12,border:`1px solid ${C.hair2}`,overflow:'hidden'}}>
      <div style={{padding:'10px 14px 8px',display:'flex',alignItems:'baseline',gap:8,borderBottom:`1px solid ${C.hair}`}}>
        <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:700,fontSize:15,color:C.ink,flex:1}}>{meal.name}</span>
        <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:0.8}}>{meal.time}</span>
        <span style={{fontFamily:'"Space Mono",monospace',fontSize:10,fontWeight:700,color:C.ink}}>{totalKcal} kcal</span>
        {meal.planned && <div style={{width:6,height:6,borderRadius:1,background:C.accent,opacity:0.5}}/>}
      </div>
      {meal.items.map((it,i) => <FoodRow key={i} C={C} item={it}/>)}
      <div style={{padding:'6px 14px 8px',display:'flex',alignItems:'center',gap:8}}>
        <div style={{height:26,padding:'0 10px',borderRadius:6,border:`1px dashed ${C.faint}`,display:'flex',alignItems:'center',cursor:'pointer'}}>
          <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:0.5}}>+ ADD FOOD</span>
        </div>
        {!meal.planned && <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:0.8,marginLeft:'auto'}}>P{meal.items.reduce((a,b)=>a+b.p,0)}g · C{meal.items.reduce((a,b)=>a+b.c,0)}g · F{meal.items.reduce((a,b)=>a+b.f,0)}g</span>}
      </div>
    </div>
  );
}

function MealBlockFlat({C, meal, FoodRow}) {
  const totalKcal = meal.items.reduce((a,b)=>a+b.kcal,0);
  return (
    <div style={{marginTop:12}}>
      <div style={{padding:'4px 14px 6px',display:'flex',alignItems:'baseline',gap:8,borderBottom:`1.5px solid ${C.hair2}`}}>
        <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:800,fontSize:14,color:C.ink,flex:1,textTransform:'uppercase',letterSpacing:0.5}}>{meal.name}</span>
        <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:0.8}}>{meal.time}</span>
        <span style={{fontFamily:'"Space Mono",monospace',fontSize:10,fontWeight:700,color:C.ink}}>{totalKcal}</span>
      </div>
      {meal.items.map((it,i) => <FoodRow key={i} C={C} item={it}/>)}
      <div style={{padding:'6px 14px',borderBottom:`1px solid ${C.hair}`}}>
        <div style={{height:24,width:100,borderRadius:5,border:`1px dashed ${C.faint}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
          <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:0.5}}>+ ADD FOOD</span>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// VARIANT A — Ring hero + card meals + minimal food rows
// Clean, visual, app-like feel
// ════════════════════════════════════════════════════════════
function FuelLogA({C}) {
  const [day, setDay] = React.useState(6);
  const dark=C===FD;
  return (
    <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',color:C.ink,fontFamily:'"Archivo",sans-serif'}}>
      <StatusBar dark={dark}/>
      {/* Fixed header */}
      <div style={{flexShrink:0}}>
        <div style={{padding:'0 16px 10px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:`1px solid ${C.hair}`}}>
          <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:26,letterSpacing:0.5,color:C.ink}}>LOG</div>
          <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:1.2}}>SUN 10 MAY</div>
        </div>
        {/* Header: ring + macro bars */}
        <div style={{padding:'12px 16px',display:'flex',gap:14,alignItems:'flex-start',borderBottom:`1px solid ${C.hair}`}}>
          <CalorieRing C={C} size={84} kcal={TOTALS.kcal} target={TARGET.kcal} weekAvg={WEEK_AVG.kcal}/>
          <div style={{flex:1,display:'flex',flexDirection:'column',gap:7}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:2}}>
              <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:1.5}}>TODAY</span>
              <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:1.5}}>TARGET</span>
            </div>
            <MacroRow C={C} label="P" val={TOTALS.p} target={TARGET.p}/>
            <MacroRow C={C} label="C" val={TOTALS.c} target={TARGET.c}/>
            <MacroRow C={C} label="F" val={TOTALS.f} target={TARGET.f}/>
          </div>
        </div>
        <DateStrip C={C} selectedDay={day} onSelectDay={setDay}/>
      </div>
      {/* Scrollable meals */}
      <div style={{flex:1,overflowY:'auto',paddingBottom:100,animation:'slideLeft 0.2s ease-out'}}>
        {TODAY_MEALS.map(m => <MealBlockCard key={m.id} C={C} meal={m} FoodRow={FoodRowMinimal}/>)}
        <div style={{height:8}}/>
      </div>
      <DockedSearch C={C}/>
      <TabBar C={C}/>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// VARIANT B — Bloomberg KPI strip + flat meals + macro food rows
// Dense, data-first, matches Pump's density
// ════════════════════════════════════════════════════════════
function FuelLogB({C}) {
  const [day, setDay] = React.useState(6);
  const dark=C===FD;
  return (
    <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',color:C.ink,fontFamily:'"Archivo",sans-serif'}}>
      <StatusBar dark={dark}/>
      <div style={{flexShrink:0}}>
        {/* Ticker-style header */}
        <div style={{background:C.tickerBg,height:26,display:'flex',alignItems:'center',padding:'0 14px',gap:16,overflow:'hidden'}}>
          {[['KCAL',`${TOTALS.kcal}/${TARGET.kcal}`,null],['P',`${TOTALS.p}g`,null],['C',`${TOTALS.c}g`,null],['F',`${TOTALS.f}g`,null],['7D AVG',`${WEEK_AVG.kcal} kcal`,null]].map(([k,v],i)=>(
            <span key={i} style={{display:'inline-flex',gap:5,alignItems:'center',flexShrink:0}}>
              <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:'rgba(236,229,214,0.5)',letterSpacing:1}}>{k}</span>
              <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,fontWeight:700,color:C.tickerFg}}>{v}</span>
              {i<4&&<span style={{color:'rgba(236,229,214,0.2)',marginLeft:4}}>·</span>}
            </span>
          ))}
        </div>
        <div style={{padding:'6px 16px 10px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:26,letterSpacing:0.5,color:C.ink}}>LOG</div>
          <div style={{textAlign:'right'}}>
            <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:22,color:C.accent,letterSpacing:0.5,lineHeight:1}}>{REMAINING.kcal}</div>
            <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:1.2,marginTop:2}}>KCAL LEFT</div>
          </div>
        </div>
        <DateStrip C={C} selectedDay={day} onSelectDay={setDay}/>
      </div>
      <div style={{flex:1,overflowY:'auto',paddingBottom:100,animation:'slideLeft 0.2s ease-out'}}>
        {TODAY_MEALS.map(m => <MealBlockFlat key={m.id} C={C} meal={m} FoodRow={FoodRowMacros}/>)}
        <div style={{height:8}}/>
      </div>
      <DockedSearch C={C}/>
      <TabBar C={C}/>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// VARIANT C — Compact ring + flat meals + bloomberg food rows
// Most data-dense. Ring small, macro bars on each row
// ════════════════════════════════════════════════════════════
function FuelLogC({C}) {
  const [day, setDay] = React.useState(6);
  const dark=C===FD;
  return (
    <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',color:C.ink,fontFamily:'"Archivo",sans-serif'}}>
      <StatusBar dark={dark}/>
      <div style={{flexShrink:0}}>
        <div style={{padding:'4px 16px 10px',display:'flex',alignItems:'center',gap:14,borderBottom:`1px solid ${C.hair}`}}>
          <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:26,letterSpacing:0.5,color:C.ink}}>LOG</div>
          <div style={{flex:1}}/>
          {/* Small ring + remaining inline */}
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <CalorieRing C={C} size={52} kcal={TOTALS.kcal} target={TARGET.kcal} weekAvg={WEEK_AVG.kcal}/>
            <div>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,letterSpacing:1.5,color:C.muted}}>TODAY</div>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,letterSpacing:1.5,color:C.muted,marginTop:3}}>PROT</div>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,letterSpacing:1.5,color:C.muted,marginTop:3}}>CARB</div>
            </div>
            <div>
              <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:700,fontSize:13,color:C.ink}}>{TOTALS.kcal} <span style={{color:C.muted,fontWeight:400,fontSize:10}}>/ {TARGET.kcal}</span></div>
              <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:700,fontSize:13,color:C.accent,marginTop:3}}>{TOTALS.p}g <span style={{color:C.muted,fontWeight:400,fontSize:10}}>/ {TARGET.p}g</span></div>
              <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:700,fontSize:13,color:C.accent,marginTop:3}}>{TOTALS.c}g <span style={{color:C.muted,fontWeight:400,fontSize:10}}>/ {TARGET.c}g</span></div>
            </div>
          </div>
        </div>
        <DateStrip C={C} selectedDay={day} onSelectDay={setDay}/>
      </div>
      <div style={{flex:1,overflowY:'auto',paddingBottom:100,animation:'slideLeft 0.2s ease-out'}}>
        {TODAY_MEALS.map(m => <MealBlockFlat key={m.id} C={C} meal={m} FoodRow={FoodRowBloomberg}/>)}
        <div style={{height:8}}/>
      </div>
      <DockedSearch C={C}/>
      <TabBar C={C}/>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// VARIANT D — Full calorie ring hero + card meals + bloomberg rows
// Biggest ring, most visual. Good for users who care about calories
// ════════════════════════════════════════════════════════════
function FuelLogD({C}) {
  const [day, setDay] = React.useState(6);
  const dark=C===FD;
  return (
    <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',color:C.ink,fontFamily:'"Archivo",sans-serif'}}>
      <StatusBar dark={dark}/>
      <div style={{flexShrink:0}}>
        {/* Hero header: big ring centered */}
        <div style={{padding:'8px 16px 12px',borderBottom:`1px solid ${C.hair}`,display:'flex',flexDirection:'column',alignItems:'center',gap:10}}>
          <div style={{display:'flex',alignItems:'center',gap:20}}>
            <CalorieRing C={C} size={110} kcal={TOTALS.kcal} target={TARGET.kcal} weekAvg={WEEK_AVG.kcal}/>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {[['PROT',TOTALS.p,TARGET.p],['CARB',TOTALS.c,TARGET.c],['FAT',TOTALS.f,TARGET.f]].map(([l,v,t])=>(
                <div key={l}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                    <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,letterSpacing:1.2,color:C.muted}}>{l}</span>
                    <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,fontWeight:700,color:C.ink}}>{v}g</span>
                  </div>
                  <div style={{width:120,height:4,background:C.hair,borderRadius:2,overflow:'hidden'}}>
                    <div style={{width:`${Math.min(1,v/t)*100}%`,height:'100%',background:C.accent,borderRadius:2}}/>
                  </div>
                </div>
              ))}
            </div>
          </div>
          {/* Weigh-in chip */}
          <div style={{height:30,padding:'0 14px',borderRadius:999,background:C.accentSoft,border:`1px solid ${C.accent}44`,display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="2" strokeLinecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,fontWeight:700,color:C.accent,letterSpacing:0.8}}>LOG WEIGHT · 78.4 KG</span>
          </div>
        </div>
        <DateStrip C={C} selectedDay={day} onSelectDay={setDay}/>
      </div>
      <div style={{flex:1,overflowY:'auto',paddingBottom:100,animation:'slideLeft 0.2s ease-out'}}>
        {TODAY_MEALS.map(m => <MealBlockCard key={m.id} C={C} meal={m} FoodRow={FoodRowBloomberg}/>)}
        <div style={{height:8}}/>
      </div>
      <DockedSearch C={C}/>
      <TabBar C={C}/>
    </div>
  );
}

// ── Layout ────────────────────────────────────────────────────
function PhoneCard({num, vibe, children}) {
  return (
    <div className="pcard">
      <div><div className="card-label"><span className="num">{num}</span><span className="vibe">{vibe}</span></div></div>
      <div className="frame"><div className="screen">{children}</div></div>
    </div>
  );
}

function App() {
  return (
    <div className="canvas">
      <h1>Fuel · Log Screen</h1>
      <p className="h1-sub">Four density/style directions. Sage green accent. Header always fixed — only the meal list slides on day change. Docked search bar for food entry. Planned items show with dashed checkbox. Light + dark.</p>

      <div className="section-label">A · RING HERO + CARD MEALS + MINIMAL ROWS</div>
      <p className="section-desc">Big calorie ring left, macro bars right. Meals in elevated cards. Food items show name · amount · kcal only. Clean and visual.</p>
      <div className="grid">
        <PhoneCard num="A1" vibe="Light"><FuelLogA C={FL}/></PhoneCard>
        <PhoneCard num="A2" vibe="Dark"><FuelLogA C={FD}/></PhoneCard>
      </div>

      <div className="section-label">B · BLOOMBERG TICKER + FLAT MEALS + MACRO ROWS</div>
      <p className="section-desc">Always-dark ticker strip with all stats. Remaining kcal prominent. Flat meal sections (no cards). Food rows show macros P/C/F inline.</p>
      <div className="grid">
        <PhoneCard num="B1" vibe="Light"><FuelLogB C={FL}/></PhoneCard>
        <PhoneCard num="B2" vibe="Dark"><FuelLogB C={FD}/></PhoneCard>
      </div>

      <div className="section-label">C · COMPACT RING + FLAT MEALS + BAR ROWS</div>
      <p className="section-desc">Smallest ring, all in the header row. Most scroll space for food. Each food item has tiny macro bars below it (Bloomberg style).</p>
      <div className="grid">
        <PhoneCard num="C1" vibe="Light"><FuelLogC C={FL}/></PhoneCard>
        <PhoneCard num="C2" vibe="Dark"><FuelLogC C={FD}/></PhoneCard>
      </div>

      <div className="section-label">D · BIG RING HERO + WEIGH-IN CHIP + CARD MEALS + BAR ROWS</div>
      <p className="section-desc">Largest ring centered at top. Weigh-in chip below ring. Card meals with bloomberg food rows. Most information per row.</p>
      <div className="grid">
        <PhoneCard num="D1" vibe="Light"><FuelLogD C={FL}/></PhoneCard>
        <PhoneCard num="D2" vibe="Dark"><FuelLogD C={FD}/></PhoneCard>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
