<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Pump — Post-Workout Summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f0ece4; min-height: 100vh; font-family: 'Archivo', system-ui; color: #1a1a1a; }
  .canvas { padding: 60px 40px 120px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 52px; letter-spacing: -1.5px; line-height: 1; max-width: 1400px; margin: 0 auto 12px; }
  .h1-sub { font-family: 'Archivo'; font-size: 15px; color: #777; max-width: 700px; margin: 0 auto 56px; line-height: 1.5; }
  .grid { display: flex; gap: 56px; max-width: 1400px; margin: 0 auto; align-items: flex-start; justify-content: center; }
  .card { display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
  .card-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }
  .card-label .num { color: #c8553d; font-weight: 700; }
  .card-label .vibe { color: #1a1a1a; font-weight: 600; margin-left: 6px; }
  .frame { width: 390px; height: 844px; border-radius: 48px; padding: 4px; background: linear-gradient(135deg, #cbcac4, #b9b8b2); box-shadow: 0 40px 80px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.4); flex-shrink: 0; }
  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; position: relative; }
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .tk { display: inline-flex; gap: 32px; animation: ticker 38s linear infinite; white-space: nowrap; padding-left: 32px; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.6px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

// ── Tokens ────────────────────────────────────────────────────
const T = {
  light: {
    bg:       '#fbf8f2',
    surf:     '#f4f0e6',
    surf2:    '#ece7d8',
    ink:      '#1f1c19',
    muted:    'rgba(31,28,25,0.5)',
    faint:    'rgba(31,28,25,0.15)',
    hair:     'rgba(31,28,25,0.08)',
    hair2:    'rgba(31,28,25,0.14)',
    inputBg:  '#f4f0e6',
    accent:   '#c8553d',
    down:     '#c0341a',
    // share card — light cream, proper light mode
    cardBg:   '#faf5ec',
    cardBorder:'rgba(31,28,25,0.11)',
    cardFg:   '#1f1c19',
    cardMuted:'rgba(31,28,25,0.45)',
    cardHair: 'rgba(31,28,25,0.09)',
    cardUp:   '#1f8f5a',
    cardPr:   '#c9892e',
    // ticker always dark regardless of mode
    tickerBg: '#1a1816',
    tickerFg: '#ece5d6',
  },
  dark: {
    bg:       '#1a1816',
    surf:     '#252220',
    surf2:    '#2e2a26',
    ink:      '#ece5d6',
    muted:    'rgba(236,229,214,0.5)',
    faint:    'rgba(236,229,214,0.15)',
    hair:     'rgba(236,229,214,0.08)',
    hair2:    'rgba(236,229,214,0.14)',
    inputBg:  '#252220',
    accent:   '#dc7d4a',
    down:     '#e05a45',
    cardBg:   '#0e0c0a',
    cardBorder:'rgba(255,255,255,0.06)',
    cardFg:   '#ece5d6',
    cardMuted:'rgba(236,229,214,0.45)',
    cardHair: 'rgba(236,229,214,0.08)',
    cardUp:   '#7fcf9f',
    cardPr:   '#d4a03c',
    tickerBg: '#0e0c0a',
    tickerFg: '#ece5d6',
  }
};

// ── Session data ──────────────────────────────────────────────
const SESSION = {
  name:      'Push Day',
  date:      'SAT 2 MAY 2026',
  duration:  '58:42',
  calories:  342,
  sets:      28,
  exercises: 6,
  improved:  4,
  prs:       2,
  streak:    13,
  volumeDelta: '+8.4%',
  exercises_list: [
    { name:'Bench Press',    sets:5, improved:true,  pr:true,  delta:'+5KG',   kg:'105×3' },
    { name:'Overhead Press', sets:4, improved:true,  pr:false, delta:'+2KG',   kg:'72.5×4' },
    { name:'Incline DB',     sets:3, improved:false, pr:false, delta:'—',      kg:'34×8' },
    { name:'Cable Fly',      sets:4, improved:true,  pr:false, delta:'+5%',    kg:'18×12' },
    { name:'Tricep PD',      sets:4, improved:true,  pr:false, delta:'+2.5KG', kg:'40×10' },
    { name:'Lateral Raise',  sets:3, improved:false, pr:false, delta:'—',      kg:'12×12' },
  ],
  muscles: [
    { id:'chest',     heat:0.95 },
    { id:'shoulders', heat:0.78 },
    { id:'triceps',   heat:0.80 },
    { id:'core',      heat:0.18 },
    { id:'back',      heat:0.06 },
    { id:'quads',     heat:0.04 },
  ]
};

// ── Sorting: PRs first → improved → unimproved ───────────────
function sortedExercises(list) {
  return [...list].sort((a, b) => {
    const sa = a.pr ? 2 : a.improved ? 1 : 0;
    const sb = b.pr ? 2 : b.improved ? 1 : 0;
    return sb - sa;
  });
}

const MAX_IN_CARD = 6;

// ── Thermal coloring ──────────────────────────────────────────
function thermal(t) {
  const stops = [[0,[240,236,226]],[0.2,[236,214,184]],[0.45,[226,170,124]],[0.7,[212,118,88]],[1.0,[192,72,60]]];
  t = Math.max(0, Math.min(1, t));
  for (let i=0;i<stops.length-1;i++) {
    const [a,ca]=stops[i],[b,cb]=stops[i+1];
    if (t<=b) { const k=(t-a)/(b-a); return `rgb(${Math.round(ca[0]+(cb[0]-ca[0])*k)},${Math.round(ca[1]+(cb[1]-ca[1])*k)},${Math.round(ca[2]+(cb[2]-ca[2])*k)})`; }
  }
  return 'rgb(192,72,60)';
}
function heatOf(id) { return thermal(SESSION.muscles.find(m=>m.id===id)?.heat||0); }

// ── Body silhouette ───────────────────────────────────────────
function BodySilhouette({ size=76, showBack=false, C }) {
  // strokes adapt to card theme
  const stroke = C.cardHair;
  const base   = 'rgba(128,110,90,0.07)';
  const h = size * 480/200;
  return (
    <svg viewBox="0 0 200 480" width={size} height={h} style={{ display:'block' }}>
      <g fill={base} stroke="none">
        <ellipse cx="100" cy="32" rx="22" ry="26"/>
        <rect x="90" y="54" width="20" height="18" rx="4"/>
        <path d="M60 76 Q54 130 56 200 Q58 260 68 310 L72 340 L128 340 L132 310 Q142 260 144 200 Q146 130 140 76Z"/>
        <path d="M60 76 Q46 86 40 108 Q34 140 36 180 Q38 220 48 240 L58 238 Q56 200 58 160 Q60 110 64 88Z"/>
        <path d="M140 76 Q154 86 160 108 Q166 140 164 180 Q162 220 152 240 L142 238 Q144 200 142 160 Q140 110 136 88Z"/>
        <path d="M48 240 Q40 268 36 300 L46 302 Q54 276 58 244Z"/>
        <path d="M152 240 Q160 268 164 300 L154 302 Q146 276 142 244Z"/>
        <path d="M72 340 Q66 390 64 440 L90 440 Q94 400 96 350Z"/>
        <path d="M128 340 Q134 390 136 440 L110 440 Q106 400 104 350Z"/>
      </g>
      <g stroke={stroke} strokeWidth="0.8">
        {!showBack ? (<>
          <path fill={heatOf('chest')}     d="M72 92 Q68 110 74 130 Q84 140 96 138 L96 94 Q84 88 72 92Z"/>
          <path fill={heatOf('chest')}     d="M128 92 Q132 110 126 130 Q116 140 104 138 L104 94 Q116 88 128 92Z"/>
          <path fill={heatOf('shoulders')} d="M56 80 Q46 90 42 108 Q50 114 62 112 Q66 96 64 84Z"/>
          <path fill={heatOf('shoulders')} d="M144 80 Q154 90 158 108 Q150 114 138 112 Q134 96 136 84Z"/>
          <path fill={heatOf('triceps')}   d="M42 112 Q38 140 44 168 Q52 168 60 160 Q62 136 60 114Z"/>
          <path fill={heatOf('triceps')}   d="M158 112 Q162 140 156 168 Q148 168 140 160 Q138 136 140 114Z"/>
          <g fill={heatOf('core')}>
            <rect x="86" y="144" width="28" height="14" rx="3"/>
            <rect x="86" y="162" width="28" height="14" rx="3"/>
            <rect x="86" y="180" width="28" height="14" rx="3"/>
          </g>
          <path fill={heatOf('quads')} d="M70 340 Q64 380 66 420 L92 420 Q94 380 94 346Z"/>
          <path fill={heatOf('quads')} d="M130 340 Q136 380 134 420 L108 420 Q106 380 106 346Z"/>
        </>) : (<>
          <path fill={heatOf('back')}      d="M70 102 Q66 150 72 200 L100 210 L128 200 Q134 150 130 102 Q118 108 100 108 Q82 108 70 102Z"/>
          <path fill={heatOf('shoulders')} d="M56 80 Q46 90 42 108 Q50 114 62 112 Q66 96 64 84Z"/>
          <path fill={heatOf('shoulders')} d="M144 80 Q154 90 158 108 Q150 114 138 112 Q134 96 136 84Z"/>
        </>)}
      </g>
    </svg>
  );
}

// ── Status bar ────────────────────────────────────────────────
const StatusBar = ({ dark=false }) => (
  <div style={{ height:50, display:'flex', alignItems:'flex-end', justifyContent:'center', paddingBottom:6, flexShrink:0 }}>
    <div style={{ width:126, height:37, background: dark ? 'rgba(255,255,255,0.12)' : '#000', borderRadius:24 }}/>
  </div>
);

// ── Ticker strip (always dark) ────────────────────────────────
function TickerStrip() {
  const items = [
    ['PUSH DAY','DONE',null],['BENCH','PR +5KG',true],['OHP','PR +2KG',true],
    ['IMPROVED','4/6',true],['VOL','▲ 8.4%',true],['STREAK','13 DAYS',null],
    ['SETS','28',null],['KCAL','342',null],['DURATION','58:42',null],['1RM BENCH','~118KG',null],
  ];
  return (
    <div style={{ background:'#1a1816', height:26, overflow:'hidden', display:'flex', alignItems:'center', borderBottom:'1px solid rgba(236,229,214,0.06)' }}>
      <div className="tk">
        {[...items,...items].map(([k,v,u],i) => (
          <span key={i} style={{ display:'inline-flex', alignItems:'center', gap:7 }}>
            <span style={{ color:'rgba(236,229,214,0.5)', letterSpacing:1 }}>{k}</span>
            <span style={{ color: u===true ? '#7fcf9f' : 'rgba(236,229,214,0.85)', fontWeight:700 }}>{u===true && '▲ '}{v}</span>
            <span style={{ color:'rgba(236,229,214,0.18)', marginLeft:4 }}>·</span>
          </span>
        ))}
      </div>
    </div>
  );
}

// ── Share card ────────────────────────────────────────────────
function ShareCard({ C }) {
  const sorted = sortedExercises(SESSION.exercises_list);
  const visible = sorted.slice(0, MAX_IN_CARD);
  const hiddenCount = sorted.length - MAX_IN_CARD;

  return (
    <div style={{ background:C.cardBg, border:`1px solid ${C.cardBorder}`, borderRadius:16, overflow:'hidden', margin:'14px 14px 0', boxShadow: C.cardBg==='#faf5ec' ? '0 2px 16px rgba(0,0,0,0.09)' : '0 12px 40px rgba(0,0,0,0.40)' }}>

      {/* Ticker — always the dark black strip */}
      <TickerStrip/>

      <div style={{ padding:'16px 16px 14px' }}>

        {/* Session name + duration */}
        <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:12 }}>
          <div>
            <div style={{ fontFamily:'"Space Mono",monospace', fontSize:9, color:C.cardMuted, letterSpacing:1.6, textTransform:'uppercase', marginBottom:4 }}>{SESSION.date}</div>
            <div style={{ fontFamily:'"Archivo",sans-serif', fontWeight:900, fontSize:44, letterSpacing:0.5, lineHeight:0.88, color:C.cardFg }}>{SESSION.name}</div>
          </div>
          <div style={{ textAlign:'right' }}>
            <div style={{ fontFamily:'"Space Mono",monospace', fontSize:8, color:C.cardMuted, letterSpacing:1.2, marginBottom:3 }}>DURATION</div>
            <div style={{ fontFamily:'"Archivo",sans-serif', fontSize:26, color:C.cardFg, letterSpacing:1, lineHeight:1 }}>{SESSION.duration}</div>
          </div>
        </div>

        {/* Stats grid */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', borderTop:`1px solid ${C.cardHair}`, borderBottom:`1px solid ${C.cardHair}`, padding:'9px 0', marginBottom:12 }}>
          {[
            { lbl:'SETS',   val:SESSION.sets,              delta:null },
            { lbl:'KCAL',   val:SESSION.calories,           delta:null },
            { lbl:'VOL',    val:'12.8K',                    delta:SESSION.volumeDelta },
            { lbl:'STREAK', val:`${SESSION.streak}D`,       delta:null },
          ].map((s,i) => (
            <div key={i} style={{ borderRight:i<3?`1px solid ${C.cardHair}`:'none', padding:'0 8px', textAlign:'center' }}>
              <div style={{ fontFamily:'"Space Mono",monospace', fontSize:8, color:C.cardMuted, letterSpacing:1.2, marginBottom:3 }}>{s.lbl}</div>
              <div style={{ fontFamily:'"Archivo",sans-serif', fontSize:21, color:C.cardFg, lineHeight:0.9 }}>{s.val}</div>
              {s.delta && <div style={{ fontFamily:'"Space Mono",monospace', fontSize:8, color:C.cardUp, fontWeight:700, marginTop:2 }}>▲ {s.delta}</div>}
            </div>
          ))}
        </div>

        {/* Body heatmap + improvement hero */}
        <div style={{ display:'flex', alignItems:'center', gap:14, marginBottom:12 }}>
          <div style={{ display:'flex', gap:5, flexShrink:0 }}>
            <div>
              <div style={{ fontFamily:'"Space Mono",monospace', fontSize:7, color:C.cardMuted, letterSpacing:1, marginBottom:3, textAlign:'center' }}>FRONT</div>
              <BodySilhouette size={72} C={C}/>
            </div>
            <div>
              <div style={{ fontFamily:'"Space Mono",monospace', fontSize:7, color:C.cardMuted, letterSpacing:1, marginBottom:3, textAlign:'center' }}>BACK</div>
              <BodySilhouette size={72} showBack C={C}/>
            </div>
          </div>
          <div style={{ flex:1 }}>
            <div style={{ display:'flex', alignItems:'baseline', gap:5, marginBottom:2 }}>
              <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:58, color:C.cardUp, lineHeight:0.85, letterSpacing:1 }}>{SESSION.improved}</span>
              <div>
                <div style={{ fontFamily:'"Space Mono",monospace', fontSize:9, color:C.cardMuted, letterSpacing:0.8 }}>OF {SESSION.exercises}</div>
                <div style={{ fontFamily:'"Space Mono",monospace', fontSize:8, color:C.cardMuted, letterSpacing:0.8 }}>IMPROVED</div>
              </div>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:6, paddingTop:7, borderTop:`1px solid ${C.cardHair}` }}>
              <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:18, color:C.cardPr, letterSpacing:0.5, lineHeight:1 }}>★ {SESSION.prs} NEW PRS</span>
            </div>
            {sorted.filter(e=>e.pr).map((e,i) => (
              <div key={i} style={{ display:'flex', alignItems:'center', gap:5, marginTop:3 }}>
                <span style={{ fontFamily:'"Space Mono",monospace', fontSize:9, color:C.cardMuted, textTransform:'uppercase' }}>{e.name}</span>
                <span style={{ fontFamily:'"Space Mono",monospace', fontSize:9, color:C.cardPr, fontWeight:700 }}>{e.delta}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Exercise breakdown — sorted: PRs → improved → unimproved */}
        <div style={{ borderTop:`1px solid ${C.cardHair}` }}>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 36px 66px 28px', padding:'5px 0 3px', fontFamily:'"Space Mono",monospace', fontSize:7, letterSpacing:1.2, color:C.cardMuted, borderBottom:`1px solid ${C.cardHair}` }}>
            <span>EXERCISE</span>
            <span style={{ textAlign:'center' }}>SETS</span>
            <span style={{ textAlign:'right' }}>BEST SET</span>
            <span style={{ textAlign:'right' }}>▲</span>
          </div>
          {visible.map((ex,i) => (
            <div key={i} style={{ display:'grid', gridTemplateColumns:'1fr 36px 66px 28px', alignItems:'center', padding:'4px 0', borderBottom: i<visible.length-1 ? `1px solid ${C.cardHair}` : 'none' }}>
              <div style={{ display:'flex', alignItems:'center', gap:5 }}>
                <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:12, fontWeight:ex.improved?600:400, color: ex.improved ? C.cardFg : C.cardMuted }}>{ex.name}</span>
                {ex.pr && <span style={{ fontFamily:'"Space Mono",monospace', fontSize:9, color:C.cardPr, fontWeight:700 }}>★</span>}
              </div>
              <div style={{ fontFamily:'"Space Mono",monospace', fontSize:10, color:C.cardMuted, textAlign:'center' }}>{ex.sets}</div>
              <div style={{ fontFamily:'"Archivo",sans-serif', fontSize:13, color: ex.improved ? C.cardFg : C.cardMuted, textAlign:'right', letterSpacing:0.5 }}>{ex.kg}</div>
              <div style={{ textAlign:'right' }}>
                {ex.improved
                  ? <span style={{ fontFamily:'"Space Mono",monospace', fontSize:10, color:C.cardUp, fontWeight:700 }}>▲</span>
                  : <span style={{ color:C.cardMuted, fontSize:10 }}>—</span>}
              </div>
            </div>
          ))}
          {hiddenCount > 0 && (
            <div style={{ paddingTop:5 }}>
              <span style={{ fontFamily:'"Space Mono",monospace', fontSize:9, color:C.cardMuted, letterSpacing:1 }}>+{hiddenCount} MORE EXERCISES</span>
            </div>
          )}
        </div>

        {/* Watermark */}
        <div style={{ marginTop:10, display:'flex', alignItems:'center', gap:5 }}>
          <div style={{ width:7, height:7, background:C.cardPr, borderRadius:2 }}/>
          <span style={{ fontFamily:'"Space Mono",monospace', fontSize:8, color:C.cardMuted, letterSpacing:1.5 }}>PULSE / PUMP</span>
        </div>
      </div>
    </div>
  );
}

// ── Three-dot dropdown menu ───────────────────────────────────
function DotsMenu({ C, onClose }) {
  return (
    <div style={{ position:'absolute', bottom:88, right:14, zIndex:200, background:C.bg, border:`1px solid ${C.hair2}`, borderRadius:14, overflow:'hidden', boxShadow:'0 8px 36px rgba(0,0,0,0.22)', minWidth:200 }}>
      {[
        {
          icon: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.ink} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
          title: 'Save workout',
          sub:   'Saved locally, not posted',
        },
        {
          icon: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.ink} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>,
          title: 'Share via…',
          sub:   'iOS share sheet',
        },
      ].map((item, i, arr) => (
        <div key={i} onClick={onClose} style={{ display:'flex', alignItems:'center', gap:12, padding:'13px 16px', borderBottom: i<arr.length-1 ? `1px solid ${C.hair}` : 'none', cursor:'pointer' }}>
          {item.icon}
          <div>
            <div style={{ fontFamily:'"Archivo",sans-serif', fontSize:14, fontWeight:600, color:C.ink }}>{item.title}</div>
            <div style={{ fontFamily:'"Archivo",sans-serif', fontSize:11, color:C.muted, marginTop:1 }}>{item.sub}</div>
          </div>
        </div>
      ))}
      <div style={{ height:1, background:C.hair }}/>
      <div onClick={onClose} style={{ display:'flex', alignItems:'center', gap:12, padding:'13px 16px', cursor:'pointer' }}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.down} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
        </svg>
        <div style={{ fontFamily:'"Archivo",sans-serif', fontSize:14, fontWeight:600, color:C.down }}>Discard workout</div>
      </div>
    </div>
  );
}

// ── Caption composer ──────────────────────────────────────────
function CaptionComposer({ C }) {
  const [menuOpen, setMenuOpen] = React.useState(false);
  const friends = ['Jay', 'Marcus', 'Priya'];

  return (
    <div style={{ padding:'14px 14px 20px', background:C.bg, borderTop:`1px solid ${C.hair2}`, position:'relative' }}>

      {menuOpen && <DotsMenu C={C} onClose={() => setMenuOpen(false)}/>}

      {/* Caption input */}
      <div style={{ display:'flex', gap:10, alignItems:'flex-start', marginBottom:12 }}>
        <div style={{ width:34, height:34, borderRadius:'50%', background:C.surf2, border:`1px solid ${C.hair2}`, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
          <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:15, color:C.muted }}>J</span>
        </div>
        <div style={{ flex:1, background:C.inputBg, borderRadius:10, border:`1px solid ${C.hair2}`, padding:'9px 12px', minHeight:56 }}>
          <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:14, color:C.muted, lineHeight:1.4 }}>Add a caption…</span>
        </div>
      </div>

      {/* Tag friends */}
      <div style={{ marginBottom:12 }}>
        <div style={{ fontFamily:'"Space Mono",monospace', fontSize:9, color:C.muted, letterSpacing:1.3, marginBottom:7 }}>TAG FRIENDS</div>
        <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
          {friends.map((f,i) => (
            <div key={i} style={{ display:'flex', alignItems:'center', gap:6, height:30, padding:'0 10px', borderRadius:999, background:C.surf, border:`1px solid ${C.hair2}`, cursor:'pointer' }}>
              <div style={{ width:16, height:16, borderRadius:'50%', background:C.surf2, display:'flex', alignItems:'center', justifyContent:'center' }}>
                <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:9, color:C.muted }}>{f[0]}</span>
              </div>
              <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:12, fontWeight:500, color:C.ink }}>{f}</span>
            </div>
          ))}
          <div style={{ height:30, padding:'0 10px', borderRadius:999, border:`1px dashed ${C.faint}`, display:'flex', alignItems:'center', cursor:'pointer' }}>
            <span style={{ fontFamily:'"Space Mono",monospace', fontSize:10, color:C.muted, letterSpacing:0.5 }}>+ ADD</span>
          </div>
        </div>
      </div>

      {/* Share destination chips */}
      <div style={{ marginBottom:14 }}>
        <div style={{ fontFamily:'"Space Mono",monospace', fontSize:9, color:C.muted, letterSpacing:1.3, marginBottom:7 }}>SHARE TO</div>
        <div style={{ display:'flex', gap:6 }}>
          {[
            { label:'PULSE FEED', active:true },
            { label:'INSTAGRAM',  active:false },
            { label:'MESSAGES',   active:false },
          ].map((d,i) => (
            <div key={i} style={{ height:30, padding:'0 12px', borderRadius:999, background:d.active?C.accent:'transparent', border:`1px solid ${d.active?C.accent:C.hair2}`, display:'flex', alignItems:'center', cursor:'pointer' }}>
              <span style={{ fontFamily:'"Space Mono",monospace', fontSize:9, fontWeight:700, color:d.active?'#fff':C.muted, letterSpacing:0.8 }}>{d.label}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Actions: big POST pill + ··· menu button */}
      <div style={{ display:'flex', gap:8 }}>
        <div style={{ flex:1, height:54, borderRadius:14, background:C.accent, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', boxShadow:`0 10px 24px rgba(200,85,61,0.26)` }}>
          <span style={{ fontFamily:'"Archivo",sans-serif', fontWeight:900, fontSize:20, letterSpacing:1.5, color:'#fff', whiteSpace:'nowrap' }}>POST</span>
        </div>
        <div onClick={() => setMenuOpen(o => !o)} style={{ width:54, height:54, borderRadius:14, background:C.surf, border:`1px solid ${C.hair2}`, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0 }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill={C.ink}>
            <circle cx="5"  cy="12" r="1.8"/>
            <circle cx="12" cy="12" r="1.8"/>
            <circle cx="19" cy="12" r="1.8"/>
          </svg>
        </div>
      </div>
    </div>
  );
}

// ── Full screen ───────────────────────────────────────────────
function PostWorkoutScreen({ mode='light' }) {
  const C = T[mode];
  return (
    <div style={{ width:'100%', height:'100%', background:C.bg, display:'flex', flexDirection:'column', overflow:'hidden', fontFamily:'"Archivo",sans-serif', color:C.ink }}>
      <StatusBar dark={mode==='dark'}/>

      {/* Screen header */}
      <div style={{ padding:'2px 16px 10px', display:'flex', alignItems:'center', justifyContent:'space-between', borderBottom:`1px solid ${C.hair}` }}>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:18, color:C.muted, fontWeight:300 }}>‹</span>
          <div>
            <div style={{ fontFamily:'"Space Mono",monospace', fontSize:9, color:C.muted, letterSpacing:1.2 }}>WORKOUT COMPLETE</div>
            <div style={{ fontFamily:'"Archivo",sans-serif', fontSize:18, lineHeight:1, letterSpacing:0.8, color:C.ink }}>PUSH DAY</div>
          </div>
        </div>
        <div style={{ fontFamily:'"Space Mono",monospace', fontSize:10, color:C.muted, letterSpacing:0.8 }}>SAT 2 MAY</div>
      </div>

      {/* Scrollable */}
      <div style={{ flex:1, overflowY:'auto' }}>
        <ShareCard C={C}/>
        <CaptionComposer C={C}/>
      </div>
    </div>
  );
}

// ── Wrapper ───────────────────────────────────────────────────
function Card({ num, vibe, children }) {
  return (
    <div className="card">
      <div style={{ marginBottom:4 }}>
        <div className="card-label"><span className="num">{num}</span><span className="vibe">{vibe}</span></div>
      </div>
      <div className="frame"><div className="screen">{children}</div></div>
    </div>
  );
}

function App() {
  return (
    <div className="canvas">
      <h1>Post-Workout Summary</h1>
      <p className="h1-sub">Share card with Bloomberg ticker header. Best exercises sorted first. Instagram-style caption composer with friend tagging. Big POST pill + ··· menu for save/share.</p>
      <div className="grid">
        <Card num="A" vibe="Light mode"><PostWorkoutScreen mode="light"/></Card>
        <Card num="B" vibe="Dark mode"><PostWorkoutScreen mode="dark"/></Card>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
