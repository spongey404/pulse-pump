</style>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const L = {
  bg:      '#fbf8f2',
  surf:    '#f4f0e6',
  surf2:   '#ece7d8',
  surf3:   '#e2dccd',
  ink:     '#1f1c19',
  ink2:    '#3a342d',
  muted:   'rgba(31,28,25,0.5)',
  faint:   'rgba(31,28,25,0.16)',
  hair:    'rgba(31,28,25,0.08)',
  hair2:   'rgba(31,28,25,0.14)',
  accent:  '#c8553d',
  up:      '#1f8f5a',
  down:    '#c0341a',
  pr:      '#c9892e', // muted gold for PR
  tickerBg:'#1a1816',
  tickerFg:'#ece5d6',
};

// ── Session data ──────────────────────────────────────────────
const SESSION = {
  name: 'Push Day',
  date: 'Mon 2 May 2026',
  duration: '58:42',
  calories: 342,
  sets: 28,
  exercises: 6,
  improved: 4,
  prs: 2,
  volume: 12840,
  volumeDelta: '+8.4%',
  streak: 13,
  exercises_list: [
    { name: 'Bench Press',    sets: 5, improved: true,  pr: true,  delta: '+5KG', kg:'105×3', rir: 2 },
    { name: 'Overhead Press', sets: 4, improved: true,  pr: false, delta: '+2KG', kg:'72.5×4', rir: 2 },
    { name: 'Incline DB',     sets: 3, improved: false, pr: false, delta: '—',    kg:'34×8',  rir: 3 },
    { name: 'Cable Fly',      sets: 4, improved: true,  pr: false, delta: '+5%',  kg:'18×12', rir: null },
    { name: 'Tricep PD',      sets: 4, improved: true,  pr: false, delta: '+2.5KG', kg:'40×10', rir: 2 },
    { name: 'Lateral Raise',  sets: 3, improved: false, pr: false, delta: '—',    kg:'12×12', rir: null },
  ],
  muscles: [
    { id:'chest',     heat:0.95 },
    { id:'shoulders', heat:0.78 },
    { id:'triceps',   heat:0.80 },
    { id:'front_delt',heat:0.72 },
    { id:'core',      heat:0.18 },
    { id:'back',      heat:0.08 },
    { id:'quads',     heat:0.04 },
  ]
};

// ── Thermal coloring ─────────────────────────────────────────
function thermal(t) {
  const stops = [[0,[240,236,226]],[0.2,[236,214,184]],[0.45,[226,170,124]],[0.7,[212,118,88]],[1.0,[192,72,60]]];
  t = Math.max(0, Math.min(1, t));
  for (let i=0;i<stops.length-1;i++) {
    const [a,ca]=stops[i],[b,cb]=stops[i+1];
    if (t<=b) {
      const k=(t-a)/(b-a);
      return `rgb(${Math.round(ca[0]+(cb[0]-ca[0])*k)},${Math.round(ca[1]+(cb[1]-ca[1])*k)},${Math.round(ca[2]+(cb[2]-ca[2])*k)})`;
    }
  }
  return 'rgb(192,72,60)';
}

function heatOf(id) {
  return thermal(SESSION.muscles.find(m=>m.id===id)?.heat || 0);
}

// ── Body silhouette ──────────────────────────────────────────
function BodySilhouette({ size = 180, showBack = false }) {
  const c = heatOf;
  const stroke = 'rgba(31,28,25,0.07)';
  const base = 'rgba(31,28,25,0.03)';
  const w = size, h = size * 480/200;
  return (
    <svg viewBox="0 0 200 480" width={w} height={h} style={{ display:'block' }}>
      <g fill={base} stroke="none">
        <ellipse cx="100" cy="32" rx="22" ry="26"/>
        <rect x="90" y="54" width="20" height="18" rx="4"/>
        <path d="M60 76 Q54 130 56 200 Q58 260 68 310 L72 340 L128 340 L132 310 Q142 260 144 200 Q146 130 140 76Z"/>
        <path d="M60 76 Q46 86 40 108 Q34 140 36 180 Q38 220 48 240 L58 238 Q56 200 58 160 Q60 110 64 88Z"/>
        <path d="M140 76 Q154 86 160 108 Q166 140 164 180 Q162 220 152 240 L142 238 Q144 200 142 160 Q140 110 136 88Z"/>
        <path d="M48 240 Q40 268 36 300 L46 302 Q54 276 58 244Z"/>
        <path d="M152 240 Q160 268 164 300 L154 302 Q146 276 142 244Z"/>
        <path d="M72 340 Q66 390 64 440 L90 440 Q94 400 96 350Z"/>
        <path d="M128 340 Q134 390 136 440 L110 440 Q106 400 104 350Z"/>
      </g>
      <g stroke={stroke} strokeWidth="0.8">
        {!showBack ? (<>
          <path fill={c('chest')} d="M72 92 Q68 110 74 130 Q84 140 96 138 L96 94 Q84 88 72 92Z"/>
          <path fill={c('chest')} d="M128 92 Q132 110 126 130 Q116 140 104 138 L104 94 Q116 88 128 92Z"/>
          <path fill={c('shoulders')} d="M56 80 Q46 90 42 108 Q50 114 62 112 Q66 96 64 84Z"/>
          <path fill={c('shoulders')} d="M144 80 Q154 90 158 108 Q150 114 138 112 Q134 96 136 84Z"/>
          <path fill={c('triceps')} d="M42 112 Q38 140 44 168 Q52 168 60 160 Q62 136 60 114Z"/>
          <path fill={c('triceps')} d="M158 112 Q162 140 156 168 Q148 168 140 160 Q138 136 140 114Z"/>
          <g fill={c('core')}>
            <rect x="86" y="144" width="28" height="14" rx="3"/>
            <rect x="86" y="162" width="28" height="14" rx="3"/>
            <rect x="86" y="180" width="28" height="14" rx="3"/>
          </g>
          <path fill={c('quads')} d="M70 340 Q64 380 66 420 L92 420 Q94 380 94 346Z"/>
          <path fill={c('quads')} d="M130 340 Q136 380 134 420 L108 420 Q106 380 106 346Z"/>
        </>) : (<>
          <path fill={c('back')} d="M70 102 Q66 150 72 200 L100 210 L128 200 Q134 150 130 102 Q118 108 100 108 Q82 108 70 102Z"/>
          <path fill={c('shoulders')} d="M56 80 Q46 90 42 108 Q50 114 62 112 Q66 96 64 84Z"/>
          <path fill={c('shoulders')} d="M144 80 Q154 90 158 108 Q150 114 138 112 Q134 96 136 84Z"/>
        </>)}
      </g>
    </svg>
  );
}

// ── Status bar ───────────────────────────────────────────────
const StatusBar = () => (
  <div style={{ height:50, display:'flex', alignItems:'flex-end', justifyContent:'center', paddingBottom:6, flexShrink:0 }}>
    <div style={{ width:126, height:37, background:'#000', borderRadius:24 }}/>
  </div>
);

// ── Stat chip ────────────────────────────────────────────────
const Stat = ({ label, value, sub, accent, large }) => (
  <div>
    <div style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color:L.muted, letterSpacing:1.4, textTransform:'uppercase', marginBottom:3 }}>{label}</div>
    <div style={{ fontFamily:'"Bebas Neue"', fontSize: large ? 48 : 28, lineHeight:0.9, color: accent || L.ink, letterSpacing:0.5 }}>{value}</div>
    {sub && <div style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color:L.muted, marginTop:2 }}>{sub}</div>}
  </div>
);

// ── Ticker ──────────────────────────────────────────────────
const Ticker = () => {
  const items = [
    ['PUSH DAY','DONE',null],['IMPROVED','4/6',null],['VOL','▲ 8.4%',true],
    ['BENCH PR','105KG',null],['OHP PR','72.5KG',null],['STREAK','13',null],
    ['SETS','28',null],['KCAL','342',null],['DURATION','58:42',null],
  ];
  return (
    <div style={{ background:L.tickerBg, color:L.tickerFg, height:24, overflow:'hidden', display:'flex', alignItems:'center' }}>
      <style>{`@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}} .tk{display:inline-flex;gap:28px;animation:ticker 40s linear infinite;white-space:nowrap;padding-left:28px;font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.5px}`}</style>
      <div className="tk">
        {[...items,...items].map(([k,v,u],i) => (
          <span key={i} style={{ display:'inline-flex', alignItems:'center', gap:6 }}>
            <span style={{ opacity:0.75 }}>{k}</span>
            <span style={{ color: u===true ? '#7fcf9f' : u===false ? '#ff8b75' : 'rgba(236,229,214,0.7)', fontWeight:700 }}>{v}</span>
            <span style={{ color:'rgba(236,229,214,0.2)' }}>·</span>
          </span>
        ))}
      </div>
    </div>
  );
};
</script>
<script type="text/babel" data-presets="react">

// ═══════════════════════════════════════════════════════════════
// VARIANT A — Editorial Receipt
// Dense, scrollable. Masthead → stats strip → heatmap → exercise
// list with per-exercise improvement + PR markers.
// ═══════════════════════════════════════════════════════════════
function VariantA() {
  return (
    <div style={{ width:'100%', height:'100%', background:L.bg, display:'flex', flexDirection:'column', overflow:'hidden', fontFamily:'Inter, system-ui', color:L.ink }}>
      <StatusBar/>
      <Ticker/>

      {/* Masthead */}
      <div style={{ padding:'10px 16px 8px', borderBottom:`1px solid ${L.hair}` }}>
        <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between' }}>
          <div>
            <div style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color:L.muted, letterSpacing:1.4, textTransform:'uppercase' }}>{SESSION.date}</div>
            <div style={{ fontFamily:'"Bebas Neue"', fontSize:34, letterSpacing:0.5, lineHeight:0.95, marginTop:2 }}>{SESSION.name}</div>
          </div>
          <div style={{ fontFamily:'"Bebas Neue"', fontSize:52, letterSpacing:1, lineHeight:0.85, color:L.ink }}>{SESSION.duration}</div>
        </div>
        {/* improvement line */}
        <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:8, paddingTop:8, borderTop:`1px solid ${L.hair}` }}>
          <span style={{ fontFamily:'"Bebas Neue"', fontSize:22, color:L.up, letterSpacing:0.5 }}>▲ {SESSION.improved}/{SESSION.exercises}</span>
          <span style={{ fontFamily:'"DM Mono", monospace', fontSize:10, color:L.muted }}>exercises improved</span>
          <div style={{ width:1, height:14, background:L.hair2, marginLeft:4, marginRight:4 }}/>
          <span style={{ fontFamily:'"Bebas Neue"', fontSize:22, color:L.pr, letterSpacing:0.5 }}>★ {SESSION.prs}</span>
          <span style={{ fontFamily:'"DM Mono", monospace', fontSize:10, color:L.muted }}>new PRs</span>
        </div>
      </div>

      <div style={{ flex:1, overflowY:'auto' }}>

        {/* Stats strip */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', borderBottom:`1px solid ${L.hair}` }}>
          {[
            { lbl:'SETS',  val:SESSION.sets,     d:'▲ +3', up:true },
            { lbl:'KCAL',  val:SESSION.calories,  d:'▲ +12%', up:true },
            { lbl:'VOL',   val:'12.8K', d:SESSION.volumeDelta, up:true },
            { lbl:'STREAK',val:SESSION.streak, d:'days', up:null },
          ].map((s,i) => (
            <div key={i} style={{ padding:'10px 12px', borderRight: i<3 ? `1px solid ${L.hair}` : 'none' }}>
              <div style={{ fontFamily:'"DM Mono", monospace', fontSize:8, color:L.muted, letterSpacing:1.2, textTransform:'uppercase', marginBottom:3 }}>{s.lbl}</div>
              <div style={{ fontFamily:'"Bebas Neue"', fontSize:22, color:L.ink, lineHeight:0.9 }}>{s.val}</div>
              <div style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color: s.up===true ? L.up : s.up===false ? L.down : L.muted, marginTop:2, fontWeight:700 }}>{s.d}</div>
            </div>
          ))}
        </div>

        {/* Heatmap */}
        <div style={{ padding:'12px 16px', borderBottom:`1px solid ${L.hair}`, display:'flex', gap:16, alignItems:'flex-start' }}>
          <div style={{ flex:'none' }}>
            <div style={{ fontFamily:'"DM Mono", monospace', fontSize:8, color:L.muted, letterSpacing:1.2, textTransform:'uppercase', marginBottom:6 }}>MUSCLES WORKED</div>
            <div style={{ display:'flex', gap:4 }}>
              <BodySilhouette size={100}/>
              <BodySilhouette size={100} showBack/>
            </div>
          </div>
          <div style={{ flex:1, paddingTop:20 }}>
            {SESSION.muscles.filter(m=>m.heat>0.05).sort((a,b)=>b.heat-a.heat).slice(0,6).map(m => (
              <div key={m.id} style={{ display:'flex', alignItems:'center', gap:6, marginBottom:5 }}>
                <div style={{ width:5, height:5, borderRadius:'50%', background:thermal(m.heat), flexShrink:0 }}/>
                <div style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color:L.ink, textTransform:'uppercase', letterSpacing:0.8, flex:1 }}>{m.id.replace('_',' ')}</div>
                <div style={{ height:4, width:60, background:L.hair, borderRadius:2 }}>
                  <div style={{ width:`${m.heat*100}%`, height:'100%', background:thermal(m.heat), borderRadius:2 }}/>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Exercise breakdown */}
        <div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 44px 72px 32px', padding:'5px 16px', borderBottom:`1px solid ${L.hair2}`, fontFamily:'"DM Mono", monospace', fontSize:8, letterSpacing:1.2, color:L.muted, background:L.surf }}>
            <span>EXERCISE</span>
            <span style={{ textAlign:'center' }}>SETS</span>
            <span style={{ textAlign:'right' }}>BEST SET</span>
            <span style={{ textAlign:'right' }}>▲</span>
          </div>
          {SESSION.exercises_list.map((ex, i) => (
            <div key={i} style={{ display:'grid', gridTemplateColumns:'1fr 44px 72px 32px', alignItems:'center', padding:'9px 16px', borderBottom:`1px solid ${L.hair}`, background: ex.improved ? 'transparent' : 'transparent' }}>
              <div>
                <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                  <span style={{ fontFamily:'Inter', fontSize:13, fontWeight:500, color:L.ink }}>{ex.name}</span>
                  {ex.pr && <span style={{ fontFamily:'"DM Mono", monospace', fontSize:9, fontWeight:700, color:L.pr }}>★</span>}
                </div>
                {ex.delta !== '—' && <div style={{ fontFamily:'"DM Mono", monospace', fontSize:9, color:L.up, marginTop:1, fontWeight:700 }}>{ex.delta}</div>}
              </div>
              <div style={{ fontFamily:'"DM Mono", monospace', fontSize:11, color:L.muted, textAlign:'center' }}>{ex.sets}</div>
              <div style={{ fontFamily:'"Bebas Neue"', fontSize:16, color:L.ink, textAlign:'right', letterSpacing:0.5 }}>{ex.kg}</div>
              <div style={{ textAlign:'right' }}>
                {ex.improved
                  ? <span style={{ color:L.up, fontWeight:700, fontSize:13 }}>▲</span>
                  : <span style={{ color:L.faint, fontSize:13 }}>—</span>}
              </div>
            </div>
          ))}
        </div>

        {/* CTA row */}
        <div style={{ padding:'12px 16px 24px', display:'flex', gap:8 }}>
