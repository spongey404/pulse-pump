<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Pump — Muscle Map · Ticker Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f3f1ec; min-height: 100vh; font-family: 'Archivo', system-ui; color: #1a1a1a; }
  .canvas { padding: 60px 40px 120px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 60px; max-width: 1100px; margin: 0 auto; justify-items: center; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
  .label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #777; }
  .label .num { color: #c8553d; font-weight: 700; }
  .label .vibe { color: #1a1a1a; font-weight: 500; margin-left: 6px; }
  .desc { font-family: 'Archivo'; font-size: 12px; color: #777; line-height: 1.5; max-width: 360px; }
  .frame { width: 360px; height: 760px; border-radius: 44px; padding: 4px; background: linear-gradient(135deg, #cbcac4, #b9b8b2); box-shadow: 0 30px 60px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.4); flex-shrink: 0; }
  .screen { width: 100%; height: 100%; border-radius: 40px; overflow: hidden; position: relative; }
  h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 56px; letter-spacing: -1.5px; line-height: 1; max-width: 1100px; margin: 0 auto 14px; }
  .h1-sub { font-family: 'Archivo'; font-size: 16px; color: #666; max-width: 800px; margin: 0 auto 60px; line-height: 1.5; }
  @keyframes ticker {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .ticker-track { display: inline-flex; gap: 32px; animation: ticker 50s linear infinite; white-space: nowrap; }
</style>
<template id="__bundler_thumbnail" data-bg-color="#fbf8f2"><svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" fill="#fbf8f2"/><g transform="translate(540 320)"><rect width="120" height="120" rx="28" fill="#c8553d"/></g></svg></template>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const WEEK = [
  { d: 'M', date:13, kind:'Push',  total: 24, delta:+12.4, sets: { chest:8, shoulders:6, triceps:6, traps:2, core:2 } },
  { d: 'T', date:14, kind:'Rest',  total: 0,  delta: 0,    sets: {} },
  { d: 'W', date:15, kind:'Pull',  total: 26, delta:+8.1,  sets: { back:10, biceps:6, traps:4, forearms:0, core:2, hams:4 } },
  { d: 'T', date:16, kind:'Rest',  total: 0,  delta: 0,    sets: {} },
  { d: 'F', date:17, kind:'Legs',  total: 32, delta:+15.7, sets: { quads:10, glutes:8, hams:4, calves:4, core:2, shoulders:4 } },
  { d: 'S', date:18, kind:'Cond.', total: 12, delta:-4.2,  sets: { core:6, shoulders:2, calves:2, glutes:2 } },
  { d: 'S', date:19, kind:'—',     total: 0,  delta: 0,    sets: {} },
];

const TARGETS = { chest:16, shoulders:14, triceps:10, back:18, traps:8, biceps:10, quads:16, glutes:14, hams:12, calves:8, core:10, forearms:6 };

function weekTotals() {
  const t = {};
  for (const d of WEEK) for (const k in d.sets) t[k] = (t[k]||0) + d.sets[k];
  return t;
}

function dayHeat(idx) {
  const d = WEEK[idx];
  const map = {};
  const max = Math.max(...Object.values(d.sets), 1);
  for (const k in d.sets) map[k] = Math.min(1, d.sets[k] / max);
  return map;
}

function weekHeat() {
  const tot = weekTotals();
  const map = {};
  for (const k in TARGETS) {
    const sets = tot[k] || 0;
    map[k] = Math.min(1, sets / TARGETS[k]);
  }
  return map;
}

function thermal(t) {
  const stops = [
    [0.00, [240, 236, 226]],
    [0.20, [236, 214, 184]],
    [0.45, [226, 170, 124]],
    [0.70, [212, 118, 88]],
    [1.00, [192, 72, 60]],
  ];
  t = Math.max(0, Math.min(1, t));
  for (let i=0;i<stops.length-1;i++) {
    const [a,ca]=stops[i],[b,cb]=stops[i+1];
    if (t<=b) {
      const k=(t-a)/(b-a);
      return `rgb(${Math.round(ca[0]+(cb[0]-ca[0])*k)},${Math.round(ca[1]+(cb[1]-ca[1])*k)},${Math.round(ca[2]+(cb[2]-ca[2])*k)})`;
    }
  }
  return `rgb(192,72,60)`;
}

function thermalDark(t) {
  const stops = [
    [0.00, [40, 38, 34]],
    [0.20, [80, 60, 50]],
    [0.45, [148, 96, 64]],
    [0.70, [220, 130, 70]],
    [1.00, [248, 100, 80]],
  ];
  t = Math.max(0, Math.min(1, t));
  for (let i=0;i<stops.length-1;i++) {
    const [a,ca]=stops[i],[b,cb]=stops[i+1];
    if (t<=b) {
      const k=(t-a)/(b-a);
      return `rgb(${Math.round(ca[0]+(cb[0]-ca[0])*k)},${Math.round(ca[1]+(cb[1]-ca[1])*k)},${Math.round(ca[2]+(cb[2]-ca[2])*k)})`;
    }
  }
  return `rgb(248,100,80)`;
}

function BodyMap({ heat, thermalFn, stroke, baseFill, strokeW = 1 }) {
  const c = (id) => heat[id] !== undefined ? thermalFn(heat[id]) : baseFill;
  return (
    <svg viewBox="0 0 200 320" width="100%" height="100%" style={{ display: 'block' }}>
      <circle cx="100" cy="22" r="14" fill={baseFill} stroke={stroke} strokeWidth={strokeW}/>
      <rect x="94" y="34" width="12" height="10" fill={baseFill} stroke={stroke} strokeWidth={strokeW}/>
      <path d="M75 46 L100 42 L125 46 L120 56 L100 52 L80 56 Z" fill={c('traps')} stroke={stroke} strokeWidth={strokeW}/>
      <path d="M70 56 Q100 48 130 56 L132 96 Q100 102 68 96 Z" fill={c('chest')} stroke={stroke} strokeWidth={strokeW}/>
      <path d="M55 60 Q48 70 50 90 L66 92 Q70 76 70 56 Z" fill={c('shoulders')} stroke={stroke} strokeWidth={strokeW}/>
      <path d="M145 60 Q152 70 150 90 L134 92 Q130 76 130 56 Z" fill={c('shoulders')} stroke={stroke} strokeWidth={strokeW}/>
      <path d="M40 90 Q34 110 36 130 L52 130 Q54 110 50 90 Z" fill={c('biceps')} stroke={stroke} strokeWidth={strokeW}/>
      <path d="M160 90 Q166 110 164 130 L148 130 Q146 110 150 90 Z" fill={c('biceps')} stroke={stroke} strokeWidth={strokeW}/>
      <path d="M30 130 Q26 154 30 172 L48 172 Q50 154 48 130 Z" fill={c('forearms')} stroke={stroke} strokeWidth={strokeW}/>
      <path d="M170 130 Q174 154 170 172 L152 172 Q150 154 152 130 Z" fill={c('forearms')} stroke={stroke} strokeWidth={strokeW}/>
      <path d="M75 96 Q100 100 125 96 L122 138 Q100 142 78 138 Z" fill={c('core')} stroke={stroke} strokeWidth={strokeW}/>
      <path d="M76 138 L124 138 L128 158 L72 158 Z" fill={baseFill} stroke={stroke} strokeWidth={strokeW}/>
      <path d="M76 158 Q72 200 76 230 L98 230 Q100 200 98 158 Z" fill={c('quads')} stroke={stroke} strokeWidth={strokeW}/>
      <path d="M124 158 Q128 200 124 230 L102 230 Q100 200 102 158 Z" fill={c('quads')} stroke={stroke} strokeWidth={strokeW}/>
      <line x1="78" y1="232" x2="98" y2="232" stroke={stroke} strokeWidth={strokeW}/>
      <line x1="102" y1="232" x2="124" y2="232" stroke={stroke} strokeWidth={strokeW}/>
      <path d="M80 234 Q76 260 80 286 L96 286 Q98 260 96 234 Z" fill={c('calves')} stroke={stroke} strokeWidth={strokeW}/>
      <path d="M120 234 Q124 260 120 286 L104 286 Q102 260 104 234 Z" fill={c('calves')} stroke={stroke} strokeWidth={strokeW}/>
      <ellipse cx="88" cy="294" rx="11" ry="5" fill={baseFill} stroke={stroke} strokeWidth={strokeW}/>
      <ellipse cx="112" cy="294" rx="11" ry="5" fill={baseFill} stroke={stroke} strokeWidth={strokeW}/>
    </svg>
  );
}

const StatusBar = ({ color = '#1a1a1a' }) => (
  <div style={{ position:'absolute', top:18, left:0, right:0, height:20, padding:'0 28px', display:'flex', justifyContent:'space-between', alignItems:'center', zIndex:50, color, fontFamily:'-apple-system', fontWeight:600, fontSize:14 }}>
    <span>9:41</span>
    <div style={{ width:120, height:32, borderRadius:18, background:'#000', position:'absolute', left:'50%', top:8, transform:'translateX(-50%)' }} />
    <div style={{ display:'flex', gap:5, fontSize:12 }}><span>●●●●</span><span>▭</span></div>
  </div>
);

function TabBar({ light = true, accent = '#c8553d' }) {
  const tabs = [
    { key: 'Programs', label: 'Programs' },
    { key: 'Social',   label: 'Social' },
    { key: 'Home',     label: 'Home', center: true },
    { key: 'Body',     label: 'Body', active: true },
    { key: 'More',     label: 'More' },
  ];
  const muted = light ? 'rgba(0,0,0,0.4)' : 'rgba(255,255,255,0.4)';
  const text  = light ? '#1f1c19' : '#ece5d6';
  const bg    = light ? 'rgba(251,248,242,0.92)' : 'rgba(31,29,26,0.92)';
  const border= light ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.06)';
  const ICON = (k, color) => {
    const s = { width:22, height:22, fill:'none', stroke:color, strokeWidth:1.6, strokeLinecap:'round', strokeLinejoin:'round' };
    if (k==='Programs') return <svg {...s} viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>;
    if (k==='Social')   return <svg {...s} viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><circle cx="17" cy="11" r="2.5"/><path d="M3 19c.5-3 3-5 6-5s5.5 2 6 5M14 19c.4-2 1.7-3.5 4-3.5s3.6 1.5 4 3.5"/></svg>;
    if (k==='Body')     return <svg {...s} viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M8 11l4-3 4 3M12 8v6M9 14l-2 6M15 14l2 6"/></svg>;
    if (k==='More')     return <svg {...s} viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>;
    return null;
  };
  return (
    <div style={{ position:'absolute', bottom:0, left:0, right:0, background:bg, backdropFilter:'blur(16px)', borderTop:`0.5px solid ${border}`, display:'flex', alignItems:'center', padding:'8px 0 28px', zIndex:50 }}>
      {tabs.map((t,i) => (
        <div key={i} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:3 }}>
          {t.center ? (
            <div style={{ width:46, height:46, borderRadius:15, background:accent, display:'flex', alignItems:'center', justifyContent:'center', marginTop:-12, boxShadow: light ? '0 8px 16px rgba(200,85,61,0.25)' : '0 0 24px rgba(220,130,70,0.4)' }}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M3.5 12L12 4" stroke="#fff" strokeWidth="2" strokeLinecap="square"/>
                <path d="M12 4L20.5 12" stroke="#fff" strokeWidth="2" strokeLinecap="square"/>
                <path d="M6 13.5v7" stroke="#fff" strokeWidth="2" strokeLinecap="square"/>
                <path d="M18 13.5v7" stroke="#fff" strokeWidth="2" strokeLinecap="square"/>
                <path d="M6 20.5h12" stroke="#fff" strokeWidth="2" strokeLinecap="square"/>
                <path d="M10.5 20.5v-4.5h3v4.5" stroke="#fff" strokeWidth="1.6" strokeLinecap="square"/>
              </svg>
            </div>
          ) : ICON(t.key, t.active ? (light ? '#1a1a1a' : '#ece5d6') : muted)}
          <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:10, fontWeight: t.active ? 600 : 500, color: t.center ? accent : (t.active ? text : muted) }}>{t.label}</span>
        </div>
      ))}
    </div>
  );
}

function Ticker({ light = true }) {
  const items = [
    ['CHEST', '+12.5%', true],
    ['BACK', '+11.1%', true],
    ['QUADS', 'TGT', null],
    ['GLUTES', 'TGT', null],
    ['SHLDR', '−14.3%', false],
    ['HAMS', '−33.3%', false],
    ['CALV', '−50.0%', false],
    ['CORE', '−40.0%', false],
    ['BICEP', '+20.0%', true],
    ['TRI',   'TGT',   null],
    ['FORE',  '−100%', false],
    ['TRAP',  '−25.0%', false],
  ];
  const up   = '#1f8f5a';
  const down = light ? '#e51b1b' : '#ff4d4d';
  const flat = light ? 'rgba(0,0,0,0.45)' : 'rgba(236,229,214,0.5)';
  const bg   = light ? '#1a1816' : '#0f0e0c';
  const fg   = '#ece5d6';
  return (
    <div style={{ background:bg, color:fg, height:28, overflow:'hidden', display:'flex', alignItems:'center' }}>
      <div className="ticker-track" style={{ fontFamily:'"Space Mono",monospace', fontSize:11, fontWeight:500, letterSpacing:0.5 }}>
        {[...items, ...items].map(([k,v,u], i) => (
          <span key={i} style={{ display:'inline-flex', alignItems:'center', gap:6 }}>
            <span style={{ color:fg, opacity:0.9 }}>{k}</span>
            <span style={{ color: u===true ? up : u===false ? down : flat, fontWeight:700 }}>{u===true?'▲':u===false?'▼':'●'} {v}</span>
            <span style={{ color:'rgba(236,229,214,0.2)' }}>·</span>
          </span>
        ))}
      </div>
    </div>
  );
}

function DayStrip({ idx, setIdx, light = true }) {
  const ink     = light ? '#1a1816' : '#ece5d6';
  const muted   = light ? 'rgba(26,24,22,0.5)' : 'rgba(236,229,214,0.45)';
  const surface = light ? 'rgba(0,0,0,0.04)'   : 'rgba(255,255,255,0.05)';
  const border  = light ? 'rgba(0,0,0,0.08)'   : 'rgba(255,255,255,0.08)';
  const accent  = light ? '#1a1816' : '#ece5d6';
  return (
    <div style={{ display:'flex', gap:6, padding:'0 16px' }}>
      <button onClick={() => setIdx(-1)} style={{
        flex:1.2, height:54, border:`1px solid ${idx===-1?accent:border}`,
        background: idx===-1 ? accent : surface,
        color: idx===-1 ? (light?'#fff':'#1a1816') : ink,
        borderRadius:10, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
        cursor:'pointer', fontFamily:'"Archivo",sans-serif', padding:0,
      }}>
        <span style={{ fontFamily:'"Space Mono",monospace', fontSize:9, letterSpacing:1.5, opacity:0.7 }}>WEEK</span>
        <span style={{ fontWeight:700, fontSize:14, marginTop:2 }}>14</span>
      </button>
      {WEEK.map((d, i) => {
        const active = i === idx;
        const empty = d.total === 0;
        return (
          <button key={i} onClick={() => setIdx(i)} style={{
            flex:1, height:54, border:`1px solid ${active?accent:border}`,
            background: active ? accent : surface,
            color: active ? (light?'#fff':'#1a1816') : (empty ? muted : ink),
            borderRadius:10, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
            cursor:'pointer', fontFamily:'"Archivo",sans-serif', padding:0, position:'relative',
          }}>
            <span style={{ fontFamily:'"Space Mono",monospace', fontSize:9, letterSpacing:1, opacity:0.65 }}>{d.d}</span>
            <span style={{ fontWeight:700, fontSize:14, marginTop:2 }}>{d.date}</span>
            {!empty && !active && (
              <div style={{ position:'absolute', bottom:4, width:14, height:2, borderRadius:1, background:'#c8553d', opacity:0.6 }}/>
            )}
          </button>
        );
      })}
    </div>
  );
}

function VibeLightTicker() {
  const [idx, setIdx] = React.useState(-1);
  const bg     = '#fbf8f2';
  const ink    = '#1f1c19';
  const muted  = 'rgba(31,28,25,0.5)';
  const accent = '#c8553d';
  const up     = '#1f8f5a';
  const down   = '#c8553d';

  const heat = idx === -1 ? weekHeat() : dayHeat(idx);
  const tot  = idx === -1 ? weekTotals() : WEEK[idx].sets;
  const totalSets = Object.values(tot).reduce((a,b)=>a+b,0);
  const dayLabel  = idx === -1 ? 'Week 14 · Apr 13–19' : `${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][idx]} · Apr ${WEEK[idx].date} · ${WEEK[idx].kind}`;

  const target = idx === -1 ? 132 : 22;
  const pct    = Math.round(totalSets / target * 100);
  const change = idx === -1 ? '+4.2%' : (WEEK[idx].delta === 0 ? '—' : (WEEK[idx].delta > 0 ? '+' : '') + WEEK[idx].delta.toFixed(1) + '%');
  const changeColor = !change.startsWith('-') && change !== '—' ? up : (change === '—' ? muted : down);

  const ratios = Object.keys(TARGETS).map(k => ({ k, ratio: (tot[k]||0) / TARGETS[k], sets: tot[k]||0, target: TARGETS[k] }));
  const movers = [...ratios].sort((a,b) => b.ratio - a.ratio);
  const gainers = movers.slice(0, 3);
  const losers  = [...movers].reverse().slice(0, 3);

  return (
    <div style={{ width:'100%', height:'100%', background:bg, color:ink, fontFamily:'"Archivo",sans-serif', position:'relative', overflow:'hidden' }}>
      <StatusBar color={ink} />
      <div style={{ position:'absolute', top:54, left:0, right:0, height:36, padding:'0 16px', display:'flex', alignItems:'center', justifyContent:'space-between', borderBottom:`1px solid rgba(0,0,0,0.06)` }}>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <div style={{ width:18, height:18, background:accent, borderRadius:4 }}/>
          <span style={{ fontFamily:'"Space Mono",monospace', fontSize:10, letterSpacing:2, fontWeight:700 }}>PULSE/PUMP</span>
        </div>
        <span style={{ fontFamily:'"Space Mono",monospace', fontSize:10, color:muted, letterSpacing:1 }}>BODY · LIVE</span>
      </div>
      <div style={{ position:'absolute', top:90, left:0, right:0 }}>
        <Ticker light={true}/>
      </div>
      <div style={{ position:'absolute', top:130, left:16, right:16, display:'flex', alignItems:'flex-end', justifyContent:'space-between' }}>
        <div>
          <div style={{ fontFamily:'"Space Mono",monospace', fontSize:9, letterSpacing:1.5, color:muted }}>{dayLabel.toUpperCase()}</div>
          <div style={{ display:'flex', alignItems:'baseline', gap:8, marginTop:4 }}>
            <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:64, lineHeight:0.85, letterSpacing:1, color:ink }}>{totalSets}</span>
            <span style={{ fontFamily:'"DM Mono"', fontSize:11, color:muted }}>/ {target}</span>
          </div>
          <div style={{ fontFamily:'"DM Mono"', fontSize:10, color:muted, marginTop:2 }}>SETS · {pct}% TGT</div>
        </div>
        <div style={{ textAlign:'right' }}>
          <div style={{ fontFamily:'"Space Mono",monospace', fontSize:9, letterSpacing:1.5, color:muted }}>VS LAST</div>
          <div style={{ fontFamily:'"Archivo",sans-serif', fontSize:32, lineHeight:1, color:changeColor, marginTop:4 }}>{change}</div>
          <div style={{ fontFamily:'"DM Mono"', fontSize:10, color:muted, marginTop:2 }}>9/12 GROUPS</div>
        </div>
      </div>
      <div style={{ position:'absolute', top:228, left:0, right:0 }}>
        <DayStrip idx={idx} setIdx={setIdx} light={true}/>
      </div>
      <div style={{ position:'absolute', top:300, left:0, right:0, height:280, display:'flex' }}>
        <div style={{ width:80, padding:'12px 0 0 14px', display:'flex', flexDirection:'column', gap:14 }}>
          <div style={{ fontFamily:'"Space Mono",monospace', fontSize:8, letterSpacing:1.5, color:muted }}>▲ TOP</div>
          {gainers.map(g => (
            <div key={g.k}>
              <div style={{ fontFamily:'"Space Mono",monospace', fontSize:10, fontWeight:700, color:ink, textTransform:'uppercase' }}>{g.k.slice(0,5)}</div>
              <div style={{ display:'flex', alignItems:'baseline', gap:3 }}>
                <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:22, color:ink, lineHeight:1 }}>{g.sets}</span>
                <span style={{ fontFamily:'"DM Mono"', fontSize:9, color:muted }}>/{g.target}</span>
              </div>
              <div style={{ fontFamily:'"DM Mono"', fontSize:9, color: g.ratio>=1?up:muted }}>{g.ratio>=1?'▲':'●'} {Math.round(g.ratio*100)}%</div>
            </div>
          ))}
        </div>
        <div style={{ flex:1, display:'flex', justifyContent:'center', alignItems:'center' }}>
          <div style={{ width:170, height:260 }}>
            <BodyMap heat={heat} thermalFn={thermal} stroke="rgba(31,28,25,0.07)" baseFill="rgba(31,28,25,0.035)" />
          </div>
        </div>
        <div style={{ width:80, padding:'12px 14px 0 0', display:'flex', flexDirection:'column', gap:14, textAlign:'right' }}>
          <div style={{ fontFamily:'"Space Mono",monospace', fontSize:8, letterSpacing:1.5, color:muted }}>▼ GAPS</div>
          {losers.map(g => (
            <div key={g.k}>
              <div style={{ fontFamily:'"Space Mono",monospace', fontSize:10, fontWeight:700, color:ink, textTransform:'uppercase' }}>{g.k.slice(0,5)}</div>
              <div style={{ display:'flex', alignItems:'baseline', gap:3, justifyContent:'flex-end' }}>
                <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:22, color:ink, lineHeight:1 }}>{g.sets}</span>
                <span style={{ fontFamily:'"DM Mono"', fontSize:9, color:muted }}>/{g.target}</span>
              </div>
              <div style={{ fontFamily:'"DM Mono"', fontSize:9, color: g.ratio<0.5?down:muted }}>{g.ratio<0.5?'▼':'●'} {Math.round(g.ratio*100)}%</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{ position:'absolute', bottom:96, left:16, right:16 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:6 }}>
          <span style={{ fontFamily:'"Space Mono",monospace', fontSize:9, letterSpacing:1.5, color:muted }}>VOL · 12W</span>
          <span style={{ fontFamily:'"Space Mono",monospace', fontSize:9, color:muted }}>AVG 108 · NOW 112 ▲</span>
        </div>
        <div style={{ display:'flex', alignItems:'flex-end', gap:3, height:32 }}>
          {[80,92,75,110,85,98,120,95,130,105,108,112].map((v,i) => (
            <div key={i} style={{ flex:1, height: v/130*32, background: i===11?accent:'rgba(0,0,0,0.18)', borderRadius:1 }}/>
          ))}
        </div>
      </div>
      <TabBar light={true} accent={accent}/>
    </div>
  );
}

function VibeDarkTicker() {
  const [idx, setIdx] = React.useState(-1);
  const bg     = '#1a1816';
  const ink    = '#ece5d6';
  const muted  = 'rgba(236,229,214,0.5)';
  const accent = '#dc8246';
  const up     = '#3fb777';
  const down   = '#f0735a';

  const heat = idx === -1 ? weekHeat() : dayHeat(idx);
  const tot  = idx === -1 ? weekTotals() : WEEK[idx].sets;
  const totalSets = Object.values(tot).reduce((a,b)=>a+b,0);
  const dayLabel  = idx === -1 ? 'Week 14 · Apr 13–19' : `${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][idx]} · Apr ${WEEK[idx].date} · ${WEEK[idx].kind}`;

  const target = idx === -1 ? 132 : 22;
  const pct    = Math.round(totalSets / target * 100);
  const change = idx === -1 ? '+4.2%' : (WEEK[idx].delta === 0 ? '—' : (WEEK[idx].delta > 0 ? '+' : '') + WEEK[idx].delta.toFixed(1) + '%');
  const changeColor = !change.startsWith('-') && change !== '—' ? up : (change === '—' ? muted : down);

  const ratios = Object.keys(TARGETS).map(k => ({ k, ratio: (tot[k]||0) / TARGETS[k], sets: tot[k]||0, target: TARGETS[k] }));
  const movers = [...ratios].sort((a,b) => b.ratio - a.ratio);
  const gainers = movers.slice(0, 3);
  const losers  = [...movers].reverse().slice(0, 3);

  return (
    <div style={{ width:'100%', height:'100%', background:bg, color:ink, fontFamily:'"Archivo",sans-serif', position:'relative', overflow:'hidden' }}>
      <StatusBar color={ink} />
      <div style={{ position:'absolute', top:54, left:0, right:0, height:36, padding:'0 16px', display:'flex', alignItems:'center', justifyContent:'space-between', borderBottom:`1px solid rgba(255,255,255,0.06)` }}>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <div style={{ width:18, height:18, background:accent, borderRadius:4 }}/>
          <span style={{ fontFamily:'"Space Mono",monospace', fontSize:10, letterSpacing:2, fontWeight:700 }}>PULSE/PUMP</span>
        </div>
        <span style={{ fontFamily:'"Space Mono",monospace', fontSize:10, color:muted, letterSpacing:1 }}>BODY · LIVE</span>
      </div>
      <div style={{ position:'absolute', top:90, left:0, right:0 }}>
        <Ticker light={false}/>
      </div>
      <div style={{ position:'absolute', top:130, left:16, right:16, display:'flex', alignItems:'flex-end', justifyContent:'space-between' }}>
        <div>
          <div style={{ fontFamily:'"Space Mono",monospace', fontSize:9, letterSpacing:1.5, color:muted }}>{dayLabel.toUpperCase()}</div>
          <div style={{ display:'flex', alignItems:'baseline', gap:8, marginTop:4 }}>
            <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:64, lineHeight:0.85, letterSpacing:1, color:ink }}>{totalSets}</span>
            <span style={{ fontFamily:'"DM Mono"', fontSize:11, color:muted }}>/ {target}</span>
          </div>
          <div style={{ fontFamily:'"DM Mono"', fontSize:10, color:muted, marginTop:2 }}>SETS · {pct}% TGT</div>
        </div>
        <div style={{ textAlign:'right' }}>
          <div style={{ fontFamily:'"Space Mono",monospace', fontSize:9, letterSpacing:1.5, color:muted }}>VS LAST</div>
          <div style={{ fontFamily:'"Archivo",sans-serif', fontSize:32, lineHeight:1, color:changeColor, marginTop:4 }}>{change}</div>
          <div style={{ fontFamily:'"DM Mono"', fontSize:10, color:muted, marginTop:2 }}>9/12 GROUPS</div>
        </div>
      </div>
      <div style={{ position:'absolute', top:228, left:0, right:0 }}>
        <DayStrip idx={idx} setIdx={setIdx} light={false}/>
      </div>
      <div style={{ position:'absolute', top:300, left:0, right:0, height:280, display:'flex' }}>
        <div style={{ width:80, padding:'12px 0 0 14px', display:'flex', flexDirection:'column', gap:14 }}>
          <div style={{ fontFamily:'"Space Mono",monospace', fontSize:8, letterSpacing:1.5, color:muted }}>▲ TOP</div>
          {gainers.map(g => (
            <div key={g.k}>
              <div style={{ fontFamily:'"Space Mono",monospace', fontSize:10, fontWeight:700, color:ink, textTransform:'uppercase' }}>{g.k.slice(0,5)}</div>
              <div style={{ display:'flex', alignItems:'baseline', gap:3 }}>
                <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:22, color:ink, lineHeight:1 }}>{g.sets}</span>
                <span style={{ fontFamily:'"DM Mono"', fontSize:9, color:muted }}>/{g.target}</span>
              </div>
              <div style={{ fontFamily:'"DM Mono"', fontSize:9, color: g.ratio>=1?up:muted }}>{g.ratio>=1?'▲':'●'} {Math.round(g.ratio*100)}%</div>
            </div>
          ))}
        </div>
        <div style={{ flex:1, display:'flex', justifyContent:'center', alignItems:'center' }}>
          <div style={{ width:170, height:260, filter:'drop-shadow(0 0 20px rgba(220,130,70,0.15))' }}>
            <BodyMap heat={heat} thermalFn={thermalDark} stroke="rgba(255,255,255,0.06)" baseFill="rgba(255,255,255,0.04)" />
          </div>
        </div>
        <div style={{ width:80, padding:'12px 14px 0 0', display:'flex', flexDirection:'column', gap:14, textAlign:'right' }}>
          <div style={{ fontFamily:'"Space Mono",monospace', fontSize:8, letterSpacing:1.5, color:muted }}>▼ GAPS</div>
          {losers.map(g => (
            <div key={g.k}>
              <div style={{ fontFamily:'"Space Mono",monospace', fontSize:10, fontWeight:700, color:ink, textTransform:'uppercase' }}>{g.k.slice(0,5)}</div>
              <div style={{ display:'flex', alignItems:'baseline', gap:3, justifyContent:'flex-end' }}>
                <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:22, color:ink, lineHeight:1 }}>{g.sets}</span>
                <span style={{ fontFamily:'"DM Mono"', fontSize:9, color:muted }}>/{g.target}</span>
              </div>
              <div style={{ fontFamily:'"DM Mono"', fontSize:9, color: g.ratio<0.5?down:muted }}>{g.ratio<0.5?'▼':'●'} {Math.round(g.ratio*100)}%</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{ position:'absolute', bottom:96, left:16, right:16 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:6 }}>
          <span style={{ fontFamily:'"Space Mono",monospace', fontSize:9, letterSpacing:1.5, color:muted }}>VOL · 12W</span>
          <span style={{ fontFamily:'"Space Mono",monospace', fontSize:9, color:muted }}>AVG 108 · NOW 112 ▲</span>
        </div>
        <div style={{ display:'flex', alignItems:'flex-end', gap:3, height:32 }}>
          {[80,92,75,110,85,98,120,95,130,105,108,112].map((v,i) => (
            <div key={i} style={{ flex:1, height: v/130*32, background: i===11?accent:'rgba(255,255,255,0.18)', borderRadius:1 }}/>
          ))}
        </div>
      </div>
      <TabBar light={false} accent={accent}/>
    </div>
  );
}

function Card({ num, vibe, desc, children }) {
  return (
    <div className="card">
      <div>
        <div className="label"><span className="num">{num}</span><span className="vibe">{vibe}</span></div>
        <div className="desc">{desc}</div>
      </div>
      <div className="frame"><div className="screen">{children}</div></div>
    </div>
  );
}

function App() {
  return (
    <div className="canvas">
      <h1>Body tab · Ticker treatment</h1>
      <p className="h1-sub">Two palette directions for the Body/Muscle Map tab. Both show: thermal heatmap body silhouette, day scrubber (clickable), rolling ticker strip, top-movers/gaps panel, 12-week volume sparkline. Click any day pill to see daily heat vs. the weekly aggregate view.</p>
      <div className="grid">
        <Card num="A" vibe="Light / Bloomberg" desc="Warm cream background. Black masthead ticker. Volume sparkline anchored at bottom. Dense tabular data layout.">
          <VibeLightTicker/>
        </Card>
        <Card num="B" vibe="Dark / Terminal" desc="Warm dark charcoal. Same layout inverted. Amber accent on the volume bar. Drop-shadow on silhouette.">
          <VibeDarkTicker/>
        </Card>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
