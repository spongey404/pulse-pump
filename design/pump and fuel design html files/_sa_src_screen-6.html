// Helper: build readable variant label for an exercise row
function variantLabel(exId, variantEq, variantGrip) {
  const ex = EXERCISES.find(e=>e.id===exId);
  if (!ex) return '';
  const parts = [];
  if (variantEq) {
    // find label
    const allVariants = ex.variants.equipment || ex.variants.grip || [];
    const found = allVariants.find(v=>v.id===variantEq);
    if (found) parts.push(found.label);
  }
  if (variantGrip) {
    parts.push(variantGrip.replace(/-/g,' '));
  }
  return parts.join(' · ');
}

// SCREEN 1 — Program list

function ProgramRow({ p, C, onSelect }) {
  const [offset, setOffset] = React.useState(0);
  const drag = React.useRef(null);
  const DW = 80;
  const onDS=(x)=>{drag.current=x;};
  const onDM=(x)=>{if(drag.current===null)return;const d=x-drag.current;if(d<0)setOffset(Math.max(-DW,d));};
  const onDE=()=>{setOffset(o=>o<-DW/2?-DW:0);drag.current=null;};
  return (
    <div style={{position:'relative',overflow:'hidden',borderBottom:`1px solid ${C.hair}`}}>
      <div style={{position:'absolute',right:0,top:0,bottom:0,width:DW,background:'#c0341a',display:'flex',alignItems:'center',justifyContent:'center',zIndex:0}}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      </div>
      <div onClick={()=>offset===0&&onSelect(p)}
        onMouseDown={e=>onDS(e.clientX)} onMouseMove={e=>onDM(e.clientX)} onMouseUp={onDE} onMouseLeave={onDE}
        onTouchStart={e=>onDS(e.touches[0].clientX)} onTouchMove={e=>onDM(e.touches[0].clientX)} onTouchEnd={onDE}
        style={{position:'relative',zIndex:1,background:C.surf,padding:'14px 16px',display:'flex',alignItems:'center',gap:12,cursor:'pointer',transform:`translateX(${offset}px)`,transition:drag.current?'none':'transform 0.2s ease',userSelect:'none'}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:600,fontSize:18,color:C.ink,letterSpacing:0.2,lineHeight:1}}>{p.name}</div>
          <div style={{display:'flex',gap:8,marginTop:3,fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted}}>
            <span>{p.days} DAYS/WK</span><span>·</span><span>{p.exercises} EXERCISES</span><span>·</span><span>{p.lastUsed}</span>
          </div>
        </div>
        <div style={{display:'flex',gap:3,flexShrink:0}}>
          {p.split.map((s,si)=>(
            <div key={si} style={{width:22,height:22,borderRadius:4,background:C.accentSoft,border:`1px solid ${C.accent}33`,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <span style={{fontFamily:'"Space Mono",monospace',fontSize:7,fontWeight:700,color:C.accent}}>{s[0].toUpperCase()}</span>
            </div>
          ))}
        </div>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={C.faint} strokeWidth="2" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>
  );
}

// SCREEN 4A — Exercise picker (inline variant expansion)
// ══════════════════════════════════════════════════════════════
function ExercisePickerInline({ C, onBack, searchQuery='' }) {
  const dark=C===TD;
  const [query, setQuery] = React.useState(searchQuery);
  const [expanded, setExpanded] = React.useState(null);
  const [filter, setFilter] = React.useState('All');
  const filters = ['All','Push','Pull','Hinge','Squat','Isolation'];

  // Smart search: if query contains equipment keyword, pre-select variant
  function smartMatch(ex, q) {
    if (!q) return { match: true, preselect: null };
    const lower = q.toLowerCase();
    const nameMatch = ex.name.toLowerCase().includes(lower) || ex.abbr.toLowerCase().includes(lower);
    // Check if query implies a specific variant
    const allVariants = [...(ex.variants.equipment||[]), ...(ex.variants.grip||[])];
    for (const v of allVariants) {
      if (lower.includes(v.label.toLowerCase()) || v.label.toLowerCase().includes(lower.replace(ex.abbr.toLowerCase(),'').trim())) {
        return { match: true, preselect: v };
      }
    }
    return { match: nameMatch, preselect: null };
  }

  const filtered = EXERCISES
    .map(ex => ({ ex, ...smartMatch(ex, query) }))
    .filter(({match}) => match)
    .filter(({ex}) => filter==='All' || ex.movement.toLowerCase()===filter.toLowerCase() ||
      (filter==='Hinge' && ex.movement==='hinge') ||
      (filter==='Push' && ex.movement==='push') ||
      (filter==='Pull' && ex.movement==='pull') ||
      (filter==='Squat' && ex.movement==='squat') ||
      (filter==='Isolation' && ex.movement==='isolation'));

  return (
    <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',color:C.ink}}>
      <StatusBar dark={dark}/>
      <div style={{padding:'2px 16px 10px',display:'flex',alignItems:'center',gap:10}}>
        <div onClick={onBack} style={{cursor:'pointer',fontSize:20,color:C.muted,lineHeight:1}}>‹</div>
        <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:22,color:C.ink,letterSpacing:0.5,flex:1}}>ADD EXERCISE</div>
      </div>

      {/* Search bar */}
      <div style={{padding:'0 16px 10px'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,height:40,background:C.surf,borderRadius:10,border:`1px solid ${C.hair2}`,padding:'0 12px'}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder='Search "RDL", "dumbbell curl", "pull-up"…'
            style={{flex:1,background:'transparent',border:'none',outline:'none',fontFamily:'"Archivo",sans-serif',fontSize:13,color:C.ink}}/>
          {query && <div onClick={()=>setQuery('')} style={{cursor:'pointer',color:C.muted,fontSize:16}}>×</div>}
        </div>
      </div>

      {/* Movement filter pills */}
      <div style={{display:'flex',gap:6,padding:'0 16px 10px',overflowX:'auto'}}>
        {filters.map(f=>(
          <div key={f} onClick={()=>setFilter(f)} style={{height:28,padding:'0 12px',borderRadius:999,background:filter===f?C.accent:C.surf,border:`1px solid ${filter===f?C.accent:C.hair2}`,display:'flex',alignItems:'center',flexShrink:0,cursor:'pointer'}}>
            <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,fontWeight:700,color:filter===f?'#fff':C.muted,letterSpacing:0.8}}>{f.toUpperCase()}</span>
          </div>
        ))}
      </div>

      <div style={{flex:1,overflowY:'auto',paddingBottom:20}}>
        {filtered.length===0 && (
          <div style={{padding:'40px 16px',textAlign:'center'}}>
            <div style={{fontFamily:'"Archivo",sans-serif',fontSize:14,color:C.muted}}>No exercises found</div>
            <div style={{fontFamily:'"Space Mono",monospace',fontSize:10,color:C.faint,marginTop:6,letterSpacing:0.8}}>TRY A DIFFERENT SEARCH</div>
          </div>
        )}
        {filtered.map(({ex, preselect},i) => {
          const isExpanded = expanded===ex.id;
          const allVariants = ex.variants.equipment || ex.variants.grip || [];
          const varType = ex.variants.equipment ? 'equipment' : 'grip';
          const hasVariants = allVariants.length > 1;

          return (
            <div key={ex.id} style={{borderBottom:`1px solid ${C.hair}`}}>
              {/* Main row */}
              <div onClick={()=>hasVariants?setExpanded(isExpanded?null:ex.id):null}
                style={{display:'flex',alignItems:'center',gap:10,padding:'12px 16px',cursor:hasVariants?'pointer':'default',background:isExpanded?C.accentSoft:'transparent'}}>
                <MovementDot movement={ex.movement} C={C}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                    <span style={{fontFamily:'"Archivo",sans-serif',fontSize:17,color:C.ink,letterSpacing:0.5}}>{ex.name.toUpperCase()}</span>
                    {preselect && <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,fontWeight:700,color:C.accent,background:C.accentSoft,padding:'3px 8px',borderRadius:999,letterSpacing:0.8,border:`1px solid ${C.accent}44`,whiteSpace:'nowrap'}}>{preselect.label.toUpperCase()}</span>}
                  </div>
                  <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,marginTop:2,letterSpacing:0.5}}>{[ex.primary,...ex.secondary.slice(0,2)].map((m,mi)=><span key={mi}>{mi>0?' · ':''}{m.toUpperCase()}</span>)}</div>
                </div>
                {hasVariants
                  ? <div style={{display:'flex',alignItems:'center',gap:4}}>
                      <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:0.8}}>{allVariants.length} VARIANTS</span>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2" strokeLinecap="round" style={{transform:isExpanded?'rotate(90deg)':'rotate(0deg)',transition:'transform 0.15s'}}><polyline points="9 18 15 12 9 6"/></svg>
                    </div>
                  : <div onClick={()=>{}} style={{height:28,padding:'0 12px',borderRadius:8,background:C.accent,display:'flex',alignItems:'center',cursor:'pointer'}}>
                      <span style={{fontFamily:'"Archivo",sans-serif',fontSize:14,letterSpacing:1,color:'#fff'}}>ADD</span>
                    </div>}
              </div>

              {/* Inline variant expansion */}
              {isExpanded && (
                <div style={{background:C.surf,borderTop:`1px solid ${C.hair}`}}>
                  <div style={{padding:'6px 16px 4px',fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:1.2,textTransform:'uppercase'}}>
                    Select {varType}:
                  </div>
                  {allVariants.map((v,vi) => (
                    <div key={v.id} style={{display:'flex',alignItems:'center',padding:'9px 16px 9px 32px',borderTop:`1px solid ${C.hair}`,cursor:'pointer',background:preselect?.id===v.id?C.accentSoft:'transparent'}}>
                      {preselect?.id===v.id && <div style={{width:6,height:6,borderRadius:'50%',background:C.accent,marginRight:8,flexShrink:0}}/>}
                      <div style={{flex:1}}>
                        <span style={{fontFamily:'"Archivo",sans-serif',fontSize:13,fontWeight:preselect?.id===v.id?600:400,color:preselect?.id===v.id?C.accent:C.ink}}>{v.label}</span>
                        {v.grip && Array.isArray(v.grip) && (
                          <div style={{display:'flex',gap:4,marginTop:4,flexWrap:'wrap'}}>
                            {v.grip.map((g,gi)=>(
                              <span key={gi} style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,background:C.surf2,padding:'2px 6px',borderRadius:4}}>{g}</span>
                            ))}
                          </div>
                        )}
                      </div>
                      <div style={{height:28,padding:'0 12px',borderRadius:8,background:C.accent,display:'flex',alignItems:'center',cursor:'pointer'}}>
                        <span style={{fontFamily:'"Archivo",sans-serif',fontSize:13,letterSpacing:1,color:'#fff'}}>ADD</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

  const [query, setQuery] = React.useState('');

    const q = query.toLowerCase();
    return ex.name.toLowerCase().includes(q) || ex.abbr.toLowerCase().includes(q);
  });

  const openSheet = (ex) => { setSheetFor(ex); setSelectedEq(null); setSelectedGrip(null); setSheetSearch(''); };

  return (
    <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',color:C.ink}}>
      <StatusBar dark={dark}/>
      <div style={{padding:'2px 16px 10px',display:'flex',alignItems:'center',gap:10}}>
        <div onClick={onBack} style={{cursor:'pointer',fontSize:20,color:C.muted}}>‹</div>
        <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:22,color:C.ink,letterSpacing:0.5,flex:1}}>ADD EXERCISE</div>
      </div>
      <div style={{padding:'0 16px 10px'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,height:40,background:C.surf,borderRadius:10,border:`1px solid ${C.hair2}`,padding:'0 12px'}}>

        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',paddingBottom:20}}>
        {filtered.map((ex,i) => {
          const allVariants = ex.variants.equipment || ex.variants.grip || [];
          const hasVariants = allVariants.length > 1;
          return (
            <div key={ex.id} style={{display:'flex',alignItems:'center',gap:10,padding:'12px 16px',borderBottom:`1px solid ${C.hair}`,cursor:'pointer'}}

              <div style={{flex:1}}>
                <div style={{fontFamily:'"Archivo",sans-serif',fontSize:17,color:C.ink,letterSpacing:0.5}}>{ex.name.toUpperCase()}</div>

              </div>
              {hasVariants
                ? <div style={{display:'flex',alignItems:'center',gap:4}}>
                    <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:0.8}}>{allVariants.length} VAR</span>

      {sheetFor && (

          <div style={{position:'relative',background:C.bg,borderRadius:'20px 20px 0 0',maxHeight:'70%',display:'flex',flexDirection:'column',animation:'slideUp 0.25s ease-out',border:`1px solid ${C.hair2}`,borderBottom:'none'}}>

            </div>

              <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,marginTop:2,marginBottom:8}}>{sheetFor.variants.equipment?'SELECT EQUIPMENT':'SELECT GRIP / STYLE'}</div>

                const isSelEq = selectedEq?.id === v.id;
                return (
                  <div key={v.id}>
                    <div onClick={()=>{ setSelectedEq(v); setSelectedGrip(null); }}
                      style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',borderBottom:`1px solid ${C.hair}`,cursor:'pointer',background:isSelEq?C.accentSoft:'transparent'}}>
                      <div style={{width:10,height:10,borderRadius:'50%',border:`2px solid ${isSelEq?C.accent:C.faint}`,background:isSelEq?C.accent:'transparent',flexShrink:0,transition:'all 0.15s'}}/>

                      </div>
                      {isSelEq && v.grip && Array.isArray(v.grip) && (
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="2" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
                      )}

                    {/* Grip sub-options inline under selected equipment */}
                    {isSelEq && v.grip && Array.isArray(v.grip) && (
                      <div style={{background:C.surf,borderBottom:`1px solid ${C.hair}`}}>
                        <div style={{padding:'6px 16px 4px 40px',fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:1}}>GRIP / STYLE</div>
                        {v.grip.map((g,gi)=>(
                          <div key={gi} onClick={()=>setSelectedGrip(g)}

                            <span style={{fontFamily:'"Archivo",sans-serif',fontSize:13,color:selectedGrip===g?C.accent:C.ink,fontWeight:selectedGrip===g?600:400}}>{g.replace(/-/g,' ')}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            {/* Add CTA */}
            <div style={{padding:'10px 16px 28px',borderTop:`1px solid ${C.hair}`,background:C.bg,flexShrink:0}}>
              <div style={{height:48,borderRadius:12,background:(selectedEq||(!sheetFor.variants.equipment&&selectedGrip))?C.accent:C.surf,border:`1px solid ${(selectedEq||selectedGrip)?C.accent:C.hair2}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',transition:'all 0.15s'}}>
                <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:700,fontSize:20,letterSpacing:2,color:(selectedEq||selectedGrip)?'#fff':C.muted}}>
                  {selectedEq ? `ADD ${(selectedGrip?selectedGrip.replace(/-/g,' ')+' ':'')}${selectedEq.label.toUpperCase()}` : 'SELECT A VARIANT'}
                </span>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

                <span style={{fontFamily:'"Space Mono",monospace',fontSize:10,color:C.muted,letterSpacing:1}}>ADD EXERCISE</span>

function ProgramFlowLight({ C }) {
  const [screen, setScreen] = React.useState('list');
  const [showPresets, setShowPresets] = React.useState(false);
  const [selectedProgram, setSelectedProgram] = React.useState(null);

  if (screen==='picker-inline') return <ExercisePickerInline C={C} onBack={()=>setScreen(selectedProgram?'detail':'new')} searchQuery="rdl"/>;
  if (screen==='picker-sheet')  return <ExercisePickerSheet C={C} onBack={()=>setScreen(selectedProgram?'detail':'new')}/>;
  if (screen==='new') return (
    <NewProgramScreen C={C}
      onBack={()=>setScreen('list')}
      onAddExercise={()=>setScreen('picker-inline')}/>
  );
  if (screen==='detail') return (
    <TemplateDetailScreen C={C} program={selectedProgram}
      onBack={()=>setScreen('list')}
      onAddExercise={()=>setScreen('picker-inline')}/>
  );

  return (
    <div style={{position:'relative',width:'100%',height:'100%'}}>
      <ProgramListScreen C={C}
        onSelectProgram={(p)=>{setSelectedProgram(p);setScreen('detail');}}
        onNewProgram={()=>{setSelectedProgram(null);setShowPresets(true);}}/>
      {showPresets && (
        <PresetPickerSheet C={C}
          onClose={()=>setShowPresets(false)}
          onSelect={(p)=>{setShowPresets(false); if(p.id==='blank') setScreen('new'); else setScreen('detail');}}/>
      )}
    </div>
  );
}

  const [tweaks, setTweaksState] = React.useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = React.useState(false);

  const setTweak = (k,v) => {
    setTweaksState(p => {
      const next = {...p,[k]:v};
      window.parent.postMessage({type:'__edit_mode_set_keys', edits: next}, '*');
      return next;
    });
  };

  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode')   setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode')  setTweaksVisible(false);

    return () => window.removeEventListener('message', handler);

      <div className="section-label">EXERCISE PICKER — VARIANTS SIDE BY SIDE</div>

          <div style={{position:'relative',width:'100%',height:'100%'}}>
            <ProgramListScreen C={C_LIGHT} onSelectProgram={()=>{}} onNewProgram={()=>{}}/>
            <PresetPickerSheet C={C_LIGHT} onClose={()=>{}} onSelect={()=>{}}/>
          </div>
        </PhoneCard>
        <PhoneCard num="C2" vibe="Template detail (light)">
          <TemplateDetailScreen C={C_LIGHT} program={PROGRAMS[0]} onBack={()=>{}} onAddExercise={()=>{}}/>
        </PhoneCard>
        <PhoneCard num="C3" vibe="Template detail (dark)">
          <TemplateDetailScreen C={C_DARK} program={PROGRAMS[0]} onBack={()=>{}} onAddExercise={()=>{}}/>
        </PhoneCard>
      </div>
    </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
