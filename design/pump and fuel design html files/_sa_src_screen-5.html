<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Pump — Social Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #edeae3; min-height: 100vh; font-family: 'Archivo', system-ui; }
  .canvas { padding: 60px 40px 120px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 52px; letter-spacing: -1.5px; line-height: 1; max-width: 1800px; margin: 0 auto 12px; }
  .h1-sub { font-family: 'Archivo'; font-size: 15px; color: #777; max-width: 700px; margin: 0 auto 56px; line-height: 1.5; }
  .section-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #c8553d; max-width: 1800px; margin: 56px auto 10px; font-weight: 700; }
  .section-desc { font-family: 'Archivo'; font-size: 13px; color: #888; max-width: 700px; margin: 0 auto 28px; line-height: 1.5; }
  .grid { display: flex; gap: 48px; max-width: 1800px; margin: 0 auto; align-items: flex-start; flex-wrap: wrap; }
  .pcard { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
  .card-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }
  .card-label .num { color: #c8553d; font-weight: 700; }
  .card-label .vibe { color: #1a1a1a; font-weight: 600; margin-left: 6px; }
  .frame { width: 390px; height: 844px; border-radius: 48px; padding: 4px; background: linear-gradient(135deg, #cbcac4, #b9b8b2); box-shadow: 0 40px 80px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.4); flex-shrink: 0; }
  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; position: relative; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes reactPop { 0%{transform:scale(0.5);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
</style>
<template id="__bundler_thumbnail" data-bg-color="#fbf8f2"><svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" fill="#fbf8f2"/><g transform="translate(540 320)"><rect width="120" height="120" rx="28" fill="#c8553d"/></g></svg></template>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const TL = {
  bg:'#fbf8f2', surf:'#f4f0e6', surf2:'#ece7d8',
  ink:'#1f1c19', ink2:'#3a342d',
  muted:'rgba(31,28,25,0.5)', faint:'rgba(31,28,25,0.13)',
  hair:'rgba(31,28,25,0.08)', hair2:'rgba(31,28,25,0.13)',
  accent:'#c8553d', up:'#1f8f5a', pr:'#c9892e',
};
const TD = {
  bg:'#1a1816', surf:'#252220', surf2:'#2e2a26',
  ink:'#ece5d6', ink2:'#c8bfb0',
  muted:'rgba(236,229,214,0.5)', faint:'rgba(236,229,214,0.12)',
  hair:'rgba(236,229,214,0.08)', hair2:'rgba(236,229,214,0.13)',
  accent:'#dc7d4a', up:'#3fb777', pr:'#d4a03c',
};

function thermal(t) {
  const s=[[0,[240,236,226]],[0.2,[236,214,184]],[0.45,[226,170,124]],[0.7,[212,118,88]],[1,[192,72,60]]];
  t=Math.max(0,Math.min(1,t));
  for(let i=0;i<s.length-1;i++){const[a,ca]=s[i],[b,cb]=s[i+1];if(t<=b){const k=(t-a)/(b-a);return`rgb(${Math.round(ca[0]+(cb[0]-ca[0])*k)},${Math.round(ca[1]+(cb[1]-ca[1])*k)},${Math.round(ca[2]+(cb[2]-ca[2])*k)})`}}
  return'rgb(192,72,60)';
}

// ── 3D Body ──────────────────────────────────────────────────
function Body3D({ heat={}, size=160, interactive=false, dark=false }) {
  const [rotY, setRotY] = React.useState(0);
  const [dragging, setDragging] = React.useState(false);
  const drag = React.useRef(null);
  const auto = React.useRef(0);
  const raf  = React.useRef(null);
  React.useEffect(() => {
    if (interactive) return;
    const tick = () => { auto.current+=0.35; setRotY(Math.sin(auto.current*Math.PI/180)*25); raf.current=requestAnimationFrame(tick); };
    raf.current=requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(raf.current);
  }, [interactive]);
  const startDrag=(x)=>{ if(!interactive)return; setDragging(true); drag.current={x,startY:rotY}; };
  const moveDrag =(x)=>{ if(!dragging||!drag.current)return; setRotY(drag.current.startY+(x-drag.current.x)*0.7); };
  const endDrag  =()=>setDragging(false);
  const c  =id=>heat[id]!=null?thermal(heat[id]):(dark?'rgba(255,255,255,0.05)':'rgba(80,60,40,0.06)');
  const sk =dark?'rgba(255,255,255,0.07)':'rgba(80,60,40,0.08)';
  const base=dark?'rgba(255,255,255,0.04)':'rgba(80,60,40,0.05)';
  const h=size*1.6;
  return (
    <div onMouseDown={e=>startDrag(e.clientX)} onMouseMove={e=>moveDrag(e.clientX)} onMouseUp={endDrag} onMouseLeave={endDrag}
         onTouchStart={e=>startDrag(e.touches[0].clientX)} onTouchMove={e=>moveDrag(e.touches[0].clientX)} onTouchEnd={endDrag}
         style={{width:size,height:h,cursor:interactive?'grab':'default',perspective:700,userSelect:'none',flexShrink:0}}>
      <div style={{width:'100%',height:'100%',transform:`rotateY(${rotY}deg)`,transformStyle:'preserve-3d',transition:dragging?'none':'transform 0.05s linear'}}>
        <svg viewBox="0 0 200 320" width={size} height={h} style={{display:'block'}}>
          <g fill={base} stroke="none">
            <ellipse cx="100" cy="20" rx="18" ry="22"/>
            <rect x="92" y="40" width="16" height="12" rx="3"/>
            <path d="M72 52 Q100 46 128 52 L130 92 Q100 98 70 92Z"/>
            <path d="M55 56 Q46 68 48 88 L65 90 Q68 74 68 54Z"/>
            <path d="M145 56 Q154 68 152 88 L135 90 Q132 74 132 54Z"/>
            <path d="M40 88 Q34 108 36 128 L52 128 Q54 108 50 88Z"/>
            <path d="M160 88 Q166 108 164 128 L148 128 Q146 108 150 88Z"/>
            <path d="M30 128 Q26 150 30 170 L46 170 Q48 150 46 128Z"/>
            <path d="M170 128 Q174 150 170 170 L154 170 Q152 150 152 128Z"/>
            <path d="M74 92 Q100 96 126 92 L124 134 Q100 138 76 134Z"/>
            <path d="M76 134 L124 134 L127 152 L73 152Z"/>
            <path d="M75 152 Q72 192 76 224 L97 224 Q98 192 96 152Z"/>
            <path d="M125 152 Q128 192 124 224 L103 224 Q102 192 104 152Z"/>
            <path d="M78 226 Q75 252 78 278 L95 278 Q96 252 95 226Z"/>
            <path d="M122 226 Q125 252 122 278 L105 278 Q104 252 105 226Z"/>
          </g>
          <g stroke={sk} strokeWidth="0.7">
            <path fill={c('chest')}     d="M72 54 Q68 72 74 88 Q84 96 97 94 L97 56 Q84 50 72 54Z"/>
            <path fill={c('chest')}     d="M128 54 Q132 72 126 88 Q116 96 103 94 L103 56 Q116 50 128 54Z"/>
            <path fill={c('shoulders')} d="M54 58 Q44 68 46 86 Q54 92 65 90 Q68 74 66 56Z"/>
            <path fill={c('shoulders')} d="M146 58 Q156 68 154 86 Q146 92 135 90 Q132 74 134 56Z"/>
            <path fill={c('triceps')}   d="M44 90 Q38 110 42 132 Q50 134 58 126 Q60 108 58 90Z"/>
            <path fill={c('triceps')}   d="M156 90 Q162 110 158 132 Q150 134 142 126 Q140 108 142 90Z"/>
            <path fill={c('biceps')}    d="M40 88 Q34 108 36 128 L52 128 Q54 108 50 88Z" opacity="0.7"/>
            <path fill={c('biceps')}    d="M160 88 Q166 108 164 128 L148 128 Q146 108 150 88Z" opacity="0.7"/>
            <path fill={c('forearms')}  d="M30 128 Q26 150 30 170 L46 170 Q48 150 46 128Z" opacity="0.7"/>
            <path fill={c('forearms')}  d="M170 128 Q174 150 170 170 L154 170 Q152 150 152 128Z" opacity="0.7"/>
            <g fill={c('core')}>
              <rect x="85" y="100" width="30" height="11" rx="2.5"/>
              <rect x="85" y="115" width="30" height="11" rx="2.5"/>
              <rect x="85" y="130" width="30" height="8"  rx="2.5"/>
            </g>
            <path fill={c('back')}      d="M72 54 Q68 72 74 88 Q100 96 126 88 Q132 72 128 54 Q100 48 72 54Z" opacity="0"/>
            <path fill={c('glutes')}    d="M76 134 L124 134 L127 152 L73 152Z"/>
            <path fill={c('quads')}     d="M74 152 Q68 186 72 216 L95 218 Q96 184 95 152Z"/>
            <path fill={c('quads')}     d="M126 152 Q132 186 128 216 L105 218 Q104 184 105 152Z"/>
            <path fill={c('hamstrings')}d="M74 152 Q68 186 72 216 L95 218 Q96 184 95 152Z" opacity="0.35"/>
            <path fill={c('calves')}    d="M79 226 Q75 252 78 275 L94 275 Q95 250 93 226Z"/>
            <path fill={c('calves')}    d="M121 226 Q125 252 122 275 L106 275 Q105 250 107 226Z"/>
            <path fill={c('traps')}     d="M72 52 Q100 46 128 52 L128 58 Q100 52 72 58Z"/>
          </g>
        </svg>
      </div>
    </div>
  );
}

// ── Status bar ────────────────────────────────────────────────
const StatusBar=({dark=false})=>(
  <div style={{height:50,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:6,flexShrink:0}}>
    <div style={{width:126,height:37,background:dark?'rgba(255,255,255,0.1)':'#000',borderRadius:24}}/>
  </div>
);

// ── Tab bar ───────────────────────────────────────────────────
function TabBar({C}) {
  const dark=C===TD;
  const muted=dark?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.35)';
  const bg=dark?'rgba(26,24,22,0.94)':'rgba(251,248,242,0.94)';
  const bord=dark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';
  const tabs=[{k:'Programs'},{k:'Social',active:true},{k:'Home',center:true},{k:'Body'},{k:'More'}];
  const ICON=(k,col)=>{const s={width:22,height:22,fill:'none',stroke:col,strokeWidth:1.6,strokeLinecap:'round',strokeLinejoin:'round'};
    if(k==='Programs')return<svg {...s} viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>;
    if(k==='Social')  return<svg {...s} viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><circle cx="17" cy="11" r="2.5"/><path d="M3 19c.5-3 3-5 6-5s5.5 2 6 5M14 19c.4-2 1.7-3.5 4-3.5s3.6 1.5 4 3.5"/></svg>;
    if(k==='Body')    return<svg {...s} viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M8 11l4-3 4 3M12 8v6M9 14l-2 6M15 14l2 6"/></svg>;
    if(k==='More')    return<svg {...s} viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>;
    return null;
  };
  return(
    <div style={{position:'absolute',bottom:0,left:0,right:0,background:bg,backdropFilter:'blur(16px)',borderTop:`0.5px solid ${bord}`,display:'flex',alignItems:'center',padding:'8px 0 28px',zIndex:50}}>
      {tabs.map((t,i)=>{
        const col=t.active?C.ink:muted;
        return(
          <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
            {t.center
              ?<div style={{width:46,height:46,borderRadius:15,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',marginTop:-12,boxShadow:`0 8px 16px ${C.accent}44`}}>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3.5 12L12 4M12 4L20.5 12M6 13.5v7M18 13.5v7M6 20.5h12M10.5 20.5v-4.5h3v4.5" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </div>
              :ICON(t.k,col)}
            <span style={{fontFamily:'"Archivo",sans-serif',fontSize:10,fontWeight:t.active?600:500,color:t.center?C.accent:col}}>{t.k}</span>
          </div>
        );
      })}
    </div>
  );
}

// ── Avatar ────────────────────────────────────────────────────
function Avatar({name,size=36,C}) {
  return(
    <div style={{width:size,height:size,borderRadius:'50%',background:C.surf2,border:`1px solid ${C.hair2}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
      <span style={{fontFamily:'"Archivo",sans-serif',fontSize:size*0.42,color:C.muted}}>{name[0]}</span>
    </div>
  );
}

// ── Music chip ────────────────────────────────────────────────
function MusicChip({ song, artist, muted: isMuted, onToggle, C }) {
  const dark = C===TD;
  return (
    <div onClick={onToggle} style={{display:'flex',alignItems:'center',gap:8,background:C===TD?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.06)',borderRadius:999,padding:'5px 12px 5px 6px',cursor:'pointer',border:`1px solid ${C.hair2}`}}>
      {/* Spinning vinyl */}
      <div style={{width:26,height:26,borderRadius:'50%',background:'#1a1816',border:'2px solid rgba(255,255,255,0.15)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,animation:isMuted?'none':'spin 3s linear infinite',boxShadow:'0 0 0 3px rgba(200,85,61,0.25)'}}>
        <div style={{width:7,height:7,borderRadius:'50%',background:isMuted?'#555':'#c8553d'}}/>
      </div>
      {/* Song info */}
      <div style={{minWidth:0}}>
        <div style={{fontFamily:'"Archivo",sans-serif',fontSize:11,fontWeight:600,color:C.ink,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:130}}>{song}</div>
        <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:0.5}}>{artist}</div>
      </div>
      {/* Mute icon */}
      <div style={{marginLeft:2,color:C.muted}}>
        {isMuted
          ? <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2" strokeLinecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          : <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="2" strokeLinecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/></svg>}
      </div>
    </div>
  );
}

// ── Hold-to-react picker ─────────────────────────────────────
const REACTS = ['❤️','💪','🔥','👊','🏆','😤'];

function ReactPicker({ onPick, onClose, C }) {
  return (
    <div style={{position:'absolute',bottom:56,left:10,zIndex:200,animation:'reactPop 0.2s ease-out'}}>
      <div style={{display:'flex',alignItems:'center',gap:4,background:C.bg,border:`1px solid ${C.hair2}`,borderRadius:999,padding:'6px 10px',boxShadow:'0 8px 32px rgba(0,0,0,0.22)'}}>
        {REACTS.map((r,i)=>(
          <div key={i} onClick={()=>{onPick(r);onClose();}} style={{width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,cursor:'pointer',borderRadius:'50%',transition:'transform 0.1s'}}
            onMouseEnter={e=>e.currentTarget.style.transform='scale(1.3)'}
            onMouseLeave={e=>e.currentTarget.style.transform='scale(1)'}>
            {r}
          </div>
        ))}
      </div>
      {/* Tail */}
      <div style={{width:0,height:0,borderLeft:'6px solid transparent',borderRight:'6px solid transparent',borderTop:`6px solid ${C.bg}`,marginLeft:20,marginTop:-1}}/>
    </div>
  );
}

// ── Reaction row ─────────────────────────────────────────────
function ReactRow({ post, C, onComment, themed=false }) {
  const [react, setReact]         = React.useState(null);
  const [showPicker, setShowPicker] = React.useState(false);
  const holdTimer = React.useRef(null);

  const startHold = () => { holdTimer.current = setTimeout(()=>setShowPicker(true), 400); };
  const endHold   = () => { clearTimeout(holdTimer.current); };
  const tapLike   = () => { if(showPicker) return; setReact(r => r ? null : '❤️'); };

  const btn=(active,col)=>({display:'flex',alignItems:'center',gap:6,padding:'7px 14px',borderRadius:8,border:`1px solid ${active?col:(themed?'rgba(255,255,255,0.2)':C.hair2)}`,background:active?col+'1a':(themed?'rgba(255,255,255,0.08)':'transparent'),cursor:'pointer',position:'relative'});

  return (
    <div style={{display:'flex',alignItems:'center',gap:8,position:'relative'}}>
      {showPicker && <ReactPicker onPick={r=>setReact(r)} onClose={()=>setShowPicker(false)} C={C}/>}
      {/* Like / hold to react */}
      <div onMouseDown={startHold} onMouseUp={endHold} onMouseLeave={endHold}
           onTouchStart={startHold} onTouchEnd={endHold}
           onClick={tapLike}
           style={btn(!!react, C.accent)}>
        {react
          ? <span style={{fontSize:16,lineHeight:1}}>{react}</span>
          : <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>}
        <span style={{fontFamily:'"Space Mono",monospace',fontSize:12,color:react?C.accent:(themed?'rgba(255,255,255,0.7)':C.muted),fontWeight:700}}>{post.likes+(react?1:0)}</span>
        <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:themed?'rgba(255,255,255,0.3)':C.faint,letterSpacing:0.5}}>HOLD</span>
      </div>
      {/* Comment — opens modal */}
      <div onClick={onComment} style={btn(false,C.muted)}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={themed?'rgba(255,255,255,0.6)':C.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <span style={{fontFamily:'"Space Mono",monospace',fontSize:12,color:themed?'rgba(255,255,255,0.7)':C.muted,fontWeight:700}}>{post.comments}</span>
      </div>
    </div>
  );
}

// ── Comments modal ────────────────────────────────────────────
function CommentsModal({ post, C, onClose }) {
  const dark = C===TD;
  const comments = [
    {user:'Marcus', text:'That bench! Been watching this number creep up for weeks.', time:'2h'},
    {user:'Priya',  text:'Form check vid next time?', time:'3h'},
    {user:'Alex',   text:'105 is insane. What program are you running?', time:'5h'},
    {user:'Sam',    text:'Been on a similar trajectory. Keep going!', time:'6h'},
    {user:'Dom',    text:'That OHP PR too 👏', time:'8h'},
    {user:'Jay',    text:'Appreciate it everyone 🙏 Running a PPL 3x/week', time:'Yesterday'},
  ];
  return (
    <div style={{position:'absolute',inset:0,zIndex:300,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
      {/* Backdrop */}
      <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.45)',backdropFilter:'blur(4px)'}}/>
      {/* Sheet */}
      <div style={{position:'relative',background:C.bg,borderRadius:'20px 20px 0 0',height:'72%',display:'flex',flexDirection:'column',border:`1px solid ${C.hair2}`,animation:'slideUp 0.28s ease-out'}}>
        {/* Handle */}
        <div style={{padding:'10px 0 6px',display:'flex',justifyContent:'center'}}>
          <div style={{width:36,height:4,borderRadius:2,background:C.faint}}/>
        </div>
        {/* Header */}
        <div style={{padding:'0 16px 10px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:`1px solid ${C.hair}`}}>
          <span style={{fontFamily:'"Space Mono",monospace',fontSize:10,fontWeight:700,letterSpacing:1.2,color:C.muted}}>COMMENTS</span>
          <div onClick={onClose} style={{fontSize:18,color:C.muted,cursor:'pointer',lineHeight:1}}>×</div>
        </div>
        {/* Scrollable comments */}
        <div style={{flex:1,overflowY:'auto',padding:'12px 16px'}}>
          {comments.map((c,i)=>(
            <div key={i} style={{display:'flex',gap:10,marginBottom:16}}>
              <Avatar name={c.user} C={C} size={32}/>
              <div style={{flex:1}}>
                <div style={{fontFamily:'"Archivo",sans-serif',fontSize:13,color:C.ink,lineHeight:1.4}}>
                  <span style={{fontWeight:700}}>{c.user} </span>{c.text}
                </div>
                <div style={{display:'flex',alignItems:'center',gap:12,marginTop:4}}>
                  <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted}}>{c.time}</span>
                  <span style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,cursor:'pointer'}}>Reply</span>
                </div>
              </div>
              <div style={{fontSize:16,cursor:'pointer',color:C.faint,alignSelf:'flex-start',paddingTop:2}}>♡</div>
            </div>
          ))}
        </div>

// ── Post carousel (Photo → Body Map → Workout) ───────────────
function PostCarousel({ post, C, dark, onTap }) {
  const [slide, setSlide] = React.useState(0);
  const slides = post.photo ? ['photo','map','workout'] : ['map','workout'];
  const total = slides.length;
  const dragStart = React.useRef(null);
  const [dragDelta, setDragDelta] = React.useState(0);

  const onDragStart = (x) => { dragStart.current = x; };
  const onDragMove  = (x) => { if(dragStart.current===null)return; setDragDelta(x - dragStart.current); };
  const onDragEnd   = () => {
    if(dragStart.current===null)return;
    if(dragDelta < -40 && slide < total-1) setSlide(s=>s+1);
    if(dragDelta >  40 && slide > 0)       setSlide(s=>s-1);
    dragStart.current=null; setDragDelta(0);
  };

  const current = slides[slide];

  return (
    <div style={{position:'relative', overflow:'hidden', userSelect:'none'}}
      onMouseDown={e=>onDragStart(e.clientX)} onMouseMove={e=>onDragMove(e.clientX)} onMouseUp={onDragEnd} onMouseLeave={onDragEnd}
      onTouchStart={e=>onDragStart(e.touches[0].clientX)} onTouchMove={e=>onDragMove(e.touches[0].clientX)} onTouchEnd={onDragEnd}>

      {/* Slide content */}
      {current==='photo' && (
        <div onClick={onTap} style={{width:'100%',height:320,overflow:'hidden',position:'relative'}}>
          <img src={post.photo} alt="" style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}
            onError={e=>{e.target.style.display='none';}}/>
          {/* Subtle gradient overlay at bottom */}
          <div style={{position:'absolute',bottom:0,left:0,right:0,height:80,background:'linear-gradient(transparent, rgba(0,0,0,0.35))'}}/>
        </div>
      )}

      {current==='map' && (
        <div onClick={onTap} style={{position:'relative',background:post.bgColor||(dark?'#111':'#f0ece4'),paddingTop:20,paddingBottom:10,display:'flex',justifyContent:'center',alignItems:'flex-end',minHeight:300}}>
          <Body3D heat={post.heat} size={155} interactive={false} dark={dark}/>
          {/* Badges */}
          <div style={{position:'absolute',top:12,right:12,display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6}}>
            <div style={{background:'rgba(0,0,0,0.5)',backdropFilter:'blur(8px)',borderRadius:10,padding:'6px 10px',border:'1px solid rgba(255,255,255,0.12)'}}>
              <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:26,color:'#7fcf9f',lineHeight:0.9,letterSpacing:0.5}}>{post.improved}<span style={{fontSize:13,color:'rgba(255,255,255,0.5)'}}>/{post.total}</span></div>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:7,color:'rgba(255,255,255,0.5)',letterSpacing:0.8}}>IMPROVED</div>
            </div>
            {post.prs>0&&(<div style={{background:'rgba(0,0,0,0.5)',backdropFilter:'blur(8px)',borderRadius:10,padding:'6px 10px',border:`1px solid ${C.pr}88`}}>
              <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:22,color:C.pr,lineHeight:0.9}}>★ {post.prs}</div>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:7,color:'rgba(255,255,255,0.5)',letterSpacing:0.8}}>PR{post.prs>1?'S':''}</div>
            </div>)}
          </div>
          <div style={{position:'absolute',top:12,left:12,background:'rgba(0,0,0,0.5)',backdropFilter:'blur(8px)',borderRadius:10,padding:'6px 10px',border:'1px solid rgba(255,255,255,0.12)'}}>
            <div style={{fontFamily:'"Space Mono",monospace',fontSize:7,color:'rgba(255,255,255,0.5)',letterSpacing:0.8,marginBottom:1}}>VOL</div>
            <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:18,color:'#7fcf9f',lineHeight:0.9}}>▲ {post.volumeDelta}</div>
          </div>
        </div>
      )}

      {current==='workout' && (
        <div onClick={onTap} style={{background:post.bgColor||C.surf,minHeight:240,padding:'12px 0'}}>
          <div style={{padding:'6px 14px 8px',fontFamily:'"Space Mono",monospace',fontSize:8,color:'rgba(255,255,255,0.5)',letterSpacing:1.3}}>WORKOUT SUMMARY — TAP FOR FULL DETAIL</div>
          {post.exercises.map((ex,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',padding:'9px 14px',borderTop:`1px solid ${C.hair}`}}>
              <div style={{flex:1}}>
                <div style={{display:'flex',alignItems:'center',gap:5}}>
                  <span style={{fontFamily:'"Archivo",sans-serif',fontSize:13,fontWeight:ex.improved?600:400,color:ex.improved?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.45)'}}>{ex.name}</span>
                  {ex.pr&&<span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.pr,fontWeight:700}}>★</span>}
                </div>
                <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:'rgba(255,255,255,0.45)',marginTop:1}}>{ex.sets.length} sets</div>
              </div>
              <span style={{fontFamily:'"Space Mono",monospace',fontSize:10,fontWeight:700,color:ex.delta!=='—'?'#7fcf9f':'rgba(255,255,255,0.25)'}}>{ex.delta!=='—'?`▲ ${ex.delta}`:'—'}</span>
            </div>
          ))}
        </div>
      )}

      {/* Dot indicators */}
      {total > 1 && (
        <div style={{position:'absolute',bottom:8,left:0,right:0,display:'flex',justifyContent:'center',gap:5,pointerEvents:'none'}}>
          {slides.map((_,i)=>(
            <div key={i} style={{width:i===slide?16:5,height:5,borderRadius:999,background:i===slide?'#fff':'rgba(255,255,255,0.55)',transition:'width 0.2s ease'}}/>
          ))}
        </div>
      )}

      {/* Slide label */}
      <div style={{position:'absolute',top:8,right:8,background:'rgba(0,0,0,0.45)',backdropFilter:'blur(4px)',borderRadius:999,padding:'3px 8px',pointerEvents:'none'}}>
        <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:'rgba(255,255,255,0.8)',letterSpacing:0.8}}>{slide+1}/{total}</span>
      </div>
    </div>
  );
}

// Approach: a standalone tall block with overflow:visible, sitting BETWEEN posts.
// Posts themselves do NOT have overflow:hidden on outer wrapper.
// The divider fills itself with gradient + wavy SVG paths.

  const H = 300;
  // Use a canvas-style approach: gradient bg + wavy SVG noise on top
  return (
    <div style={{ position:'relative', height:H, flexShrink:0, overflow:'hidden' }}>
      {/* Pure smooth gradient as base — this IS the seamless part */}
      <div style={{ position:'absolute', inset:0,
        background:`linear-gradient(to bottom, ${fromColor} 0%, ${fromColor} 15%, ${toColor} 85%, ${toColor} 100%)`
      }}/>
      {/* SVG waves adding organic texture to the midzone */}
      <svg viewBox={`0 0 390 ${H}`} width="100%" height="100%" preserveAspectRatio="none"
           style={{ position:'absolute', inset:0, display:'block' }}>
        {/* fromColor waves dissolving downward */}
        <path d={`M0,${H*.32} C55,${H*.18} 130,${H*.46} 200,${H*.30} C270,${H*.14} 335,${H*.44} 390,${H*.28} L390,0 L0,0Z`} fill={fromColor} opacity="0.85"/>

        <path d={`M0,${H*.72} C75,${H*.56} 155,${H*.80} 230,${H*.64} C308,${H*.48} 355,${H*.76} 390,${H*.62} L390,0 L0,0Z`} fill={fromColor} opacity="0.10"/>
        {/* toColor waves rising upward */}

        <path d={`M0,${H*.54} C75,${H*.70} 155,${H*.44} 228,${H*.60} C305,${H*.74} 352,${H*.50} 390,${H*.64} L390,${H} L0,${H}Z`} fill={toColor} opacity="0.5"/>
        <path d={`M0,${H*.42} C80,${H*.58} 158,${H*.32} 235,${H*.48} C308,${H*.62} 355,${H*.38} 390,${H*.54} L390,${H} L0,${H}Z`} fill={toColor} opacity="0.24"/>
        <path d={`M0,${H*.30} C78,${H*.46} 152,${H*.22} 228,${H*.38} C305,${H*.52} 352,${H*.28} 390,${H*.44} L390,${H} L0,${H}Z`} fill={toColor} opacity="0.10"/>

            {!exercise.pr&&exercise.delta!=='—'&&<div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.up,fontWeight:700,marginTop:1}}>▲ {exercise.delta}</div>}
          </div>
          <div onClick={onClose} style={{fontSize:20,color:C.muted,cursor:'pointer'}}>×</div>
        </div>
        {/* Tabs: MAP / SETS */}
        <div style={{display:'flex',borderBottom:`1px solid ${C.hair}`,padding:'0 16px'}}>
          {['map','sets'].map(t=>(
            <div key={t} onClick={()=>setTab(t)} style={{padding:'8px 16px',fontFamily:'"Space Mono",monospace',fontSize:10,fontWeight:700,letterSpacing:1,textTransform:'uppercase',color:tab===t?C.ink:C.muted,borderBottom:tab===t?`2px solid ${C.accent}`:'2px solid transparent',marginBottom:-1,cursor:'pointer'}}>
              {t==='map'?'BODY MAP':'SETS'}
            </div>
          ))}
        </div>
        <div style={{flex:1,overflowY:'auto'}}>
          {tab==='map' ? (
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'24px 0 16px',background:dark?'#111':'#f0ece4',gap:10}}>
              <Body3D heat={focusHeat} size={140} interactive={true} dark={dark}/>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.faint,letterSpacing:1}}>DRAG TO ROTATE</div>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:10,color:C.muted,letterSpacing:1,textTransform:'uppercase',marginTop:4}}>{exercise.primary} — primary</div>
            </div>
          ) : (
            <div>
              <div style={{display:'grid',gridTemplateColumns:'40px 1fr 1fr 32px',padding:'5px 16px',fontFamily:'"Space Mono",monospace',fontSize:8,letterSpacing:1.1,color:C.muted,background:C.surf,borderBottom:`1px solid ${C.hair}`}}>
                <span>TYPE</span><span style={{textAlign:'center'}}>KG</span><span style={{textAlign:'center'}}>REPS</span><span style={{textAlign:'right'}}>✓</span>
              </div>
              {exercise.sets.map((s,si)=>(
                <div key={si} style={{display:'grid',gridTemplateColumns:'40px 1fr 1fr 32px',alignItems:'center',padding:'10px 16px',borderBottom:`1px solid ${C.hair}`,background:typeColors[s.type]||'transparent'}}>
                  <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,fontWeight:700,color:typeFg[s.type]||C.muted,background:typeColors[s.type]||C.surf2,padding:'2px 5px',borderRadius:3,width:'fit-content'}}>{s.type}</span>
                  <div style={{textAlign:'center',display:'flex',alignItems:'center',justifyContent:'center',gap:4}}>
                    <span style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:22,color:C.ink,letterSpacing:0.5}}>{s.kg}</span>
                    {s.pr&&<span style={{width:6,height:6,borderRadius:'50%',background:C.pr,display:'inline-block'}}/>}
                  </div>
                  <div style={{textAlign:'center'}}><span style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:22,color:C.ink,letterSpacing:0.5}}>{s.reps}</span></div>
                  <div style={{textAlign:'right'}}><span style={{color:C.up,fontSize:14,fontWeight:700}}>✓</span></div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Post detail screen ────────────────────────────────────────
function PostDetailScreen({ C, post, onBack }) {
  const [commentsOpen, setCommentsOpen] = React.useState(false);
  const [selectedEx, setSelectedEx]     = React.useState(null);
  const [muted, setMuted] = React.useState(true);
  const dark = C===TD;
  return (
    <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',color:C.ink}}>
      <StatusBar dark={dark}/>
      <div style={{padding:'2px 16px 10px',display:'flex',alignItems:'center',gap:10,borderBottom:`1px solid ${C.hair}`}}>
        <div onClick={onBack} style={{cursor:'pointer',fontSize:20,color:C.muted,lineHeight:1}}>‹</div>
        <span style={{fontFamily:'"Archivo",sans-serif',fontSize:15,fontWeight:600,color:C.ink}}>Workout</span>
      </div>
      <div style={{flex:1,overflowY:'auto',paddingBottom:30}}>
        {/* Author */}
        <div style={{padding:'12px 16px',display:'flex',alignItems:'center',gap:10}}>
          <Avatar name={post.user} C={C} size={42}/>
          <div>
            <div style={{fontFamily:'"Archivo",sans-serif',fontSize:15,fontWeight:700,color:C.ink}}>{post.user}</div>
            <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted}}>{post.handle} · {post.time}</div>
          </div>
        </div>
        {/* Large interactive silhouette */}
        <div style={{background:dark?'#111':'#f0ece4',borderTop:`1px solid ${C.hair}`,borderBottom:`1px solid ${C.hair}`,padding:'28px 0 18px',display:'flex',flexDirection:'column',alignItems:'center',gap:10,position:'relative'}}>
          <div style={{position:'absolute',inset:0,background:dark?'radial-gradient(ellipse at 50% 55%, rgba(220,125,74,0.10) 0%, transparent 65%)':'radial-gradient(ellipse at 50% 55%, rgba(200,85,61,0.07) 0%, transparent 65%)'}}/>
          <Body3D heat={post.heat} size={180} interactive={true} dark={dark}/>
          <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.faint,letterSpacing:1.2}}>DRAG TO ROTATE</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted}}>COLD</span>
            <div style={{width:72,height:4,borderRadius:2,background:'linear-gradient(90deg, rgb(240,236,226), rgb(212,118,88), rgb(192,72,60))'}}/>
            <span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted}}>HOT</span>
          </div>
        </div>
        {/* Session headline */}
        <div style={{padding:'14px 16px',borderBottom:`1px solid ${C.hair}`,display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:1.2,marginBottom:3}}>{post.time.toUpperCase()}</div>
            <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:36,color:C.ink,letterSpacing:0.5,lineHeight:0.9}}>{post.workout}</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:1}}>DURATION</div>
            <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:28,color:C.ink,letterSpacing:0.5}}>{post.duration}</div>
          </div>
        </div>
        {/* Key stats */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',borderBottom:`1px solid ${C.hair}`}}>
          {[['IMPROVED',`${post.improved}/${post.total}`,C.up],['SETS',post.sets,C.ink],['KCAL',post.kcal,C.ink],['VOL',post.volumeDelta,C.up]].map(([l,v,col],i)=>(
            <div key={i} style={{padding:'10px 0',textAlign:'center',borderRight:i<3?`1px solid ${C.hair}`:'none'}}>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:1.1,marginBottom:3}}>{l}</div>
              <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:22,color:col,lineHeight:0.9}}>{v}</div>
            </div>
          ))}
        </div>
        {/* Music + caption */}
        <div style={{padding:'10px 16px',borderBottom:`1px solid ${C.hair}`,display:'flex',flexDirection:'column',gap:8}}>
          <MusicChip song={post.song} artist={post.artist} muted={muted} onToggle={()=>setMuted(m=>!m)} C={C}/>
          {post.caption&&<span style={{fontFamily:'"Archivo",sans-serif',fontSize:14,color:C.ink,lineHeight:1.5}}><span style={{fontWeight:700}}>{post.user} </span>{post.caption}</span>}
        </div>
        {/* Reactions */}
        <div style={{padding:'10px 16px',borderBottom:`1px solid ${C.hair}`,display:'flex',alignItems:'center',gap:8}}>
          <ReactRow post={post} C={C} onComment={()=>setCommentsOpen(true)}/>
        </div>
        {/* Exercise list — tap any to see body map + sets */}
        <div>
          <div style={{padding:'12px 16px 6px',fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:1.3}}>EXERCISES — TAP TO INSPECT</div>
          {post.exercises.map((ex,ei)=>(
            <div key={ei} onClick={()=>setSelectedEx(ex)} style={{display:'flex',alignItems:'center',padding:'11px 16px',borderTop:`1px solid ${C.hair}`,cursor:'pointer',background:'transparent'}}>
              <div style={{flex:1}}>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <span style={{fontFamily:'"Archivo",sans-serif',fontSize:14,fontWeight:ex.improved?600:400,color:C.ink}}>{ex.name}</span>
                  {ex.pr&&<span style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.pr,fontWeight:700}}>★ PR</span>}
                </div>
                <div style={{fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,marginTop:2}}>{ex.sets.length} sets · {ex.primary}</div>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontFamily:'"Space Mono",monospace',fontSize:10,fontWeight:700,color:ex.delta!=='—'?C.up:C.faint}}>{ex.delta!=='—'?`▲ ${ex.delta}`:'—'}</span>
                <span style={{fontSize:14,color:C.faint}}>›</span>
              </div>
            </div>
          ))}
        </div>
      </div>
      {commentsOpen&&<CommentsModal post={post} C={C} onClose={()=>setCommentsOpen(false)}/>}
      {selectedEx&&<ExerciseDetailSheet exercise={selectedEx} C={C} onClose={()=>setSelectedEx(null)}/>}
    </div>
  );
}

// ── Feed screen ───────────────────────────────────────────────
function FeedScreen({ C }) {
  const [detail, setDetail]   = React.useState(null);
  const [commentsFor, setCommentsFor] = React.useState(null);
  const dark = C===TD;
  if (detail!==null) return <PostDetailScreen C={C} post={POSTS[detail]} onBack={()=>setDetail(null)}/>;
  return (
    <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',color:C.ink}}>
      <StatusBar dark={dark}/>
      <div style={{padding:'2px 16px 8px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:`1px solid ${C.hair}`}}>
        <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,fontSize:28,letterSpacing:0.5,color:C.ink}}>SOCIAL</div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        </div>
      </div>
      <div style={{display:'flex',padding:'0 16px',borderBottom:`1px solid ${C.hair}`}}>
        {['FRIENDS','CHALLENGES'].map((t,i)=>(
          <div key={i} style={{padding:'8px 14px',fontFamily:'"Space Mono",monospace',fontSize:10,fontWeight:700,letterSpacing:1,color:i===0?C.ink:C.muted,borderBottom:i===0?`2px solid ${C.accent}`:'2px solid transparent',marginBottom:-1,cursor:'pointer'}}>{t}</div>
        ))}
      </div>
      <div style={{flex:1,overflowY:'auto',paddingBottom:88,background:C.bg}}>
        {POSTS.map((p,i)=>(
          <React.Fragment key={p.id}>
            <FeedPostCard post={p} C={C} onTap={()=>setDetail(i)} onComment={()=>setCommentsFor(i)}/>
            {i < POSTS.length-1 && <div style={{height:8, background:C===TD?'#0e0c0a':'#e8e4dc'}}/>}
          </React.Fragment>
        ))}
      </div>
      {commentsFor!==null&&<CommentsModal post={POSTS[commentsFor]} C={C} onClose={()=>setCommentsFor(null)}/>}
      <TabBar C={C}/>
    </div>
  );
}

// ── Empty feed ────────────────────────────────────────────────

          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>

        </svg>
        <div style={{textAlign:'center'}}>
          <div style={{fontFamily:'"Archivo",sans-serif',fontSize:16,fontWeight:600,color:C.ink,marginBottom:6}}>No friends yet</div>

      <TabBar C={C}/>
    </div>
  );
}

// ── Friend profile ────────────────────────────────────────────

    <div style={{width:'100%',height:'100%',background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',color:C.ink}}>

        <span style={{fontSize:20,color:C.muted,fontWeight:300,cursor:'pointer'}}>‹</span>

        {/* Stats */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',borderBottom:`1px solid ${C.hair}`}}>
          {[['WORKOUTS',friend.workouts],['STREAK',`${friend.streak}D`],['THIS WEEK','4']].map(([l,v],i)=>(
            <div key={i} style={{padding:'12px 0',textAlign:'center',borderRight:i<2?`1px solid ${C.hair}`:'none'}}>
              <div style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.muted,letterSpacing:1.2,marginBottom:3}}>{l}</div>
              <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:28,color:C.ink,lineHeight:0.9}}>{v}</div>

          ))}
        </div>
        {/* Latest workout */}
        <div style={{padding:'12px 16px',borderBottom:`1px solid ${C.hair}`}}>
          <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:6}}>
            <div style={{fontFamily:'"Archivo",sans-serif',fontWeight:900,ontSize:20,color:C.ink,letterSpacing:0.5}}>LATEST · PULL DAY</div>

              {e.pr&&<span style={{fontFamily:'"Space Mono",monospace',fontSize:8,color:C.pr,fontWeight:700}}>★ PR</span>}

        <div>
          <div style={{padding:'10px 16px 6px',fontFamily:'"Space Mono",monospace',fontSize:9,color:C.muted,letterSpacing:1.3}}>RECENT WORKOUTS</div>
          {[
            {name:'Pull Day',date:'Today',     sets:26,improved:'5/6',prs:1},
            {name:'Push Day',date:'2 days ago',sets:24,improved:'4/6',prs:0},
            {name:'Legs',    date:'4 days ago',sets:28,improved:'3/5',prs:0},
            {name:'Pull Day',date:'5 days ago',sets:25,improved:'4/6',prs:1},
          ].map((w,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',padding:'10px 16px',borderTop:`1px solid ${C.hair}`,gap:10}}>

// ── Layout ────────────────────────────────────────────────────
function PhoneCard({num,vibe,children}) {
  return(
    <div className="pcard">
      <div><div className="card-label"><span className="num">{num}</span><span className="vibe">{vibe}</span></div></div>
      <div className="frame"><div className="screen">{children}</div></div>
    </div>
  );
}

function App() {
  return (
    <div className="canvas">
      <h1>Social Feed</h1>
      <p className="h1-sub">Instagram-scale cards. Spinning vinyl music chip, tap unmute to play. Hold heart to react with custom emoji. Tap any exercise → body map + sets sheet. Comments slide up as a modal. No STRONG button.</p>
      <div className="section-label">FEED</div>
      <p className="section-desc">Tap any post to open full detail. Tap any exercise in detail to see body map + sets. Hold the heart to pick a reaction. Tap the music chip to unmute.</p>
      <div className="grid">
        <PhoneCard num="A1" vibe="Light mode"><FeedScreen C={TL}/></PhoneCard>
        <PhoneCard num="A2" vibe="Dark mode"><FeedScreen C={TD}/></PhoneCard>
        <PhoneCard num="A3" vibe="Empty state"><EmptyFeedScreen C={TL}/></PhoneCard>
      </div>
      <div className="section-label">FRIEND PROFILE</div>
      <div className="grid">
        <PhoneCard num="B1" vibe="Friend profile (light)"><FriendProfileScreen C={TL}/></PhoneCard>
        <PhoneCard num="B2" vibe="Friend profile (dark)"><FriendProfileScreen C={TD}/></PhoneCard>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
