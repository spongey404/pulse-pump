const TARGETS = { chest:16, shoulders:14, triceps:10, back:18, traps:8, biceps:10, quads:16, glutes:14, hams:12, calves:8, core:10, forearms:6 };

function weekTotals(w = WEEKS[0]) {
  const t = {};
  for (const d of w.days) for (const k in d.sets) t[k] = (t[k]||0) + d.sets[k];
  return t;
}

function dayHeat(idx, w = WEEKS[0]) {
  const d = w.days[idx];
  const map = {};
  const max = Math.max(...Object.values(d.sets), 1);
  for (const k in d.sets) map[k] = Math.min(1, d.sets[k] / max);
  return map;
}

function weekHeat(w = WEEKS[0]) {
  const tot = weekTotals(w);
  const map = {};
  for (const k in TARGETS) {
    const sets = tot[k] || 0;
    map[k] = Math.min(1, sets / TARGETS[k]);
  }
  return map;
}

function thermal(t) {
  const stops = [
    [0.00, [240, 236, 226]],
    [0.20, [236, 214, 184]],
    [0.45, [226, 170, 124]],
    [0.70, [212, 118, 88]],
    [1.00, [192, 72, 60]],
  ];
  t = Math.max(0, Math.min(1, t));
  for (let i=0;i<stops.length-1;i++) {
    const [a,ca]=stops[i],[b,cb]=stops[i+1];
    if (t<=b) {
      const k=(t-a)/(b-a);
      return `rgb(${Math.round(ca[0]+(cb[0]-ca[0])*k)},${Math.round(ca[1]+(cb[1]-ca[1])*k)},${Math.round(ca[2]+(cb[2]-ca[2])*k)})`;
    }
  }
  return `rgb(192,72,60)`;
}

// Expected re-train cadence per muscle (days). Past 1.5× = "stale".
const CADENCE = {
  chest:4, shoulders:3, triceps:4, back:4, traps:5, biceps:4,
  quads:5, glutes:5, hams:5, calves:4, core:3, forearms:5,
};

const TODAY = 19; // Sun · Apr 19

function daysSince(w = WEEKS[0]) {
  const out = {};
  for (const mk of Object.keys(CADENCE)) {
    let last = null;
    for (const d of w.days) {
      if (d.sets[mk] && d.sets[mk] > 0) last = d.date;
    }
    out[mk] = last === null ? 14 : Math.max(1, w.days[w.days.length-1].date - last);
  }
  return out;
}

function coldSpotsFreq(n = 3, w = WEEKS[0]) {
  const ds = daysSince(w);
  return Object.keys(CADENCE).map(k => ({
    k, days: ds[k], cadence: CADENCE[k],
    ratio: ds[k] / CADENCE[k],
    stale: ds[k] >= CADENCE[k] * 1.5,
  })).sort((a,b) => b.ratio - a.ratio).slice(0, n);
}

function coldSpotsVol(n = 3, w = WEEKS[0]) {
  const tot = weekTotals(w);
  return Object.keys(TARGETS).map(k => {
    const sets = tot[k] || 0;
    const target = TARGETS[k];
    const ratio = sets / target;
    return { k, sets, target, ratio, under: ratio < 0.5 };
  }).sort((a,b) => a.ratio - b.ratio).slice(0, n);
}

function DayStrip({ idx, setIdx, weekIdx, setWeekIdx, week, light = true }) {
  const ink     = light ? '#1a1816' : '#ece5d6';
  const muted   = light ? 'rgba(26,24,22,0.5)' : 'rgba(236,229,214,0.45)';
  const surface = light ? 'rgba(0,0,0,0.04)'   : 'rgba(255,255,255,0.05)';
  const border  = light ? 'rgba(0,0,0,0.08)'   : 'rgba(255,255,255,0.08)';
  const accent  = light ? '#1a1816' : '#ece5d6';
  const dotMute = light ? 'rgba(26,24,22,0.2)'  : 'rgba(236,229,214,0.2)';

  // Pages laid out oldest -> newest (left -> right). weekIdx 0 = current = rightmost.
  const orderedWeeks = React.useMemo(() => [...WEEKS].reverse(), []);
  const currentPage = orderedWeeks.length - 1 - weekIdx;
  const ref = React.useRef(null);
  const settledRef = React.useRef(false);

  // Scroll to current page on mount + when weekIdx changes externally.
  React.useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const w = el.clientWidth;
    const target = currentPage * w;
    if (Math.abs(el.scrollLeft - target) > 2) {
      el.scrollLeft = target;
    }
    settledRef.current = true;
  }, [currentPage]);

  const onScroll = () => {
    if (!settledRef.current) return;
    const el = ref.current;
    if (!el) return;
    const w = el.clientWidth;
    if (w === 0) return;
    const page = Math.round(el.scrollLeft / w);
    const newIdx = orderedWeeks.length - 1 - page;
    if (newIdx !== weekIdx && newIdx >= 0 && newIdx < orderedWeeks.length) {
      setWeekIdx(newIdx);
      setIdx(-1);
    }
  };

  return (
    <div>
      <div ref={ref} onScroll={onScroll} className="swipe-strip" style={{
        display:'flex', overflowX:'auto', overflowY:'hidden',
        scrollSnapType:'x mandatory', WebkitOverflowScrolling:'touch',
        scrollBehavior:'smooth',
      }}>
        {orderedWeeks.map((wk) => {
          const isCurrentWeek = wk.num === week.num;
          return (
            <div key={wk.num} style={{
              flex:'0 0 100%', minWidth:'100%', scrollSnapAlign:'start', scrollSnapStop:'always',
              display:'flex', gap:6, padding:'0 16px',
            }}>
              <button onClick={() => isCurrentWeek && setIdx(-1)} style={{
                flex:1.2, height:54, border:`1px solid ${isCurrentWeek && idx===-1?accent:border}`,
                background: isCurrentWeek && idx===-1 ? accent : surface,
                color: isCurrentWeek && idx===-1 ? (light?'#fff':'#1a1816') : ink,
                borderRadius:10, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
                cursor:'pointer', fontFamily:'"Archivo",sans-serif', padding:0,
              }}>
                <span style={{ fontFamily:'"Space Mono",monospace', fontSize:9, letterSpacing:1.5, opacity:0.7 }}>WEEK</span>
                <span style={{ fontWeight:700, fontSize:14, marginTop:2 }}>{wk.num}</span>
              </button>
              {wk.days.map((d, i) => {
                const active = isCurrentWeek && i === idx;
                const empty = d.total === 0;
                return (
                  <button key={i} onClick={() => isCurrentWeek && setIdx(i)} style={{
                    flex:1, height:54, border:`1px solid ${active?accent:border}`,
                    background: active ? accent : surface,

                      <div style={{ position:'absolute', bottom:4, width:14, height:2, borderRadius:1, background:'#c8553d', opacity:0.6 }}/>

                  </button>
                );
              })}
            </div>
          );
        })}
      </div>
      {/* Page indicator dots */}
      <div style={{ display:'flex', gap:5, justifyContent:'center', marginTop:8 }}>
        {orderedWeeks.map((_, pi) => (
          <div key={pi} style={{
            width:5, height:5, borderRadius:'50%',
            background: pi === currentPage ? accent : dotMute,
            transition:'background 0.2s',
          }}/>
        ))}
      </div>
    </div>
  );
}

function ColdSpots({ light = true, week = WEEKS[0] }) {
  const [mode, setMode] = React.useState('freq'); // 'freq' | 'vol'
  const ink   = light ? '#1f1c19' : '#ece5d6';
  const muted = light ? 'rgba(31,28,25,0.5)' : 'rgba(236,229,214,0.5)';
  const surf  = light ? 'rgba(0,0,0,0.035)' : 'rgba(255,255,255,0.04)';
  const border= light ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.08)';
  const pillBg= light ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.06)';
  const blue  = light ? '#3a6ea5' : '#5a9ed4';
  const warn  = light ? '#c8553d' : '#dc8246';

  const spots = mode === 'freq' ? coldSpotsFreq(3, week) : coldSpotsVol(3, week);
  const flagged = spots.filter(s => mode === 'freq' ? s.stale : s.under).length;
  const badgeLabel = mode === 'freq' ? 'STALE' : 'UNDER';
  const headerLabel = mode === 'freq' ? `COLD SPOTS · ${flagged} STALE` : `UNDER TARGET · ${flagged} LOW`;

  return (
    <div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6 }}>
        <span style={{ fontFamily:'"Space Mono",monospace', fontSize:9, letterSpacing:1.5, color:muted }}>{headerLabel}</span>
        <div style={{ display:'flex', background:pillBg, borderRadius:5, padding:2, gap:1 }}>
          {[['freq','FREQ'],['vol','VOL']].map(([k,l]) => (
            <button key={k} onClick={() => setMode(k)} style={{
              border:'none', cursor:'pointer', padding:'2px 7px', borderRadius:3,
              background: mode===k ? (light?'#fbf8f2':'#1a1816') : 'transparent',
              color: mode===k ? ink : muted,
              fontFamily:'"Space Mono",monospace', fontSize:9, letterSpacing:1, fontWeight:700,
              boxShadow: mode===k ? (light?'0 1px 2px rgba(0,0,0,0.06)':'0 1px 2px rgba(0,0,0,0.3)') : 'none',
            }}>{l}</button>
          ))}
        </div>
      </div>
      <div style={{ display:'flex', gap:6 }}>
        {spots.map(s => {
          const flag = mode === 'freq' ? s.stale : s.under;
          const numTop = mode === 'freq' ? `${s.days}d` : `${s.sets}`;
          const numBot = mode === 'freq' ? `/ ${s.cadence}d` : `/ ${s.target}`;
          // bar: in freq, bar grows with staleness; in vol, bar grows with deficit (1 - completion)
          const fillPct = mode === 'freq'
            ? Math.min(100, s.ratio * 60)
            : Math.min(100, (1 - Math.min(1, s.ratio)) * 100);
          return (
            <div key={s.k} style={{ flex:1, padding:'8px 10px', background:surf, borderRadius:8, border:`1px solid ${border}`, position:'relative' }}>
              <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between' }}>
                <span style={{ fontFamily:'"Space Mono",monospace', fontSize:10, fontWeight:700, color:ink, letterSpacing:0.5 }}>{MUSCLE_LABEL[s.k]}</span>
                {flag && <span style={{ fontFamily:'"Space Mono",monospace', fontSize:7, color:warn, letterSpacing:1, fontWeight:700 }}>{badgeLabel}</span>}
              </div>
              <div style={{ display:'flex', alignItems:'baseline', gap:3, marginTop:3 }}>
                <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:20, lineHeight:0.9, color: flag?warn:ink }}>{numTop}</span>
                <span style={{ fontFamily:'"DM Mono",monospace', fontSize:9, color:muted }}>{numBot}</span>
              </div>
              <div style={{ height:2, background:border, marginTop:4, borderRadius:1, overflow:'hidden' }}>
                <div style={{ width:`${fillPct}%`, height:'100%', background: flag?warn:blue }}/>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

            <div key={g.k}>
              <div style={{ fontFamily:'"Space Mono",monospace', fontSize:10, fontWeight:700, color:ink, textTransform:'uppercase' }}>{g.k.slice(0,5)}</div>
              <div style={{ display:'flex', alignItems:'baseline', gap:3, justifyContent:'flex-end' }}>
                <span style={{ fontFamily:'"Archivo",sans-serif', fontSize:22, color:ink, lineHeight:1 }}>{g.sets}</span>
                <span style={{ fontFamily:'"DM Mono"', fontSize:9, color:muted }}>/{g.target}</span>
              </div>
              <div style={{ fontFamily:'"DM Mono"', fontSize:9, color: g.ratio<0.5?down:muted }}>{g.ratio<0.5?'▼':'●'} {Math.round(g.ratio*100)}%</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{ position:'absolute', bottom:96, left:16, right:16 }}>
        <ColdSpots light={false} week={week}/>
      </div>
      <CalendarModal open={calOpen} onClose={() => setCalOpen(false)} light={false}/>
      <TabBar light={false} accent={accent}/>
    </div>
  );
}

function Card({ num, vibe, desc, children }) {
  return (
    <div className="card">
      <div>
        <div className="label"><span className="num">{num}</span><span className="vibe">{vibe}</span></div>
        <div className="desc">{desc}</div>
      </div>
      <div className="frame"><div className="screen">{children}</div></div>
    </div>
  );
}

function App() {
  return (
    <div className="canvas">
      <h1>Body tab · Ticker treatment</h1>
      <p className="h1-sub">Two palette directions for the Body/Muscle Map tab. Both show: thermal heatmap body silhouette, day scrubber (clickable), rolling ticker strip, top-movers/gaps panel, 12-week volume sparkline. Click any day pill to see daily heat vs. the weekly aggregate view.</p>
      <div className="grid">
        <Card num="A" vibe="Light / Bloomberg" desc="Warm cream background. Black masthead ticker. Volume sparkline anchored at bottom. Dense tabular data layout.">
          <VibeLightTicker/>
        </Card>
        <Card num="B" vibe="Dark / Terminal" desc="Warm dark charcoal. Same layout inverted. Amber accent on the volume bar. Drop-shadow on silhouette.">
          <VibeDarkTicker/>
        </Card>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
