name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

# A newer push to the same PR/branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase:
    name: Firebase rules + functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            firebase/functions/package-lock.json
            firebase/rules-tests/package-lock.json

      - uses: actions/setup-java@v4          # the Firestore emulator needs a JVM
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          npm install -g firebase-tools
          npm --prefix firebase/functions ci
          npm --prefix firebase/rules-tests ci

      - name: Functions typecheck + build
        run: |
          npm --prefix firebase/functions run typecheck
          npm --prefix firebase/functions run build

      - name: Functions unit tests
        run: npm --prefix firebase/functions test

      - name: Security rules tests (Firestore emulator)
        run: npm --prefix firebase/rules-tests test

      - name: Functions integration tests (Functions + Firestore + Auth emulators)
        run: npm --prefix firebase/functions run test:integration

  test:
    name: Build + unit tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Project is built with Xcode 26.4; use the newest 26.x on the runner.
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xcode" ] && sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('PulsePump.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Unit tests + Release build check
        run: bin/test.sh --release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
